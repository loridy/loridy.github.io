olid #dbeae6;border-radius:11px;color:#5d7e7b;font-size:11px}.modal-bg{position:fixed;inset:0;background:#0b1825aa;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{width:100%;max-width:530px;max-height:91vh;overflow:auto;background:#fff;border-radius:18px;padding:27px;box-shadow:0 25px 80px #0004}.modal h2{font-size:20px;margin:0 0 13px}.modal p{font-size:12px;line-height:1.8;color:#718198}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:22px}.result-card{text-align:center;padding:38px}.result-score{font-size:66px;font-weight:850;letter-spacing:-4px;color:#0a8376;margin:10px}.result-info{color:#8995a5;font-size:12px}.result-actions{display:flex;gap:10px;justify-content:center;margin-top:27px;flex-wrap:wrap}.footnote{font-size:10px;color:#97a3b0;line-height:1.8}.mobile-only{display:none}@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

<script>
const BANK=[{"id":"1-1-01","set":"1-1","number":1,"stem":"Which of the following is a recommended procedure for compliance with the\nStandard relating to responsibilities of supervisors? Members should encourage\ntheir firms to:","options":{"A":"adopt a code of ethics that addresses general fiduciary concepts.","B":"provide the firm's clients with a copy of detailed compliance procedures.","C":"commingle the firm's code of ethics with its detailed compliance procedures."},"answer":"A","topic":"Ethics","page":1,"solution":"assets/solutions/1-1/01.jpg","confidence":"ocr","explanation":"because the recommended procedures for compliance with Standard IV (C), Responsibilities of\nSupervisors, state that members and candidates are encouraged to recommend that their employers adopt a code\nof ethics. In addition, stand-alone codes of ethics should be written in plain language and should address general\nfiduciary concepts."},{"id":"1-1-02","set":"1-1","number":2,"stem":"According to the guidance provided by the Standards, which of the following is\nnot among the recommended procedures for compliance with the Standard\nrelating to independence and objectivity?","options":{"A":"Create a restricted list","B":"Prohibit the acceptance of gifts","C":"Appoint a senior compliance officer with oversight responsibilities"},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/1-1/02.jpg","confidence":"ocr","explanation":"because according to Standard | (B), Independence and Objectivity, a recommended procedure for\ncompliance is to limit gifts, not prohibit gifts."},{"id":"1-1-03","set":"1-1","number":3,"stem":"In the CFA Institute Standards of Professional Conduct, Standard II-Duties to\nClients most likely includes which of the following subsections?","options":{"A":"Knowledge of the Law","B":"Performance Presentation","C":"Independence and Objectivity"},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/1-1/03.jpg","confidence":"ocr","explanation":"because Performance Presentation is a sub-section of Standard lIl-Duties to Clients. The other sub-\nsections include: Loyalty, Prudence and Care, Fair Dealing, Suitability, and Preservation of Confidentiality."},{"id":"1-1-04","set":"1-1","number":4,"stem":"Akash Gupta has just finished taking the Level II CFA exam for the second time.\nTo protect the integrity of the exam, Gupta is careful not to discuss the exam\nquestions with other candidates. Gupta calls his friend, a member, and contrasts\nhis two attempts by highlighting that there were many calculation questions on\nderivatives in the first instance and none in the second. Later, in a public blog on\ninvestment education, Gupta shares his strong disagreement regarding CFA\nInstitute shifting to computer-based testing. Has Gupta violated the Standards?","options":{"A":"No","B":"Yes, by highlighting that there were no calculation questions on derivatives\nin the recent exam","C":"Yes, by expressing his disagreement in a public blog regarding CFA Institute\nshifting to computer-based testing"},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/1-1/04.jpg","confidence":"ocr","explanation":"because according to Standard VII(A) relating to Conduct as Participants in CFA Institute Programs,\n‘examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to\nbroad topical areas and formulas tested or not tested on the exam. Gupta has violated Standard VII(A)."},{"id":"1-1-05","set":"1-1","number":5,"stem":"A portfolio manager is hired by an executive manager of a trust. The duty of\nloyalty is owed to the:","options":{"A":"trustee","B":"executive manager.","C":"beneficiaries of the trust."},"answer":"C","topic":"Ethics","page":1,"solution":"assets/solutions/1-1/05.jpg","confidence":"ocr","explanation":"because according to Standard Ill (A), Loyalty, Prudence, and Care, when the manager is responsible for\nthe portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but,\nrather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries."},{"id":"1-1-06","set":"1-1","number":6,"stem":"Melissa Kon, CFA, is an equity analyst. She recently left her job at Hamm Capital\n(HC) to join Eagle Investments (EI). Kon obtains the express consent of HC to\ntake one of her historical research reports with her. At EI, she diligently updates\nthe report and publishes it. Afterwards, she re-creates supporting records from\nsources obtained at HC. Has Kon violated the Standards?","options":{"A":"No","B":"Yes, by publishing the updated research report","C":"Yes, by re-creating the supporting records from sources obtained at Hamm\nCapital"},"answer":"C","topic":"Ethics","page":2,"solution":"assets/solutions/1-1/06.jpg","confidence":"ocr","explanation":"because a member must not re-create supporting records from sources obtained at the previous\nemployer. Standard V(C), Record Retention, states that the member or candidate cannot use historical\nrecommendations or research reports created at the previous firm because the supporting documentation is\nunavailable. For future use, the member or candidate must re-create the supporting records at the new firm with\ninformation gathered through public sources or directly from the covered company and not from memory or\nsources obtained at the previous employer."},{"id":"1-1-07","set":"1-1","number":7,"stem":"Anisha Joshi, CFA, develops a product that selects mutual funds based on\nhistorical data. Joshi tests her methodology and produces simulated performance\nresults. The promotional material for the product does not indicate that the results\nare simulated. Joshi has most likely violated the Standards relating:","options":{"A":"only to fair dealing.","B":"only to performance presentation.","C":"both to fair dealing and to performance presentation."},"answer":"B","topic":"Ethics","page":2,"solution":"assets/solutions/1-1/07.jpg","confidence":"ocr","explanation":"because Standard III(D). Performance Presentation, requires members and candidates to provide credible\nperformance information to clients and prospective clients and to avoid misstating performance or misleading\nclients and prospective clients about the investment performance of members or candidates or their firms. This\nstandard encourages full disclosure of investment performance data to clients and prospective clients. By not\ndisclosing that the results related to the product were simulated Joshi has violated the Standard."},{"id":"1-1-08","set":"1-1","number":8,"stem":"A member receives referral fees for recommending third-party services to clients.\nBefore entering into an agreement with a new client, which of the following must\nthe member disclose to the new client?","options":{"A":"Flat fees only","B":"In kind benefits only","C":"Both flat fees and in kind benefits"},"answer":"C","topic":"Ethics","page":2,"solution":"assets/solutions/1-1/08.jpg","confidence":"ocr","explanation":"because members and candidates must disclose the nature of the consideration or benefit—for example,\nflat fee. Further, consideration includes all fees, whether paid in cash, in soft dollars, or in kind. Therefore, the\nmember is required to disclose both flat fees and in kind benefits to the new client."},{"id":"1-1-09","set":"1-1","number":9,"stem":"Maria Perez, CFA, is a portfolio manager for an advisory firm that utilizes\nexternal mutual funds. The firm has a committee that selects external funds, using\nan analytical model to determine their choices. Although Perez has no reason to\nquestion the committee's research process, she does not like the committee's\nchoice for a bond fund because it is not appropriate for all her clients. She\nresearches and selects a different bond fund that better meets her clients' needs,\nbut her manager tells her that she is not permitted to make independent fund\npurchase decisions. She then invests in the fund chosen by the committee for all\nof her clients. Has Perez most likely violated the Standards?","options":{"A":"No","B":"Yes, the Standard relating to suitability","C":"Yes, the Standard relating to diligence and reasonable basis"},"answer":"B","topic":"Ethics","page":2,"solution":"assets/solutions/1-1/09.jpg","confidence":"ocr","explanation":"because Perez has violated Standard III (C), Suitability, since the committee-selected bond fund may not\nbe suitable for all of her clients. Standard III (C) states that when members and candidates are in an advisory\nrelationship with a client, they must\n\n‘* Make a reasonable inquiry into a client's or prospective client's investment experience, risk and return\nobjectives, and financial constraints prior to making any investment recommendation or taking investment\naction and must reassess and update this information regularly.\n\n* Determine that an investment is suitable to the client's financial situation and consistent with the client's written\nobjectives, mandates, and constraints before making an investment recommendation or taking investment\naction\n\n* Judge the suitability of investments in the context of the client's total portfolio.\n\nBy purchasing the bond fund that she feels is inappropriate for all of her clients, Perez has violated this Standard"},{"id":"1-1-10","set":"1-1","number":10,"stem":"Suzanna Bermi, CFA, manages portfolios for retail clients. A friend asks her if\nBermi can provide investment advice in Bermi's spare time. The friend offers a\ndonation to Bermi's favorite charity in exchange for Bermi's advice. Bermi\naccepts the offer and starts providing investment advice to her friend immediately\nafter sending an email to her firm's compliance department about the arrangement,\nincluding the fact that she receives no cash payments from her friend. Has Bermi\nmost likely violated the Standards?","options":{"A":"No","B":"Yes, the Standard relating to additional compensation arrangements","C":"Yes, the Standard relating to communication with clients and prospective\nclients"},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/1-1/10.jpg","confidence":"ocr","explanation":"because Standard IV (B), Additional Compensation Arrangements, requires members and candidates to\nobtain permission from their employer before accepting compensation or other benefits from third parties for the\nservices rendered to the employer or for any services that might create a conflict with their employer's interest.\nCompensation and benefits include direct compensation by the client and any indirect compensation or other\nbenefits received from third parties. Bermi has violated this Standard because the donations to her favorite charity\nrepresent a form of compensation for services provided to her friend. In addition, her services constitute a conflict\nof interest with her employer since she provides a service that competes with her firm's service. Therefore, an\nemail notification to the firm's compliance department will not suffice. Bermi has to obtain prior written permission\nfrom her employer."},{"id":"1-1-11","set":"1-1","number":11,"stem":"Which of the following is a violation according to the Standard relating to\npreservation of confidentiality?","options":{"A":"Members share details relating to former clients with third party service\nproviders.","B":"Members convey to clients that not all firm-sponsored resources may be\nappropriate for communicating confidential information.","C":"When allowed under the law, members share confidential client information\nto defend themselves in an investigation by the CFA Institute Professional\nConduct Program."},"answer":"A","topic":"Ethics","page":3,"solution":"assets/solutions/1-1/11.jpg","confidence":"ocr","explanation":"because Standard III(E), Preservation of Confidentiality, requires that members and candidates preserve\nthe confidentiality of information communicated to them by their clients, prospective clients, and former clients\nDetails of former clients cannot be shared with third party service providers and this is a violation of the Standard"},{"id":"1-1-12","set":"1-1","number":12,"stem":"Adira Badawi, CFA, who owns a research and consulting company, is an\nindependent board member of a leading cement manufacturer in a small local\nmarket. Because of Badawi's expertise in the cement industry, a foreign cement\nmanufacturer looking to enter the local market has hired him to undertake a\nfeasibility study. Under what circumstances can Badawi most likely undertake the\nassignment without violating the Standards?","options":{"A":"By making full disclosure to both companies","B":"By receiving written permission from the local company","C":"By signing confidentiality agreements with both companies"},"answer":"A","topic":"Ethics","page":3,"solution":"assets/solutions/1-1/12.jpg","confidence":"ocr","explanation":"because making full and fair disclosure of all matters that could reasonably be expected to impair one’s\nindependence and objectivity or interfere with respective duties to one’s clients is required by Standard VI(A),\nDisclosure of Conflicts."},{"id":"1-1-13","set":"1-1","number":13,"stem":"David Kertz, CFA, a portfolio manager, is considering investing in a small cap\nfirm he stopped following three years ago due to poor trading liquidity. Based on\npublished stock exchange data, the company's trading liquidity has improved\nconsiderably. Kertz arranges to obtain some third-party research reports on the\nfirm. He assesses the assumptions used, determines the rigor of the analysis, and\nthe reports' published dates. Which of the following additional actions should\nKertz most likely undertake next to meet the Standards?","options":{"A":"Consider the validity of the published trading liquidity data","B":"Evaluate the independence of the third-party recommendations","C":"Determine if each third party analyst's opinion reflects their firm's\nrecommendation"},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/1-1/13.jpg","confidence":"ocr","explanation":"because according to Standard V(A) Diligence and Reasonable Basis, if members rely on secondary or\nthird-party research, they must make reasonable and diligent efforts to determine whether such research is sound\nCriteria that a member can use in forming an opinion on whether research is sound includes an evaluation of the\nobjectivity and independence of the recommendations"},{"id":"1-1-14","set":"1-1","number":14,"stem":"While waiting in the business class lounge before boarding an airplane, Becca\nMsafari, CFA, an equity analyst, overhears a conversation by a group of senior\nmanagers, including members of the Board, from a large publicly listed bank. The\nmanagers discuss staff changes necessary to accommodate their regional\nexpansion plans. Msafari hears several staff names mentioned. Under what\ncircumstances could Msafari most likely use this information when making an\ninvestment recommendation to her clients?","options":{"A":"Under no circumstances","B":"If she does not breach the confidentiality of names of staff","C":"If the discussed changes are unlikely to affect investor perception of the bank"},"answer":"C","topic":"Ethics","page":4,"solution":"assets/solutions/1-1/14.jpg","confidence":"ocr","explanation":"because in order to comply with the Code and Standards, a member or candidate cannot use material\nnonpublic information when making investment recommendations. The information overheard would be considered\nmaterial only if any public announcement of the staff removal would be likely to move the share price of the bank.\nIn this case, the discussed changes are unlikely to affect investor perception of the bank, so Msafari could use the\ninformation when making an investment recommendation."},{"id":"1-1-15","set":"1-1","number":15,"stem":"A member is developing allocation procedures for block trades and new issues.\nAccording to the recommended procedures for compliance with the Standard\nrelating to fair dealing, the member's allocation procedures should involve:","options":{"A":"prohibiting consideration of advanced interest when allocating trades for new\nissues.","B":"bundling orders on a first-in, first-out basis for efficiency as appropriate for\nthe asset class.","C":"giving client accounts participating in a block trade execution prices\ncorresponding to order arrival time."},"answer":"B","topic":"Ethics","page":4,"solution":"assets/solutions/1-1/15.jpg","confidence":"ocr","explanation":"because according to the recommendations for Standard III (B), Fair Dealing, procedures should include\nprocessing and executing orders on a first-in, first-out basis with consideration of bundling orders for efficiency as\nappropriate for the asset class or the security."},{"id":"1-1-16","set":"1-1","number":16,"stem":"Which of the following is most accurate according to the Standard relating to\nknowledge of the law? Members are required to","options":{"A":"dissociate from client activities they believe are unethical.","B":"have detailed knowledge of all the laws that could potentially govern their\nactivities.","C":"report potential violations of the Code and Standards committed by fellow\nmembers to the CFA Institute Professional Conduct Program."},"answer":"A","topic":"Ethics","page":4,"solution":"assets/solutions/1-1/16.jpg","confidence":"ocr","explanation":"because according to Standard | (A), Knowledge of the Law, if a member or candidate has reasonable\ngrounds to believe that imminent or ongoing client or employer activities are illegal or unethical, the member or\ncandidate must dissociate, or separate, from the activity."},{"id":"1-1-17","set":"1-1","number":17,"stem":"Ekta Prakash, CFA, works as an investment advisor for TXM Investments (TXM).\nPrakash advises a client to transfer $150,000 from a tax-deferred investment\naccount to TXM's multi-cap fund. Prakash discloses to her client that withdrawals\nfrom the tax-deferred account will attract a penalty of $15,000 but assures the\nclient that the cost can be recovered through better investment returns from\nTXM's fund. Prakash has violated the Standard(s) relating to:","options":{"A":"only misrepresentation.","B":"only loyalty, prudence, and care.","C":"both misrepresentation and loyalty, prudence, and care."},"answer":"C","topic":"Ethics","page":4,"solution":"assets/solutions/1-1/17.jpg","confidence":"ocr","explanation":"because Standard |(C), Misrepresentation, prohibits members and candidates from making any\nstatements that promise or guarantee a specific rate of return on volatile investments. Because the equity-based\ninvestment is inherently volatile, and the future retum is unpredictable, Prakash's promises about future returns\nmaking up for the penalty of withdrawing the funds violates Standard I(C). Trust is the foundation of the investment\nprofession. Investment professionals who make false or misleading statements not only harm investors but also\nreduce the level of investor confidence in the investment profession and threaten the integrity of the capital\nmarkets. Therefore, Prakash has violated Standard (C).\n\nFurther, according to Standard III(A), Loyalty, Prudence, and Care prudence requires caution and discretion. The\nexercise of prudence by investment professionals requires that they act with the care, skill, and diligence that a\nreasonable person acting in a like capacity and familiar with such matters would use. Acting with care requires\nmembers and candidates to act in a prudent and judicious manner in avoiding harm to clients. Prakash causes\nharm to her client by recommending that the client transfer money from a tax-deferred account to TXM's large-cap\nfund, a process that will cost the client $15,000 in penalties. Therefore, Prakash also violated Standard III(C).\n\nEthics Application\n\n= explain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and\n\nStandards of Professional Conduc"},{"id":"1-1-18","set":"1-1","number":18,"stem":"Pia Nilsson is a sole proprietor investment advisor. An economic recession has\nreduced the number of clients she advises and caused revenues to decline. As a\nresult, Nilsson has not paid her CFA Institute membership dues for the past two\nyears. When a national financial publication recently interviewed Nilsson, she\nindicated that up until two years ago she had been a CFA charterholder and a CFA\nInstitute member in good standing. In addition, she stated the completion of the\nCFA Program enhanced her portfolio management skills and enabled her to\nachieve superior returns on behalf of her clients. Which of Nilsson's following\nactions most likely violated the CFA Institute Standards of Professional Conduct?","options":{"A":"Nonpayment of CFA Institute membership dues","B":"Attributing her superior returns to participation in the CFA Program","C":"Indicating that being a CFA charterholder has enhanced her portfolio\nmanagement skills"},"answer":"B","topic":"Ethics","page":5,"solution":"assets/solutions/1-1/18.jpg","confidence":"ocr","explanation":"because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA\nProgram, it is a violation to claim that the CFA charter helped her to achieve superior returns."},{"id":"1-1-19","set":"1-1","number":19,"stem":"According to the Standard related to communication with clients and prospective\nclients, members must:","options":{"A":"only distinguish between fact and opinion in the presentation of investment\nanalyses.","B":"only promptly disclose material and nonmaterial changes in the investment\nprocesses they use to select securities.","C":"both distinguish between fact and opinion in the presentation of investment\nanalyses and promptly disclose material and nonmaterial changes in the\ninvestment processes they use to select securities."},"answer":"A","topic":"Ethics","page":5,"solution":"assets/solutions/1-1/19.jpg","confidence":"ocr","explanation":"because according to Standard V(B), Communication with Clients and Prospective Clients, members must\ndistinguish between fact and opinion in the presentation of investment analyses and recommendations."},{"id":"1-1-20","set":"1-1","number":20,"stem":"According to the Standards, transaction-based manipulation includes:","options":{"A":"acquiring a dominant position in a derivative to exploit the price of a related\nunderlying.","B":"taking an aggressive investment position in a security with an intent to\nexploit market inefficiencies.","C":"issuing an overly optimistic projection of a security's value to induce trading\nby other market participants."},"answer":"A","topic":"Ethics","page":5,"solution":"assets/solutions/1-1/20.jpg","confidence":"ocr","explanation":"because transaction-based manipulation involves instances where a member or candidate knew or should\nhave known that his or her actions could affect the pricing of a security. This type of manipulation includes, but is\nnot limited to, the following: securing a controlling, dominant position in a financial instrument to exploit and\nmanipulate the price of a related derivative and/or the underlying asset."},{"id":"1-1-21","set":"1-1","number":21,"stem":"Which of the following statements is accurate according to the GIPS standards?\n\nStatement 1  A firm must perform verification to claim compliance with\nthe GIPS standards.\nStatement 2    Verification ensures accuracy of specific composite\npresentations.\nStatement 3    Verification is performed with respect to an entire firm.","options":{"A":"Statement 1","B":"Statement 2","C":"Statement 3"},"answer":"C","topic":"Ethics","page":5,"solution":"assets/solutions/1-1/21.jpg","confidence":"ocr","explanation":"because according to the GIPS standards, verification is performed with respect to an entire firm, not on\nspecific composites. Therefore, Statement 3 is correct."},{"id":"1-1-22","set":"1-1","number":22,"stem":"According to the GIPS standards, a firm's definition of discretion establishes\ncriteria to judge which of the following?","options":{"A":"Investment strategy the firm must implement","B":"Portfolios the firm must include in a composite","C":"Accounts the firm may exclude based on performance criteria"},"answer":"B","topic":"Ethics","page":6,"solution":"assets/solutions/1-1/22.jpg","confidence":"ocr","explanation":"because the firm’s definition of discretion establishes criteria to judge which portfolios must be included in\na composite and is based on the firm’s ability to implement its investment strategies."},{"id":"1-1-23","set":"1-1","number":23,"stem":"Yip Wai Yin, a CFA candidate, is an independent mutual fund sales agent. For\nevery front-end load product she promotes,Yip receives a portion of the front-end\nfee as commission at the time of sale. For every back-end load fund she sells, Yip\nreceives a smaller commission paid at the end of the year. Yip always informs her\nclients that she is paid a commission as an agent, but does not provide details of\nthe compensation structure. When pitching her favored front-end load product\nline she tells clients 20% of her commission is always invested in the same fund\nas proof of her confidence in the fund she recommends. Which Standard does Yip\nleast likely violate?","options":{"A":"Referral Fees","B":"Disclosure of Conflicts.","C":"Priority of Transactions."},"answer":"C","topic":"Ethics","page":6,"solution":"assets/solutions/1-1/23.jpg","confidence":"ocr","explanation":"because Yip's investments do not adversely affect the interest of the clients and therefore do not violate\nthe Priority of Transactions requirement. A candidate having the same investment positions does not always create\na conflict of interest, and in some instances having an aligned investment portfolio can be beneficial to the client.\nBy not detailing the commission structure to her clients, Yip does not disclose the potential reason for her favoring\nfront-end load funds over back-end load as the commission is higher and is paid immediately rather than at the end\nof the year and is in violation of Standard VI(A), Disclosure of Conflicts. Yip also does not disclose the commission\nstructure in detail, which could impair her independence when recommending front-load mutual funds rather than\nback-end load mutual funds to her clients, a violation of Standard VI(C), Referral Fees"},{"id":"1-1-24","set":"1-1","number":24,"stem":"For a retail client's account to be included in a GIPS-compliant firm's composite,\nit will most likely be in a composite:","options":{"A":"restricted to retail accounts.","B":"composed of discretionary accounts.","C":"with both fee-paying and non-fee-paying accounts."},"answer":"B","topic":"Ethics","page":6,"solution":"assets/solutions/1-1/24.jpg","confidence":"ocr","explanation":"because a composite must include all actual, fee-paying, discretionary segregated accounts managed in\naccordance with the same investment mandate, objective, or strategy."},{"id":"1-1-25","set":"1-1","number":25,"stem":"The Standard relating to misconduct addresses:","options":{"A":"only all conduct that reflects poorly on members' professional integrity.","B":"only all actions violating trust in members' professional and private lives.","C":"both all conduct that reflects poorly on members' professional integrity and\nall actions violating trust in members' professional and private lives."},"answer":"A","topic":"Ethics","page":6,"solution":"assets/solutions/1-1/25.jpg","confidence":"ocr","explanation":"because Standard | (D), Misconduct, addresses all conduct that reflects poorly on the professional\nintegrity, good reputation, or competence of members and candidates"},{"id":"1-1-26","set":"1-1","number":26,"stem":"Thomas Turkman recently hired Georgia Viggen, CFA, as a portfolio manager for\nNorth South Bank. Although Viggen worked many years for a competitor, West\nStar Bank, the move was straightforward since she did not have anon-compete\nagreement with her previous employer. Once Viggen starts working for Turkman,\nthe first thing she does is to bring a trading software package she developed and\nused at West Star to her new employer. Using public information, Viggen contacts\nall of her former clients to convince them to move with her to North South.\nViggen also convinces one of the analysts she worked with at West Star to join\nher at her new employer. Viggen most likely violated the CFA Institute Code of\nEthics and Standards of Professional Conduct concerning her actions involving:","options":{"A":"clients.","B":"the analyst.","C":"trading software"},"answer":"C","topic":"Ethics","page":6,"solution":"assets/solutions/1-1/26.jpg","confidence":"ocr","explanation":"because the portfolio manager violated Standard IV(A)-Loyalty by taking proprietary trading software from\nher former employer. Although the manager created the software, it was during a period of time when West Star\n‘employed her, so the software is not her property to take with her to her new employer. The member contacted\nclients using public information, so she did not violate Standard IV(A)-Loyalty. Because Viggen was not obligated\nto abide by a non-compete agreement that would likely restrict recruitment of former colleagues, Viggen is most\nlikely free to recruit the analyst from his former employer."},{"id":"1-1-27","set":"1-1","number":27,"stem":"Which of the following claims can an asset management firm most likely make\nregarding the GIPS standards?","options":{"A":"Claim GIPS compliance using the GIPS Compliance Statement","B":"State that the firm will achieve GIPS compliance by a future date","C":"Claim partial GIPS compliance with details on areas of non-compliance"},"answer":"A","topic":"Ethics","page":7,"solution":"assets/solutions/1-1/27.jpg","confidence":"ocr","explanation":"because a firm has only two options with regard to compliance with the GIPS standards: fully comply with\nall requirements of the GIPS standards and claim compliance through the use of the GIPS Compliance Statement;\n‘or not comply with all requirements or the GIPS standards and not claim compliance with, or make any reference\nto, the GIPS standards."},{"id":"1-1-28","set":"1-1","number":28,"stem":"Countries who are global leaders and use their economic influence to control\nresources are best described as:","options":{"A":"autarkic","B":"hegemonic.","C":"multilateral."},"answer":"B","topic":"Mixed Topics","page":7,"solution":"assets/solutions/1-1/28.jpg","confidence":"ocr","explanation":"because hegemonic countries tend to be regional or even global leaders, and they use their political or\n‘economic influence of others to control resources"},{"id":"1-1-29","set":"1-1","number":29,"stem":"An analyst gathers the following information for a company's fiscal year\nbeginning 1 January:\n\nNet income                                                $1,800,000\nDividends declared and paid on convertible preferred             $600,000\nWeighted average common shares outstanding during the year      200,000\n\nConvertible preferred shares outstanding during the year            50,000\nIf one preferred share can be converted into four common shares and there are no\nother potentially dilutive securities outstanding, reported diluted EPS for the year\nis:","options":{"A":"$3.00","B":"$4.50.","C":"$6.00."},"answer":"B","topic":"Equity Investments","page":7,"solution":"assets/solutions/1-1/29.jpg","confidence":"ocr","explanation":"because the effect of using if-converted method would be a reported diluted EPS of $4.50. The if-\nconverted method is based on what EPS would have been if the convertible preferred securities had been\nconverted at the beginning of the period. If the convertible shares had been converted, there would be two effects.\nFirst, the convertible preferred securities would no longer be outstanding; instead, additional common stock would\nbe outstanding. Thus, under the if-converted method, the weighted average number of shares outstanding would\nbe higher than in the basic EPS calculation. Second, if such a conversion had taken place, the company would not\nhave paid preferred dividends. Diluted EPS using the if-converted method for preferred stock is Net income/\n(Weighted average number of shares outstanding + New common shares that would have been issued at\nconversion); or = $1,800,000 / [200,000 + (50,000 x 4)] = $1,800,000 / 400,000 = $4.50. Basic EPS = (Net income\n— Preferred dividends) / Weighted average number of shares outstanding = ($1,800,000 — $600,000) / 200,000 =\n$6.00. As Basic EPS of $6.00 is higher than diluted EPS of $4.50, the convertible preferred stock is dilutive (rather\nthan antidilutive), and the diluted EPS of $4.50 should thus be reported"},{"id":"1-1-30","set":"1-1","number":30,"stem":"Nomalized earnings are best defined as the:","options":{"A":"average level of achieved earnings over a long-term historical period.","B":"estimated going-concern value of the company after the explicit forecast\nperiod.","C":"expected level of mid-cycle earnings in the absence of any unusual or\ntemporary factors."},"answer":"C","topic":"Mixed Topics","page":7,"solution":"assets/solutions/1-1/30.jpg","confidence":"ocr","explanation":"because normalized earnings are the expected level of mid-cycle earnings for a company in the absence\nof any unusual or temporary factors that affect profitability (either positively or negatively),\n\nIntroduction to Financial Statement Modeling\n\n= explain considerations in the choice of an explicit forecast horizon and an analyst's choices in developing\nprojections beyond the short-term forecast horizon"},{"id":"1-1-31","set":"1-1","number":31,"stem":"All else being equal, an increase in the central bank's policy rate most likely puts\ndownward pressure on domestic inflation by:","options":{"A":"increasing consumption growth.","B":"improving investors' confidence.","C":"strengthening the country's currency."},"answer":"C","topic":"Economics","page":7,"solution":"assets/solutions/1-1/31.jpg","confidence":"ocr","explanation":"because there is a whole range of interconnected ways in which a rise in the central bank's policy rate can\nreduce real domestic demand and net external demand (that is, the difference between export and import\nconsumption). Weaker total demand would tend to put downward pressure on the rate of domestic inflation—as\nwould a stronger currency, which would reduce the prices of imports. Taken together, these might begin to put\ndownward pressure on the overall measure of inflation.\n\nMonetary Policy\n\n= describe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate\ntargeting in expansionary or contractionary monetary policy; and describe the limitations of monetary policy"},{"id":"1-1-32","set":"1-1","number":32,"stem":"A technology company, reporting under US GAAP, has three classes of intangible\nassets. The table below shows information on each of the three classes (in USD\nthousands):\n\nGoodwill    Licenses   Computer Software\n31 December of Year 1             65,321       8,243                 5,257\nExchange movements in Year 2       7,324        821                 334\nAmortization charge for Year 2     —       1,244                 2,102\nNet additions (disposals)in      —   (25)         —\nYear 2\n31 December of Year 2             73,194      10,856                 8,214\n\nBased on the data provided, the intangible asset that has the largest absolute\nimpairment charge for the period ended 31 December of Year 2 is:","options":{"A":"goodwill.","B":"licenses","C":"computer software."},"answer":"B","topic":"Mixed Topics","page":8,"solution":"assets/solutions/1-1/32.jpg","confidence":"ocr","explanation":"because licenses will have the largest dollar impairment charge on the income statement due to the size\nof the implied impairment charge, which is calculated as: Accumulated impairment losses and amortization as of 31\nDecember Year 1— (Accumulated impairment losses and amortization as of 31 December Year 1+ Exchange\nmovements + Amortization charge for year + Net Additions (Disposals). In this case the largest impairment loss\nthat will be reported is due to licenses. Impairment charge due to licenses = 10,856 — (8,243 + 821 + 1,244 — 25) =\n573"},{"id":"1-1-33","set":"1-1","number":33,"stem":"All else being equal, a decrease in which of the following financial metrics would\nmost likely result in a lower return on equity (ROE)?","options":{"A":"Leverage","B":"The tax rate","C":"Days of sales outstanding"},"answer":"A","topic":"Financial Statement Analysis","page":8,"solution":"assets/solutions/1-1/33.jpg","confidence":"ocr","explanation":"because leverage is a component of the return on equity equation under the DuPont Analysis. If leverage\ndecreases, so will return on equity.\nROE = Tax burden x Interest burden x Earnings before interest and taxes margin x Total asset turnover x\nLeverage"},{"id":"1-1-34","set":"1-1","number":34,"stem":"An analyst regresses net profit margin (NPM) on research and development\nexpenditure scaled by revenues (RDR) and gathers the following information:\nEstimate\nIntercept              17.38%\nSlope coefficient         -0.6000\n\nThe predicted value of NPM for a forecasted RDR of 7% is closest to:","options":{"A":"4.20%.","B":"13.18%","C":"21.58%."},"answer":"B","topic":"Mixed Topics","page":8,"solution":"assets/solutions/1-1/34.jpg","confidence":"ocr","explanation":"because the predicted value of NPM when the forecasted RDR is 7% is equal to 17.38% — 0.6 x 7% =\n13.18%"},{"id":"1-1-35","set":"1-1","number":35,"stem":"For a company with taxable income, if interest expense becomes tax deductible,\nthe effective marginal cost of debt.","options":{"A":"decreases","B":"remains the same.","C":"increases."},"answer":"A","topic":"Mixed Topics","page":8,"solution":"assets/solutions/1-1/35.jpg","confidence":"ocr","explanation":"because if interest can be deducted the tax deductibility of debt reduces the effective marginal cost of\ndebt."},{"id":"1-1-36","set":"1-1","number":36,"stem":"The supply curve for a specific good shows the highest:","options":{"A":"quantity sellers are willing to offer at each price.","B":"price buyers are willing to pay for each quantity.","C":"price sellers are willing to accept for each quantity."},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/1-1/36.jpg","confidence":"ocr","explanation":"because the firm's supply curve should measure the quantity the firm is willing to supply at various prices\nAlso, the market supply curve is the sum of the supply curves of the individual firms"},{"id":"1-1-37","set":"1-1","number":37,"stem":"Which of the following expense recognition choices is least consistent with\nconservative accounting of reported net income?","options":{"A":"Recognizing expenses later rather than earlier","B":"Reflecting lower warranty expenses due to improved product quality","C":"Estimating lower uncollectible accounts due to stricter credit policies"},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/1-1/37.jpg","confidence":"ocr","explanation":"because all else equal, recognizing expenses later rather than sooner is considered to be less\nconservative in reporting net income."},{"id":"1-1-38","set":"1-1","number":38,"stem":"Which of the following ratios will most likely increase as a result of an inventory\nwrite-down?","options":{"A":"Current ratio","B":"Total asset turnover ratio","C":"Receivables turnover ratio"},"answer":"B","topic":"Financial Statement Analysis","page":9,"solution":"assets/solutions/1-1/38.jpg","confidence":"ocr","explanation":"because an inventory write-down reduces both profit and the carrying amount of inventory on the balance\nsheet and thus has a negative effect on profitability, liquidity, and solvency ratios. However, activity ratios (for\nexample, inventory turnover and total asset turnover) will be positively affected by a write-down because the asset\nbase (denominator) is reduced. Total asset turnover = Revenue / Average total assets. Inventory carrying amount\ndecreases as a result of the write-down. Thus the denominator, Average total assets decreases while the\nnumerator, Revenue remains unchanged. Total asset turnover ratio will therefore increase as a result of an\ninventory write-down."},{"id":"1-1-39","set":"1-1","number":39,"stem":"Which of the following statements about evaluating a project with a real option is\nmost accurate?","options":{"A":"The cost of the real option should be ignored as it represents a sunk cost","B":"The value of the real option less the incremental cost should be included in\nthe project NPV","C":"If the project NPV is negative before considering the real option,\nmanagement should not undertake the project"},"answer":"B","topic":"Derivatives","page":9,"solution":"assets/solutions/1-1/39.jpg","confidence":"ocr","explanation":"because there are several approaches a company’s management may use in evaluating capital\ninvestments with real options and one approach is to consider the Project NPV = NPV (based on DCF [discounted\ncash flow] alone) — Cost of options + Value of options. Calculate the NPV based on expected cash flows. Then\nsimply add the value associated with real options less their incremental cost."},{"id":"1-1-40","set":"1-1","number":40,"stem":"In a simple linear regression model, the residual for an observation of Y is\ncomputed as:","options":{"A":"the observed value of Y divided by the expected value of Y.","B":"the unexplained variation in Y divided by the explained variation in Y","C":"the difference between the observed value of Y and the estimated value of Y"},"answer":"C","topic":"Quantitative Methods","page":9,"solution":"assets/solutions/1-1/40.jpg","confidence":"ocr","explanation":"because the residual for the th observation, e,, is how much the observed value of Y; differs from the Y;\nestimated using the regression line.\n\nSimple Linear Regression\n\n= describe a simple linear regression model, how the least squares criterion is used to estimate regression\n\ncoefficients, and the interpretation of these coefficients"},{"id":"1-1-41","set":"1-1","number":41,"stem":"An analyst gathers the following information about two projects with the same\ndiscount rate:\nYear        Project 1 Cash Flows     Project 2 Cash Flows\n0                 -$1,000                   -$1,300\n1                $400                  $500\n2                $400                  $500\n3                $400                  $500\n\nIf the NPV of Project 1 is $0, the NPV of Project 2 is:","options":{"A":"negative","B":"zero","C":"positive."},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/1-1/41.jpg","confidence":"ocr","explanation":"because the internal rate of return (IRR) is the discount rate that makes the net present value (NPV) equal\nto zero. As the NPV of Project 1 is $0, the discount rate must be equal to its IRR. The IRR of Project 1 is the\nsolution to the equation: 0 = $1,000 + —#®@_ ,. _Si00_ | _ S400 where IRR = 9.7%. Calculator solution: CFy =\n\neee” * eimny + Cy\n\n~1,000; CF, = 400; CF, = 400; CF, = 400; solve for IRR = 9.7%. Next, use this discount rate to calculate the NPV\nof Project 2; NVP = $1,300 + —S%_ , _$500_  _ $300 __ _ _¢59 Calculator solution: CFy = -1,300; CF, =\n\nGoon! * Groom? * C0007\n500; CF, = 500; CF = 500; | = 9.7; solve for NPV = -50. The question can also be solved intuitively by recognizing\n1) that the discount rate for Project 1 has to be positive and 2) that Project 2 has a greater initial investment\n($1,300) for the same net cash flow ($200) as Project 1, whose NPV is $0. Taken together, this has to result in a\nnegative NPV for Project 2."},{"id":"1-1-42","set":"1-1","number":42,"stem":"In machine learning, overfitting can most likely be mitigated by using","options":{"A":"higher computing power.","B":"a simpler machine-learning model.","C":"an unsupervised machine-learning model."},"answer":"B","topic":"Mixed Topics","page":10,"solution":"assets/solutions/1-1/42.jpg","confidence":"ocr","explanation":"because overfitting occurs when the ML [machine learning] model learns the input and target dataset too\nprecisely. An ML model that has been overfitted is not able to accurately predict outcomes using a different dataset\nand may be too complex. When a model has been underfitted, the ML model treats true parameters as if they are\nNoise and is not able to recognize relationships within the training data. In such cases, the model may be too\nsimplistic. Hence, using a less complex ML model may alleviate the issue."},{"id":"1-1-43","set":"1-1","number":43,"stem":"Under the revaluation model, an initial revaluation that increases the carrying\nvalue of an asset most likely results in a:","options":{"A":"higher net profit margin.","B":"lower financial leverage ratio.","C":"higher total asset turnover ratio."},"answer":"B","topic":"Mixed Topics","page":10,"solution":"assets/solutions/1-1/43.jpg","confidence":"ocr","explanation":"because an increase in the carrying amount of depreciable long-lived assets increases total assets and\nshareholders’ equity, so asset revaluations that increase the carrying amount of an asset can be used to reduce\nreported leverage. Defining leverage as average total assets divided by average shareholders’ equity, increasing\nboth the numerator (assets) and denominator (equity) by the same amount leads to a decline in the ratio.\n(Mathematically, when a ratio is greater than one, as in this case, an increase in both the numerator and the\ndenominator by the same amount leads to a decline in the ratio)"},{"id":"1-1-44","set":"1-1","number":44,"stem":"With respect to fiscal policy, which of the following is an automatic stabilizer?","options":{"A":"Tax rate changes","B":"Infrastructure spending","C":"Payment of unemployment benefits"},"answer":"C","topic":"Financial Statement Analysis","page":10,"solution":"assets/solutions/1-1/44.jpg","confidence":"ocr","explanation":"because automatic stabilizers are indeed automatic, not requiring the identification of shocks to which\npolicy makers must consider a response. They should be distinguished from discretionary fiscal policies, such as\nchanges in government spending or tax rates, which are actively used to stabilize aggregate demand.\nUnemployment benefits satisfies the definition of automatic stabilizer. For example, as an economy slows and\nunemployment rises, government spending on unemployment benefits will also rise and add to aggregate demand\nThis is known as an automatic stabilizer.\n\nFiscal Policy\n\n= describe tools of fiscal policy, including their advantages and disadvantages"},{"id":"1-1-45","set":"1-1","number":45,"stem":"The regulation of economic activity over time is associated with:","options":{"A":"fiscal policy only.","B":"monetary policy only.","C":"both fiscal policy and monetary policy."},"answer":"C","topic":"Economics","page":10,"solution":"assets/solutions/1-1/45.jpg","confidence":"ocr","explanation":"because both monetary and fiscal policies are used to regulate economic activity over time.\nFiscal Policy\n\n= compare monetary and fiscal policy"},{"id":"1-1-46","set":"1-1","number":46,"stem":"Ignoring income taxes, an impairment loss on equipment will most likely\ndecrease:","options":{"A":"net profit margin.","B":"total asset turnover.","C":"working capital turnover."},"answer":"A","topic":"Corporate Issuers","page":10,"solution":"assets/solutions/1-1/46.jpg","confidence":"ocr","explanation":"because net profit margin is calculated by dividing net income by revenue. The amount of the impairment\nloss will reduce the carrying amount of the asset on the balance sheet and will reduce net income on the income\nstatement. Thus, the impairment loss will reduce net income but will have no effect on revenue, resulting in a\nreduction of net profit margin."},{"id":"1-1-47","set":"1-1","number":47,"stem":"If an auditor is experiencing some scope limitation, but can still issue an opinion,\nthe auditor most likely issues a(n):","options":{"A":"adverse opinion.","B":"qualified opinion.","C":"disclaimer of opinion."},"answer":"B","topic":"Mixed Topics","page":10,"solution":"assets/solutions/1-1/47.jpg","confidence":"ocr","explanation":"because a qualified audit opinion is one in which there is some scope limitation or exception to accounting\nstandards."},{"id":"1-1-48","set":"1-1","number":48,"stem":"An analyst gathers the following annual information on three companies:\n\nCompany A  Company B   Company C\n\nSales                                $40,000       $200,000      $450,000\n\nCost of sales                          $21,000       $110,000      $240,000\n\nSelling, general and administrative        $6,000        $24,000       $48,000\n\nAll other operating expenses              $1,000         $2,000         $5,000\n\nOperating income                      $12.000        $64,000      $157,000\n\nInterest and other expense                $2,000            $0       $14,000\n\nTaxes                                  $4,000        $26,000       $58,000\n\nNet in come                            $6,000        $38,000       $85,000\n\nThe company with the highest gross profit margin is:","options":{"A":"Company A.","B":"Company B.","C":"Company C."},"answer":"A","topic":"Mixed Topics","page":11,"solution":"assets/solutions/1-1/48.jpg","confidence":"ocr","explanation":". The gross profit is sales minus cost of sales and the gross profit margin is calculated as gross profit\ndivided by sales. The calculations for the three companies are as follows:\nCompany A: Gross profit = $40,000 — $21,000 = $19,000 and the gross profit margin is 47.5% ($19,000/$40,000).\nOf the three companies, this gross profit margin is the highest.\nCompany B: Gross profit = $200,000 — $110,000 = $90,000 and the gross profit margin is 45.0%\n($90,000/$200,000).\nCompany C: Gross profit = $450,000 — $240,000 = $210,000 and the gross profit margin is 46.7%\n($210,000/$450,000)."},{"id":"1-1-49","set":"1-1","number":49,"stem":"The primary responsibility of a corporation's directors is to act in the best interest\nof the:","options":{"A":"creditors.","B":"managers.","C":"shareholders."},"answer":"C","topic":"Mixed Topics","page":11,"solution":"assets/solutions/1-1/49.jpg","confidence":"ocr","explanation":"because directors and managers have a primary responsibility to act in the best interest of shareholders\nand, indirectly, all stakeholders. Further, if a board or management does not act in shareholders’ best interests,\nshareholders can enact change through exercising voting rights attached to their shares—for example, by voting to\nreplace the board of directors\n\nOrganizational Forms, Corporate Issuer Features, and Ownership\n\n= describe key features of corporate issuers"},{"id":"1-1-50","set":"1-1","number":50,"stem":"Debt as a proportion of total capital is most likely greatest in which of the\nfollowing life-cycle stages of a company?","options":{"A":"Start-up","B":"Growth","C":"Mature"},"answer":"C","topic":"Mixed Topics","page":11,"solution":"assets/solutions/1-1/50.jpg","confidence":"ocr","explanation":"because at the maturity stage, the company becomes able to support low-cost debt, often on an\nunsecured basis. From the company's perspective, debt financing is likely to be more attractive than higher-cost\nequity financing\n\nCapital Structure\n\n= explain factors affecting capital structure and the weighted-average cost of capital"},{"id":"1-1-51","set":"1-1","number":51,"stem":"Real exchange rates:","options":{"A":"reflect changes in relative purchasing power.","B":"are quoted in global foreign exchange markets.","C":"have a strong track record as a predictor of future nominal exchange rates."},"answer":"A","topic":"Economics","page":11,"solution":"assets/solutions/1-1/51.jpg","confidence":"ocr","explanation":"because real exchange rates reflect changes in relative purchasing power."},{"id":"1-1-52","set":"1-1","number":52,"stem":"Under a franchise model, the franchisee:","options":{"A":"earns a royalty on sales.","B":"is responsible for product development and advertising.","C":"operates under a specific brand with proprietary products and processes."},"answer":"C","topic":"Mixed Topics","page":11,"solution":"assets/solutions/1-1/52.jpg","confidence":"ocr","explanation":"because under franchise models franchisees have a tightly defined and exclusive relationship with a\nfranchisor to operate under a specific brand with proprietary products and processes\n\nBusiness Models\n\n= describe various types of business models"},{"id":"1-1-53","set":"1-1","number":53,"stem":"Accounting goodwill is created when an acquisition's purchase price:","options":{"A":"results in a “bargain purchase.”","B":"exceeds the value of acquired net identifiable assets.","C":"is attributed solely to separately identifiable assets and liabilities."},"answer":"B","topic":"Mixed Topics","page":12,"solution":"assets/solutions/1-1/53.jpg","confidence":"ocr","explanation":"because accounting goodwill arising from an acquisition is the excess of the cost to purchase a target\ncompany over the acquired net identifiable assets (fair value of identifiable assets minus fair value of the liabilities\nand contingent liabilities)."},{"id":"1-1-54","set":"1-1","number":54,"stem":"An analyst gathers the following closing prices of a stock:\n\nDate           Closing Price($)\n1 January             30\n15 January            38\n\nThe continuously compounded return for the period 1 January to 15 January is\nclosest to:","options":{"A":"7.0%.","B":"23.6%.","C":"26.7%."},"answer":"B","topic":"Mixed Topics","page":12,"solution":"assets/solutions/1-1/54.jpg","confidence":"ocr","explanation":"because the continuously compounded return from t to t + 1 is\nfy ter = IN(Sp/Sp) = IN(1 + Ry 421).\nTherefore, the continuous compounded return from 1 January to 15 January is\nTy, 20 == In(Spo/S1) = In($38/$30) = 23.64% ~ 23.6%."},{"id":"1-1-55","set":"1-1","number":55,"stem":"A positive movement in a lagging indicator would least likely be used to:","options":{"A":"identify a past condition of the economy.","B":"identify an expected future economic upturn.","C":"confirm that an expansion is currently underway."},"answer":"B","topic":"Mixed Topics","page":12,"solution":"assets/solutions/1-1/55.jpg","confidence":"ocr","explanation":"because a positive movement in a lagging indicator would most likely be used to confirm that an existing\nexpansion is underway or has already occurred. Only a leading indicator would help identify or predict a future\neconomic event."},{"id":"1-1-56","set":"1-1","number":56,"stem":"A fund initially has $50 million under management and earns 17% in Year 1. The\nfund receives additional investments of $125 million at the beginning of Year 2\nand earns 12% in Year 2. The annualized money-weighted rate of return over the\n2-year period is closest to:","options":{"A":"13.2%.","B":"14.5%.","C":"15.5%"},"answer":"A","topic":"Mixed Topics","page":12,"solution":"assets/solutions/1-1/56.jpg","confidence":"ocr","explanation":"because the money-weighted return and its calculation are similar to the intemal rate of return and the\nyield to maturity. Just like the internal rate of return, amounts invested are cash outflows from the investor's\nperspective and amounts returned or withdrawn by the investor, or the money that remains at the end of an\ninvestment cycle, is a cash inflow for the investor. The value of the fund at the end of Year 2 is 50(1.17)(1.12) +\n125(1.12) = 205.52. To find the IRR — the money-weighted return — using a calculator: CF) = -50; CF, = -125; CF2\n= +205.52; compute IRR = 13.1785% ~ 13.2%."},{"id":"1-1-57","set":"1-1","number":57,"stem":"A central bank is least likely to:","options":{"A":"implement fiscal policy.","B":"oversee the payments system.","C":"manage foreign currency reserves."},"answer":"A","topic":"Economics","page":12,"solution":"assets/solutions/1-1/57.jpg","confidence":"ocr","explanation":"because while central banks are usually responsible for the operation of a country’s monetary policy,” they\nare not responsible for setting or implementing fiscal policy. Monetary policy refers to central bank activities that are\ndirected toward influencing the quantity of money and credit in an economy. By contrast, fiscal policy refers to the\ngovernment's decisions about taxation and spending"},{"id":"1-1-58","set":"1-1","number":58,"stem":"An analyst gathers the following data on the Sharpe ratios of seven portfolios:\n\nPortfolio         Sharpe Ratio\n1                    0.2\n2                    0.6\n3                    0.7\n4                    0.9\n5                    1.0\n6                    1.4\n7                    1.6\nThe interquartile range of the Sharpe ratios is closest to:","options":{"A":"0.6.","B":"0.8.","C":"1.4."},"answer":"B","topic":"Portfolio Management","page":13,"solution":"assets/solutions/1-1/58.jpg","confidence":"ocr","explanation":"because quartiles divide the distribution into quarters and the interquartile range (IQR) is the difference\nbetween the third quartile and the first quartile, IQR = Q, - Q,. Moreover, the location of the first quartile (Q,) and\nthe third quartile (Q;) can be calculated as: (7 + 1)(25/100) = 2 and (7 + 1)(75/100) = 6, respectively. Since the\nportfolios are already in increasing order, the first quartile (Q,) is given by the Sharpe ratio of Portfolio 2 and the\nthird quartile (Q;) by the Sharpe ratio of Portfolio 6. Hence, IQR = Q;- Q, = 1.4-0.6 = 0.8"},{"id":"1-1-59","set":"1-1","number":59,"stem":"An analyst gathers the following information about a company:\n\nBefore-tax cost of debt     5%\nMarginal tax rate       30%\nCost of equity        8%\nTarget debt-to-equity ratio    50%\n\nThe company's WACC is equal to:","options":{"A":"5.75%.","B":"6.50%.","C":"7.00%"},"answer":"B","topic":"Financial Statement Analysis","page":13,"solution":"assets/solutions/1-1/59.jpg","confidence":"ocr","explanation":"because WACC = Wer4(1 —t) + Wpfp + Wee. Given that there is no preferred stock in the capital structure,\nWACC = Wata(1—t) + Wefe. Also, a simple way of transforming a debt-to-equity ratio D/E into a weight—that is, D/(D\n+ E)-is to divide DIE by 1 + D/E. Asa result, WACC = (DIEVI[1 + (D/E)] x ry x (1-t) + 4/1 + (DIE)] x te=\n0.5/(1+0.5) x 0.05 x (1 — 0.30) + 4/(1 + 0.5) x 0.08 = 6.50%."},{"id":"1-1-60","set":"1-1","number":60,"stem":"Based on good corporate governance practices, it is most appropriate for a\ncompany's compensation committee to:","options":{"A":"include some company executives.","B":"develop director remuneration policies.","C":"recommend remuneration for the external auditors."},"answer":"B","topic":"Corporate Issuers","page":13,"solution":"assets/solutions/1-1/60.jpg","confidence":"ocr","explanation":"because under good corporate governance practices the compensation committee develops remuneration\npolicies for directors as well as key executives."},{"id":"1-1-61","set":"1-1","number":61,"stem":"If differences between accounting profit and taxable income are recoverable,\ndeferred tax assets are created when:","options":{"A":"accounting profit is less than taxable income.","B":"accounting profit is greater than taxable income.","C":"income taxes payable is less than income tax expense."},"answer":"A","topic":"Financial Statement Analysis","page":13,"solution":"assets/solutions/1-1/61.jpg","confidence":"ocr","explanation":"because deferred tax assets arise when an excess amount is paid for income taxes (taxable income higher\nthan accounting profit) and the company expects to recover the difference during the course of future operations."},{"id":"1-1-62","set":"1-1","number":62,"stem":"An analyst gathers the following exchange rate information:\nSpot rate              4.6895\n1-year forward points    -12.7\nThe 1-year forward rate is closest to:","options":{"A":"4.67680.","B":"4.68823.","C":"469077."},"answer":"B","topic":"Fixed Income","page":14,"solution":"assets/solutions/1-1/62.jpg","confidence":"ocr","explanation":"because to convert any of these quoted forward points into a forward rate, one would divide the number of\npoints by 10,000 (to scale down to the fourth decimal place, the last decimal place in the spot quote) and then add\nthe result to the spot exchange rate quote 4.6895 + (-12.7/10,000) = 4.6895 — 0.00127 = 4.68823"},{"id":"1-1-63","set":"1-1","number":63,"stem":"An investor plans to contribute $10,000 each year into an account that earns an\nannual interest rate of 5%. If the first contribution is made one year from today,\nthe value of the account immediately after the 10th contribution is closest to:","options":{"A":"$125,779.","B":"$132,068.","C":"$142,068."},"answer":"A","topic":"Mixed Topics","page":14,"solution":"assets/solutions/1-1/63.jpg","confidence":"ocr","explanation":"because it is the future value of the ordinary annuity: FV = A x ((1 + 1) — 4yr=$10,000[(1 + 0.05)\" —\n10.05 = $125,779. Calculator solution: [PMT] = 10,000; [N] = 10; [I/Y] = 5; [CPT] [FV] = 125,779."},{"id":"1-1-64","set":"1-1","number":64,"stem":"According to Modigliani and Miller's Proposition without taxes, a higher\nproportion of debt in the capital structure of a company results in:","options":{"A":"the same WACC","B":"a lower cost of equity.","C":"a greater company value."},"answer":"A","topic":"Corporate Issuers","page":14,"solution":"assets/solutions/1-1/64.jpg","confidence":"ocr","explanation":"because the more debt the company uses, the greater the cost of equity, but the total value of the\ncompany does not change and neither does the weighted average cost of capital"},{"id":"1-1-65","set":"1-1","number":65,"stem":"In a small country, an export subsidy for a good most likely results in a decrease\nin the good's domestic:","options":{"A":"price.","B":"production.","C":"consumption."},"answer":"C","topic":"Mixed Topics","page":14,"solution":"assets/solutions/1-1/65.jpg","confidence":"ocr","explanation":"because as the price increases, domestic consumption will most likely decrease.\nInternational Trade\n= compare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications"},{"id":"1-1-66","set":"1-1","number":66,"stem":"In the statement of cash flows, interest paid by a company is most likely included\nin:","options":{"A":"either the operating or financing section under IFRS.","B":"either the operating or financing section under US GAAP.","C":"only the financing section under both IFRS and US GAAP."},"answer":"A","topic":"Mixed Topics","page":14,"solution":"assets/solutions/1-1/66.jpg","confidence":"ocr","explanation":"because US GAAP requires that interest paid be classified as an operating cash flow; IFRS allows interest\npaid to be classified as either an operating or financing activity,"},{"id":"1-1-67","set":"1-1","number":67,"stem":"An analyst is comparing the solvency of a company over the past two years using\nthe information below:\n\nYear 2                         ¥ Millions\nTotal debt                               2,300\nTotal shareholders' equity                17,000\nTotal assets                            20,000\nNet income                             375\nInterest payments/interest expense          200\nTaxes paid                             125\nRatios in Year 1\nDebt to capital                       12.7%\nInterest coverage                              2.9\nThe best conclusion\nthe analyst can make about Year 2 is that compared with Year    1, the company's\nsolvency has:","options":{"A":"remained the same.","B":"deteriorated because both ratios have weakened.","C":"improved because both ratios have strengthened."},"answer":"C","topic":"Mixed Topics","page":15,"solution":"assets/solutions/1-1/67.jpg","confidence":"ocr","explanation":"because both ratios have improved from Year 1 to Year 2, thus the company is more solvent in Year 2\n—ssCYear4——~SS=CSYear2calculations Year\nDebt to capital 127% 2,300/(2,300 + 17,000) = 11.9% 11.9%\nInterest coverage 29 (375 + 200 + 125)/200 = 3.5 35\nFinancial Analysis Techniques\n= calculate and interpret activity, liquidity, solvency, and profitability ratios"},{"id":"1-1-68","set":"1-1","number":68,"stem":"Which action is most likely considered a secondary source of liquidity?","options":{"A":"Increasing the availability of bank lines of credit","B":"Increasing the efficiency of cash flow management","C":"Renegotiating current debt contracts to lower interest payments"},"answer":"C","topic":"Mixed Topics","page":15,"solution":"assets/solutions/1-1/68.jpg","confidence":"ocr","explanation":"because renegotiating debt contracts is a secondary source of liquidity because it may affect the\n‘company’s operating and/or financial positions\nWorking Capital and Liquidity\n= explain liquidity and compare issuers’ liquidity levels"},{"id":"1-1-69","set":"1-1","number":69,"stem":"The returns of a fund are as follows:\nYear      Return (%)\n1           -20.60\n2           15.00\n3            0.50\n4            9.80\n5            4.60\nThe mean absolute deviation (MAD) of returns for the fund is closest to:","options":{"A":"9.53%.","B":"11.91%.","C":"13.69%."},"answer":"A","topic":"Mixed Topics","page":15,"solution":"assets/solutions/1-1/69.jpg","confidence":"ocr","explanation":". The mean absolute deviation (MAD) for a sample is calculated as follows: MAD = = where\nXX; = the return of the fund during year /\nX = the mean of the returns of the sample\nn= the number of retums in the sample\ni= the index for the year\nIn this problem:\nMean: X = (-20.60% + 15.00% + 0.50% + 9.80% + 4.60%)/5 = 1.86%\n1-20.60% - 1.86%| 22.46\n115.00% ~ 1.86%| 13.14\n10.50% ~ 1.86%| 1.36\n19.80% ~ 1.86%| 7.94\n14.60% ~ 1.86%| 274\nTotal 47.64\nMAD = 47.64/5, 9.53"},{"id":"1-1-70","set":"1-1","number":70,"stem":"The time-weighted rate of return:","options":{"A":"is affected by the amount and timing of cash flows to and from a portfolio.","B":"calculates multi-period cash flows mirroring a portfolio's compound growth\nrate.","C":"results in a lower return when compared with the money-weighted rate of\nreturn."},"answer":"B","topic":"Portfolio Management","page":16,"solution":"assets/solutions/1-1/70.jpg","confidence":"ocr","explanation":"because time-weighted rate of return reflects the compound rate of growth of one unit of currency invested\nover a stated measurement period, and it removes the effects of timing and amount of withdrawals and additions to\nthe portfolio."},{"id":"1-1-71","set":"1-1","number":71,"stem":"An analyst gathers the following information about a company:\n\nYear 2    Year 1\nRevenue                                          €725,000   €720,000\nEBIT                                             €93,500    €91,500\nNet income                                        €57,500    €58,000\nWeighted average common shares outstanding during    650,000    635,000\nthe year\n\nWhich of the following increased from Year 1 to Year 2?","options":{"A":"Basic FPS","B":"EBIT margin","C":"Net profit margin"},"answer":"B","topic":"Equity Investments","page":16,"solution":"assets/solutions/1-1/71.jpg","confidence":"ocr","explanation":"because EBIT margin = EBIT / Total revenues.\nYear 1 = €91,500 / €720,000 ~ 12.71%\nYear 2 = €93,500 / €725,000 ~ 12.90%\nAccordingly, EBIT margin increased from Year 1 to Year 2"},{"id":"1-1-72","set":"1-1","number":72,"stem":"All else being equal, in an environment of rising inventory unit costs and constant\ninventory quantities, the LIFO inventory valuation method most likely results in a\nhigher.","options":{"A":"ending inventory than under the FIFO method.","B":"gross profit margin than under the FIFO method.","C":"inventory turnover ratio than under the FIFO method."},"answer":"C","topic":"Financial Statement Analysis","page":16,"solution":"assets/solutions/1-1/72.jpg","confidence":"inferred","explanation":""},{"id":"1-1-73","set":"1-1","number":73,"stem":"For a company reporting under IFRS, which of the following events most likely\nrepresents low financial reporting quality? The company:","options":{"A":"reported an increase in EPS as a result of the sale of a subsidiary.","B":"included gains from foreign exchange rate changes in its cost of goods sold.","C":"entered a long-term lease for a customized piece of equipment and classified\nit as a finance lease."},"answer":"B","topic":"Financial Statement Analysis","page":16,"solution":"assets/solutions/1-1/73.jpg","confidence":"ocr","explanation":"because high financial reporting quality provides useful information to decision makers. Since foreign\n‘exchange gains and losses may not recur, they should be disclosed separately and not included in cost of goods\nsold"},{"id":"1-1-74","set":"1-1","number":74,"stem":"An analyst gathers the following information (in $ millions) about a company\nreporting under US GAAP:\n\nCash flow from operations        500\nCapital expenditures             40\nInterest expensed and paid         20\nNet borrowing                  10\n\nIf the tax rate is 25%, free cash flow to the firm (in $ millions)is:","options":{"A":"460.","B":"470.","C":"475."},"answer":"C","topic":"Financial Statement Analysis","page":17,"solution":"assets/solutions/1-1/74.jpg","confidence":"ocr","explanation":"because FCFF = CFO + Int(1 — Tax rate) — FCInv. Free cash flow to the firm is calculated as $500 + $20 * (\n10.25 )— $40 = $500 + $15 — $40 = $475.\n\nAnalyzing Statements of Cash Flows II\n\n= calculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow\n\nratios"},{"id":"1-1-75","set":"1-1","number":75,"stem":"For a hypothesis test concerning the correlation between two normally distributed\nvariables with sample size n each, the number of degrees of freedom is","options":{"A":"n-2.","B":"n-1.","C":"2n-2."},"answer":"A","topic":"Quantitative Methods","page":17,"solution":"assets/solutions/1-1/75.jpg","confidence":"ocr","explanation":"because if the two variables are normally distributed, we can test to determine whether the null hypothesis\n(Hp: p = 0) should be rejected. This test statistic is t-distributed with n ~ 2 degrees of freedom, where p represents\nthe population correlation coefficient."},{"id":"1-1-76","set":"1-1","number":76,"stem":"A portfolio has two stocks with equal weighting. The variance of returns for each\nstock is 100 percent squared, and the covariance is 50 percent squared. The\nportfolio standard deviation of returns is closest to:","options":{"A":"7.9%.","B":"8.7%.","C":"75.0%."},"answer":"B","topic":"Portfolio Management","page":17,"solution":"assets/solutions/1-1/76.jpg","confidence":"ocr","explanation":"because 0%(Re) = Ej-1 2-4 wiw,Cov(Ri.Rj)\nFor two assets, n = 2, 0%(Re) = i202 + wz2oz2 + 2042022,\nwhere, from given values, 0; = 022 = 100%2, 04,2?= 50%?\nSince the portfolio is equally weighted, w; = 1/n = %\nHence, the portfolio variance, 0%(Rp) = (¥4)2(100) + (%)2(100) + 2(%)(%4)(50) = %4(100 + 100 + 100) = 300/4 = 75\n[%?], ie. portfolio standard deviation, o(Rz) = \\(0.0075) = 0.08660 ~ 0.087 = 8.7%."},{"id":"1-1-77","set":"1-1","number":77,"stem":"A researcher wants to measure the level of consumer confidence in a country by\ninterviewing a simple random sample of ten consumers from three randomly\nselected cities. This method is an example of:","options":{"A":"cluster sampling.","B":"systematic sampling.","C":"stratified random sampling."},"answer":"A","topic":"Quantitative Methods","page":17,"solution":"assets/solutions/1-1/77.jpg","confidence":"ocr","explanation":"because cluster sampling requires the division or classification of the population into subpopulation groups,\ncalled clusters. In this method, the population is divided into clusters, each of which is essentially a mini-\nrepresentation of the entire populations. Then certain clusters are chosen as a whole using simple random\nsampling. If a subsample is randomly selected from each selected cluster, then the plan is referred as two-stage\ncluster sampling. In this case, each city represents a cluster, from which a sample of ten consumers is randomly\nselected, i.e. the researcher uses a two-stage cluster sampling."},{"id":"1-1-78","set":"1-1","number":78,"stem":"The following data apply to a firm operating in perfect competition.\nQuantity Total   Revenue Total        Cost\n21             $210            $138\n22             $220            $145\n23             $230            $154\n24             $240            $165\n\nThe firm's profit maximizing output (in units) is most likely:","options":{"A":"21.","B":"23.","C":"24."},"answer":"B","topic":"Mixed Topics","page":17,"solution":"assets/solutions/1-1/78.jpg","confidence":"ocr","explanation":"because under perfect competition, economic profits are maximized when marginal revenue equals short-\nTun marginal cost—in this case, marginal cost crosses $10 per unit. Profits are maximized at 23 units of production\nbecause marginal cost is in excess of marginal revenue at 24 units."},{"id":"1-1-79","set":"1-1","number":79,"stem":"The money supply most likely increases when a central bank:","options":{"A":"purchases bonds.","B":"increases the policy rate.","C":"raises the reserve requirement."},"answer":"A","topic":"Fixed Income","page":18,"solution":"assets/solutions/1-1/79.jpg","confidence":"ocr","explanation":"because if the central bank wishes to increase the supply of money, it might buy bonds (usually\ngovernment bonds) from the banks, with an agreement to sell them back at some time in the future. This\ntransaction is known as a repurchase agreement."},{"id":"1-1-80","set":"1-1","number":80,"stem":"Under IFRS, which component of the change in the net pension asset or liability\neach period is recognized in other comprehensive income?","options":{"A":"Employees' service costs","B":"Actuarial gains and losses and other remeasurements","C":"The net interest expense or income accrued on the beginning net pension\nplan asset or liability"},"answer":"B","topic":"Mixed Topics","page":18,"solution":"assets/solutions/1-1/80.jpg","confidence":"ocr","explanation":"because under IFRS, the change in the net pension asset or liability each period is viewed as having three\ngeneral components. Two of the components of this change are recognized as pension expense in profit and loss:\n(1) employees’ service costs and (2) the net interest expense or income accrued on the beginning net pension\nasset or liability. The third item, remeasurements, is recognized in other comprehensive income"},{"id":"1-1-81","set":"1-1","number":81,"stem":"The following information is available for a company:\n\nYear 2\n(in E Millions)\nEBIT(earnings before interest and taxes)            1,015.0\n\nInterest expense                                    73.4\nTax expense                                     201.4\n\nTotal assets                                       5,305.0\n\nAverage total assets                               5,421.0\nTotal debt                                         1.048.0\n\nYear 1\nInterest coverage                                15.3×\nDebt to total assets                           18.2%\nOperating return on assets (ROA)                17.3%\n\nCompared with Year 1,which of the following ratios most likely indicates an\nimprovement in the creditworthiness of the company? The change in the\ncompany's:","options":{"A":"operating ROA.","B":"interest coverage","C":"debt-to-total assets."},"answer":"A","topic":"Mixed Topics","page":18,"solution":"assets/solutions/1-1/81.jpg","confidence":"ocr","explanation":". When calculated for Year 2, interest coverage decreased and debt to total assets and retum on assets\nboth increased. In general, a decrease in interest coverage and an increase in debt to total assets would reduce\ncreditworthiness, but an increase in return on assets would improve creditworthiness. Calculations are as follows:\nCalculation Year 2 Comment\nDebt to total Total debi/Totalassets= 19.8% Higher than year 1(18.2%), which would reduce\nassets €1,048/€5,305 = creditworthiness\nInterest EBIT/Interest payments=  13.8x _ Lower than Year 1(15.3x), which would reduce\ncoverage €1,015/€73.4 = creditworthiness\nOperating ROA —_EBIT/Average total assets= 18.7% Higher than year 1 (17.3%), which would\n€1,015/€5,421 = improve creditworthiness"},{"id":"1-1-82","set":"1-1","number":82,"stem":"When considering ESG factors, energy efficiency is best described as a(n):","options":{"A":"environmental factor.","B":"social factor.","C":"governance factor."},"answer":"A","topic":"Mixed Topics","page":18,"solution":"assets/solutions/1-1/82.jpg","confidence":"ocr","explanation":"because energy efficiency is best described as an environmental factor. Environmental factors that are\ngenerally considered material in investment analysis include natural resource management, pollution prevention,\nwater conservation, energy efficiency and reduced emissions, the existence of carbon assets, and adherence to\nenvironmental safety and regulatory standards."},{"id":"1-1-83","set":"1-1","number":83,"stem":"An analyst gathers the following information about a company:\n\nTarget D/E             0.80\nCurrent D/E            0.65\nYield to maturity     4%\nCost of equity       9%\nTax rate           30%\n\nThe WACC to be used in financial analysis is closest to:","options":{"A":"6.24%.","B":"6.56%.","C":"6.78%."},"answer":"A","topic":"Fixed Income","page":19,"solution":"assets/solutions/1-1/83.jpg","confidence":"ocr","explanation":"because the target D/E ratio is used to determine WACC. The target capital structure is the company’s\nchosen
