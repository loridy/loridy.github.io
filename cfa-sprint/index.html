ecreasing net external demand.","C":"decreasing real domestic demand and decreasing net external demand."},"answer":"C","topic":"Economics","page":18,"solution":"assets/solutions/5-1/82.jpg","confidence":"ocr","explanation":"because there is a whole range of interconnected ways in which an increase in a central bank's policy rate\ncan reduce real domestic demand and net external demand (that is, the difference between export and import\nconsumption)\n\nMonetary Policy\n\n= describe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain\nthe relationships between monetary policy and economic growth, inflation, interest, and exchange rates"},{"id":"5-1-83","set":"5-1","number":83,"stem":"All else being equal, if the level of significance applied to a hypothesis test\ndecreases from 0.05 to 0.01, which of the following probabilities will\nincrease?","options":{"A":"Only a Type I error","B":"Only a Type II error","C":"Both a Type I error and a Type II error"},"answer":"B","topic":"Quantitative Methods","page":18,"solution":"assets/solutions/5-1/83.jpg","confidence":"ocr","explanation":"because, all else equal, if we decrease the probability of a Type | error by specifying a smaller significance\nlevel (say 0.01 rather than 0.05), we increase the probability of making a Type II error because we will reject the\nnull less frequently, including when it is false."},{"id":"5-1-84","set":"5-1","number":84,"stem":"The most appropriate test to determine whether performance of a group of\nanalysts differed between two consecutive 10-year periods is a:","options":{"A":"sign test.","B":"Mann-Whitney U-test.","C":"Wilcoxon signed-rank test."},"answer":"B","topic":"Mixed Topics","page":18,"solution":"assets/solutions/5-1/84.jpg","confidence":"ocr","explanation":"because the Mann-Whitney U-test is most appropriate for tests of differences in means for nonparametric\ndata such as analysts’ rankings."},{"id":"5-1-85","set":"5-1","number":85,"stem":"A characteristic of monopolistic competition is most likely:","options":{"A":"high barriers to entry.","B":"a large number of sellers.","C":"strong pricing power of firms."},"answer":"B","topic":"Mixed Topics","page":18,"solution":"assets/solutions/5-1/85.jpg","confidence":"ocr","explanation":"because under the conditions of monopolistic competition there are a large number of potential buyers and\nsellers."},{"id":"5-1-86","set":"5-1","number":86,"stem":"Nationalization of industries is an example of which type of geopolitical\ntool?","options":{"A":"Financial","B":"Economic","C":"National security"},"answer":"B","topic":"Mixed Topics","page":19,"solution":"assets/solutions/5-1/86.jpg","confidence":"ocr","explanation":"because economic tools can also be non-cooperative in nature. Nationalization, the process of transferring\nan activity or industry from private to state control, is a non-cooperative approach to asserting economic control."},{"id":"5-1-87","set":"5-1","number":87,"stem":"An investor gathers the following information about three potential\ninvestment portfolios with normally distributed returns:\nPortfolio 1     Portfolio 2     Portfolio 3\nExpected annual return          20%        14%        17%\nStandard deviation of returns      17%        10%        13%\nThe investor wants to withdraw $25,000 at year end without withdrawing\nany of their initial $500,000 capital. According to Roy's safety-first criterion,\nthe optimal portfolio is:","options":{"A":"Portfolio 1.","B":"Portfolio 2.","C":"Portfolio 3."},"answer":"C","topic":"Portfolio Management","page":19,"solution":"assets/solutions/5-1/87.jpg","confidence":"ocr","explanation":"because using the formula for a safety-first optimal portfolio, [E(R,) — Ril/o,, where E(R,) is the portfolio's\nexpected return, R, is the threshold return (here being $25,000/$500,000 = 5%) and g, is the portfolio's standard\ndeviation of return, the safety-first ratios for the three portfolios are:\n\nPortfolio 1: (0.20 — 0.05)/0.17 = 0.88\nPortfolio 2: (0.14 — 0.05)/0.10 = 0.90\nPortfolio 3: (0.17 — 0.05)/0.13 = 0.92\nIfreturns are normally distributed, the safety-first optimal portfolio maximizes the safety-first ratio (SFRatio).\nTherefore, Portfolio 3 is the optimal portfolio according to Roy's safety-first criterion,\nPortfolio Mathematics\n= define shortfall risk, calculate the safety-first ratio, and identify an optimal portfolio using Roy's safety-first criterion"},{"id":"5-1-88","set":"5-1","number":88,"stem":"An analyst gathers the following return data:\n1.4%\n2.7%\n4.1%\n4.8%\n6.1%\n6.9%\n8.3%\n9.0%\nThe 30h percentile is closest to:","options":{"A":"2.7%.","B":"3.3%.","C":"3.7%."},"answer":"C","topic":"Quantitative Methods","page":19,"solution":"assets/solutions/5-1/88.jpg","confidence":"ocr","explanation":"because the yth percentile is the value at or below which y% of observations lie. The location of a\npercentile is: (n + 1) x (y/ 100); here, the location of the 30\" percentile is (8 + 1) x (30 / 100) = 2.7. The value of\n30\" percentile is determined using linear interpolation: 2.7% + [(2.7 — 2.0) x (4.1% — 2.7%)] = 3.7%.\n\nStatistical Measures of Asset Returns\n\n= calculate, interpret, and evaluate measures of central tendency and location to address an investment problem"},{"id":"5-1-89","set":"5-1","number":89,"stem":"If wages and prices are rigid, which of the following policy combinations\nmost likely leads to an increase in aggregate demand from the private sector\nrelative to the public sector?","options":{"A":"Easy fiscal policy and easy monetary policy","B":"Easy fiscal policy and tight monetary policy","C":"Tight fiscal policy and easy monetary policy"},"answer":"C","topic":"Economics","page":19,"solution":"assets/solutions/5-1/89.jpg","confidence":"ocr","explanation":"because, under the assumption that wages and prices are rigid, if a fiscal contraction is accompanied by\nexpansionary monetary policy and low interest rates, then the private sector will be stimulated and will increase as\na share of GDP, while the public sector will shrink.\n\nMonetary Policy\n\n= explain the interaction of monetary and fiscal policy"},{"id":"5-1-90","set":"5-1","number":90,"stem":"An analyst gathers the following quarterly returns for an investment fund:\nQuarter    Return\nQ1      2%\nQ2      6%\nQ3       -4%\nQ4      8%\nIf the target return is 5%, the target downside deviation is closest to:","options":{"A":"4.7%.","B":"5.3%.","C":"5.5%."},"answer":"C","topic":"Mixed Topics","page":20,"solution":"assets/solutions/5-1/90.jpg","confidence":"ocr","explanation":"because the target downside deviation, also referred to as the target semideviation, is a measure of\ndispersion of the observations (here, returns) below the target. It is calculated by Starget = [(2\" rat XieBO%— Bn —\n4))°5 = {((2 — 5? + (4 — 54 — 1)}°5 = (90/3)\"5 = 5.477 oF 5.5%\n\nStatistical Measures of Asset Returns\n\n= calculate, interpret, and evaluate measures of dispersion to address an investment problem"},{"id":"5-2-01","set":"5-2","number":1,"stem":"The Macaulay duration of a non-callable perpetual bond with a yield in perpetuity\nof 8%is closest to:","options":{"A":"7.4.","B":"8.0.","C":"135"},"answer":"C","topic":"Fixed Income","page":1,"solution":"assets/solutions/5-2/01.jpg","confidence":"ocr","explanation":"because the Macaulay duration of a non-callable perpetual bond is\nMacDur = (1 + ir\n= 1.08/0.08 = 13.5\n\nInterest Rate Risk and Return\n\n= define, calculate, and interpret Macaulay duration"},{"id":"5-2-02","set":"5-2","number":2,"stem":"An analyst gathers the following information about zero rates:\nYears to Maturity Zero      Rate\n1               1.50%\n2               2.00%\n3               2.25%\nThe 2-year implied forward rate in one year's time is closest to:","options":{"A":"2.50%.","B":"2.63%.","C":"2.75%."},"answer":"B","topic":"Fixed Income","page":1,"solution":"assets/solutions/5-2/02.jpg","confidence":"ocr","explanation":"because this is the implied forward rate that starts in year 1 and ends in year 3 with a tenor of 2 (= 3-1)\nyears, denoted as IFR,,2. The general formula for the relationship between the two spot rates (Za, Zs) and the\nimplied forward rate (IFR,..-a) [that starts in period A and ends in period B] is given by (1 +Z,)* * (1+ IFRag a) *\n=(1 +25)\n\nTherefore, for the provided information:\n\n(14 2))' x 1 AIERiga)P = (1 #25),\n\n(4+ 1.5%)! x (1 + IFRy2? = (1 + 2.25%),\n\nIFRy2= [(1 + 2.25%)5/(1 + 4.5%)']\"? —1 = 0.026271 ~ 2.63%"},{"id":"5-2-03","set":"5-2","number":3,"stem":"A European waterfall distributes performance fees on a(n):","options":{"A":"deal-by-deal basis and is more advantageous to the general partner than an\nAmerican waterfall.","B":"deal-by-deal basis and is more advantageous to the limited partners than an\nAmerican waterfall.","C":"aggregated fund level and is more advantageous to the limited partners than\nan American waterfall."},"answer":"C","topic":"Alternative Investments","page":1,"solution":"assets/solutions/5-2/03.jpg","confidence":"ocr","explanation":"because whole-of-fund (or European) waterfalls occur at the aggregate fund level (i., after all\ninvestments have been exited) and are more advantageous to the LPs. In alternative investments, a waterfall\nrepresents the distribution method that defines the order in which allocations are made to LPs and GPs. There are\ntwo types of waterfalls: deal-by-deal (or American) waterfalls and whole-of-fund (or European) waterfalls. Deal-by-\ndeal waterfalls are more advantageous to the GP because performance fees are collected on a per-deal basis,\nallowing the GP to get paid before LPs receive both their initial investment and their preferred rate of return (ie.,\nthe hurdle rate) on the entire fund. In whole-of-fund waterfalls, all distributions go to the LPs as deals are exited\nand the GP does not participate in any profits until the LPs receive their initial investment and the hurdle rate has\nbeen met. In contrast to deal-by-deal waterfalls, whole-of-fund waterfalls occur at the aggregate fund level (i.e.,\nafter all investments have been exited) and are more advantageous to the LPs.\n\nAlternative Investment Features, Methods, and Structures\n\n= describe investment ownership and compensation structures commonly used in alternative investments"},{"id":"5-2-04","set":"5-2","number":4,"stem":"If interest rates are increasing, the effective duration of a bond with an embedded\nput option is:","options":{"A":"less than the effective duration of an option-free bond.","B":"the same as the effective duration of an option-free bond.","C":"greater than the effective duration of an option-free bond."},"answer":"A","topic":"Fixed Income","page":1,"solution":"assets/solutions/5-2/04.jpg","confidence":"ocr","explanation":"because an embedded put option reduces the effective duration of the bond, especially when rates are\nrising"},{"id":"5-2-05","set":"5-2","number":5,"stem":"An investor wants to avoid investing in companies that contribute to pollution. In\nthe IPS, this requirement is most appropriately specified in the:","options":{"A":"liquidity section.","B":"unique circumstances section.","C":"investment objectives section."},"answer":"B","topic":"Mixed Topics","page":1,"solution":"assets/solutions/5-2/05.jpg","confidence":"ocr","explanation":"because the unique circumstances section of the IPS should cover any other aspect of the client's\ncircumstances, including beliefs and values, that is likely to have a material impact on the composition of the\nportfolio. Such considerations are often referred to as ESG (environmental, social, governance). Examples of ESG\nissues include environmental issues such as air and water pollution"},{"id":"5-2-06","set":"5-2","number":6,"stem":"In capital market theory, the optimal portfolio for an investor who borrows at the\nrisk-free rate to invest in the market portfolio is situated:","options":{"A":"above the capital allocation line.","B":"to the right of the market portfolio on the capital allocation line.","C":"at the tangent of the capital allocation line and the Markowitz efficient\nfrontier."},"answer":"B","topic":"Portfolio Management","page":2,"solution":"assets/solutions/5-2/06.jpg","confidence":"ocr","explanation":"because the location of an optimal investor portfolio depends on the investor's risk preferences. Some less\nrisk-averse investors (i.e., with a high risk tolerance) may wish to accept even more risk because of the chance of\nhigher return. Such an investor may borrow money to invest more in the risky portfolio. The optimal investor\nportfolio for such an investor will lie to the right of the optimal risky portfolio on the capital allocation line."},{"id":"5-2-07","set":"5-2","number":7,"stem":"Which of the following derivative contracts most likely requires an upfront\npayment by the buyer at contract initiation?","options":{"A":"Options only","B":"Forwards only","C":"Both options and forwards"},"answer":"A","topic":"Derivatives","page":2,"solution":"assets/solutions/5-2/07.jpg","confidence":"ocr","explanation":"because this right to exercise in the future has a value that is paid upfront to the option seller in the form of\nan option premium."},{"id":"5-2-08","set":"5-2","number":8,"stem":"The price of an option-free bond increases by 5%when the yield to maturity\ndecreases by 200 basis points. If the price of this bond decreases by 5%,the yield\nto maturity most likely increases by:","options":{"A":"less than 200 basis points.","B":"200 basis points.","C":"more than 200 basis points."},"answer":"C","topic":"Fixed Income","page":2,"solution":"assets/solutions/5-2/08.jpg","confidence":"ocr","explanation":"because for an option-free bond with the same coupon rate and time-to-maturity, the percentage price\nchange is greater (in absolute value, meaning without regard to the sign of the change) when the market discount\nrate goes down than when it goes up (the convexity effect),\n\nFixed-Income Bond Valuation: Prices and Yields\n\n= identify the relationships among a bond’s price, coupon rate, maturity, and yield-to-maturity"},{"id":"5-2-09","set":"5-2","number":9,"stem":"A company's depository receipts most likely trade:","options":{"A":"like ordinary shares on the investors' local exchanges.","B":"in the local currency on the company's local exchange.","C":"in the company's currency on investors' local exchanges."},"answer":"A","topic":"Equity Investments","page":2,"solution":"assets/solutions/5-2/09.jpg","confidence":"ocr","explanation":"because a depository receipt (DR) is a security that trades like an ordinary share on an investor's local\nexchange and represents an economic interest in a foreign company. It allows the publicly listed shares of a foreign\ncompany to be traded on an exchange outside its domestic market."},{"id":"5-2-10","set":"5-2","number":10,"stem":"Which of the following measures is least appropriate for evaluating the risk of a\ncurrency option?","options":{"A":"Beta","B":"Vega","C":"Delta"},"answer":"A","topic":"Derivatives","page":2,"solution":"assets/solutions/5-2/10.jpg","confidence":"ocr","explanation":"because beta is a measure of the sensitivity of a security's retums to the returns on the market portfolio.\nBeta measures relative risk, meaning how much market risk an asset contributes to a well-diversified portfolio. Beta\ndescribes risk well for a portfolio of equities, but other sources of risk may require other descriptive risk metrics.\nThe risk associated with derivatives is one example of this"},{"id":"5-2-11","set":"5-2","number":11,"stem":"An analyst gathers the following information about a company:\nDividend payout ratio       40%\nSustainable growth rate      6%\nROE is closest to:","options":{"A":"3.6%.","B":"10.0%.","C":"15.0%."},"answer":"B","topic":"Mixed Topics","page":2,"solution":"assets/solutions/5-2/11.jpg","confidence":"ocr","explanation":"because Sustainable growth rate = Retention rate x ROE where the retention rate is the complement of\nthe dividend payout ratio (ie., 1 — payout ratio). Rearranging gives ROE = Sustainable growth rate / (1 — Dividend\npayout ratio) = 6% / 60%= 10%."},{"id":"5-2-12","set":"5-2","number":12,"stem":"A financial system is best described as operationally efficient when:","options":{"A":"the costs of arranging trades are low.","B":"asset and contract prices reflect all available information.","C":"an economy's resources are used where they are most valuable."},"answer":"A","topic":"Mixed Topics","page":3,"solution":"assets/solutions/5-2/12.jpg","confidence":"ocr","explanation":"because if the costs of arranging trades are low, the financial system is operationally efficient."},{"id":"5-2-13","set":"5-2","number":13,"stem":"Which  of  the following statements  regarding a commodity index  is most\naccurate?","options":{"A":"Commodity indexes commonly use an equal-weighting method.","B":"Commodity indexes in the same markets will share similar risk and return\nprofiles.","C":"Commodity index returns differ from the changes in the prices of their\nunderlying commodities."},"answer":"C","topic":"Alternative Investments","page":3,"solution":"assets/solutions/5-2/13.jpg","confidence":"ocr","explanation":"because the performance of commodity indexes can be different from their underlying commodities\nbecause the indexes consist of futures contracts on the commodities rather than the actual commodities.\nCommodity index returns reflect the risk-free interest rate, the changes in future prices, and the roll yield\n\nSecurity Market Indexes\n\n= describe indexes representing alternative investments"},{"id":"5-2-14","set":"5-2","number":14,"stem":"A strategy that seeks to profit from investing in companies that are likely to be\nacquired is best described as a(n):","options":{"A":"macro strategy.","B":"event-driven strategy.","C":"relative value strategy."},"answer":"B","topic":"Mixed Topics","page":3,"solution":"assets/solutions/5-2/14.jpg","confidence":"ocr","explanation":"because event-driven strategies seek to profit from defined catalyst events, typically those that involve\nchanges in corporate structure, such as an acquisition or restructuring. This strategy is considered to be\nunderpinned by bottom-up security-specific analysis, as opposed to top-down analysis. Investments may include\nlong and short positions in common and preferred stocks, debt securities, and options."},{"id":"5-2-15","set":"5-2","number":15,"stem":"An investor purchased a 5-year bond at issuance for 98 per 100 of par value and\nheld the bond for two years. Coupon payments were reinvested at the original\nyield to maturity. If the realized horizon yield is equal to the original yield to\nmaturity, the investor most likely sold the bond at a price:","options":{"A":"below par","B":"equal to par.","C":"above par."},"answer":"A","topic":"Fixed Income","page":3,"solution":"assets/solutions/5-2/15.jpg","confidence":"ocr","explanation":"because the realized horizon yield matches the original yield-to-maturity if (1) coupon payments are\nreinvested at the same interest rate as the original yield-to-maturity, and (2) the bond is sold at a price on the\nconstant-yield price trajectory, which implies that the investor does not have any capital gains or losses when the\nbond is sold. Since the bond is sold prior to maturity, the bond would have to be sold at a price greater than 98 but\nless than 100."},{"id":"5-2-16","set":"5-2","number":16,"stem":"A security and the market exhibit the following characteristics:\nRisk-free rate of return             2%\nMarket risk premium              8%\nBeta                                      1.5\nSecurity's correlation with the market       0.5\nBased on the CAPM, the security's expected rate of return is closest to:","options":{"A":"6%.","B":"11%","C":"14%."},"answer":"C","topic":"Portfolio Management","page":3,"solution":"assets/solutions/5-2/16.jpg","confidence":"ocr","explanation":"because the calculation of the security's expected return using the CAPM calculation is as follows: E(R,) =\nR-+* BilE(Rm) — R = 2% + (1.5) x (8%) = 14%. The market risk premium is the expected return minus the risk free\nrate so you do not need to subtract the risk free rate because it is already reflected in the market risk premium."},{"id":"5-2-17","set":"5-2","number":17,"stem":"If a leveraged position is financed at a minimum margin requirement of 55%, the\nmaximum leverage ratio is closest to:","options":{"A":"1.55.","B":"1.82.","C":"2.22."},"answer":"B","topic":"Mixed Topics","page":4,"solution":"assets/solutions/5-2/17.jpg","confidence":"ocr","explanation":"because the maximum leverage ratio associated with a position financed by the minimum margin\nrequirement is one divided by the minimum margin requirement. 100% / 55% ~ 1.82"},{"id":"5-2-18","set":"5-2","number":18,"stem":"Which of the following pooled investment products is most likely to trade at a\nprice furthest from its NAV?","options":{"A":"ETF","B":"Open-end mutual fund","C":"Closed-end mutual fund"},"answer":"C","topic":"Mixed Topics","page":4,"solution":"assets/solutions/5-2/18.jpg","confidence":"ocr","explanation":"because closed-end funds can trade at a premium or discount to their NAV due to the fixed number of\nshares outstanding. That is, one consequence of this fixed share base is that, unlike open-end funds in which new\nshares are created and sold at the current NAV per share, closed-end funds can sell for a premium or discount to\nNAV depending on the demand for the shares.\n\nPortfolio Management: An Overview\n\n= describe mutual funds and compare them with other pooled investment products"},{"id":"5-2-19","set":"5-2","number":19,"stem":"An investor allocates $10 million at the beginning of the year to a hedge fund\ncharging a management fee of 2% and an incentive fee of 20% with a 6% hard\nhurdle  rate. At year-end the value of the investment  is $11.8 million. The\nincentive fee is calculated net of the management fee and the management fee is\nbased on the year-end value. The net-of-fees return the investor earned is closest\nto:","options":{"A":"13.24%.","B":"13.71%","C":"13.93%"},"answer":"B","topic":"Alternative Investments","page":4,"solution":"assets/solutions/5-2/19.jpg","confidence":"ocr","explanation":"because the net-of-fees retum to the investor at year-end is closest to 13.71%\nPortfolio gain = year-end value — beginning value = $11.8 million — $10 million = $1.8 million\nHurdle amount = beginning value x hurdle % = $10 million x 6% = $600,000\nManagement fee = year-end value x management fee % = $11.8 million x 2% = $236,000\nIncentive fee = (portfolio gain — hurdle amount — management fee) x Incentive fee %\n= ($1.8 million — $600,000 — $236,000) x 20% = $192,800\nTotal fees = management fee + incentive fee = $236,000 + $192,800 = $428,800\nNet-of-fees return = (portfolio gain — total fees)/beginning value\n= ($1.8 million — $428,800)/$10 million = 13.71%"},{"id":"5-2-20","set":"5-2","number":20,"stem":"Return-generating models are best used to estimate the:","options":{"A":"expected return of a security.","B":"expected return of the market portfolio.","C":"expected excess return on the market portfolio."},"answer":"A","topic":"Portfolio Management","page":4,"solution":"assets/solutions/5-2/20.jpg","confidence":"ocr","explanation":"because a retum-generating model is a model that can provide an estimate of the expected return of a\nsecurity given certain parameters"},{"id":"5-2-21","set":"5-2","number":21,"stem":"A value-weighted equity index is most likely biased by a stock that","options":{"A":"has a high price","B":"splits frequently.","C":"has a large market capitalization."},"answer":"C","topic":"Equity Investments","page":4,"solution":"assets/solutions/5-2/21.jpg","confidence":"ocr","explanation":"because the impact of a given percentage price change of a large-cap stock is larger than the impact of\nthe same percentage price change of a small-cap stock, which is a source of bias for value-weighted indexes.\nSecurity Market Indexes\n= compare the different weighting methods used in index construction"},{"id":"5-2-22","set":"5-2","number":22,"stem":"The time value of an option is equal to the:","options":{"A":"option price minus the intrinsic value of the option.","B":"strike price of the option minus the underlying price.","C":"strike price of the option minus the intrinsic value of the option."},"answer":"A","topic":"Derivatives","page":4,"solution":"assets/solutions/5-2/22.jpg","confidence":"ocr","explanation":"because the time value of an option is the difference between the market price of the option and its\nintrinsic value"},{"id":"5-2-23","set":"5-2","number":23,"stem":"All else being equal, which of the following portfolios should have the lowest\nrisk profile? A portfolio consisting of","options":{"A":"greenfield assets only.","B":"brownfield assets only.","C":"both greenfield assets and brownfield assets."},"answer":"B","topic":"Portfolio Management","page":5,"solution":"assets/solutions/5-2/23.jpg","confidence":"ocr","explanation":"because operational secondary-stage assets with an existing track record of generating steady, bond-like\ncash flows possess the lowest risk and offer the lowest return to the investors. Brownfield investments,\nredevelopment of existing infrastructure, are incrementally riskier, and greenfield projects are the riskiest"},{"id":"5-2-24","set":"5-2","number":24,"stem":"Which of the following performance measures is most appropriate for an investor\nwho holds a well-diversified portfolio?","options":{"A":"M2","B":"Sharpe ratio","C":"Jensen's alpha"},"answer":"C","topic":"Portfolio Management","page":5,"solution":"assets/solutions/5-2/24.jpg","confidence":"ocr","explanation":"because Jensen's alpha is based on systematic risk. Performance measures relative to beta risk—Treynor\nratio and Jensen's alpha—are relevant when the investor holds a well-diversified portfolio with negligible\ndiversifiable risk."},{"id":"5-2-25","set":"5-2","number":25,"stem":"Which of the following is most likely an application of the CAPM?","options":{"A":"Estimating expected returns over multiple periods","B":"Assessing return performance against a benchmark","C":"Estimating expected returns using multiple investment factors"},"answer":"B","topic":"Portfolio Management","page":5,"solution":"assets/solutions/5-2/25.jpg","confidence":"ocr","explanation":"because applications of the CAPM include comparison of the actual return of a portfolio or portfolio\nmanager with the CAPM return for performance appraisal."},{"id":"5-2-26","set":"5-2","number":26,"stem":"In the context of venture capital financing, seed-stage financing most likely\nsupports:","options":{"A":"initial commercial production and sales.","B":"product development and/or marketing efforts.","C":"transformation of an idea into a business plan."},"answer":"B","topic":"Alternative Investments","page":5,"solution":"assets/solutions/5-2/26.jpg","confidence":"ocr","explanation":"because seed-stage financing, or seed capital, generally supports product development and marketing\nefforts, including market research. This is the first stage at which VC funds usually invest."},{"id":"5-2-27","set":"5-2","number":27,"stem":"Which of the following  is least likely a feature of a credit card receivable\nasset-backed security (ABS)?","options":{"A":"A lockout period","B":"Amortizing collateral","C":"An early amortization provision"},"answer":"B","topic":"Mixed Topics","page":5,"solution":"assets/solutions/5-2/27.jpg","confidence":"ocr","explanation":"because a credit card receivable ABS is an example of an ABS with a non-amortizing collateral"},{"id":"5-2-28","set":"5-2","number":28,"stem":"A company has an obligation to pay a certain amount each month to each of its\nemployees after they retire. This obligation is a characteristic of a(n):","options":{"A":"endowment.","B":"defined-benefit pension plan.","C":"defined-contribution pension plan."},"answer":"B","topic":"Mixed Topics","page":5,"solution":"assets/solutions/5-2/28.jpg","confidence":"ocr","explanation":"because a defined-benefit pension plan defines the future benefit that an employer has the obligation to\npay in terms of the retirement income benefits owed to participants."},{"id":"5-2-29","set":"5-2","number":29,"stem":"Which of the following statements is most accurate? Venture debt is private debt\nfunding provided to:","options":{"A":"public companies with the intent to take them private.","B":"startup or early-stage companies that may have little or negative cash flow.","C":"mature companies that face bankruptcy or other complications with meeting\ndebt obligations."},"answer":"B","topic":"Mixed Topics","page":6,"solution":"assets/solutions/5-2/29.jpg","confidence":"ocr","explanation":"because for private debt, in addition to private loans or bonds, venture debt is extended to early-stage\nfirms with little or no cash flow."},{"id":"5-2-30","set":"5-2","number":30,"stem":"A closed-end fund is trading at a premium to its NAV. This scenario most likely\nreflects:","options":{"A":"concerns about the quality of management.","B":"excess demand for redemption of the shares.","C":"a belief that the portfolio securities are undervalued."},"answer":"C","topic":"Portfolio Management","page":6,"solution":"assets/solutions/5-2/30.jpg","confidence":"ocr","explanation":"because closed-end funds may trade at a premium (discount) to NAV when investors believe that the\nportfolio securities are undervalued (overvalued).\n\nMarket Organization and Structure\n\n= describe the major types of securities, currencies, contracts, commodities, and real assets that trade in organized\n\nmarkets, including their distinguishing characteristics and major subtypes"},{"id":"5-2-31","set":"5-2","number":31,"stem":"For a portfolio consisting of two assets with a correlation coefficient of +1.0,\nportfolio risk is most likely:","options":{"A":"less than the weighted average of the risk of the two assets in the portfolio.","B":"equal to the weighted average of the risk of the two assets in the portfolio.","C":"greater than the weighted average of the risk of the two assets in the\nportfolio."},"answer":"B","topic":"Portfolio Management","page":6,"solution":"assets/solutions/5-2/31.jpg","confidence":"ocr","explanation":"because with a correlation coefficient of +1.0, no diversification benefits are obtained and the portfolio risk\nis equal to the weighted average of the risk of the two assets in the portfolio."},{"id":"5-2-32","set":"5-2","number":32,"stem":"A waterfall structure in asset-backed securities is most likely associated with:","options":{"A":"credit tranching.","B":"overcollateralization.","C":"monoline insurance guarantees."},"answer":"A","topic":"Alternative Investments","page":6,"solution":"assets/solutions/5-2/32.jpg","confidence":"ocr","explanation":"because it is common for securitizations to include a form of internal credit enhancement called\nsubordination, also referred to as credit tranching. In such a structure, there is more than one bond class or\ntranche, and the bond classes differ as to how they will share any losses resulting from defaults of the borrowers\nwhose loans are in the collateral. This type of protection is also commonly referred to as a waterfall structure\nbecause of the cascading flow of payments between bond classes in the event of default"},{"id":"5-2-33","set":"5-2","number":33,"stem":"A market has the following limit orders standing on its book for a particular\nstock:\nBuyer   Bid  Size(#  of  Limit         Seller Offer   Size(#of      Limit\nshares)          Price($)                    shares)        Price($)\n1         500           18.50          1          200         20.20\n2         300           18.90          2          300         20.35\n3         400           19.20          3          400         20.50\n4         200           20.10          4          100         20.65\n5         100           20.15          5          200         20.70\nIf a trader submits an immediate-or-cancel limit buy order for 700 shares at a\nprice of $20.50, the average price the trader will pay is closest to:","options":{"A":"$20.35.","B":"$20.50.","C":"$20.58."},"answer":"A","topic":"Equity Investments","page":6,"solution":"assets/solutions/5-2/33.jpg","confidence":"ocr","explanation":"because the limit buy order will be filled first with the most aggressively priced limit sell order and will be\nfollowed by filling with the higher priced limit sell orders that are needed up to and including the limit buy price until\nthe order is filled.\nAverage price = [(200 x $20.20) + (300 x $20.35) + (200 x$20.50)/700\n= $20.35."},{"id":"5-2-34","set":"5-2","number":34,"stem":"Private real estate investors expect to generate the highest returns from","options":{"A":"core strategies.","B":"value-add strategies.","C":"opportunistic strategies."},"answer":"C","topic":"Mixed Topics","page":7,"solution":"assets/solutions/5-2/34.jpg","confidence":"ocr","explanation":"because investors seeking higher returns may also accept development, redevelopment, repositioning,\nand leasing risk. Finite-life closed-end funds are more commonly used for alpha- and beta-generating value-add\nand opportunistic investment styles. Value-add investments may require modest redevelopment or upgrades, the\nleasing of vacant space, or repositioning the underlying properties to earn a higher return than core properties\nOpportunistic investing accepts the much higher risks of development, major redevelopment, repurposing of assets,\ntaking on large vacancies, and speculating on significant improvement in market conditions\n\nReal Estate and Infrastructure\n\n= explain features and characteristics of real estate"},{"id":"5-2-35","set":"5-2","number":35,"stem":"Which of the following is most likely a consequence of the overconfidence bias?\nAn investor who:","options":{"A":"overestimates downside risks","B":"underestimates expected returns","C":"holds a poorly diversified portfolio"},"answer":"C","topic":"Portfolio Management","page":7,"solution":"assets/solutions/5-2/35.jpg","confidence":"ocr","explanation":"because as a result of overconfidence bias, investors may underestimate risks and overestimate expected\nreturns and/or hold poorly diversified portfolios, which may result in significant downside risk.\n\nThe Behavioral Biases of Individuals\n\n= discuss commonly recognized behavioral biases and their implications for financial decision making"},{"id":"5-2-36","set":"5-2","number":36,"stem":"An analyst gathers the following data to value the shares of a company:\nROE                        12%\nDividend payout ratio            40%\nRequired rate of return on shares     15%\nCurrent year's dividend per share      $3.60\nUsing the Gordon growth model, the intrinsic value per share is closest to:","options":{"A":"$36.96.","B":"$46.15.","C":"$49.49."},"answer":"C","topic":"Equity Investments","page":7,"solution":"assets/solutions/5-2/36.jpg","confidence":"ocr","explanation":"because the intrinsic value per share can be calculated using the Gordon growth model, as follows:\nFirst, calculate the growth rate g:\ng=bxROE\nb= Earnings retention rate = (1 — Dividend payout ratio)\nb=1-040=060\ng= 0.60 x 0.12 =0.072=7.2%\nThen, use the Gordon growth model to calculate intrinsic value =\nVo = D,i(r—g) where\nDy =Dy* (1+9)\nD, = 3.60 x (1.072) = $3.86\nVp = 3.86/(0.15 — 0.072) = $49.49\nEquity Valuation: Concepts and Basic Tools\n= calculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend\ndiscount model or a two-stage dividend discount model, as appropriate"},{"id":"5-2-37","set":"5-2","number":37,"stem":"Which of the following statements about distributed ledger technology (DLT) is\nmost accurate?","options":{"A":"DLT  is  considered  energy-efficient  as  it  requires minimal energy  for\ntransaction verification","B":"Using DLT, a transaction entered incorrectly can easily be  rectified by\ndeleting the incorrect record","C":"A DLT consensus mechanism requires nodes in a network to agree on a\ncommon state of the ledger"},"answer":"C","topic":"Mixed Topics","page":7,"solution":"assets/solutions/5-2/37.jpg","confidence":"ocr","explanation":"because consensus mechanism is the process by which the computer entities (or nodes) in a network\nagree on a common state of the ledger.\n\nIntroduction to Digital Assets\n\n= describe financial applications of distributed ledger technology"},{"id":"5-2-38","set":"5-2","number":38,"stem":"With respect to risk management, risk budgeting applies to:","options":{"A":"portfolio management only.","B":"business management only.","C":"both portfolio management and business management."},"answer":"C","topic":"Portfolio Management","page":7,"solution":"assets/solutions/5-2/38.jpg","confidence":"ocr","explanation":"because risk budgeting applies to both business management and portfolio management. Its foundation is\nthe perspective that business or portfolio management involves assembling a number of risk activities or securities,\nwhich can be collated into an assemblage of various risk characteristics.\n\nIntroduction to Risk Management\n\n= describe risk budgeting and its role in risk governance"},{"id":"5-2-39","set":"5-2","number":39,"stem":"An analyst gathers the following information about forward rates:\nTime Period Forward    Rate\n0y1y                  2.31%\n1y1y                  2.82%\n2y1y                  2.97%\nThe 2-year implied spot rate is closest to:","options":{"A":"2.56%.","B":"2.82%.","C":"2.89%."},"answer":"A","topic":"Fixed Income","page":8,"solution":"assets/solutions/5-2/39.jpg","confidence":"ocr","explanation":"because the spot curve can be calculated as the geometric average of the forward rates. Here, the two-\nyear implied spot rate is: (1.0231 x 1.0282) = (1 + 2,)?, z) = 0.0256 = 2.56%"},{"id":"5-2-40","set":"5-2","number":40,"stem":"For parallel shifts in the benchmark yield curve, key rate durations indicate the\nsame interest rate sensitivity as:","options":{"A":"effective duration.","B":"modified duration.","C":"Macaulay duration."},"answer":"A","topic":"Fixed Income","page":8,"solution":"assets/solutions/5-2/40.jpg","confidence":"ocr","explanation":"because for parallel shifts in the benchmark yield curve, yields at all maturity segments of the curve move\nthe same in both direction and magnitude and the curve maintains its shape (no flattening or steepening). As a\nresult, key rate durations at all maturity segments will indicate the same interest rate sensitivity as effective\nduration, the measure of interest rate risk in terms of a parallel shift in the benchmark yield curve."},{"id":"5-2-41","set":"5-2","number":41,"stem":"A company announces an unexpected improvement in its earnings forecast for the\ncoming year. The announcement most likely immediately impacts:","options":{"A":"the company's book value of equity only.","B":"the company's market value of equity only.","C":"both the company's book value of equity and the company's market value of\nequity."},"answer":"B","topic":"Mixed Topics","page":8,"solution":"assets/solutions/5-2/41.jpg","confidence":"ocr","explanation":"because market value reflects the collective and differing expectations of investors concerning the\n‘amount, timing, and uncertainty of the company's future cash flows, and an unexpected change in a company's\nearnings forecast will change investors expectations."},{"id":"5-2-42","set":"5-2","number":42,"stem":"The rating agency notching adjustment applied to the subordinated debt rating of\nspeculative grade issuers is most likely.","options":{"A":"smaller than that applied to the subordinated debt rating of investment grade\nissuers.","B":"the same as that applied to the subordinated debt rating of investment grade\nissuers.","C":"larger than that applied to the subordinated debt rating of investment grade\nissuers."},"answer":"C","topic":"Mixed Topics","page":8,"solution":"assets/solutions/5-2/42.jpg","confidence":"ocr","explanation":"because as a general rule, the higher the senior unsecured rating, the smaller the notching adjustment will\nbe. Speculative grade issuers have lower senior unsecured ratings and hence larger notching adjustments.\n\nCredit Analysis for Corporate Issuers.\n\n= describe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and\n\ntheir impact on credit ratings"},{"id":"5-2-43","set":"5-2","number":43,"stem":"An analyst gathers the following information about a hedge fund:\nBeginning-of-year assets under management (AUM)         $50 million\nAnnual return before fees                             20%\nManagement fee (based on end-of-year AUM before fees)        2%\nIncentive fee (based on return net of management fees)          20%\nThe total amount of fees earned by the hedge fund is:","options":{"A":"$2.80 million.","B":"$2.96 million.","C":"$3.20 million."},"answer":"B","topic":"Alternative Investments","page":9,"solution":"assets/solutions/5-2/43.jpg","confidence":"ocr","explanation":"because management fee = end of year AUM x management fee = $60 million x 2% = $1.2 million; where\nend of year AUM = beginning of year AUM x (1+ annual return) = $50million x 1.20= $60 million\nIncentive fee = (end of year AUM — beginning of year AUM — management fee) x incentive fee = ($60 — $50 — $1.2)\nmillion x 20% = $1.76 million.\nTotal fees = management fee + incentive fee = $1.2 million + $1.76 million = $2.96 million"},{"id":"5-2-44","set":"5-2","number":44,"stem":"If a semiannual pay bond has a yield-to-maturity of 4.3%, the yield-to-maturity\nbased on quarterly compounding is closest to:","options":{"A":"4.23%.","B":"4.28%.","C":"4.32%."},"answer":"B","topic":"Fixed Income","page":9,"solution":"assets/solutions/5-2/44.jpg","confidence":"ocr","explanation":"because the formula to convert from semi-annual to quarterly compounding is\n(1+ (APRI2))2= (1 + (APRI/4))*\n(4 + (0.043/2))? = (1 + (APRI4))*\nAPR = 0.042771 ~ 4.28%"},{"id":"5-2-45","set":"5-2","number":45,"stem":"An analyst gathers the following information about a company (in $thousands):\nYear 1   Year 2\nOperating income              168     217\nDepreciation and amortization    422     416\nInterest expense               120     155\nBased  on  the  interest  coverage   ratio  using  EBITDA,  the  company's\ncreditworthiness has:","options":{"A":"deteriorated.","B":"remained the same.","C":"improved."},"answer":"A","topic":"Financial Statement Analysis","page":9,"solution":"assets/solutions/5-2/45.jpg","confidence":"ocr","explanation":"because over the period the interest coverage ratio decreased, which indicates that the company is worse\npositioned to service its debt. A higher ratio indicates higher credit quality.\nInterest coverage ratio is calculated as EBITDA/Interest expense and EBITDA = Operating income + Depreciation\nand amortization, hence the ratios are:\nYear 1: EBITDA: 168 + 422 = 590 = Interest coverage: 590/120 = 4.92 = 4.9x;\nYear 2: EBITDA: 217 + 416 = 633 = Interest coverage: 633/155 = 4.08 = 4.1x."},{"id":"5-2-46","set":"5-2","number":46,"stem":"For a put option, if the price of the underlying is greater than the exercise price,\nthe put option is:","options":{"A":"in the money.","B":"at the money.","C":"out of the money."},"answer":"C","topic":"Derivatives","page":9,"solution":"assets/solutions/5-2/46.jpg","confidence":"ocr","explanation":"because when the underlying is higher than the exercise price of the put option, the option is said to be out\nof the money.\nPricing and Valuation of Options\n= explain the exercise value, moneyness, and time value of an option"},{"id":"5-2-47","set":"5-2","number":47,"stem":"An analyst gathers the following information about two companies' non-callable,\nnon-convertible perpetual preference shares:\nPreference Share 1   Preference Share 2\nPar value                       $100               $100\nRequired rate of return          8%             11%\nAnnual dividend per share           $6                 $8\nThe value of Preference Share 1 is:","options":{"A":"less than the value of Preference Share 2.","B":"equal to the value of Preference Share 2.","C":"greater than the value of Preference Share 2."},"answer":"C","topic":"Equity Investments","page":10,"solution":"assets/solutions/5-2/47.jpg","confidence":"ocr","explanation":"because the present value (PV) of a non-callable, non-convertible, perpetual preference share is solved\nusing the equation: Vo = Do /r, (where: Dy = current dividend; r= required rate of return on the stock. Therefore the\nPV of Preference Share 1 = $6 / 0.08 = $75.00, which is greater than the PV of Preference Share 2 = $8 / 0.11 ~\n$72.73.\n\nEquity Valuation: Concepts and Basic Tools\n\n= calculate the intrinsic value of a non-callable, non-convertible preferred stock"},{"id":"5-2-48","set":"5-2","number":48,"stem":"A commodity market is in contango when futures prices are:","options":{"A":"lower than the spot price.","B":"the same as the spot price.","C":"higher than the spot price."},"answer":"C","topic":"Derivatives","page":10,"solution":"assets/solutions/5-2/48.jpg","confidence":"ocr","explanation":"because when a commodity market is in contango, futures prices are higher than the spot price.\nNatural Resources\n= describe features of commodities and their investment characteristics"},{"id":"5-2-49","set":"5-2","number":49,"stem":"A portfolio consists of four bonds with the following characteristics:\nBond  Market Value  Duration\nA     $1.2 million          3.2\nB     $3.4 million          7.6\nC     $2.9 million        12.4\nD     $1.6 million          1.5\nThe duration of the portfolio is closest to:","options":{"A":"5.4.","B":"6.2.","C":"7.5."},"answer":"C","topic":"Fixed Income","page":10,"solution":"assets/solutions/5-2/49.jpg","confidence":"ocr","explanation":"because the duration of a portfolio is the weighted average of the bonds’ durations in which the weight for\neach bond is its contribution to the portfolio’s value, as follows:\nDurationporttoto = 2Wpond X Durationgong., where,\nWhond = ValUl@yonq/ VAIU® porto\nIn this case, value of the portfolio is 1.2 + 3.4 + 2.9 + 1.6 = $9.1 million, and the portfolio duration equals (1.2/9.1 x\n3.2) + (3.4/9.1 x 7.6) + (2.9/9.1 x 12.4) + (1.6/9.1 x 1.5) = 0.4220 + 2.8396 + 3.9516 + 0.2637 ~7.5.\n\nYield-Based Bond Convexity and Portfolio Properties\n\n= calculate portfolio duration and convexity and explain the limitations of these measures"},{"id":"5-2-50","set":"5-2","number":50,"stem":"Under which of the following alternative investment methods can an investor\ninvest indirectly in alternative assets?","options":{"A":"Co-investing only","B":"Fund investing only","C":"Both co-investing and fund investing"},"answer":"C","topic":"Alternative Investments","page":10,"solution":"assets/solutions/5-2/50.jpg","confidence":"ocr","explanation":"because fund investing can be viewed as an indirect method of investing in alternative assets. In addition,\nunder co-investing, the investor invests in assets indirectly through the fund but also possesses rights (known as.\nco-investment rights) to invest directly in the same assets\n\nAlternative Investment Features, Methods, and Structures\n\n= compare direct investment, co-investment, and fund investment methods for alternative investments"},{"id":"5-2-51","set":"5-2","number":51,"stem":"Which of the following statements is least accurate? A firm's FCFE:","options":{"A":"is a measure of the firm's dividend-paying capacity.","B":"increases with an increase in the firm's net borrowing.","C":"is significantly affected by the amount of dividends paid by the firm."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/5-2/51.jpg","confidence":"ocr","explanation":"because dividends, a discretionary cash flow from financing activities, have no bearing on a firm's FCFE,\nas can be seen from the formula: FCFE = CFO — FCInv + Net borrowing\n\nEquity Valuation: Concepts and Basic Tools\n\n= explain the rationale for using present value models to value equity and describe the dividend discount and free-\n\ncash-flow-to-equity models"},{"id":"5-2-52","set":"5-2","number":52,"stem":"An investor opens a margin account with an initial deposit of $5,000. He then\npurchases 300 shares of a stock at $30 per share using margin. The account\nrequires a maintenance margin of 30%. Ignoring commissions and interest, the\nprice below which the investor will first receive a margin call is closest to:","options":{"A":"$19.05.","B":"$23.08.","C":"$23.81."},"answer":"A","topic":"Equity Investments","page":11,"solution":"assets/solutions/5-2/52.jpg","confidence":"ocr","explanation":"because the price below which the investor will receive a margin call can be calculated using the equation\nfor calculating maintenance margin\nMaintenance margin = Equity ~ Market value =\n5000+ (Px300)-(30%300)\nSEE CO = 30%,\nSolving for Price, P= $19.05"},{"id":"5-2-53","set":"5-2","number":53,"stem":"Forward contracts are different from futures contracts because forwards are:","options":{"A":"standardized.","B":"marked to market.","C":"traded over-the-counter."},"answer":"C","topic":"Derivatives","page":11,"solution":"assets/solutions/5-2/53.jpg","confidence":"ocr","explanation":"because futures contracts differ from forward contracts in that they have standard terms, and are traded on\na futures exchange, whereas forward contracts are traded over-the-counter.\nPricing and Valuation of Futures Contracts\n= explain why forward and futures prices differ"},{"id":"5-2-54","set":"5-2","number":54,"stem":"Which of the following is most likely part of the feedback step in the portfolio\nmanagement process?","options":{"A":"Portfolio construction","B":"Performance measurement","C":"Developing the investment policy statement"},"answer":"B","topic":"Portfolio Management","page":11,"solution":"assets/solutions/5-2/54.jpg","confidence":"ocr","explanation":"because performance measurement, along with portfolio monitoring and rebalancing, is part of the\nfeedback step."},{"id":"5-2-55","set":"5-2","number":55,"stem":"Which of the following is most likely a cross-sectional anomaly in financial\nmarkets?","options":{"A":"Value effect","B":"Overreaction effect","C":"Closed-end fund discount"},"answer":"A","topic":"Mixed Topics","page":11,"solution":"assets/solutions/5-2/55.jpg","confidence":"ocr","explanation":"because the value effect—that is, stocks with below-average price-to-earnings and market-to-book ratios\nand above-average dividend yields have consistently outperformed growth stocks over long periods—is a cross-\nsectional anomaly."},{"id":"5-2-56","set":"5-2","number":56,"stem":"An analyst gathers the following historical information about two stocks:\nVariance of returns for Stock 1                     0.0625\nVariance of returns for Stock 2                     0.0900\nCorrelation coefficient between Stock 1 and Stock 2  0.4500\nThe covariance between Stock 1 and Stock 2 is closest to:","options":{"A":"0.0025.","B":"0.0338.","C":"0.0675."},"answer":"B","topic":"Quantitative Methods","page":11,"solution":"assets/solutions/5-2/56.jpg","confidence":"ocr","explanation":"because covariance is calculated as Cov,, = p;0;0; , where\np,;= correlation coefficient between two stocks\n9; = variance of returns for Stock 1\n0; = variance of returns for Stock 2\nPlugging in the values:\nCov,, = 0.0625\"? x 0.090\"? x 0.450 = 0.0338"},{"id":"5-2-57","set":"5-2","number":57,"stem":"All else being equal, a stock split results in:","options":{"A":"a decrease in the number of shares and an increase in the share price.","B":"an increase in the number of shares and a decrease in the share price.","C":"an increase in the number of shares and an increase in the share price."},"answer":"B","topic":"Equity Investments","page":11,"solution":"assets/solutions/5-2/57.jpg","confidence":"ocr","explanation":"because a stock split involves an increase in the number of shares outstanding with a consequent\ndecrease in share price."},{"id":"5-2-58","set":"5-2","number":58,"stem":"After  the  lockout  period,  principal  payments  associated  with  credit  card\nreceivable-backed securities are:","options":{"A":"periodically distributed to investors.","B":"reinvested in additional receivables.","C":"distributed to investors as a balloon payment."},"answer":"A","topic":"Mixed Topics","page":12,"solution":"assets/solutions/5-2/58.jpg","confidence":"ocr","explanation":"because credit card receivable-backed securities are non-amortizing loans. They have a lockout period\nduring which the only cash flows paid to investors are based on finance charges and fees. When the lockout period\nis over, principal payments are distributed to investors in periodic payments. In contrast, principal is received\nmonthly in automobile loan-backed securities."},{"id":"5-2-59","set":"5-2","number":59,"stem":"Market prices are most likely accepted as accurately reflecting intrinsic values in:","options":{"A":"an inefficient market only.","B":"a highly efficient market only.","C":"both an inefficient market and a highly efficient market."},"answer":"B","topic":"Mixed Topics","page":12,"solution":"assets/solutions/5-2/59.jpg","confidence":"ocr","explanation":"because if investors believe a market is highly efficient, they will usually accept market prices as accurately\nreflecting intrinsic values."},{"id":"5-2-60","set":"5-2","number":60,"stem":"If a market is semi-strong-form efficient, fundamental analysis most likely.","options":{"A":"enables investors to generate consistent abnormal returns.","B":"helps participants understand the value implications of information.","C":"attempts to profit by looking at patterns of prices and trading volumes."},"answer":"B","topic":"Mixed Topics","page":12,"solution":"assets/solutions/5-2/60.jpg","confidence":"ocr","explanation":"because fundamental analysis is necessary in a well-functioning market because this analysis helps\nmarket participants understand the value implications of information"},{"id":"5-2-61","set":"5-2","number":61,"stem":"According to portfolio theory, combinations of the risk-free asset and a risky asset\nresult in:","options":{"A":"a capital allocation line.","B":"the Markowitz efficient frontier.","C":"an investor's indifference curve."},"answer":"A","topic":"Portfolio Management","page":12,"solution":"assets/solutions/5-2/61.jpg","confidence":"ocr","explanation":"because the combination of the risk-free asset and a risky asset can result in a better risk-return trade-off\nthan an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset\nThe combination is called the capital allocation line."},{"id":"5-2-62","set":"5-2","number":62,"stem":"A 3-year, semiannual-pay bond with a $100 par value and a 5% coupon rate is\npurchased for $98. One year later, if the yield to maturity has decreased by 100\nbasis points, the change in the value of this bond is closest to:","options":{"A":"$2.50.","B":"$2.73.","C":"$5.98."},"answer":"A","topic":"Fixed Income","page":12,"solution":"assets/solutions/5-2/62.jpg","confidence":"ocr","explanation":"because the value of the bond is found by the formula’\nPV=[PMT/(1 + 1)\"']+[PMT/(1 + 0] +... (EV +PMT)/(1 + 9\")\nwhere\nPV = present value, or the price of the bond\nPMT = coupon payment per period\nFV = future value paid at maturity, or the par value of the bond\nr= market discount rate, or required rate of return per period\nN= number of evenly spaced periods to maturity\nAlternatively, the change in value after one year can be calculated by solving for | and calculating the new value\nwith a 100 basis point change in yield (I) with the following calculator inputs; N = (3 x 2) = 6, PMT = (5% / 2) x 100\n= $2.50, FV = $100, PV = $98, Solve |, is equal to 2.8675%, or 2.868%. Annualized, | = 2.868 x 2 = 5.736%. If the\nyield to maturity drops by 100 bps, the new yield to maturity is equal to 5.736 — 1.00 = 4.736%, or 2.368% ona\nsemi-annual basis.\nThe price of the bond after one year and the new yield to maturity (or !) is computed using the following calculator\ninputs: N =(2 x 2)= 4, PMT = $2.50, FV = $100, | = (5.736% — 1%) / 2 = 2.368%. Solving for PV, the new value is\nequal to $100.498.\nTherefore, the change in value of the bond, on an absolute basis =| $98.00 - $100.498| = $2.498, rounded to\n$2.50"},{"id":"5-2-63","set":"5-2","number":63,"stem":"The price value of a basis point for a 30-year, 1% annual coupon payment bond\nwith a par value of €1,000 and a yield-to-maturity of 0.8% is closest to:","options":{"A":"€2.58.","B":"€2.74.","C":"€3.00."},"answer":"B","topic":"Fixed Income","page":12,"solution":"assets/solutions/5-2/63.jpg","confidence":"ocr","explanation":"because\nPVBP = [(full price calculated by lowering the yield-to-maturity by 1 bp) — (full price calculated by raising the yield-\nto-maturity by 1 bp)]/2\nPVBP = (1,055.90 — 1,050.42) /2= 2.74,\nwhereby PV_: FV = 1,000; PMT = 10; N = 30; 'Y = 0.79%; CPT PV = 1,055.90 and\nPV.: FV = 1,000; PMT = 10; N = 30; IY = 0.81%; CPT PV = 1,050.42"},{"id":"5-2-64","set":"5-2","number":64,"stem":"Asset-based valuation models are best used for companies that have:","options":{"A":"a high proportion of intangibles.","B":"significant property, plant and equipment.","C":"a high proportion of current assets and current liabilities."},"answer":"C","topic":"Mixed Topics","page":13,"solution":"assets/solutions/5-2/64.jpg","confidence":"ocr","explanation":"because asset-based valuations work well for companies that do not have a high proportion of intangible or\n“off the books” assets and that do have a high proportion of current assets and current liabilities\n\nEquity Valuation: Concepts and Basic Tools\n\n= describe asset-based valuation models and their use in estimating equity value"},{"id":"5-2-65","set":"5-2","number":65,"stem":"A company seeking to raise capital with minimal public disclosure of information\nmost likely pursues a:","options":{"A":"shelf registration.","B":"private placement.","C":"best effort offering."},"answer":"B","topic":"Ethics","page":13,"solution":"assets/solutions/5-2/65.jpg","confidence":"ocr","explanation":"because in a private placement, corporations sell securities directly to a small group of qualified investors,\nusually with the assistance of an investment bank. Qualified investors have sufficient knowledge and experience to\nrecognize the risks that they assume, and sufficient wealth to assume those risks responsibly. Most countries allow\ncorporations to do private placements without nearly as much public disclosure as is required for public offerings."},{"id":"5-2-66","set":"5-2","number":66,"stem":"According to put-call parity, for European options, a long call on an asset is equal\nto a:","options":{"A":"long put plus long asset plus long risk-free bond.","B":"long put plus long asset plus short risk-free bond.","C":"short put plus short asset plus long risk-free bond."},"answer":"B","topic":"Fixed Income","page":13,"solution":"assets/solutions/5-2/66.jpg","confidence":"ocr","explanation":"because the put-call parity relationship states that\nSo+ po =co+ Fy\nThatis,\nLong asset + long put = long calll + long risk-free bond\nRearranging terms gives:\nLong call = long put + long asset + short risk-free bond."},{"id":"5-2-67","set":"5-2","number":67,"stem":"Over a given holding period, performance of credit-risky bonds will most likely\nbenefit from:","options":{"A":"periods of high demand.","B":"widening credit spreads.","C":"weakening economic conditions."},"answer":"A","topic":"Fixed Income","page":13,"solution":"assets/solutions/5-2/67.jpg","confidence":"ocr","explanation":"because in periods of high demand for bonds, spreads will move tighter. Wider spreads hurt bond\nperformance, whereas narrower spreads help bond performance."},{"id":"5-2-68","set":"5-2","number":68,"stem":"An analyst gathers the following information about Canadian bonds:\nBond                            Coupon Rate   Price   Years to Maturity\nCanadian government benchmark bond     3.0%      101          2\nCanadian corporate bond                5.0%      102          2\nAssuming annual compounding, the G-spread is closest to:","options":{"A":"146 bps.","B":"200 bps.","C":"248 bps."},"answer":"A","topic":"Fixed Income","page":13,"solution":"assets/solutions/5-2/68.jpg","confidence":"ocr","explanation":"because the yield spread in basis points over an actual or interpolated government bond is known as the\nG-spread. Using the data provided, the yield for the Canadian Government Bond is found by 101 = 3/(1 +r) +103\n1 (1 +1)? r= 2.48%. While the yield on the corporate bond is 102 = 5/ (1 +r) + 105/ (1 +r. r= 3.94%. G spread =\n3.94 — 2.48 = 1.46 or 146 basis points."},{"id":"5-2-69","set":"5-2","number":69,"stem":"With respect to an IPS, which of the following best describes a relative risk\nobjective for the client's portfolio?","options":{"A":"An annual tracking risk of less than 2 percent","B":"A 12-month 95%value at risk less than $1,000,000","C":"Maintaining at least $10,000 in cash for planned monthly withdrawals"},"answer":"A","topic":"Portfolio Management","page":13,"solution":"assets/solutions/5-2/69.jpg","confidence":"ocr","explanation":"because for risk relative to a benchmark, the measure could be tracking risk, or tracking error. Further, an\nexpected tracking risk of 2% would imply a return within 4% of the index return approximately 95% of the time.\nRemember that tracking risk is stated as a one standard deviation measure."},{"id":"5-2-70","set":"5-2","number":70,"stem":"A put option trades for $1.00 with an exercise price of $40.00. If the price of the\nunderlying at expiration is $35.00, the profit for a put seller is:","options":{"A":"-$5.00.","B":"-$4.00.","C":"$4.00."},"answer":"B","topic":"Derivatives","page":14,"solution":"assets/solutions/5-2/70.jpg","confidence":"ocr","explanation":"because the put seller's profit is: = —Max(0, X— S7) + pp , where\nX= exercise price\nS,= strike price\nPo= price of put option\nPlugging in the values:\nTN =—Max(0, $40.00 — $35.00) + $1.00 = -$4.00."},{"id":"5-2-71","set":"5-2","number":71,"stem":"A hedge  portfolio  consists  of  underlying  assets and  derivatives on  those\nunderlying assets. In the absence of arbitrage, the portfolio is expected to earn:","options":{"A":"zero return.","B":"the risk-free rate of return.","C":"the weighted average return of the underlying assets in the portfolio."},"answer":"B","topic":"Portfolio Management","page":14,"solution":"assets/solutions/5-2/71.jpg","confidence":"ocr","explanation":"because derivatives usually take their values from the underlying by constructing a hypothetical\ncombination of the derivatives and the underlyings that eliminates risk. This combination is typically called a hedge\nportfolio. With the risk eliminated, it follows that the hedge portfolio should eam the risk-free rate"},{"id":"5-2-72","set":"5-2","number":72,"stem":"The forward price on an underlying asset will increase with an increase in:","options":{"A":"storage costs of the underlying asset.","B":"interest earned on the underlying asset.","C":"convenience yield of the underlying asset."},"answer":"A","topic":"Fixed Income","page":14,"solution":"assets/solutions/5-2/72.jpg","confidence":"ocr","explanation":"because forward price = Fo(T) = (So—y + 8)(1 + 1)\" = (underlying price — interest eamed + storage cost) x\n(1 + risk free rate)*(time to expiration). Therefore, the forward price will increase with an increase in storage costs\nof the underlying asset."},{"id":"5-2-73","set":"5-2","number":73,"stem":"All else being equal, which of the following bonds most likely has the highest\nyield to maturity?","options":{"A":"Putable bonds","B":"Convertible bonds","C":"Contingent convertible bonds"},"answer":"C","topic":"Fixed Income","page":14,"solution":"assets/solutions/5-2/73.jpg","confidence":"ocr","explanation":"because bonds with contingent write-down provisions are convertible on the downside. In the case of\ncontingent convertible bonds (CoCos), conversion is automatic if a specified event occurs. In such cases, the\nCoCos immediately convert into equity. Because the conversion is not at the option of the bondholders but\nautomatic, CoCos force bondholders to take losses. For this reason, CoCos must offer a higher yield than otherwise\nsimilar bonds.\n\nFixed-Income Cash Flows and Types\n\n= describe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions\nthat benefit issuers and investors"},{"id":"5-2-74","set":"5-2","number":74,"stem":"Issuers' disclosures about operating costs are most likely","options":{"A":"less detailed than their revenue disclosures.","B":"just as detailed as their revenue disclosures.","C":"more detailed than their revenue disclosures."},"answer":"A","topic":"Ethics","page":14,"solution":"assets/solutions/5-2/74.jpg","confidence":"ocr","explanation":"because issuers’ disclosures about operating costs are typically less detailed than revenue disclosures.\nRather than modeling costs separately for different geographic regions, business segments, or product lines,\nanalysts are often forced to use more aggregated forecast objects such as consolidated financial statement lines\n(eg., cost of sales, SG&A) or summary measures like EBITDA margins on a consolidated or segment basis."},{"id":"5-2-75","set":"5-2","number":75,"stem":"A net investment hedge occurs when a derivative is used to:","options":{"A":"offset the fluctuation in the fair value of an asset or liability.","B":"absorb the variable cash flow of a floating rate asset or liability.","C":"offset the exchange rate risk of the equity of a foreign operation."},"answer":"C","topic":"Derivatives","page":14,"solution":"assets/solutions/5-2/75.jpg","confidence":"ocr","explanation":"because net investment hedges occur when either a foreign currency bond or a derivative such as an FX\nswap or forward is used to offset the exchange rate risk of the equity of a foreign operation\n\nDerivative Benefits, Risks, and Issuer and Investor Uses\n\n= compare the use of derivatives among issuers and investors"},{"id":"5-2-76","set":"5-2","number":76,"stem":"If a hedge fund imposes a gate, it is temporarily limiting the:","options":{"A":"redemptions from the fund.","B":"inflow of money into the fund.","C":"amount of leverage in the fund."},"answer":"A","topic":"Alternative Investments","page":14,"solution":"assets/solutions/5-2/76.jpg","confidence":"ocr","explanation":"because funds sometimes impose a gate, which limits or restricts redemptions for a period of time.\nInvestors should be aware of their liquidity needs before investing in a fund with restrictive provisions"},{"id":"5-2-77","set":"5-2","number":77,"stem":"Which of the following sections of the IPS most likely explains how to respond to\nvarious contingencies?","options":{"A":"Procedures","B":"Investment guidelines","C":"Evaluation and review"},"answer":"A","topic":"Mixed Topics","page":15,"solution":"assets/solutions/5-2/77.jpg","confidence":"ocr","explanation":"because the procedures section explains the steps to take to keep the IPS current and the procedures to\nfollow to respond to various contingencies."},{"id":"5-2-78","set":"5-2","number":78,"stem":"A South Korean electronics company issued bonds denominated in US dollars in\nthe United States and registered with the Securities and Exchange Commission\n(SEC). These bonds are most likely known as:","options":{"A":"Eurobonds.","B":"global bonds.","C":"foreign bonds."},"answer":"C","topic":"Fixed Income","page":15,"solution":"assets/solutions/5-2/78.jpg","confidence":"ocr","explanation":"because bonds issued by entities that are incorporated in another country are called foreign bonds.\nTherefore, the bonds issued by a South Korean company in the United States are known as foreign bonds.\n\nFixed-Income Cash Flows and Types\n\n= describe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities"},{"id":"5-2-79","set":"5-2","number":79,"stem":"An analyst gathers the following data for a 2-year option contract:\nForward price       1.2000 USD/EUR\nStrike price          1.2250 USD/EUR\nRisk-free rate          5%\nCall premium        0.0500 USD/EUR\nUSD/EUR is the amount of USD per 1 EUR\nThe put premium is closest to:","options":{"A":"0.0273 USD/EUR.","B":"0.0727 USD/EUR.","C":"0.0750 USD/EUR."},"answer":"B","topic":"Derivatives","page":15,"solution":"assets/solutions/5-2/79.jpg","confidence":"ocr","explanation":"because put-call forward parity can be expressed as:\n\nFa(TI(A + Hy + py = cy + XC +177,\n\nwhere F,(7)(1 + r)-7 is the present value of F,(7) discounted at the risk-free rate, pp is the price of the put option on\nthe underlying at t= 0, cy is the price of the call option on the underlying at f= 0, X(1 + 1)-7 is a risk-free bond that\npays the amount of the exercise price X at t= T.\n\nIn other words, under put-call parity, at f= 0 the price of the long underlying asset plus the long put must equal the\nprice of the long call plus the risk-free asset.\n\nRearranging the formula yields:\n\nFo(TI4 + 17 —X(1 + T= 9 Dg\n\n[Fo(T) —X]/ (1 + 1)\" = Cy — Po\n\nPo = Co [X—F(T]/ (1 +1)\"\n\nSubstituting in yields:\n\nPo = 0.0500 + (1.2250 — 1.2000) / (1 + 0.05)? = 0.0727."},{"id":"5-2-80","set":"5-2","number":80,"stem":"When  incorporating ESG  considerations  into  portfolio implementation and\nmanagement, client-directed proxy voting is most likely a characteristic of:","options":{"A":"thematic investing.","B":"negative screening.","C":"shareholder engagement."},"answer":"C","topic":"Portfolio Management","page":15,"solution":"assets/solutions/5-2/80.jpg","confidence":"ocr","explanation":"because shareholder engagement is the practice of entering into a dialogue with companies (including with\nrespect to ESG issues). With shareholder engagement, clients and investment managers have to be clear with\neach other about the exercise of voting rights, filing shareholder proposals or entering into conversations with\ncompany management. Alternatively, the client may instruct some proxy agent to vote on its behalf and according to\nits own stewardship policies\n\nBasics of Portfolio Planning and Construction\n\n= describe how environmental, social, and governance (ESG) considerations may be integrated into portfolio planning\nand construction"},{"id":"5-2-81","set":"5-2","number":81,"stem":"Compared  to  exchange-traded  derivatives,  the  relative  transparency  of\nover-the-counter derivatives is:","options":{"A":"lower.","B":"the same.","C":"higher."},"answer":"A","topic":"Derivatives","page":15,"solution":"assets/solutions/5-2/81.jpg","confidence":"ocr","explanation":"because over-the-counter derivatives are characterized by a lower degree of market transparency as many\ntransactions in OTC markets will retain a degree of privacy with lower transparency. In contrast, exchange markets\nare said to have transparency, which means that full information on all transactions is disclosed to exchanges and\nregulatory bodies. So, over-the-counter derivatives have lower market transparency than exchange-traded\nderivatives."},{"id":"5-2-82","set":"5-2","number":82,"stem":"In a repurchase agreement, the initial margin protects:","options":{"A":"the cash lender only.","B":"the cash borrower only.","C":"both the cash lender and the cash borrower."},"answer":"A","topic":"Mixed Topics","page":16,"solution":"assets/solutions/5-2/82.jpg","confidence":"ocr","explanation":"because in addition to the high quality of underlying securities, repos include features designed to reduce\nthe risk of a collateral shortfall over the contract life. One such feature is the provision of collateral in excess of the\ncash exchanged, known as initial margin. A 100% initial margin indicates a fully collateralized loan, while a higher\nmargin indicates even greater initial collateral protection. This is alternatively considered a reduction or haircut of\nthe underlying loan relative to the initial collateral value. The repo margin allows for some worsening in market\nvalue, and thus provides the cash lender a margin of safety if the collateral's market value declines."},{"id":"5-2-83","set":"5-2","number":83,"stem":"Which of the following statements about Porter's Five Forces is most accurate?","options":{"A":"Porter's Five Forces framework cannot be applied to new industries for\nwhich historical data is not available","B":"Assessing the barriers to exiting an industry should be considered when\nassessing the threat of new entrants","C":"Porter's Five Forces  is a framework for assessing industry structure that\ndetermines an industry's long-run profitability"},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/5-2/83.jpg","confidence":"ocr","explanation":"because Porter's Five Forces is a framework for assessing industry structure that determines an industry's\nlong-run profitability measure by its returns on invested capital.\n\nIndustry and Competitive Analysis\n\n= analyze an industry's structure and external influences using Porter's Five Forces and PESTLE frameworks"},{"id":"5-2-84","set":"5-2","number":84,"stem":"An analyst observes the following information about a bond:\nPrice if benchmark curve increases by 25 bps    127.66\nCurrent price per 100 of par value              130.00\nPrice if benchmark curve decreases by 25 bps   132.41\nThe effective duration for the bond is closest to:","options":{"A":"7.3.","B":"9.5.","C":"14.6."},"answer":"A","topic":"Fixed Income","page":16,"solution":"assets/solutions/5-2/84.jpg","confidence":"ocr","explanation":"because the formula for effective duration is ((PV.) - (PV.)I[2 x (ACurve) x (PVo)].\nIn this case EffDur = [132.41— 127.66)/[2 x 0.0025 x 130]\n4,75I[0.005 x 130] = 7.3077 ~7.3."},{"id":"5-2-85","set":"5-2","number":85,"stem":"An investor buys a call for $24.70 that has a strike price of $670. If the value at\nexpiration for this call is $47.60, the price of the underlying at expiration is\nclosest to:","options":{"A":"$622.40.","B":"$692.90.","C":"$717.60."},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/5-2/85.jpg","confidence":"ocr","explanation":"because the value or payoff to the call buyer at expiration is cr = Max(0,S; — X) where X is the strike price,\nSris the price of the underlying at expiration. Given the information in the stem we get $47.60 = Max(0,S; — $670).\nHence, S; =$ 670 + $47.60 = $717.60.\n\nForward Commitment and Contingent Claim Features and Instruments\n\n= determine the value at expiration and profit from a long or a short position in a call or put option"},{"id":"5-2-86","set":"5-2","number":86,"stem":"A bond has a modified duration of 6.2 and an approximate annual convexity of\n328. If yields increase by 30 bps, the expected percentage price change of this\nbond is closest to:","options":{"A":"-2.01%.","B":"-1.71%.","C":"-1.56%."},"answer":"B","topic":"Fixed Income","page":16,"solution":"assets/solutions/5-2/86.jpg","confidence":"ocr","explanation":"because the percentage price change for this bond is:\n%APV Full = [-AnnModDur x AYield] + [0.5 x AnnConvexity x (AYield)?]\n= [-6.2 x 0.003] + [0.5 x 328 x (0.003)2)\n= [-0.0186] + [0.001476] = -0.017124, rounded to -1.71%."},{"id":"5-2-87","set":"5-2","number":87,"stem":"An analyst gathers the following information about three stocks that are the only\nconstituents of an equal-weighted index:\nBeginning of the Year                End of the Year\nStock   Price per Share  Shares Outstanding   Price per Share  Shares Outstanding\n1         €30              500              €36              500\n2         €50              200              €45              200\n3         €40              300              €50              300\nAt the beginning of the year, the index value was 100. If it is not re balanced\nduring the year, the index value at the end of the year is closest to:","options":{"A":"109.2.","B":"111.7.","C":"113.5."},"answer":"B","topic":"Equity Investments","page":17,"solution":"assets/solutions/5-2/87.jpg","confidence":"ocr","explanation":"because to calculate the index value of an equal-weighted index, the return for each security is first\ncalculated using the formula: (ending value / beginning value) — 1\nStock 1: ((36/30) 1) = 0.2 = 20%\nStock 2: ((45/50) -1) = -0.1 =-10%\nStock 3: ((50/40) -1) = 0.25 = 25%\nThese returns are then averaged: (20% — 10% + 25%)/3) = 11.67%.\nThe index value at year end is the beginning index value x average return =\n100 x 1.1167 ~ 111.7."},{"id":"5-2-88","set":"5-2","number":88,"stem":"If a general partner exits successful deals early in a fund's life but incurs losses on\ndeals later, which of the following most likely allows a limited partner to reclaim\nsome of the general partner's fees?","options":{"A":"A hurdle rate.","B":"A catch-up clause.","C":"A clawback provision"},"answer":"C","topic":"Mixed Topics","page":17,"solution":"assets/solutions/5-2/88.jpg","confidence":"ocr","explanation":"because a clawback provision reflects the right of LPs to reclaim part of the GP’s performance fee. Along\neither waterfall path, if a GP ever accrues (or actually pays itself) an incentive fee on gains that are not yet fully\nrealized and then subsequently gives back these gains, an investor is typically able to claw back prior incentive fee\naccruals and payments. Clawback provisions are usually activated when a GP exits successful deals early on but\nincurs losses on deals later in the fund's life.\n\nAlternative Investment Features, Methods, and Structures\n\n= describe investment ownership and compensation structures commonly used in alternative investments"},{"id":"5-2-89","set":"5-2","number":89,"stem":"In a one-period binomial model, the risk-neutral probabilities of upward and\ndownward price movements of an underlying asset are determined by:","options":{"A":"the risk-free rate.","B":"investors' risk aversion.","C":"the probabilities of the underlying price moving up and down."},"answer":"A","topic":"Derivatives","page":17,"solution":"assets/solutions/5-2/89.jpg","confidence":"ocr","explanation":"because in a one-period binomial model, the risk-neutral probabilities are determined only by the risk-free\nrate over the life of the option and the underlying asset's volatility (as measured by the up and down gross returns,\nR, and Rg)"},{"id":"5-2-90","set":"5-2","number":90,"stem":"The justified forward P/E ratio calculated based on the Gordon growth model is\nalways positively related to the:","options":{"A":"payout ratio.","B":"dividend growth rate.","C":"required rate of return."},"answer":"B","topic":"Mixed Topics","page":17,"solution":"assets/solutions/5-2/90.jpg","confidence":"ocr","explanation":"because, based on the Gordon growth model, the justified forward P/E is calculated by dividing the\ndividend payout ratio by the difference between the required rate of return and dividend growth rate. The P/E is\ninversely related to the required rate of return and positively related to the growth rate; that is, as the required rate\nof retum increases, the P/E declines, and as the growth rate increases, the P/E increases"}];
