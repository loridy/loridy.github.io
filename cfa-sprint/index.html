aid (tax rate of 30%)                                         18.0\nTotal debt, end of year                                            512.8\nThe cash flow debt coverage ratio for the year is closest to:","options":{"A":"20.6%.","B":"23.7%.","C":"27.4%."},"answer":"A","topic":"Financial Statement Analysis","page":17,"solution":"assets/solutions/3-1/79.jpg","confidence":"ocr","explanation":"because cash flow debt coverage ratio = CFO/Total debt = 105.9/512.8 = 20.6%."},{"id":"3-1-80","set":"3-1","number":80,"stem":"A firm operating in a perfectly competitive market will most likely shut down in the\nshort run when:","options":{"A":"average total cost is higher than marginal revenue.","B":"average fixed cost is higher than average revenue.","C":"average variable cost is higher than average revenue."},"answer":"C","topic":"Mixed Topics","page":17,"solution":"assets/solutions/3-1/80.jpg","confidence":"ocr","explanation":"because if TR (total revenue) cannot cover TVC (total variable cost), the firm shuts down production to\nminimize loss. Also, average revenue (AR) is revenue per unit. Further, average variable cost (AVC) is the ratio of\ntotal variable cost to total output: AVC = TVC/Q. Therefore TR < TVC implies that AR < AVC.\n\nThe Firm and Market Structures\n\n= determine and interpret breakeven and shutdown points of production, as well as how economies and\ndiseconomies of scale affect costs under perfect and imperfect competition"},{"id":"3-1-81","set":"3-1","number":81,"stem":"In contrast to US GAAP, cash flow statements prepared under IFRS:","options":{"A":"are less flexible regarding the classification of dividends paid or received.","B":"allow interest receipts to be classified as either operating or investing cash flows.","C":"require adherence to the direct method format when reporting operating\nactivities."},"answer":"B","topic":"Financial Statement Analysis","page":18,"solution":"assets/solutions/3-1/81.jpg","confidence":"ocr","explanation":"because IFRS allows interest receipts to be classified as either operating or investing activities whereas\nUS GAAP requires interest receipts to be classified only as operating cash flows"},{"id":"3-1-82","set":"3-1","number":82,"stem":"If a company's receivables turnover ratio is equal to its payables turnover ratio, the\ncompany's cash conversion cycle is equal to its number of days of.","options":{"A":"payables.","B":"sales outstanding.","C":"inventory on hand."},"answer":"C","topic":"Financial Statement Analysis","page":18,"solution":"assets/solutions/3-1/82.jpg","confidence":"ocr","explanation":"because a company with the same value for receivables tumover and payables turnover has the same\nnumber of days sales outstanding (DSO) as the number of days of payables; therefore, the company's cash\nconversion cycle would equal the days of inventory on hand (DOH). That is, as a company's cash conversion cycle\nis equal to DOH + DSO — Number of days of payables when a company's DSO is equal to the number of days of\npayables, the company's cash conversion cycle is equal to its DOH\n\nFinancial Analysis Techniques\n\n= calculate and interpret activity, liquidity, solvency, and profitability ratios"},{"id":"3-1-83","set":"3-1","number":83,"stem":"A central bank most likely:","options":{"A":"lends money to banks facing serious shortages.","B":"is one of many supplier's of a country's currency.","C":"does not manage a country's foreign currency reserves."},"answer":"A","topic":"Economics","page":18,"solution":"assets/solutions/3-1/83.jpg","confidence":"ocr","explanation":"because the central bank acts as a lender of last resort to banks. Because the central bank effectively has\nthe capacity to print money, itis in the position to be able to supply the funds to banks that are facing a damaging\nshortage."},{"id":"3-1-84","set":"3-1","number":84,"stem":"Bootstrap resampling:","options":{"A":"repeatedly draws samples without replacement.","B":"can be used to estimate the standard error of a population median.","C":"relies on an analytical formula to estimate the distribution of estimators."},"answer":"B","topic":"Quantitative Methods","page":18,"solution":"assets/solutions/3-1/84.jpg","confidence":"ocr","explanation":"because bootstrap, one of the most popular resampling methods, can be used to find the standard error or\nconstruct confidence intervals for the statistic of other population parameters, such as the median."},{"id":"3-1-85","set":"3-1","number":85,"stem":"When a company's payables turnover ratio is lower compared to its peers, the\ncompany is most likely.","options":{"A":"utilizing early payment discounts.","B":"taking advantage of lenient supplier terms.","C":"receiving payments from customers faster than its peers."},"answer":"B","topic":"Mixed Topics","page":18,"solution":"assets/solutions/3-1/85.jpg","confidence":"ocr","explanation":"because an excessively low turnover ratio (high days payable) could indicate trouble making payments on\ntime, or alternatively, exploitation of lenient supplier terms."},{"id":"3-1-86","set":"3-1","number":86,"stem":"A company acquires 100% of a target company for a purchase price of $4.5 million.\nThe net identifiable assets of the target company have a fair value of $5 million. In\nthe period the acquisition occurs, the acquiring company most likely reports:","options":{"A":"goodwill of $0.5 million.","B":"a pretax gain of $0.5 million in profit and loss.","C":"a pretax gain of $0.5 million in other comprehensive income."},"answer":"B","topic":"Mixed Topics","page":18,"solution":"assets/solutions/3-1/86.jpg","confidence":"ocr","explanation":"because when the fair value of the assets exceeds the purchase price, it is a bargain purchase, and is\nrecognized the profit and loss in the period it occurs. When a transaction involves the purchase of net identifiable\nassets with a value greater than the cost to purchase itis called a bargain purchase. Any gain from a bargain\npurchase is recognized in profit and loss in the period in which it arises."},{"id":"3-1-87","set":"3-1","number":87,"stem":"Costs incurred related to the search of alternative materials to use in a production\nprocess:","options":{"A":"must be expensed.","B":"must be capitalized.","C":"may be capitalized if certain criteria are met."},"answer":"A","topic":"Mixed Topics","page":19,"solution":"assets/solutions/3-1/87.jpg","confidence":"ocr","explanation":"because IFRS require that expenditures on research (or during the research phase of an internal project)\nbe expensed rather than capitalized as an intangible asset. Research is defined as original and planned\ninvestigation undertaken with the prospect of gaining new scientific or technical knowledge and understanding. The\nresearch phase of an internal project refers to the period during which a company cannot demonstrate that an\nintangible asset is being created—for example, the search for alternative materials or systems to use in a\nproduction process."},{"id":"3-1-88","set":"3-1","number":88,"stem":"Which of the following statements is most accurate? The role of financial reporting is\nto:","options":{"A":"forecast future net income and cash flow.","B":"value a security for making investment decisions.","C":"provide information about a company's performance, financial position, and\nchanges in financial position."},"answer":"C","topic":"Financial Statement Analysis","page":19,"solution":"assets/solutions/3-1/88.jpg","confidence":"ocr","explanation":"because the role of financial statements issued by companies is to provide information about a company's\nperformance, financial position, and changes in financial position that is useful to a wide range of users in making\n‘economic decisions,\n\nIntroduction to Financial Statement Analysis\n\n= describe the roles of financial statement analysis"},{"id":"3-1-89","set":"3-1","number":89,"stem":"Which of the following is an example of a liquidity ratio?","options":{"A":"Defensive interval ratio","B":"Inventory turnover ratio","C":"Working capital turnover ratio"},"answer":"A","topic":"Financial Statement Analysis","page":19,"solution":"assets/solutions/3-1/89.jpg","confidence":"ocr","explanation":"because the defensive interval ratio measures how long the company can continue to pay its expenses\nfrom its existing liquid assets without receiving any additional cash inflow. A higher defensive interval ratio indicates\ngreater liquidity."},{"id":"3-1-90","set":"3-1","number":90,"stem":"In simple linear regression models, the normality assumption requires that the:","options":{"A":"dependent variable is normally distributed.","B":"independent variable is normally distributed.","C":"regression residuals are normally distributed."},"answer":"C","topic":"Quantitative Methods","page":19,"solution":"assets/solutions/3-1/90.jpg","confidence":"ocr","explanation":"because we need to make the assumption that regression residuals are normally distributed to be able to\ndraw valid conclusions from a simple linear regression model.\n\nSimple Linear Regression\n\n= explain the assumptions underlying the simple linear regression model, and describe how residuals and residual\nplots indicate if these assumptions may have been violated"},{"id":"3-2-01","set":"3-2","number":1,"stem":"A risk-neutral investor considers two investments:\n  Investment 1 has a guaranteed payment of $45.\n  Investment 2 has an equal chance of earning either $100 or $0.\nThe investor most likely:","options":{"A":"prefers Investment 1.","B":"prefers Investment 2.","C":"is indifferent between Investment 1 and Investment 2."},"answer":"B","topic":"Mixed Topics","page":1,"solution":"assets/solutions/3-2/01.jpg","confidence":"ocr","explanation":"because risk neutrality means that the investor cares only about return and not about risk, so higher return\ninvestments are more desirable even if they come with higher risk. The expected value of Investment 2 is $50,\nhigher than the $45 guaranteed payment of Investment 1"},{"id":"3-2-02","set":"3-2","number":2,"stem":"Which of the following index types has the most significant potential to suffer\nfrom survivorship bias?","options":{"A":"Hedge fund","B":"Government bond","C":"Broad equity market"},"answer":"A","topic":"Fixed Income","page":1,"solution":"assets/solutions/3-2/02.jpg","confidence":"ocr","explanation":"because hedge fund performance reporting is voluntary. Another consequence of the voluntary\nperformance reporting [of hedge funds] is the potential for survivorship bias and, therefore, inaccurate performance\nrepresentation. This means that hedge funds with poor performance may be less likely to report their performance\nto the database or may stop reporting to the database, so their returns may be excluded when measuring the\nreturn of the index. As a result, the index may not accurately reflect actual hedge fund performance so much as the\nperformance of hedge funds that are performing well"},{"id":"3-2-03","set":"3-2","number":3,"stem":"An investor sells a European put option with the following characteristics:\nPut price         50\nExercise price      1,640\nIf the price of the underlying at expiration is 1,670, the profit for the seller is:","options":{"A":"20.","B":"30.","C":"50."},"answer":"C","topic":"Derivatives","page":1,"solution":"assets/solutions/3-2/03.jpg","confidence":"ocr","explanation":"because to the put seller, the profit is [= -Max(0,X — Sr) + po, where X is the exercise price, Syis the\nprice of the underlying at expiration, and pp is the put price. Therefore, 1 = —Max(0,(1,640 — 1,670)) + 50 = 50.\n\nForward Commitment and Contingent Claim Features and Instruments\n\n= determine the value at expiration and profit from a long or a short position in a call or put option"},{"id":"3-2-04","set":"3-2","number":4,"stem":"The price/yield relationship for option-free bonds is best described as:","options":{"A":"linear.","B":"convex.","C":"concave."},"answer":"B","topic":"Fixed Income","page":1,"solution":"assets/solutions/3-2/04.jpg","confidence":"ocr","explanation":"because the price of a fixed-rate bond will change whenever the market discount rate changes. For the\nsame coupon rate and time-to-maturity, the percentage price change is greater (in absolute value, meaning without\nregard to the sign of the change) when the market discount rate goes down than when it goes up (the convexity\neffect). Additionally, the percentage price increases are greater in absolute value than the percentage price\ndecreases. This implies that the relationship between bond prices and the market discount rate is not linear;\ninstead, it is curved. It is described as being ‘convex’"},{"id":"3-2-05","set":"3-2","number":5,"stem":"An analyst assumes that a company's market share gains will decline smoothly to\nzero over the next five years. Which of the following best describes this forecast\napproach and object?","options":{"A":"Discretionary forecast of a top-down revenue driver","B":"Historical base rates and convergence forecast of a top-down revenue driver","C":"Historical base rates and convergence forecast of a bottom-up revenue driver"},"answer":"B","topic":"Mixed Topics","page":1,"solution":"assets/solutions/3-2/05.jpg","confidence":"ocr","explanation":"because a company’s market share is a top-down revenue driver and assuming that this object will\nconverge to zero over the next five years is consistent with the historical base rates and convergence forecasting\napproach"},{"id":"3-2-06","set":"3-2","number":6,"stem":"An analyst gathers the following information:\nRisk-free rate            4%\nExpected return on a security       7%\nExpected return on the market       14%\nAccording to the CAPM, the security's beta is closest to:","options":{"A":"0.21.","B":"0.30.","C":"0.50."},"answer":"B","topic":"Portfolio Management","page":2,"solution":"assets/solutions/3-2/06.jpg","confidence":"ocr","explanation":"because, according to the CAPM, the expected return [E(R))] for an asset is given by: E(R;) = Rr + BIE(Rmn)\nSRA\nThe beta [Bis then calculated using: B; = [E(R,) — RITE(R,) — RA = [7% — 4%)/[14% — 4%] = 0.30."},{"id":"3-2-07","set":"3-2","number":7,"stem":"Cryptocurrency exchange-traded funds:","options":{"A":"do not typically invest directly in cryptocurrencies.","B":"allow investors to trade shares in trusts holding large pools of a\ncryptocurrency.","C":"represent agreements to buy or sell a specific quantity of cryptocurrency at a\nspecified price and date."},"answer":"A","topic":"Economics","page":2,"solution":"assets/solutions/3-2/07.jpg","confidence":"ocr","explanation":"because cryptocurrency exchange-traded funds such as ETFs, seek to replicate digital asset investment\nretums. These ETFs typically do not directly invest in cryptocurrencies and gain exposure to the value of\ncryptocurrencies using cash and cryptocurrency derivatives."},{"id":"3-2-08","set":"3-2","number":8,"stem":"If a call option is overvalued relative to the binomial model, investors can earn a\nreturn above the risk-free rate by selling the call option and simultaneously:","options":{"A":"buying the underlying.","B":"selling short the underlying and investing the proceeds at the risk-free rate.","C":"buying the underlying and funding the transaction by borrowing funds at the\nrisk-free rate."},"answer":"C","topic":"Derivatives","page":2,"solution":"assets/solutions/3-2/08.jpg","confidence":"ocr","explanation":"because if the option is trading too high relative to the formula, investors can sell the call, buy h shares of\nthe underlying, and eam a retum in excess of the risk-free rate, while funding the transaction by borrowing at the\nrisk-free rate\n\nValuing a derivative using a one-period binomial model\n\n= explain how to value a derivative using a one-period binomial model"},{"id":"3-2-09","set":"3-2","number":9,"stem":"Two years ago, a homeowner took out a $1 million home mortgage from a bank.\nThe current principal on the loan is $750,000, and the homeowner has defaulted\non the loan. Following foreclosure proceedings, the bank sells the property for\n$600,000 and is only entitled to use these funds to satisfy the loan obligation. The\nhomeowner most likely had a:","options":{"A":"bullet loan.","B":"recourse loan.","C":"non-recourse loan."},"answer":"C","topic":"Mixed Topics","page":2,"solution":"assets/solutions/3-2/09.jpg","confidence":"ocr","explanation":"because the bank does not have a claim against the borrower for the shortfall of $150,000 on the\nmortgage balance outstanding relative to the proceeds received from the property's sale, indicating that the home\nmortgage is a non-recourse loan.\n\nMortgage-Backed Security (MBS) Instrument and Market Features\n\n= describe fundamental features of residential mortgage loans that are securitized"},{"id":"3-2-10","set":"3-2","number":10,"stem":"An analyst gathers the following information about a stock purchased on margin:\nPurchase price of stock                        €50\nLeverage ratio                                      2.5\nPrice below which first margin call received       €40\nThe maintenance margin requirement is:","options":{"A":"20%.","B":"25%.","C":"40%."},"answer":"B","topic":"Mixed Topics","page":2,"solution":"assets/solutions/3-2/10.jpg","confidence":"ocr","explanation":"because a price of €40 corresponds to the maintenance margin requirement equals Required Minimum\nEquity/ Margin Call Price = €10/ €40 = 25% whereas the Required Minimum Equity = Initial Equity + Margin Call\nPrice — Initial Price = [Initial Price x 1/ Leverage Ratio] + Margin Call Price — Initial Price = [€50 x 1/2.5] + €40 —\n€50 = €10"},{"id":"3-2-11","set":"3-2","number":11,"stem":"A bond is currently selling for 102.31. A valuation model estimates the price will\nfall to 101.12 if interest rates increase by 20 bps and rise to 103.74 if interest rates\ndecrease by 20 bps. Using these estimates, the effective duration of the bond is\nclosest to:","options":{"A":"6.31.","B":"6.40.","C":"6.48."},"answer":"B","topic":"Fixed Income","page":3,"solution":"assets/solutions/3-2/11.jpg","confidence":"ocr","explanation":"because the effective duration of a bond is\nEffDur = where PV_, PVp, and PV. are the values of the bond when the yield falls, under the current\nyield, and when the yield rises, respectively, and ACurve is the change in the benchmark yield curve.\n= 1037410112\nEffDur = Delo 3TTx0.002 = 6.40"},{"id":"3-2-12","set":"3-2","number":12,"stem":"When a company issues common shares:","options":{"A":"it is obligated to make dividend payments to shareholders.","B":"the future cash flows due to equity holders are known and certain.","C":"the equity holders' required rate of return is based on the future cash flows\nthey expect to receive."},"answer":"C","topic":"Equity Investments","page":3,"solution":"assets/solutions/3-2/12.jpg","confidence":"ocr","explanation":"because when investors purchase the company’s equity securities, their minimum required rate of retum is\nbased on the future cash flows they expect to receive.\n\nOverview of Equity Securities\n\n= compare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return"},{"id":"3-2-13","set":"3-2","number":13,"stem":"Common shares are riskier than preference shares because common shares:","options":{"A":"have more uncertainty around future cash flows.","B":"do not have a guaranteed return if a company is liquidated.","C":"rank behind debt in the distribution of assets if a company is liquidated."},"answer":"A","topic":"Equity Investments","page":3,"solution":"assets/solutions/3-2/13.jpg","confidence":"ocr","explanation":"because dividends on preference shares are known and fixed, and they account for a large portion of the\npreference shares’ total return. Therefore, there is less uncertainty about future cash flows."},{"id":"3-2-14","set":"3-2","number":14,"stem":"Which section of an IPS most likely provides information on the permissible use\nof leverage?","options":{"A":"Procedures","B":"Investment Objectives","C":"Investment Guidelines"},"answer":"C","topic":"Mixed Topics","page":3,"solution":"assets/solutions/3-2/14.jpg","confidence":"ocr","explanation":"because the Investment Guidelines section provides information about how policy should be executed\n(eg., on the permissible use of leverage and derivatives) and on specific types of assets excluded from\ninvestment, if any.\n\nBasics of Portfolio Planning and Construction\n\n= describe the major components of an IPS"},{"id":"3-2-15","set":"3-2","number":15,"stem":"Base-rate neglect is a type of.","options":{"A":"hindsight bias.","B":"endowment bias.","C":"representativeness bias."},"answer":"C","topic":"Mixed Topics","page":3,"solution":"assets/solutions/3-2/15.jpg","confidence":"ocr","explanation":"because base-rate neglect and sample-size neglect are two types of representativeness bias that apply to\nFMPs (financial market participants). In base-rate neglect, a phenomenon's rate of incidence in a larger\npopulation—its base rate—is neglected in favor of specific information.\n\nThe Behavioral Biases of Individuals\n\n= discuss commonly recognized behavioral biases and their implications for financial decision making"},{"id":"3-2-16","set":"3-2","number":16,"stem":"In a rising interest rate environment, the difference in effective duration between\na callable bond and a non-callable bond would most likely.","options":{"A":"decrease.","B":"remain unchanged","C":"increase."},"answer":"A","topic":"Fixed Income","page":3,"solution":"assets/solutions/3-2/16.jpg","confidence":"ocr","explanation":"because as interest rates rise, the call option is less likely to be exercised by the issuer, so the difference\nin effective duration between a callable bond and a non-callable bond is expected to narrow (decrease). The\nreverse is true in a falling interest rate environment, because the call option is more likely to be exercised and will\nhave the effect of reducing the effective duration of a callable bond and widening (increasing) the difference in\neffective duration with a non-callable bond."},{"id":"3-2-17","set":"3-2","number":17,"stem":"Which of the following factors is least likely to affect an individual's ability to\ntake risk?","options":{"A":"Time horizon","B":"Personality type","C":"Expected income"},"answer":"B","topic":"Mixed Topics","page":4,"solution":"assets/solutions/3-2/17.jpg","confidence":"ocr","explanation":"because personality type is most likely to affect an individual's willingness to take risk, not the ability to\ntake risk. An individual's ability to take risk is affected by such factors as time horizon and expected income."},{"id":"3-2-18","set":"3-2","number":18,"stem":"The value of a European put is:","options":{"A":"inversely related to the exercise price.","B":"inversely related to the risk-free interest rate.","C":"directly related to the value of the underlying."},"answer":"B","topic":"Mixed Topics","page":4,"solution":"assets/solutions/3-2/18.jpg","confidence":"ocr","explanation":"because the value of a European put is inversely related to the risk-free interest rate."},{"id":"3-2-19","set":"3-2","number":19,"stem":"Compared with an otherwise identical option-free bond, when interest rates fall,\nthe price of a callable bond will:","options":{"A":"fall less.","B":"rise less.","C":"rise more."},"answer":"B","topic":"Fixed Income","page":4,"solution":"assets/solutions/3-2/19.jpg","confidence":"ocr","explanation":"because when interest rates fall, the price of the embedded call option increases. The price of a callable\nbond equals the price of an option-free bond minus the price of the embedded call option. The price of the callable\nbond will not increase as much as an option-free bond because the price of the call option is increasing. As interest\nrates fall, the bond is more likely to be called, limiting the upside price increase potential"},{"id":"3-2-20","set":"3-2","number":20,"stem":"Which of the following European options has the greatest value at expiration?","options":{"A":"A put with an exercise price of 72 and an underlying priced at 83","B":"A put with an exercise price of 83 and an underlying priced at 72","C":"A call with an exercise price of 83 and an underlying priced at 70"},"answer":"B","topic":"Derivatives","page":4,"solution":"assets/solutions/3-2/20.jpg","confidence":"ocr","explanation":"because the value at expiration for a put is the greater of either zero or the exercise price minus the price\nof the underlying at expiration: p; = Max(0, X — S;), where X is the exercise price and S, underlying price. Here: p-\n= Max(0,83 — 72) = 11"},{"id":"3-2-21","set":"3-2","number":21,"stem":"A covered bond most likely.","options":{"A":"provides bondholders recourse against the issuer.","B":"has a cover pool with assets that remain unchanged.","C":"has a cover pool that is transferred to a special purpose entity."},"answer":"A","topic":"Fixed Income","page":4,"solution":"assets/solutions/3-2/21.jpg","confidence":"ocr","explanation":"because in the case of covered bonds, the pool of assets remains on the financial institution's balance\nsheet. In the event of default, bondholders have recourse against both the financial institution and the cover pool."},{"id":"3-2-22","set":"3-2","number":22,"stem":"An increase in the dividend payout ratio will most likely increase the intrinsic\nvalue when using a(n):","options":{"A":"multiplier model.","B":"present value model.","C":"asset-based valuation model."},"answer":"B","topic":"Mixed Topics","page":4,"solution":"assets/solutions/3-2/22.jpg","confidence":"ocr","explanation":"because an increase in the dividend payout ratio will increase the cash expected to be distributed to\nshareholders. The dividend discount model is the present value of the cash expected to be distributed to.\nshareholders. Therefore an increase in the dividend payout ratio will increase the intrinsic value in a present value\nmodel."},{"id":"3-2-23","set":"3-2","number":23,"stem":"Contraction risk and extension risk are most likely associated with:","options":{"A":"credit risk on asset-backed securities.","B":"prepayment risk on mortgage-backed securities.","C":"income risk on commercial mortgage-backed securities."},"answer":"B","topic":"Fixed Income","page":4,"solution":"assets/solutions/3-2/23.jpg","confidence":"ocr","explanation":"because an investor in mortgage pass-through securities does not know what the future cash flows will be\nbecause these future cash flows depend on actual prepayments. This risk is called prepayment risk. This has two\ncomponents: contraction risk and extension risk"},{"id":"3-2-24","set":"3-2","number":24,"stem":"A protective put strategy consists of a:","options":{"A":"long put option on an asset and a long position in a risk-free bond.","B":"long position in an underlying asset and a long put option on the asset.","C":"long call option on an asset and a short position in the underlying asset."},"answer":"B","topic":"Derivatives","page":5,"solution":"assets/solutions/3-2/24.jpg","confidence":"ocr","explanation":"because the strategy of holding the asset and a put is called a protective put"},{"id":"3-2-25","set":"3-2","number":25,"stem":"Compared to a US bond, Eurobonds are most likely:","options":{"A":"less regulated.","B":"subject to the same regulations.","C":"more regulated."},"answer":"A","topic":"Fixed Income","page":5,"solution":"assets/solutions/3-2/25.jpg","confidence":"ocr","explanation":"because the Eurobond market was created primarily to bypass the legal, regulatory, and tax constraints\nimposed on bond issuers and investors, particularly in the United States"},{"id":"3-2-26","set":"3-2","number":26,"stem":"An investor gathers the following information about a portfolio and the market.\nReturn Standard   Deviation of Returns     Beta\nPortfolio        11%           4%              1.2\nMarket         10%           3%              1.0\nIf the risk-free rate is 3%, Jensen's alpha for the portfolio is:","options":{"A":"-4.0%.","B":"-0.4%.","C":"0.4%."},"answer":"B","topic":"Portfolio Management","page":5,"solution":"assets/solutions/3-2/26.jpg","confidence":"ocr","explanation":"because Jensen's alpha is calculated as:\ndp = Rp— [Rr + Bp (Rn — Ri]\nly = 11% — [3% + 1.2 x (10% — 3%)]\ny= 11% — 11.4% = -0.4%,"},{"id":"3-2-27","set":"3-2","number":27,"stem":"A measure of the sensitivity of a bond's price to a change in a specific maturity\nsegment of the benchmark yield curve best defines:","options":{"A":"key rate duration.","B":"effective duration.","C":"modified duration."},"answer":"A","topic":"Fixed Income","page":5,"solution":"assets/solutions/3-2/27.jpg","confidence":"ocr","explanation":"because key rate duration (or partial duration) is a measure of a bond's sensitivity to a change in the\nbenchmark yield curve at a specific maturity segment. In contrast to effective duration, key rate durations help\nidentify ‘shaping risk’ for a bond—that is, a bond's sensitivity to changes in the shape of the benchmark yield curve."},{"id":"3-2-28","set":"3-2","number":28,"stem":"Accrued interest:","options":{"A":"depends on a bond's yield-to-maturity.","B":"is equal to a bond's full price minus its flat price.","C":"is typically included in the price quoted by bond dealers."},"answer":"B","topic":"Fixed Income","page":5,"solution":"assets/solutions/3-2/28.jpg","confidence":"ocr","explanation":"because PVF! = PYF + Al, where PVF! is the bond's full price, PV\"**is the bond's flat price, and Al is\nthe accrued interest."},{"id":"3-2-29","set":"3-2","number":29,"stem":"The use of a three-stage dividend discount model is most appropriate for a\ncompany that is entering the early stages of its:","options":{"A":"growth phase.","B":"maturity phase.","C":"transition phase."},"answer":"A","topic":"Equity Investments","page":5,"solution":"assets/solutions/3-2/29.jpg","confidence":"ocr","explanation":"because one can make the case that a three-stage DDM would be most appropriate for a fairly young\ncompany, one that is just entering the growth phase."},{"id":"3-2-30","set":"3-2","number":30,"stem":"An analyst gathers the following information about a hedge fund:\nBeginning-of-year assets under management (AUM)        £200,000,000\nManagement fee (based on end-of-year AUM before fees)      2%\nIncentive fee                                    10%\nSoft hurdle rate                                5%\nAnnual return before fees                           20%\nIf the incentive fee is calculated independently of the management fee, total fees\nfor the year are:","options":{"A":"£7,800,000.","B":"£8,320,000.","C":"£8,800,000."},"answer":"C","topic":"Alternative Investments","page":6,"solution":"assets/solutions/3-2/30.jpg","confidence":"ocr","explanation":"because the partnership agreement usually specifies that the performance fee is earned only after the\nfund achieves a return known as a hurdle rate. The hurdle rate is a minimum rate of return, typically 8%, that the\nGP must exceed in order to earn the performance fee. GPs typically receive 20% of the total profit of the private\nequity fund net of any hard hurdle rate, in which case the GP earns fees on annual returns in excess of the hurdle\nrate, or net of the soft hurdle rate, in which case the fee is calculated on the entire annual gross return as long as\nthe set hurdle is exceeded. Accordingly, the fees are calculated as:\n\nManagement fee = (200,000,000 x 1.20) x 0.02 = 4,800,000\nAs the retum before fees is higher than the soft hurdle rate, the incentive fee is\nIncentive fee = (200,000,000 x 0.2) x 0.10 = 4,000,000\nTotal fees = 8,800,000\nAlternative Investment Performance and Returns\n= calculate and interpret alternative investment returns both before and after fees"},{"id":"3-2-31","set":"3-2","number":31,"stem":"With regard to commodities, it is most likely true that.","options":{"A":"exposure is most commonly achieved via commodity derivatives.","B":"their returns are based on an income stream such as interest or dividends.","C":"they are physical products so most investors prefer to trade the actual\ncommodity."},"answer":"A","topic":"Alternative Investments","page":6,"solution":"assets/solutions/3-2/31.jpg","confidence":"manual_source_correction","explanation":"because the majority of commodity investing is implemented through derivatives. [Source correction: The scanned answer also labels C as “Correct,” but its own explanation says investors use derivatives rather than physical commodities; A is the supported answer.]"},{"id":"3-2-32","set":"3-2","number":32,"stem":"According to put-call-forward parity, for European options, a long put on an asset\nis equal to:","options":{"A":"short call +short risk-free bond +long forward.","B":"short call +long risk-free bond +short forward.","C":"long call +long risk-free bond +short forward."},"answer":"C","topic":"Fixed Income","page":6,"solution":"assets/solutions/3-2/32.jpg","confidence":"ocr","explanation":"because the put-call_forward parity relationship states that\nAO *\n(any POS CO, (ly\nThatis,\nLong forward + Long put = Long calll + Long risk-free bond\nRearranging terms gives\nLong put = Long call + Long risk-free bond + Short forward\nOption Replication Using Put-Call Parity\n= explain put-call forward parity for European options"},{"id":"3-2-33","set":"3-2","number":33,"stem":"An analyst gathers the following information about an equally weighted portfolio\ncomprised of 500 assets:\n  Average variance of the returns of the assets =0.04\n  Average covariance between the returns of the assets =0.01\nThe variance of the portfolio returns is closest to:","options":{"A":"0.01.","B":"0.04","C":"0.05."},"answer":"A","topic":"Portfolio Management","page":6,"solution":"assets/solutions/3-2/33.jpg","confidence":"ocr","explanation":"because for portfolios with a large number of assets, covariance among the assets accounts for almost all\nof the portfolio’s risk. Given equal weights and average variance/covariance, we can rewrite the portfolio variance\nas: o = a°IN + “Cov. The variance of the portfolio = (0.04/500) + [(500 — 1)/500] x 0.01 = 0.00008 + 0.00998 =\n0.01006 ~ 0.01 (average covariance of returns)."},{"id":"3-2-34","set":"3-2","number":34,"stem":"Which of the following statements about alternative investments' compensation\nstructures is most accurate?","options":{"A":"A hurdle rate protects clients from paying twice for the same performance","B":"The management fee for a private equity fund is based on committed capital\nuntil fully drawn","C":"The management fee is earned only after the fund achieves a return known as\na high-water mark"},"answer":"B","topic":"Alternative Investments","page":6,"solution":"assets/solutions/3-2/34.jpg","confidence":"ocr","explanation":"because until the committed capital is fully drawn down and invested, the management fee for a private\n‘equity fund is based on committed capital, not invested capital."},{"id":"3-2-35","set":"3-2","number":35,"stem":"Replication is most likely used to:","options":{"A":"increase leverage.","B":"reduce portfolio risk.","C":"exploit pricing differentials."},"answer":"C","topic":"Portfolio Management","page":7,"solution":"assets/solutions/3-2/35.jpg","confidence":"ocr","explanation":"because replication is the process of creating an asset or portfolio from another asset, portfolio, and/or\nderivative. It is used to exploit pricing differentials.\n\nArbitrage, Replication, and the Cost of Carry in Pricing Derivatives\n\n= explain how the concepts of arbitrage and replication are used in pricing derivatives"},{"id":"3-2-36","set":"3-2","number":36,"stem":"A bond has an annual modified duration of 8 and an annual convexity measure of\n150. If the bond's yield to maturity decreases by 140 bps, the change in the price\nof this bond is closest to:","options":{"A":"9.7%.","B":"12.7%.","C":"14.1%"},"answer":"B","topic":"Fixed Income","page":7,"solution":"assets/solutions/3-2/36.jpg","confidence":"ocr","explanation":"because\nExpected price change = (- AnnModDur x Ayield) + [0.5 x AnnConvexity x (Ayield)?] =\n[= 8  (- 0.0140)] + [0.5 x (150) x (- 0.0140)3] = 0.112 + 0.0147 = 0.1267 = 12.7%"},{"id":"3-2-37","set":"3-2","number":37,"stem":"Making a minority equity investment in a mature company that plans to expand\noperations best describes:","options":{"A":"growth capital investing.","B":"leveraged buyout investing.","C":"development capital investing."},"answer":"A","topic":"Mixed Topics","page":7,"solution":"assets/solutions/3-2/37.jpg","confidence":"ocr","explanation":"because growth capital generally refers to minority equity investments, whereby the firm takes a less-than-\ncontrolling interest in more mature companies looking for capital to expand or restructure operations, enter new\nmarkets, or finance major acquisitions."},{"id":"3-2-38","set":"3-2","number":38,"stem":"In which scenario would yields most likely narrow?","options":{"A":"Weak financial markets","B":"High demand for bonds","C":"Slowdown in market-making activity"},"answer":"B","topic":"Fixed Income","page":7,"solution":"assets/solutions/3-2/38.jpg","confidence":"ocr","explanation":"because in periods of high demand, bond prices will increase and yields will decrease (since bond price\nand yield are inversely related); consequently, yield spreads (the difference in yield between a corporate bond and\ndefault-free bond) will tighten (narrow)."},{"id":"3-2-39","set":"3-2","number":39,"stem":"An analyst gathers the following information about an equal-weighted index with\nthree securities:\nSecurity      Outstanding   Beginning-of-Period   End-of-Period\nShares         (Millions)            Price                Price\n1            15              $5               $6\n2            20              $2               $2\n3            25              $3               $4\nThe price return of the index is closest to:","options":{"A":"17.8%.","B":"20.0%.","C":"21.1%."},"answer":"A","topic":"Equity Investments","page":7,"solution":"assets/solutions/3-2/39.jpg","confidence":"ocr","explanation":"because equal weighting assigns an equal weight to each constituent security at inception. To construct an\nequal-weighted index from three securities, the index provider allocates one third of the index value at the\nbeginning of the period to each security. Assume the Index value at the beginning is 300 and 100 is allocated to\neach security, the equal-weighted retum is calculated as follows:\n“—“Sharesin BOP BOP Weight  Sharesinindex | EOP EOP Value (Shares x\nSecurity Index Price Value (%) (Value/BOP Price) _ Price EOP Price)\n1 1 5.00 100.00 33.33 20 6.00 120.00\n2 1 2.00 100.00 33.33 50 2.00 100.00\n4 1 3.00 100.00 33.33 33.33 4.00 133.33\nTotal (Index oss — 300.00 100.00 = = 353.33\nValue)\nIndex Value = — 300 = = = 353.33\n(Totav/3)\nTherefore the equal-weighted price retum is EOP index value / BOP index value — 1= 353.33/300 — 1= 0.1778 =\n17.8%."},{"id":"3-2-40","set":"3-2","number":40,"stem":"Market efficiency most likely increases with an increase in:","options":{"A":"restrictions on short selling.","B":"the time required to execute trades.","C":"the number of analysts evaluating securities."},"answer":"C","topic":"Mixed Topics","page":7,"solution":"assets/solutions/3-2/40.jpg","confidence":"ocr","explanation":"because the number of financial analysts who follow or analyze a security or asset should be positively\nrelated to market efficiency. The efficiency of a market is affected by the depth of analyst coverage.\n\nMarket Efficiency\n\n= explain factors that affect a market's efficiency"},{"id":"3-2-41","set":"3-2","number":41,"stem":"Real estate is best classified as a:","options":{"A":"commodity.","B":"physical asset.","C":"financial asset."},"answer":"B","topic":"Alternative Investments","page":8,"solution":"assets/solutions/3-2/41.jpg","confidence":"ocr","explanation":"because real assets are tangible properties such as real estate, airplanes, or machinery. Securities,\ncurrencies, and contracts are classified as financial assets whereas commodities and real assets [including real\nestate] are classified as physical assets."},{"id":"3-2-42","set":"3-2","number":42,"stem":"Which of the following statements about direct ownership of real estate is most\naccurate?","options":{"A":"Investors have no control over the tenant mix","B":"Extensive time is required to manage the property","C":"Non-cash property depreciation expenses cannot be used to reduce taxable\nincome"},"answer":"B","topic":"Financial Statement Analysis","page":8,"solution":"assets/solutions/3-2/42.jpg","confidence":"ocr","explanation":"because there are also disadvantages to investing directly in property: Complexity. The owners need to\ndedicate time to manage the property. Making the purchase itself is more complicated as well, with requirements\nincluding property selection, negotiating terms, performing due diligence, title search, contract review, and property\ninspection."},{"id":"3-2-43","set":"3-2","number":43,"stem":"Which of the following statements about interest rate forward and swap contracts\nis most accurate? Both interest rate forward and swap contracts:","options":{"A":"have symmetric payoff profiles.","B":"involve an exchange of cash upfront.","C":"have no counterparty credit exposure."},"answer":"A","topic":"Derivatives","page":8,"solution":"assets/solutions/3-2/43.jpg","confidence":"ocr","explanation":"because similarities between interest rate forwards and swaps include the symmetric payoff profile and the\nfact that no cash flow is exchanged upfront. Both interest rate forward and swap contracts involve counterparty\ncredit exposure."},{"id":"3-2-44","set":"3-2","number":44,"stem":"The semiannual bond equivalent yield spot rates for US Treasury yields are\nprovided below.\nPeriod         Years       Spot Rate\n1              0.5         1.20%\n2              1.0         2.10%\n3              1.5         2.80%\n4              2.0         3.30%\nOn a semiannual bond equivalent yield (BEY) basis, the six-month forward rate\none year from now is closest to:","options":{"A":"2.10%.","B":"3.64%.","C":"4.21%."},"answer":"C","topic":"Fixed Income","page":8,"solution":"assets/solutions/3-2/44.jpg","confidence":"ocr","explanation":"because the x-year forward rate y years from now is\nDien\nDS ai\nAll spot rates are given on a BEY basis and must be divided by 2 in this calculation:\n_ Uso, _\nosfio = Teenaimp ~ | = 0.021036\nOn a BEY basis, the forward rate is 0.021036 x 2 = 4.21%\nThe Term Structure of Interest Rates: Spot, Par, and Forward Curves\n= define par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates,\nand the price of a bond using forward rates"},{"id":"3-2-45","set":"3-2","number":45,"stem":"An optimal risky portfolio has an expected return of 15% and standard deviation\nof 20%. The risk-free rate is currently 5%. A risk-seeking investor who is\nconsidering investing along the capital allocation line (CAL) would most likely.","options":{"A":"lend 100% of her wealth at the risk-free rate.","B":"invest 100% of her wealth in the optimal risky portfolio.","C":"borrow 25% of her wealth at the risk-free rate and invest 125% in the optimal\nrisky portfolio."},"answer":"C","topic":"Portfolio Management","page":8,"solution":"assets/solutions/3-2/45.jpg","confidence":"ocr","explanation":"because risk-seeking investors, which are those who are willing to take higher risks for a higher expected\nreturn, will invest more than 100% in the optimal risky portfolio by borrowing at the risk-free rate. This portfolio lies\nto the right point of the optimal risky portfolio on the CAL"},{"id":"3-2-46","set":"3-2","number":46,"stem":"At the first of the year, an investor decides to invest $1.5 million in a hedge fund\nwith an incentive fee of 15% and a hard hurdle rate of 4%. At the end of the year,\nthe fund has a return of 23.3%. The incentive fee payment that the general partner\nof the fund earned based on this clients investment at the end of the year is closest\nto:","options":{"A":"$38,445.","B":"$43.425","C":"$52,425."},"answer":"B","topic":"Alternative Investments","page":9,"solution":"assets/solutions/3-2/46.jpg","confidence":"ocr","explanation":"because the investor's return met the 4% hurdle rate, so the incentive fee charged would be ($1,849,500 —\n$1,500,000 — $60,000) x 15% = $43,425."},{"id":"3-2-47","set":"3-2","number":47,"stem":"Which of the following statements best describes the relationship between the net\ncosts of carry and the forward price?","options":{"A":"If the costs of carry exceed the benefits, the forward price would be lower","B":"If the costs of carry exceed the benefits, the forward price would be higher","C":"If the benefits exceed the costs of carry, the forward price would be higher"},"answer":"B","topic":"Mixed Topics","page":9,"solution":"assets/solutions/3-2/47.jpg","confidence":"ocr","explanation":"because if the costs exceed the benefits, the forward price would be higher because the forward contract\navoids the costs at the expense of the lesser benefits."},{"id":"3-2-48","set":"3-2","number":48,"stem":"The daily settlement of mark-to-market gains and losses in exchange-traded\nderivatives most likely reduces:","options":{"A":"basis risk.","B":"liquidity risk.","C":"counterparty credit risk."},"answer":"C","topic":"Derivatives","page":9,"solution":"assets/solutions/3-2/48.jpg","confidence":"ocr","explanation":"because daily swings in the price of an underlying, among other factors affecting derivative prices, require\nmore frequent exposure monitoring and management. Counterparty credit exposure varies by the derivative type\nand market in which a derivative is transacted and daily settlement of MTM (mark-to-market) gains and losses,\nwhich characterizes exchange-traded derivatives, substantially reduces counterparty credit risk\n\nDerivative Benefits, Risks, and Issuer and Investor Uses\n\n= describe benefits and risks of derivative instruments"},{"id":"3-2-49","set":"3-2","number":49,"stem":"Compared to alternative investments, traditional investments are most likely\ncharacterized by:","options":{"A":"greater use of leverage.","B":"a more complex fee structure.","C":"higher levels of transparency."},"answer":"C","topic":"Alternative Investments","page":9,"solution":"assets/solutions/3-2/49.jpg","confidence":"ocr","explanation":"because alternative investments often have less regulation and less transparency than traditional\ninvestment\n\nAlternative Investment Features, Methods, and Structures\n\n= describe features and categories of alternative investments"},{"id":"3-2-50","set":"3-2","number":50,"stem":"Trading in the secondary market most likely helps identify the proper price for","options":{"A":"a seasoned offering.","B":"a best effort offering.","C":"an underwritten offering."},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/3-2/50.jpg","confidence":"ocr","explanation":"because a seasoned security is a security that an issuer has already issued. If the issuer wants to sell\nadditional units of a previously issued security, it makes a seasoned offering (sometimes called a secondary\noffering). Trading in the secondary market helps identify the proper price for the seasoned offering"},{"id":"3-2-51","set":"3-2","number":51,"stem":"Which of the following statements about pension plans is most accurate?","options":{"A":"Defined benefit plans typically have a low risk tolerance","B":"Defined contribution plans typically have a high risk tolerance","C":"The sponsor of a defined benefit plan specifies the obligation owed to\nparticipants"},"answer":"C","topic":"Mixed Topics","page":9,"solution":"assets/solutions/3-2/51.jpg","confidence":"ocr","explanation":"because defined benefit pension plans (DB plans) are company-sponsored plans that offer employees a\npredefined benefit on retirement. The future benefit is defined because the DB plan requires the plan sponsor to\nspecify the obligation stated in terms of the retirement income benefits owed to participants.\n\nPortfolio Management: An Overview\n\n= describe defined contribution and defined benefit pension plans"},{"id":"3-2-52","set":"3-2","number":52,"stem":"All else being equal, which of the following are equivalent to cash dividends of\nequal value in terms of the effect on shareholders wealth?","options":{"A":"Stock dividends","B":"Share repurchases","C":"Reverse stock splits"},"answer":"B","topic":"Mixed Topics","page":10,"solution":"assets/solutions/3-2/52.jpg","confidence":"ocr","explanation":"because a share repurchase (or buyback) is a transaction in which a company uses cash to buy back its\nown shares. Shares that have been repurchased are not considered for dividends, voting, or computing earnings\nper share. A share repurchase is viewed as equivalent to the payment of cash dividends of equal value in terms of\nthe effect on shareholders’ wealth, all other things being equal"},{"id":"3-2-53","set":"3-2","number":53,"stem":"If a stock is purchased on margin and the minimum initial margin requirement is\n40%, the maximum leverage ratio is closest to:","options":{"A":"1.50.","B":"1.67.","C":"2.50"},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/3-2/53.jpg","confidence":"ocr","explanation":"because the leverage ratio is the ratio of the value of the position to the value of the equity investment in it.\nLeverage ratio = 1/initial margin requirement; or = 1/0.40 = 2.50\n\nMarket Organization and Structure\n\n= calculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which\n\nthe investor would receive a margin call"},{"id":"3-2-54","set":"3-2","number":54,"stem":"With respect to a client's investment policy statement, the set of exposures to the\npermissible asset classes that is expected to achieve the client's long-term\nobjectives best describes the:","options":{"A":"security selection.","B":"tactical asset allocation.","C":"strategic asset allocation."},"answer":"C","topic":"Portfolio Management","page":10,"solution":"assets/solutions/3-2/54.jpg","confidence":"ocr","explanation":"because the strategic asset allocation (SAA) is the set of exposures to IPS-permissible asset classes that\nis expected to achieve the client's long-term objectives given the client's risk profile and investment constraints.\n\nBasics of Portfolio Planning and Construction\n\n= describe the principles of portfolio construction and the role of asset allocation in relation to the IPS"},{"id":"3-2-55","set":"3-2","number":55,"stem":"Which of the following is a characteristic of both a forward contract and a\ncontingent claim?","options":{"A":"The derivative contract has a positive value at contract initiation","B":"The payoff of the derivative contract is dependent on the payoff of an\nunderlying asset","C":"Each party of the derivative contract is required to engage in a transaction at\na later point in time"},"answer":"B","topic":"Derivatives","page":10,"solution":"assets/solutions/3-2/55.jpg","confidence":"ocr","explanation":"because a contingent claim is a derivative in which the outcome or payoff is dependent on the outcome or\npayoff of an underlying asset. Although this characteristic is also associated with forward commitments, a\ncontingent claim has come to be associated with a right, but not an obligation, to make a final payment contingent\n‘on the performance of the underlying,"},{"id":"3-2-56","set":"3-2","number":56,"stem":"A disadvantage of computing the duration of a bond portfolio as a weighted\naverage of time to receipt of the aggregate cash flows is that it","options":{"A":"is theoretically incorrect.","B":"is difficult to use in practice.","C":"assumes the yield curve shifts in a parallel manner."},"answer":"B","topic":"Fixed Income","page":10,"solution":"assets/solutions/3-2/56.jpg","confidence":"ocr","explanation":"because computing duration as the weighted average of time to receipt of the aggregate cash flows is\ndifficult to use in practice."},{"id":"3-2-57","set":"3-2","number":57,"stem":"A mechanism that allows a hedge fund to temporarily restrict redemptions by all\ninvestors is known as a:","options":{"A":"gate.","B":"notice period.","C":"lockup period."},"answer":"A","topic":"Alternative Investments","page":10,"solution":"assets/solutions/3-2/57.jpg","confidence":"ocr","explanation":"because in addition, funds sometimes impose a gate, which limits or restricts redemptions for a period of\ntime. A gate is imposed by the hedge fund manager independent of any lockup period that may apply. A gate\ntherefore applies to all investors for a finite period of time while a lockup period applies to new investors only."},{"id":"3-2-58","set":"3-2","number":58,"stem":"A convertible bond arbitrage hedge fund is most likely to focus on buying:","options":{"A":"convertible bonds of companies at or near bankruptcy.","B":"convertible bonds and selling the stock of the same company.","C":"sufficient convertible bonds of a company in order to influence the\ncompany's policies."},"answer":"B","topic":"Fixed Income","page":11,"solution":"assets/solutions/3-2/58.jpg","confidence":"ocr","explanation":"because relative value funds seek to profit from a pricing discrepancy between related securities based on\nan unusual short-term relationship. The expectation is that the discrepancy will be resolved over time. An example\nof a relative value strategy is convertible bond arbitrage. This conceptually market-neutral investment strategy\nseeks to exploit a perceived mispricing between a convertible bond and its component parts—namely, the\nunderlying bond and the embedded stock option—relative to the pricing of a reference equity into which the bond\nmay someday convert. The strategy typically involves buying convertible debt securities and simultaneously selling\na certain amount of the same issuer's common stock."},{"id":"3-2-59","set":"3-2","number":59,"stem":"A put option has a strike price of $20.50. The option premium is $1.00. If the\nprice of the underlying at expiration is $21.50, the put option is:","options":{"A":"in the money","B":"at the money","C":"out of the money"},"answer":"C","topic":"Derivatives","page":11,"solution":"assets/solutions/3-2/59.jpg","confidence":"ocr","explanation":"because a put option is called \"out of the money” if the underlying value is greater than the exercise price\nIn this case, the underlying value of $21.50 is greater than the strike price of $20.50.\nForward Commitment and Contingent Claim Features and Instruments\n= determine the value at expiration and profit from a long or a short position in a call or put option"},{"id":"3-2-60","set":"3-2","number":60,"stem":"A limited partner in a private equity fund most likely activates a clawback\nprovision if the general partner","options":{"A":"exits successful deals early in the fund's life but incurs losses on deals later.","B":"exits unsuccessful deals early in the fund's life but generates gains on deals\nlater.","C":"exits successful deals early in the fund's life and generates additional gains\non deals later."},"answer":"A","topic":"Alternative Investments","page":11,"solution":"assets/solutions/3-2/60.jpg","confidence":"ocr","explanation":"because a clawback provision reflects the right of LPs to reclaim part of the GP’s performance fee if a GP\never accrues (or actually pays itself) an incentive fee on gains that are not yet fully realized and then subsequently\ngives back these gains, an investor is typically able to claw back prior incentive fee accruals and payments.\nClawback provisions are usually activated when a GP exits successful deals early on but incurs losses on deals\nlater in the fund's life."},{"id":"3-2-61","set":"3-2","number":61,"stem":"The assets underlying an infrastructure investment are most likely:","options":{"A":"intended for private use.","B":"owned by a government entity.","C":"expected to have a short operational life."},"answer":"B","topic":"Alternative Investments","page":11,"solution":"assets/solutions/3-2/61.jpg","confidence":"ocr","explanation":"because most infrastructure assets are financed, owned, and operated by governments"},{"id":"3-2-62","set":"3-2","number":62,"stem":"Which of the following statements about robo-advisers is most accurate?","options":{"A":"Robo-advisers charge higher fees than traditional investment advisers","B":"Robo-advisers mainly target investors with a high level of investable assets","C":"Assets managed by robo-advisers are growing in part due to new entrants\nsuch as insurance companies"},"answer":"C","topic":"Mixed Topics","page":11,"solution":"assets/solutions/3-2/62.jpg","confidence":"ocr","explanation":"because, reflecting low barriers to entry, large wealth management firms have introduced robo-adviser\nsolutions to service certain customer segments and appeal to a new generation of investors. In addition to these\nlarge wealth managers, other less-traditional entrants, such as insurance companies and asset managers, are\ndeveloping solutions to cross-sell into their existing clients.\n\nPortfolio Management: An Overview\n\n= describe aspects of the asset management industry"},{"id":"3-2-63","set":"3-2","number":63,"stem":"Which of the following private debt categories most likely provides an investor\nwith options for equity participation?","options":{"A":"Mezzanine debt","B":"Distressed debt","C":"Unitranche debt"},"answer":"A","topic":"Derivatives","page":11,"solution":"assets/solutions/3-2/63.jpg","confidence":"ocr","explanation":"because to compensate investors for this heightened risk, investors commonly demand higher interest\nrates and may require options for equity participation. Mezzanine debt often comes with additional features, such\nas warrants or conversion rights. These provide equity participation to lenders/investors, conveying the option to\nconvert their debt into equity or purchasing the equity of the underlying borrower under certain circumstances."},{"id":"3-2-64","set":"3-2","number":64,"stem":"An investor uses the following data and Gordon's constant growth dividend\ndiscount model to evaluate a company's common stock. To estimate growth, she\nuses the average of the:\n1.average value of the compounded annual dividend growth rate over the period\nof Year 1 to Year 6, and\n2.dividend payout ratio for Year 6.\nYear        Earnings per Share  Dividend per Share  Return on Equity\n6          $3.20              $1.92           12%\n5          $3.60              $1.85           17%\n4          $2.44              $1.74           13%\n3          $2.08              $1.62           15%\n2          $2.76              $1.35           11%\n1          $2.25              $1.25          9%\nIf her required return is 15%, the stock's intrinsic value is closest to:","options":{"A":"$25.31.","B":"$23.71.","C":"$30.14."},"answer":"A","topic":"Equity Investments","page":12,"solution":"assets/solutions/3-2/64.jpg","confidence":"ocr","explanation":"because Vp = D,/(r— 9); First estimate the two growth rates.\n4. Compound annual dividend growth rate over the period of Year 1 to Year 6 =\n1.25 x (1+9)8= 1.92\ng= 8.96% ~ 9%\n2. Sustainable growth rate for Year 6 using the dividend payout ratio:\nb = earings retention rate = (1 — Dividend payout ratio)\n= [1 — (1.92/3.20)] = 0.40\ng =b* ROE; g= 0.40 x 12% = 4.8%Average of the two approaches = (9 + 4.8)/2 = 6.90%\nVo = Dyl(r—g)\n= (1.92 x 1.069)/(0.15 — 0.069)\n= 2.05/0.081 = $25.31"},{"id":"3-2-65","set":"3-2","number":65,"stem":"All else being equal, if futures prices are positively correlated with interest rates,\nfutures contracts are:","options":{"A":"less desirable to holders of long positions than are forwards.","B":"equally desirable to holders of long positions than are forwards.","C":"more desirable to holders of long positions than are forwards."},"answer":"C","topic":"Derivatives","page":12,"solution":"assets/solutions/3-2/65.jpg","confidence":"ocr","explanation":"because if futures prices are positively correlated with interest rates, futures contracts are more [not less]\ndesirable to holders of long positions than are forwards.\n\nPricing and Valuation of Futures Contracts\n\n= explain why forward and futures prices differ"},{"id":"3-2-66","set":"3-2","number":66,"stem":"In semi-strong-form efficient markets, the use of fundamental analysis most\nlikely allows investors to:","options":{"A":"exploit patterns of prices.","B":"earn consistent abnormal returns.","C":"understand the value implications of information."},"answer":"C","topic":"Mixed Topics","page":12,"solution":"assets/solutions/3-2/66.jpg","confidence":"ocr","explanation":"because fundamental analysis is necessary in a well-functioning market because this analysis helps the\nmarket participants understand the value implications of information. In other words, fundamental analysis\nfacilitates a semi-strong efficient market by disseminating value relevant information. And, although fundamental\nanalysis requires costly information, this analysis can be profitable in terms of generating abnormal returns if the\nanalyst creates a comparative advantage with respect to this information.\n\nMarket Efficiency\n\n= explain the implications of each form of market efficiency for fundamental analysis, technical analysis, and the\nchoice between active and passive portfolio management"},{"id":"3-2-67","set":"3-2","number":67,"stem":"One source of return for an investor in a fixed-rate corporate bond is most likely\nthe:","options":{"A":"bid-ask spread.","B":"interest on the collateral.","C":"reinvestment of coupon payments."},"answer":"C","topic":"Fixed Income","page":12,"solution":"assets/solutions/3-2/67.jpg","confidence":"ocr","explanation":"because the fixed-rate bond investor has three sources of return: (1) receipt of the promised coupon and\nprincipal payments on the scheduled dates, (2) reinvestment of coupon payments, and (3) potential capital gains or\nlosses on the sale of the bond prior to maturity.\n\nInterest Rate Risk and Return\n\n= calculate and interpret the sources of return from investing in a fixed-rate bond;"},{"id":"3-2-68","set":"3-2","number":68,"stem":"An analyst gathers the following information about three stocks that are part of an\nequal-weighted index consisting of 16 stocks:\nStock     End of Period Weight\n1            5.50%\n2            6.25%\n3            7.00%\nIf the index is rebalanced, which stock's weight most likely remains unchanged?","options":{"A":"Stock 1","B":"Stock 2","C":"Stock 3"},"answer":"B","topic":"Mixed Topics","page":13,"solution":"assets/solutions/3-2/68.jpg","confidence":"ocr","explanation":"because rebalancing is necessary because the weights of the constituent securities change. The equal\nweight for all the 16 stocks in the index at rebalancing is 1/16, or 6.25%. Stock 2's end-of-period weight is 6.25%,\n0 its weight has not changed and need not be changed for the index to be rebalanced"},{"id":"3-2-69","set":"3-2","number":69,"stem":"If a risk-free asset with zero expected return is added to the investable universe of\nrisky assets, the investors' risk-return trade-off most likely.","options":{"A":"worsens","B":"remains unchanged.","C":"improves."},"answer":"C","topic":"Mixed Topics","page":13,"solution":"assets/solutions/3-2/69.jpg","confidence":"ocr","explanation":"because we can improve an investor's portfolio by expanding the opportunity set of risky assets because\nthis allows the investor to choose a superior mix of assets. An investor's portfolio improves if a risk-free asset is\nadded to the mix. In other words, a combination of the risk-free asset and a risky asset can result in a better risk—\nreturn trade-off than an investment in only one type of asset because the risk-free asset has zero correlation with\nthe risky asset. The combination is called the capital allocation line."},{"id":"3-2-70","set":"3-2","number":70,"stem":"Which of the following is best classified as financial risk?","options":{"A":"Market risk","B":"Longevity risk","C":"Accounting risk"},"answer":"A","topic":"Mixed Topics","page":13,"solution":"assets/solutions/3-2/70.jpg","confidence":"ocr","explanation":"because the three primary types of financial risks are market risk, credit risk, and liquidity risk. Market risk\nis the risk that arises from movements in interest rates, stock prices, exchange rates, and commodity prices"},{"id":"3-2-71","set":"3-2","number":71,"stem":"With respect to the portfolio management process, which of the following\nstatements is most accurate?","options":{"A":"The IPS is prepared in the feedback step","B":"Risk management is a part of the execution step","C":"Security analysis is conducted in the planning step"},"answer":"B","topic":"Portfolio Management","page":13,"solution":"assets/solutions/3-2/71.jpg","confidence":"ocr","explanation":"because the next step (the execution step) is for the portfolio manager to construct a suitable portfolio\nbased on the IPS of the client. Risk management is an important part of the portfolio construction process."},{"id":"3-2-72","set":"3-2","number":72,"stem":"Which of the following debt categories has the highest loss severity?","options":{"A":"Third lien debt","B":"Senior unsecured debt","C":"Senior subordinated debt"},"answer":"C","topic":"Mixed Topics","page":13,"solution":"assets/solutions/3-2/72.jpg","confidence":"ocr","explanation":"because within unsecured debt, there can also be finer gradations and seniority rankings. The highest-\nranked unsecured debt is senior unsecured debt. It is the most common type of all corporate bonds outstanding\nOther, lower-ranked debt includes subordinated debt and junior subordinated debt. Among the various creditor\nclasses, these obligations have among the lowest priority of claims and frequently have little or no recovery in the\nevent of default. That is, their loss severity can be as high as 100%.\n\nCredit Analysis for Corporate Issuers\n\n= describe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and\ntheir impact on credit ratings"},{"id":"3-2-73","set":"3-2","number":73,"stem":"If a quarterly pay bond has an effective annual rate of 10%, the semiannual bond\nequivalent yield for this bond is closest to:","options":{"A":"9.76%.","B":"10.13%","C":"10.25%."},"answer":"A","topic":"Fixed Income","page":13,"solution":"assets/solutions/3-2/73.jpg","confidence":"ocr","explanation":"because the following formula converts an annual yield from one periodicity to another\n(14 SB)\" = (14 SEY’ Hore: (1+ SE)” = (14 ME)! (1+ BY) = io; SE = 1.0488 1;\nAPR, = 0.09762, rounded to 9.76%"},{"id":"3-2-74","set":"3-2","number":74,"stem":"According to the size effect anomaly:","options":{"A":"equities with low P/Es tend to outperform equities with high P/Es.","B":"equities with above-average dividend yields tend to outperform equities with\nbelow-average dividend yields.","C":"equities of small-cap companies tend to outperform equities of large-cap\ncompanies on a risk adjusted basis."},"answer":"C","topic":"Fixed Income","page":14,"solution":"assets/solutions/3-2/74.jpg","confidence":"ocr","explanation":"because the size effect results from the observation that equities of small-cap companies tend to\n‘outperform equities of large-cap companies on a risk adjusted basis.\n\nMarket Efficiency\n\n= describe market anomalies"},{"id":"3-2-75","set":"3-2","number":75,"stem":"When forming asset classes for a strategic asset allocation, the defined asset\nclasses should:","options":{"A":"approximate the relevant investable universe.","B":"have high pairwise correlations between them.","C":"contain negatively correlated assets within each asset class."},"answer":"A","topic":"Portfolio Management","page":14,"solution":"assets/solutions/3-2/75.jpg","confidence":"ocr","explanation":"because asset classes, while being mutually exclusive, should add up to a sufficient approximation of the\nrelevant investable universe."},{"id":"3-2-76","set":"3-2","number":76,"stem":"Using the following information and assuming coupons are paid annually, the\nG-spread of the Steel Co. bond is closest to:\nBond           Maturity      Coupon         Price\nSteel Co.        2 Years       5.00%        101.70\nTreasury bond      2 Years       4.00%        100.50","options":{"A":"36 bps","B":"94 bps","C":"100 bps"},"answer":"A","topic":"Fixed Income","page":14,"solution":"assets/solutions/3-2/76.jpg","confidence":"ocr","explanation":"because the yield for the Steel Co. bond is calculated as\nSy S+100 _\nao + 2M = 101.70\nr= 4.0974%\nThe yield for the Treasury bond is calculated as\n4g te100\nwis + HM = 100.50\n1 =3.7359%\nG-spread is calculated as the yield difference between the Steel Co. Bond and the Treasury bond: 4.0974% —\n3.7359% = 36.15%, or 36 bps."},{"id":"3-2-77","set":"3-2","number":77,"stem":"The industry growth style of the crude oil sector is best characterized as:","options":{"A":"cyclical mature.","B":"defensive growth.","C":"defensive mature."},"answer":"A","topic":"Mixed Topics","page":14,"solution":"assets/solutions/3-2/77.jpg","confidence":"ocr","explanation":"because crude oil together with natural gas and freight transportation are examples of cyclical mature\nindustries given in the reading."},{"id":"3-2-78","set":"3-2","number":78,"stem":"An analyst gathers the following balance sheet information (in $ millions) for a\ncompany:\nCash                 2.5\nAccounts receivable          7.5\nInventories             15.0\nNet fixed assets           25.0\nTotal assets             50.0\nTotal liabilities           22.5\nCommon shareholders' equity    27.5\nTotal liabilities and equity      50.0\nThe market value of inventories is 110% of reported value and the market value\nof net fixed assets is 115% of reported value. All other values are as reported.\nThere are 2.0 million shares outstanding and the current share price is $18.00.\nUsing an asset-based valuation approach, the company's shares are most likely.","options":{"A":"undervalued","B":"fairly valued.","C":"overvalued."},"answer":"C","topic":"Financial Statement Analysis","page":15,"solution":"assets/solutions/3-2/78.jpg","confidence":"ocr","explanation":"because estimated value (adjusted book value) per share = adjusted book value / number of shares\noutstanding = (market value of assets — market value of liabilities) / number of shares outstanding\nMarket value of assets = cash + accounts receivable + adjusted inventories + adjusted net fixed assets = 2.5 + 7.5+\n(1.10 x 15.0) + (1.15 x 25)=2.5 +7.5 + 16.5 + 28.75 = 55.25\nAdjusted book value = 55.25 - 22.5 = 32.75\nEstimated value per share = 32.75 / 2.0 = $16.375\nWith a current share price of $18.00, the shares are overvalued because market price exceeds estimated value per\nshare.\n\nEquity Valuation: Concepts and Basic Tools\n\n= describe asset-based valuation models and their use in estimating equity value"},{"id":"3-2-79","set":"3-2","number":79,"stem":"By setting minimum standards of competence for investment managers,\nregulators most likely.","options":{"A":"help solve agency problems.","B":"ensure firms maintain minimum levels of capital.","C":"ensure all companies report financial results on a common basis."},"answer":"A","topic":"Ethics","page":15,"solution":"assets/solutions/3-2/79.jpg","confidence":"ocr","explanation":"because regulators help solve these agency problems by setting minimum standards of competence for\nagents and by defining and enforcing minimum standards of practice. These agents include investment managers."},{"id":"3-2-80","set":"3-2","number":80,"stem":"Which of the following positions gains if the price of the underlying decreases?","options":{"A":"A short forward position only","B":"A short call option position only","C":"Both a short forward position and a short call option position"},"answer":"C","topic":"Derivatives","page":15,"solution":"assets/solutions/3-2/80.jpg","confidence":"ocr","explanation":"because a short forward position, a short call option position, and a long put option position will gain from a\ndecrease in the underlying price\n\nForward Commitment and Contingent Claim Features and Instruments\n\n= contrast forward commitments with contingent claims"},{"id":"3-2-81","set":"3-2","number":81,"stem":"In a rising interest rate environment, the risk of a lower bond price is greater than\nthe coupon reinvestment risk when the Macaulay duration of the bond is:","options":{"A":"less than the investor's investment horizon.","B":"equal to the investor's investment horizon.","C":"greater than the investor's investment horizon."},"answer":"C","topic":"Fixed Income","page":15,"solution":"assets/solutions/3-2/81.jpg","confidence":"ocr","explanation":"because when the investment horizon is less than the Macaulay duration of the bond, market price risk\ndominates coupon reinvestment risk. The investor's risk is to higher interest rates.\n\nInterest Rate Risk and Return\n\n= describe the relationships among a bond's holding period return, its Macaulay duration, and the investment horizon;"},{"id":"3-2-82","set":"3-2","number":82,"stem":"An analyst gathers the following information about a company and its common\nstock:\nCurrent dividend per share (D0)      $2.00\nDividend payout ratio           55%\nROE                     9%\nIf the required return is 8%, the intrinsic value per share using the Gordon growth\nmodel is closest to:","options":{"A":"$50.63.","B":"$52.68.","C":"$68.82."},"answer":"B","topic":"Mixed Topics","page":16,"solution":"assets/solutions/3-2/82.jpg","confidence":"ocr","explanation":"because intrinsic value = Vp = D;/ (r—_g), where: g = ROE x earnings retention rate = 0.09 x (1 — 0.55) =\n0.0405, D; = Do x (1 + g) = $2.00 x 1.0405 = $2.0810. Thus, Vo = $2.0810 / (0.08 — 0.0405) = $2.0810 / 0.0395 ~\n$52.6835 = $52.68."},{"id":"3-2-83","set":"3-2","number":83,"stem":"An analyst gathers the following information about the current order book for a\nstock:\nBids           Offers\n--           €48\n--           €47\n--           €46\n€44                 --\n€42                 --\n€41                 --\nA buy order placed at which of the following prices would most likely make a\nnew market?","options":{"A":"€43","B":"€44","C":"€45"},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/3-2/83.jpg","confidence":"ocr","explanation":"because if the buy order is placed above the best bid but below the best offer, traders say the order makes\n‘a new market because it becomes the new best bid. In this case the bid at €45 is greater than the current best bid\nof €44 and below the best offer of €46.\n\nMarket Organization and Structure\n\n= compare execution, validity, and clearing instructions"},{"id":"3-2-84","set":"3-2","number":84,"stem":"If the Macaulay duration and time-to-maturity of a bond are equal, the bond is\nmost likely a:","options":{"A":"zero-coupon bond.","B":"coupon bond trading at par.","C":"coupon bond trading at a premium."},"answer":"A","topic":"Fixed Income","page":16,"solution":"assets/solutions/3-2/84.jpg","confidence":"ocr","explanation":"because zero-coupon bonds have a single payment, the face value at maturity, the present weighted-\naverage time to receipt of cash flows is the same as the time-to-maturity because that single cash flow has a\npresent value weight of 1.0. Therefore, the Macaulay duration of a zero-coupon bond is its time-to- maturity."},{"id":"3-2-85","set":"3-2","number":85,"stem":"A successful portfolio risk budget will most likely.","options":{"A":"be based on multiple sources of risk.","B":"produce superior performance compared to passive investing.","C":"lead to investment in assets with the highest return per unit of risk."},"answer":"C","topic":"Portfolio Management","page":16,"solution":"assets/solutions/3-2/85.jpg","confidence":"ocr","explanation":"because whether the risk budgeting process focuses explicitly on it or not, it should result in choosing\nassets based on their ability to add the best return for each unit of the risk budget they use. Although some risk\nbudgeting processes consider multiple risk sources, even a process based on a single risk can provide substantial\nbenefits to an organization. While risk budgeting focuses on allocating the portfolio’s risk tolerance to its best uses,\nthis does not necessary define a portfolio that will beat passive benchmarks. Risk might be best budgeted to\npassive investments\n\nIntroduction to Risk Management\n\n= describe risk budgeting and its role in risk governance"},{"id":"3-2-86","set":"3-2","number":86,"stem":"With respect to risk-adjusted return measures, the information ratio is calculated\nas Jensen's alpha divided by a security's","options":{"A":"total variance.","B":"systematic variance.","C":"nonsystematic variance."},"answer":"C","topic":"Portfolio Management","page":17,"solution":"assets/solutions/3-2/86.jpg","confidence":"ocr","explanation":"because the information ratio for a security is Jensen's alpha divided by nonsystematic variance. The\ninformation ratio, (i.¢., alpha divided by nonsystematic risk), measures the abnormal return per unit of risk added by\nthe security to a well-diversified portfolio. The larger the information ratio is, the more valuable the security."},{"id":"3-2-87","set":"3-2","number":87,"stem":"An investor gathers the following data.\nYear   Earnings per Share ($)   Dividends per Share ($)    ROE\n4             3.20                     1.92          12%\n3             3.60                     1.80          17%\n2             2.44                     1.71          13%\n1             2.50                     1.60          15%\nTo estimate the stock's justified forward P/E, the investor prefers to use the\ncompounded annual earnings growth and the average of the payout ratios over the\nrelevant period (i.e., Year 1-Year 4).\nIf the investor uses 11.5% as her required rate of return, the stock's justified\nforward P/E is closest to:","options":{"A":"10.","B":"12.","C":"21."},"answer":"C","topic":"Mixed Topics","page":17,"solution":"assets/solutions/3-2/87.jpg","confidence":"ocr","explanation":"because\nPolE; = plir—g)\nEarnings growth rate (g) over the period of 2011-2014 = 2.50(1 + g)? = 3.20; g=8.6%\nPayout ratio (p) computation: for example, Year 4: 1.92/3.20 = 0.60.\nAverage payout ratio = (0.60 + 0.50 + 0.70 + 0.64)/4 = 0.61\nPoE = pl(r—g); = 0.61/(0.115 — 0.086) = 0.61/0.029 = 21.0\n\nEquity Valuation: Concepts and Basic Tools\n\n= calculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to\nsales, and price to book value"},{"id":"3-2-88","set":"3-2","number":88,"stem":"An analyst gathers the following information about a bond:\nAnnual modified duration              7.534\nFlat price (per 100 of par value)           92.084\nAccrued interest (per 100 of par value)        1.458\nThe bond's money duration per 100 of par value is closest to:","options":{"A":"683.","B":"694.","C":"705."},"answer":"C","topic":"Fixed Income","page":17,"solution":"assets/solutions/3-2/88.jpg","confidence":"ocr","explanation":"because money duration (MoneyDur) is calculated as the annual modified duration (AnnModDur) times the\nfull price (PVF) of the bond including accrued interest\nMoneyDur = AnnModDur x PV.\" Using also the relation PVF = PVF\"! + Al, where PVF\" is the flat price and Al is\nthe accrued interest, MoneyDur = AnnModDur x (PVF#! + Al) = 7.534 x (92.084 + 1.458) = 7.534 x 93.542 =\n704.745 ~ 705.\n\nYield-Based Bond Duration Measures and Properties\n\n= define, calculate, and interpret modified duration, money duration, and the price v
