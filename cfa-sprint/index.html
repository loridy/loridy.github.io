naged the\ncommodities derivatives trading unit of Continental. As part of his compensation\nat Continental, he received stock, which he still owns. Based upon his research,\nOrtiz recommends Continental to clients who have a moderate risk tolerance.\nTwo weeks later Continental announces its quarterly earnings are 30% less than a\nyear ago. Consequently, shares of Continental drop by 50%. Ortiz most likely\nviolated the CFA Institute Code of Ethics and Standards of Professional Conduct\nrelated to his stock:","options":{"A":"Research.","B":"Ownership.","C":"Recommendation."},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/2-1/01.jpg","confidence":"ocr","explanation":"because there is a violation of Standard VI(A), Disclosure of Conflicts. The analyst worked for Continental\nand still has ties to the company in the form of his stock ownership."},{"id":"2-1-02","set":"2-1","number":2,"stem":"According to the Standard relating to additional compensation agreements, a\nmember is required to obtain permission from her employer before accepting\nbenefits from third parties:","options":{"A":"only for services rendered to her employer.","B":"only for services that might create a conflict with her employer's interest.","C":"both for services rendered to her employer and for services that might create\na conflict with her employer's interest."},"answer":"C","topic":"Ethics","page":1,"solution":"assets/solutions/2-1/02.jpg","confidence":"ocr","explanation":"because Standard IV (B), Additional Compensation Agreements, requires members and candidates to\n‘obtain permission from their employer before accepting compensation or other benefits from third parties for the\nservices rendered to the employer or for any services that might create a conflict with their employer's interest.\nCompensation and benefits include direct compensation by the client and any indirect compensation or other\nbenefits received from third parties"},{"id":"2-1-03","set":"2-1","number":3,"stem":"Julia Otkins, CFA, is approached by her friend who works for a charity that is\nlooking for potential donors. Otkins refuses to share the contact details of current\nclients and only shares the details of one former client. Otkins later learns that\none of her existing clients is involved in illegal money laundering. There are no\napplicable laws relating to client confidentiality and Otkins reports the client to\nthe regulator. Otkins has most likely violated the Standard relating to\nconfidentiality:","options":{"A":"only by reporting the client to the regulator.","B":"only by sharing the contact details of the former client with the charity.","C":"both by reporting the client to the regulator and by sharing the contact details\nof the former client with the charity."},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/2-1/03.jpg","confidence":"ocr","explanation":"because according to Standard Ill (E), Preservation of Confidentiality, members must preserve the\nconfidentiality of information communicated to them by their clients, prospective clients, and former clients."},{"id":"2-1-04","set":"2-1","number":4,"stem":"According to the GIPS standards, verification:","options":{"A":"is voluntary.","B":"ensures the accuracy of a performance report.","C":"can be performed with respect to specific composites."},"answer":"A","topic":"Ethics","page":2,"solution":"assets/solutions/2-1/04.jpg","confidence":"ocr","explanation":"because, according to the GIPS standards, once a firm claims compliance with the GIPS standards, it may\nvoluntarily hire an independent third party to perform a verification in order to increase confidence in the firm's\nclaim of compliance."},{"id":"2-1-05","set":"2-1","number":5,"stem":"Feng Liu, CFA, is an investment manager. Liu organizes nonviolent\ndemonstrations on weekends to fight climate change. After repeated\ndemonstrations, Liu is arrested and convicted for obstructing public transit which\nis considered an act of civil disobedience in her country. Has Liu violated the\nStandards?","options":{"A":"No.","B":"Yes, Liu has violated the Standard relating to loyalty.","C":"Yes, Liu has violated the Standard relating to misconduct."},"answer":"A","topic":"Ethics","page":2,"solution":"assets/solutions/2-1/05.jpg","confidence":"ocr","explanation":"because Standard | (D) is not meant to cover legal transgressions resulting from acts of civil disobedience\nin support of personal beliefs because such conduct does not reflect adversely on the member's professional\nreputation, integrity, or competence. Therefore, Liu has not violated Standard I(D). Further, Standard IV(A), Loyalty,\nrequires members and candidates to protect the interests of their firm by refraining from any conduct that would\ninjure the firm, deprive it of profit, or deprive it of the member's or candidate's skills and ability. However, this\nstandard is not meant to be a blanket requirement to place employer interests ahead of personal interests in all\nmatters. The standard does not require members and candidates to subordinate important personal and family\nobligations to their work. Therefore, Liu’s act of civil disobedience does not violate Standard IV(A)"},{"id":"2-1-06","set":"2-1","number":6,"stem":"Jorge Fernandez, CFA, is an equity analyst at a brokerage company. He suspects\nhis colleague is trading on shares prior to his research reports being distributed to\nclients. When Fernandez asks his colleague about it, he is told to mind his own\nbusiness. To comply with the Standard relating to knowledge of law, Fernandez\nshould most likely.","options":{"A":"report his suspicions to his supervisor.","B":"continue to observe his colleague's trades.","C":"discuss his colleague's trades with other analysts at the firm."},"answer":"A","topic":"Ethics","page":2,"solution":"assets/solutions/2-1/06.jpg","confidence":"ocr","explanation":"because Standard I(A) Knowledge of the Law states if a member has reasonable grounds to believe that\n‘ongoing activities within a firm are illegal or unethical, the member or candidate must dissociate, or separate, from\nthe activity. When direct discussions with the person committing the violation are unsuccessful, the first step should\nbe to attempt to stop the behavior by bringing it to the attention of the employer through a supervisor or the firm's\ncompliance department."},{"id":"2-1-07","set":"2-1","number":7,"stem":"Sandra Chen, CFA, works for a research firm, Vega. Chen's research group\nidentifies a low volatility investment product as a viable risk reduction strategy.\nThe group prepares a report based on its findings. Chen believes the analysis is\nthorough and discloses the associated risks. However, Chen disagrees with the\nfindings because she believes the product will be more volatile than the report\nsuggests. She agrees to have her name included in the report. Has Chen most\nlikely violated the Standards?","options":{"A":"No.","B":"Yes, because she failed to dissociate herself with the report.","C":"Yes, because she failed to include her dissenting opinion in the report."},"answer":"A","topic":"Ethics","page":2,"solution":"assets/solutions/2-1/07.jpg","confidence":"ocr","explanation":"because although Chen does not agree with the view of the group, she believes there is sufficient\ninformation to support the investment conclusion. According to Standard V(A), Diligence and Reasonable Basis, if\nthe member or candidate believes that the consensus opinion has a reasonable and adequate basis and is\nindependent and objective, the member or candidate need not decline to be identified with the report. Because\nChen agrees with the thoroughness of the analysis and the risk disclosure, she is not required to either dissociate\nor insist that the report carry her dissenting opinion."},{"id":"2-1-08","set":"2-1","number":8,"stem":"Lucie Hilbert, CFA, offers premium services to clients for an additional fee. She\noffers the premium services only by email to all of her clients. One client, who\npreviously inquired about premium services, does not receive the offer due to a\ntechnical problem with the client's email system. One week later Hilbert makes\nan investment in an IPO on behalf of her clients. The issue is oversubscribed, so\nshe excludes her sister, a regular fee-paying client of Hilbert's firm, to free up\nshares for other clients. Has Hilbert most likely violated the Standards?","options":{"A":"No.","B":"Yes, the Standard relating to fair dealing.","C":"Yes, the Standard relating to communication with clients and prospective\nclients."},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/2-1/08.jpg","confidence":"ocr","explanation":"because according to Standard III (B), Fair Dealing, if the investment professional's family-member\naccounts are managed similarly to the accounts of other clients of the firm, the family-member accounts should not\nbe excluded from buying such shares. In this case, Hilbert's sister is a regular fee-paying client, thus should not be\nexcluded"},{"id":"2-1-09","set":"2-1","number":9,"stem":"To be consistent with the Standard relating to communication with clients and\nprospective clients, a member:","options":{"A":"must share in written form investment recommendations with clients.","B":"should notify clients that additional information is available if a\nrecommendation is shared in capsule form.","C":"is permitted to share investment recommendations solely using a social\nmedia service to which most clients have access."},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/2-1/09.jpg","confidence":"ocr","explanation":"because Standard V (B), Communication with Clients and Prospective Clients, states, The nature of client\ncommunications is highly diverse—from one word (‘buy’ or “sell”) to in-depth reports of more than 100 pages. A\ncommunication may contain a general recommendation about the market, asset allocations, or classes of\ninvestments (e.g., stocks, bonds, real estate) or may relate to a specific security. If recommendations are contained\nin capsule form (such as a recommended stock list), members and candidates should notify clients that additional\ninformation and analyses are available from the producer of the report"},{"id":"2-1-10","set":"2-1","number":10,"stem":"Riti Malhotra, CFA, is a research analyst covering the oil and gas sector.\nMalhotra visits a covered company's new oil refining facility. The company\narranges a chartered flight as there are no commercial fights serving the location\nof the new refinery. Meals are also provided for by the company at a nearby hotel.\nMalhotra lets the company pay for the expenses. Has Malhotra violated the\nStandards?","options":{"A":"No.","B":"Yes, the Standard relating to loyalty, prudence, and care.","C":"Yes, the Standard relating to independence and objectivity."},"answer":"A","topic":"Ethics","page":3,"solution":"assets/solutions/2-1/10.jpg","confidence":"ocr","explanation":"because according to Standard I(B) relating to Independence and Objectivity, if commercial transportation\nis unavailable, members and candidates may accept modestly arranged travel to participate in appropriate\ninformation-gathering events, such as a property tour and the trip was strictly for business and Malhotra was not\naccepting irrelevant or lavish hospitality. The itinerary required chartered flights, for which analysts were not\nexpected to pay. The accommodations were modest. These arrangements are not unusual and did not violate\nStandard |(B) as long as Malhotra’s independence and objectivity were not compromised. Hence, the Standards are\nnot violated."},{"id":"2-1-11","set":"2-1","number":11,"stem":"Which of the following is a recommended procedure for members to meet their\nobligations under the Standard relating to performance presentation?","options":{"A":"Members should use a single representative account for each investment\nmandate while presenting performance history.","B":"Members should consider the knowledge and sophistication of the audience\nto whom the performance history is being presented.","C":"Members should exclude terminated accounts while presenting performance\nhistory with an indication of when the accounts were terminated."},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/2-1/11.jpg","confidence":"ocr","explanation":"because members and candidates can also meet their obligations under Standard III(D), Performance\nPresentation, by considering the knowledge and sophistication of the audience to whom a performance\npresentation is addressed. This is a recommended procedure for members to meet their obligations."},{"id":"2-1-12","set":"2-1","number":12,"stem":"Reliable Data Corp offered to pay all the expenses of Lindsey Robinson, CFA, an\nequity analyst who covers the company, to attend the company's upcoming annual\nshareholder meeting. Robinson declined their offer and explained to the company\nthat if she had accepted their offer she would most likely be in violation of:","options":{"A":"Standard I-Professionalism.","B":"Standard III-Duties to Clients.","C":"Standard II-Integrity of Capital Markets."},"answer":"A","topic":"Mixed Topics","page":4,"solution":"assets/solutions/2-1/12.jpg","confidence":"ocr","explanation":"because if Robinson were to accept Reliable Data Corp's offer to pay all her expenses to attend the\ncompany’s upcoming annual shareholder meeting she would be in violation of Standard |(B)-Independence and\nObjectivity. Members and candidates must use reasonable care and judgement to achieve and maintain\nindependence and objectivity in their professional activities. Members and candidates must not offer, solicit, or\naccept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own\nor another's independence and objectivity."},{"id":"2-1-13","set":"2-1","number":13,"stem":"According to the recommended procedures for compliance with CFA Institute\nStandard V(C): Record Retention, who is most likely responsible for maintaining\nthe records that support investment actions?","options":{"A":"The firm.","B":"Research analysts.","C":"The chief compliance officer."},"answer":"A","topic":"Ethics","page":4,"solution":"assets/solutions/2-1/13.jpg","confidence":"ocr","explanation":", because according to the recommended procedures for compliance with CFA Institute Standard V(C),\nRecord Retention, the responsibility to maintain records that support investment action generally lies with the firm,\nrather than individuals."},{"id":"2-1-14","set":"2-1","number":14,"stem":"Sue Kim, CFA, a US citizen, works as an analyst for a subsidiary of a US\ninvestment firm on a small island that attracts offshore investment accounts.\nLocal securities laws allow insider trading. While having dinner with the CEO of\na local company, Kim learns that the firm is in negotiations to be acquired for a\nsignificant premium. Would Kim most likely comply with the CFA Institute\nStandards if she purchased the company's shares for her client accounts?","options":{"A":"No.","B":"Yes, because local laws allow insider trading","C":"Yes, if she receives permission from her firm's compliance department"},"answer":"A","topic":"Ethics","page":4,"solution":"assets/solutions/2-1/14.jpg","confidence":"ocr","explanation":"because Standard II(A) prohibits members or candidates from acting on material nonpublic information no\nmatter if local laws or a compliance department allow it. In the event of conflict between the Code and Standards\nand local laws, Standard I(A) requires members or candidates to comply with the stricter law, rule, or regulation."},{"id":"2-1-15","set":"2-1","number":15,"stem":"Teresa Avila, CFA, is a micro cap investment analyst at a hedge fund. The fund\nrequires Avila to hold any securities she recommends for the fund in her own\naccount as well. Because Avila has such a small account, whenever she trades for\nher own portfolio she combines the transactions with those of the hedge fund so\nshe is sure to have her account aligned with the fund. Has Avila most likely\nviolated any CFA Institute Standards of Professional Conduct?","options":{"A":"No.","B":"Yes, the Standard relating to misconduct.","C":"Yes, the Standard relating to priority of transactions."},"answer":"C","topic":"Ethics","page":4,"solution":"assets/solutions/2-1/15.jpg","confidence":"ocr","explanation":"because Standard VI(B), Priority of Transactions, requires that investment transactions for clients and\nemployers have priority over transactions in which members have beneficial ownership. By executing her own\naccounts transactions with those of the hedge fund the analyst has violated this Standard as micro cap securities\ncan be thinly traded and easily influenced by changes in the volume of activity. So the analyst may benefit when\nshe combines her transactions with the hedge funds and she should let the fund execute its orders before she\nmakes changes to her account."},{"id":"2-1-16","set":"2-1","number":16,"stem":"Where local performance presentation regulations conflict with GIPS standards,\nGIPS-compliant firms should most likely comply with:","options":{"A":"the GIPS standards.","B":"local regulations and disclose conflicts.","C":"the higher standard between local regulations and the GIPS standards."},"answer":"B","topic":"Ethics","page":4,"solution":"assets/solutions/2-1/16.jpg","confidence":"ocr","explanation":"because when local laws and regulations conflict with GIPS standards, GIPS-compliant firms are required\nto abide by local laws and regulations and make disclosures regarding conflicts with GIPS standards. It is\nrecommended that both local laws and regulations and GIPS standards be applied."},{"id":"2-1-17","set":"2-1","number":17,"stem":"Soujit Ghosh, CFA, observes a price difference in a security that trades in two\ndifferent markets. Ghosh concludes the price difference is because of time delay\nin factoring material information disseminated by the company. Ghosh\nimmediately buys large quantities of the security in one market and creates a\ndominant short position in the derivative on the security in the other market with\nan intent to exploit the price difference. Has Ghosh violated the Standards?","options":{"A":"No.","B":"Yes, the Standard relating to market manipulation.","C":"Yes, the Standard relating to material nonpublic information."},"answer":"A","topic":"Ethics","page":5,"solution":"assets/solutions/2-1/17.jpg","confidence":"ocr","explanation":"because Standard II(B) relating to Market Manipulation is not intended to preclude transactions undertaken\non legitimate trading strategies based on perceived market inefficiencies. Ghosh has engaged in legitimate\narbitrage strategy and has not violated the Standards."},{"id":"2-1-18","set":"2-1","number":18,"stem":"Joan Tasha, CFA, a supervisor at Olympia Advisors (OA), wrote and\nimplemented compliance policies at her firm. Along-time OA employee, Derek\nLongtree, recently changed the asset allocation of a client, which is inconsistent\nwith her financial needs and objectives and with OA's policies. Until now,\nLongtree has never violated OA's policies. Tasha discusses the issue with\nLongtree but takes no further action. Do Tasha's actions concerning Longtree\nmost likely violate any CFA Institute Standards of Professional Conduct?","options":{"A":"No.","B":"Yes, because she failed to detect Longtree's actions.","C":"Yes, because she did not take steps to ensure that the violation will not be\nrepeated."},"answer":"C","topic":"Ethics","page":5,"solution":"assets/solutions/2-1/18.jpg","confidence":"ocr","explanation":"because once a supervisor learns that an employee has violated or may have violated the law or the Code\nand Standards, the supervisor must promptly initiate an investigation to ascertain the extent of the wrongdoing as\nrequired by Standard IV(C), Responsibilities of Supervisors. Relying on an employee's statements about the extent\nof the violation or assurances that the wrongdoing will not recur is not enough. Reporting the misconduct up the\nchain of command and warning the employee to cease the activity are also not enough. Pending the outcome of the\ninvestigation, a supervisor should take steps to ensure that the violation will not be repeated, such as placing limits\n‘on the employee's activities or increasing the monitoring of the employee's activities."},{"id":"2-1-19","set":"2-1","number":19,"stem":"According to the Standard relating to loyalty, prudence, and care, a member with\ncontrol of client assets should submit to each client an itemized statement of their\nsecurity holdings and transactions at least:","options":{"A":"quarterly.","B":"semi-annually","C":"annually."},"answer":"A","topic":"Ethics","page":5,"solution":"assets/solutions/2-1/19.jpg","confidence":"ocr","explanation":"because according to Standard III(A), Duties to Clients - Loyalty, Prudence, and Care, members and\ncandidates with control of client assets should submit to each client, at least quarterly, an itemized statement\nshowing the funds and securities in the custody or possession of the member or candidate plus all debits, credits,\nand transactions that occurred during the period"},{"id":"2-1-20","set":"2-1","number":20,"stem":"Vanraj Shah has just finished taking the Level II CFA exam for the second time.\nTo protect the integrity of the exam, Gupta is careful not to discuss the exam\nquestions with other candidates. Shah calls his friend, a member, and contrasts his\ntwo attempts by highlighting that there were many calculation questions on\nderivatives in the first instance and none in the second. Later, in a public blog on\ninvestment education, Shah shares his strong disagreement regarding CFA\nInstitute shifting to computer-based testing. Shah has violated the\nStandard(s)relating to:","options":{"A":"conduct as participants in CFA Institute programs only.","B":"reference to CFA Institute, the CFA designation, and the CFA program only.","C":"both conduct as participants in CFA Institute programs and reference to CFA\nInstitute, the CFA designation, and the CFA program."},"answer":"A","topic":"Ethics","page":5,"solution":"assets/solutions/2-1/20.jpg","confidence":"ocr","explanation":"because according to Standard VII(A) relating to Conduct as Participants in CFA Institute Programs,\n‘examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to\nbroad topical areas and formulas tested or not tested on the exam. Shah has violated Standard VII(A) by\nmentioning that there were no calculation questions on derivatives. Also according to Standard VII(B) relating to\nReference to CFA Institute, the CFA designation, and the CFA program, when referring to CFA Institute, CFA\nInstitute membership, the CFA designation, or candidacy in the CFA Program, Members and Candidates must not\nmisrepresent or exaggerate the meaning or implications of membership in CFA Institute, holding the CFA\ndesignation, or candidacy in the CFA Program. Shah has not done this and hence Standard VII(B) is not violated\nOnly Standard VIK(A) is violated"},{"id":"2-1-21","set":"2-1","number":21,"stem":"According to the GIPS standards, a firm must:","options":{"A":"attain compliance for a minimum of seven years to initially claim compliance\nwith the GIPS standards.","B":"include terminated composites on its list of composite descriptions for at\nleast seven years after the composite termination date.","C":"update GIPS reports provided to prospective clients to include information\nthrough the most recent annual period within 12 months of that annual period\nend."},"answer":"C","topic":"Ethics","page":6,"solution":"assets/solutions/2-1/21.jpg","confidence":"ocr","explanation":"because according to the GIPS standards, when providing GIPS reports to prospective clients and\nprospective investors, firms must update these reports to include information through the most recent annual period\nend within 12 months of that annual period end"},{"id":"2-1-22","set":"2-1","number":22,"stem":"Milene Fontes, CFA, takes over coverage of a company because the original\nanalyst left the firm before finishing there search report. She adds her own\nthorough analysis and publishes the report in her name only. Has Fontes violated\nthe Standards?","options":{"A":"No.","B":"Yes, by using the original analyst's work in the report.","C":"Yes, by not attributing the report to the original analyst."},"answer":"A","topic":"Ethics","page":6,"solution":"assets/solutions/2-1/22.jpg","confidence":"ocr","explanation":"because according to Standard I(C) Misrepresentation, members and Candidates must not knowingly\nmake any misrepresentations relation to investment analysis, recommendations, actions, or other professional\nactivities. Members or Candidates may use research conducted or models developed by others within the same\nfirm without committing a violation The most common example relates to the situation in which one (or more) of the\noriginal analysts is no longer with the firm."},{"id":"2-1-23","set":"2-1","number":23,"stem":"Ritu Jain, CFA, is preparing to leave her firm and join a new employer. Prior to\nleaving the firm, Jain calls all her clients informing them of her decision to leave.\nWhen asked by the clients, Jain states lack of confidence in the firm's leadership\nas the reason for her departure and also mentions that more employees are likely\nto leave soon. Jain has violated the Standard(s)relating:","options":{"A":"only to loyalty.","B":"only to preservation of confidentiality.","C":"both to loyalty and to preservation of confidentiality."},"answer":"A","topic":"Ethics","page":6,"solution":"assets/solutions/2-1/23.jpg","confidence":"ocr","explanation":"because Standard IV(A): Duties to Employers, Loyalty states that CFA Institute members and candidates\nmust act for the benefit of their employer and not otherwise cause harm to their employer and Jain violates her duty\nof loyalty to her employer by making disparaging and harmful statements about the firm to its clients. Jain can call\nher clients to inform of her decision but cannot make disparaging statements about her employer. Also according to\nStandard III(E) relating to preservation of confidentiality, members and candidates preserve the confidentiality of\ninformation communicated to them by their clients, prospective clients, and former clients. No client related\ninformation is being disclosed and information pertaining to an employer is not covered by this Standard. Hence\nonly the Standard relating to preservation of confidentiality has been violated"},{"id":"2-1-24","set":"2-1","number":24,"stem":"John Pedersen, CFA, writes in his firm's promotional material:\n\"I passed all three CFA Program examinations in three consecutiveStatement 1               years.\"\nBeing a CFA charter holder,  I am among the  elite of investmentStatement 2               professionals.\"\nStatement 1: \"I passed all three CFA Program examinations in three consecutive\nyears.\"\nStatement 2: \"Being a CFA charter holder, I am among the elite of investment\nprofessionals.\"\nHas Pedersen most likely violated the Standard(s)?","options":{"A":"No.","B":"Yes, by making Statement 1 only.","C":"Yes, by making Statement 2 only"},"answer":"C","topic":"Ethics","page":6,"solution":"assets/solutions/2-1/24.jpg","confidence":"ocr","explanation":"because according to Standard VII (B), Reference to CFA Institute, CFA Institute membership, the CFA\ndesignation, and the CFA Program, statements referring to CFA Institute, the CFA designation, or the CFA Program\nthat overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be\nexpected from someone with the CFA designation are not allowed under the standard."},{"id":"2-1-25","set":"2-1","number":25,"stem":"The GIPS standards were created to prevent the:","options":{"A":"comparison of comparable time periods with other firms' results.","B":"selection of a top-performing portfolio to represent the firm's strategy.","C":"presentation of an average performance history that includes terminated\nportfolios."},"answer":"B","topic":"Ethics","page":7,"solution":"assets/solutions/2-1/25.jpg","confidence":"ocr","explanation":"because the GIPS standards were created to prevent misleading practices such as cherry-picking\nrepresentative accounts which is the selection a top-performing portfolio to represent the firm's overall investment\nresults for a specific mandate."},{"id":"2-1-26","set":"2-1","number":26,"stem":"A member makes two statements:\nStatement 1  \"Members are required to disclose referral fees paid to others.\"\n\nStatement 2  \"Members are required to disclose referral fees received from others.\"","options":{"A":"Yes.","B":"No, only Statement 1 is correct.","C":"No, only Statement 2 is correct."},"answer":"A","topic":"Ethics","page":7,"solution":"assets/solutions/2-1/26.jpg","confidence":"ocr","explanation":"because Standard VI (C), Referral Fees, states that members and candidates must disclose to their\nemployer, clients, and prospective clients, as appropriate, any compensation, consideration, or benefit received\nfrom or paid to others for the recommendation of products or services. Therefore, members must disclose referral\nfees paid to others and also referral fees received from others."},{"id":"2-1-27","set":"2-1","number":27,"stem":"Werner Merz, CFA, manages a short-term corporate bond mutual fund at a\nsubsidiary of Cygnet Bank. The president of Cygnet Bank tells Merz that the\nbank needs to sell some of its long-term government bond holdings; however,\nbecause market prices are below their purchase price of 100, a loss would be\nrealized. The president asks Merz to purchase these bonds for the mutual fund at\n100, assuring him that the fund can hold the bonds to maturity and get a full\nreturn of the initial investment. Merz purchases the bonds for the fund at 100 as\nrequested. Merz has most likely violated the Standard(s) relating:","options":{"A":"only to suitability.","B":"only to loyalty, prudence, and care.","C":"both to suitability and to loyalty, prudence, and care."},"answer":"C","topic":"Ethics","page":7,"solution":"assets/solutions/2-1/27.jpg","confidence":"ocr","explanation":"because according to Standard Il (C), Suitability, when Members and Candidates are responsible for\nmanaging a portfolio to a specific mandate, strategy, or style, they must make only investment recommendations or\ntake only investment actions that are consistent with the stated objectives and constraints of the portfolio. Mertz\nmanages a mutual fund with a short-term corporate bond mandate. By purchasing long-term government securities,\nhe is taking investment actions that are inconsistent with the stated objectives, or mandate, of the fund, and has.\ntherefore violated Standard III (C). Additionally, according to Standard III (A), Loyalty, Prudence, and Care,\nMembers and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients’ interests\nbefore their employer's or their own interests. A member's or candidate's responsibility to a client includes a duty of\nloyalty and a duty to exercise reasonable care. Investment actions must be carried out for the sole benefit of the\nclient and in a manner the member or candidate believes, given the known facts and circumstances, to be in the\nbest interest of the client. By purchasing assets from his employer for the mutual fund at above-market prices, he\nhas placed the interests of his employer over those of the clients and acted in an imprudent manner in his\ninvestment decisions, thus violating Standard III (A) as well"},{"id":"2-1-28","set":"2-1","number":28,"stem":"All else being equal, in periods of rising prices and constant inventory quantities,\nFIFO most likely results in a higher.","options":{"A":"total asset turnover than LIFO.","B":"working capital turnover than LIFO.","C":"days of inventory on hand than LIFO."},"answer":"C","topic":"Financial Statement Analysis","page":7,"solution":"assets/solutions/2-1/28.jpg","confidence":"ocr","explanation":"because in an environment of rising inventory unit costs and constant or increasing inventory quantities,\nFIFO (in comparison with weighted average cost or LIFO) will allocate a lower amount of the total cost of goods\navailable for sale to cost of sales on the income statement and a higher amount to ending inventory on the balance\nsheet. Accordingly, because cost of sales will be lower under FIFO, a company's gross profit, operating profit, and\nincome before taxes will be higher. Days of inventory on hand = Number of days in period ~ Inventory turnover.\nInventory turnover = Cost of sales ~ Average inventory. As inventory is higher under FIFO relative to LIFO, and\nCost of sales is lower under FIFO relative to LIFO, Inventory turnover is lower under FIFO. As such, Days of\ninventory on hand is higher under FIFO relative to LIFO.\n\nAnalysis of Inventories\n\n= calculate and explain how inflation and deflation of inventory costs affect the financial statements and ratios of\ncompanies that use different inventory valuation methods"},{"id":"2-1-29","set":"2-1","number":29,"stem":"An example of an expansionary fiscal policy is:","options":{"A":"a reduction in bank reserve requirements.","B":"an increase in public spending on social goods and infrastructure.","C":"the purchase of government bonds through open market operations."},"answer":"B","topic":"Fixed Income","page":7,"solution":"assets/solutions/2-1/29.jpg","confidence":"ocr","explanation":"because an expansionary fiscal policy could include new public spending on social goods and\ninfrastructure, such as hospitals and schools, boosting personal incomes with the objective of raising aggregate\ndemand"},{"id":"2-1-30","set":"2-1","number":30,"stem":"When forecasting earnings, an analyst's best approach is to:","options":{"A":"utilize the results of financial analysis and professional judgment.","B":"calculate a range of possibilities solely based on the results of financial\nanalysis.","C":"establish a precise forecast based on the results of economic and financial\nanalysis."},"answer":"A","topic":"Mixed Topics","page":8,"solution":"assets/solutions/2-1/30.jpg","confidence":"ocr","explanation":"because forecasts are not limited to a single point estimate but should involve a range of possibilities. The\nresults of financial analysis are integral to this process, along with judgment of the analysts."},{"id":"2-1-31","set":"2-1","number":31,"stem":"The creditors of a company most likely.","options":{"A":"hold voting power.","B":"have similar risk tolerance to shareholders.","C":"have the ability to restrict the activities of the company"},"answer":"C","topic":"Mixed Topics","page":8,"solution":"assets/solutions/2-1/31.jpg","confidence":"ocr","explanation":"because the difference in debt versus equity claims gives rise to potential conflicts of interest. Further,\ncreditors are more likely to impose contractual limits on leverage and shareholder distributions, which are important\n(financing) activities of the company.\n\nCorporate Governance: Conflicts, Mechanisms, Risks, and Benefits\n\n= describe the principal-agent relationship and conflicts that may arise between stakeholder groups"},{"id":"2-1-32","set":"2-1","number":32,"stem":"An option to abandon a capital investment at a future date if the NPV of the\nproject is less than expected is a type of:","options":{"A":"sizing option.","B":"timing option.","C":"flexibility option."},"answer":"A","topic":"Derivatives","page":8,"solution":"assets/solutions/2-1/32.jpg","confidence":"ocr","explanation":"because an abandonment option is a type of sizing option. If after investing the company can abandon the\ninvestment if the financial results are disappointing, it has an abandonment option. At some future date, if the cash\nflow from abandoning an investment exceeds the present value of the cash flows from continuing the investment,\nthe company should exercise the abandonment option."},{"id":"2-1-33","set":"2-1","number":33,"stem":"An analyst gathers the following information (in $ thousands) about a company:\nPurchases from suppliers  9,000\n\nIncrease in inventory      1,000\nCash paid to suppliers (in $ thousands)is:","options":{"A":"7,500.","B":"8,000.","C":"8,500."},"answer":"A","topic":"Financial Statement Analysis","page":8,"solution":"assets/solutions/2-1/33.jpg","confidence":"ocr","explanation":"because cash paid to suppliers can be calculated by adjusting purchases for the change in accounts\npayable. Accordingly, Cash paid to suppliers = Purchases from suppliers — Increase in accounts payable = 9,000 —\n1,500 = 7,500."},{"id":"2-1-34","set":"2-1","number":34,"stem":"Which of the following most likely increases a manufacturing company's\noperating income? A decrease in.","options":{"A":"income taxes.","B":"interest charges.","C":"administrative costs."},"answer":"C","topic":"Mixed Topics","page":8,"solution":"assets/solutions/2-1/34.jpg","confidence":"ocr","explanation":"because operating profit is calculated as gross profit minus operating costs. So, an operating profit margin\nincreasing faster than the gross profit margin can indicate improvements in controlling operating costs, such as\nadministrative overheads. Thus, a decrease in administrative costs will increase a company's operating income\n\nFinancial Analysis Techniques\n\n= calculate and interpret activity, liquidity, solvency, and profitability ratios"},{"id":"2-1-35","set":"2-1","number":35,"stem":"Which of the following events is most likely to lead management to make biased\naccounting choices?","options":{"A":"Changing the company's CEO.","B":"Changing the company's audit firm.","C":"Changing the company's fiscal year."},"answer":"A","topic":"Mixed Topics","page":8,"solution":"assets/solutions/2-1/35.jpg","confidence":"ocr","explanation":"because a company might report lower earnings in the CEO's first year to create a positive trajectory for\nfuture periods. Alternatively, there could be motivation to report higher earnings under the new CEO. Either situation\ncould lead to biased accounting choices."},{"id":"2-1-36","set":"2-1","number":36,"stem":"A random variable Y=exp(X) is lognormally distributed, where X is normally\ndistributed. The distribution of Y:","options":{"A":"is skewed to the left.","B":"is often used to model stock prices.","C":"has a mean equal to exp(μ), whereμis the mean of X."},"answer":"B","topic":"Mixed Topics","page":9,"solution":"assets/solutions/2-1/36.jpg","confidence":"ocr","explanation":"because the lognormal distribution has been found to be a usefully accurate description of the distribution\nof prices for many financial assets, which includes stocks"},{"id":"2-1-37","set":"2-1","number":37,"stem":"An analyst gathers the following information about a project:\n$100 million                          Initial outlay\nCash flow at end of Year 1  $65 million\n\nCash flow at end of Year 2  $65 million\n\nCash flow at end of Year 3  $65 million\nIf the required rate of return is 15%, the NPV is closest to:","options":{"A":"$48 million.","B":"$95 million.","C":"$148 million."},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/2-1/37.jpg","confidence":"ocr","explanation":"because it discounts all the cash flows at the required return and sums them as follows: NPV = ,.1\"2CF, /(1\n+ 1)! - Outlay, where CF; = After-tax cash flow at time t, r= Required rate of return for the investment, Outlay =\nInvestment cash flow at time zero, NPV = 65/(1 + 15%) + 65/(1 + 15%)? + 65/(1 + 15%)? — 100 ~ 56.52 + 49.15 +\n42.74 — 100 = 148.41 ~ 48."},{"id":"2-1-38","set":"2-1","number":38,"stem":"Frequent changes to commercial bank reserve requirements most likely.","options":{"A":"are disruptive for banks.","B":"lead to high money growth.","C":"are common in developed countries."},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/2-1/38.jpg","confidence":"ocr","explanation":"because changing reserve requirements frequently is disruptive for banks. For example, if a central bank\nincreased the reserve requirements, a bank that was short on reserves might have to cease its lending activities\nuntil it had built up the necessary reserves, because deposits would be unlikely to rise quickly enough for the bank\nto build its reserves in this way."},{"id":"2-1-39","set":"2-1","number":39,"stem":"According to the converged accounting standards for revenue recognition,\nrevenue is recognized only when:","options":{"A":"cash is received.","B":"it is highly probable that it will not be subsequently reversed.","C":"all performance obligations within a contract have been met while the\ntransaction price can be allocated to each identified performance obligation."},"answer":"B","topic":"Ethics","page":9,"solution":"assets/solutions/2-1/39.jpg","confidence":"ocr","explanation":"because revenue should only be recognized when it is highly probable that it will not be subsequently\nreversed"},{"id":"2-1-40","set":"2-1","number":40,"stem":"Which of the following measures best expresses the amount of a portfolio's risk\nper unit of mean return?","options":{"A":"Sharpe ratio.","B":"Standard deviation.","C":"Coefficient of variation."},"answer":"C","topic":"Portfolio Management","page":9,"solution":"assets/solutions/2-1/40.jpg","confidence":"ocr","explanation":"because the coefficient of variation, CV, is the ratio of the standard deviation of a set of observations to\ntheir mean value. When the observations are returns, for example, the coefficient of variation measures the amount\nof risk (standard deviation) per unit of mean return.\n\nStatistical Measures of Asset Returns\n\n= calculate, interpret, and evaluate measures of dispersion to address an investment problem"},{"id":"2-1-41","set":"2-1","number":41,"stem":"Under US GAAP, a valuation allowance is a reserve created against","options":{"A":"deferred tax assets only.","B":"deferred tax liabilities only.","C":"both deferred tax assets and deferred tax liabilities."},"answer":"A","topic":"Financial Statement Analysis","page":10,"solution":"assets/solutions/2-1/41.jpg","confidence":"ocr","explanation":"because if it were doubtful that future economic benefits would be realized from a temporary difference, the\ntemporary difference will not lead to recognition of a deferred tax asset. If a deferred tax asset was recognized\npreviously, but there was sufficient doubt about the economic benefits being realized, then, under IFRS, an existing\ndeferred tax asset would be reversed. Under US GAAP, a valuation allowance would be established to reduce the\namount of the deferred tax asset to the amount that is more likely than not to be realized."},{"id":"2-1-42","set":"2-1","number":42,"stem":"An indicator variable used in a simple linear regression is best described as a\nvariable taking a value:","options":{"A":"of either 0 or 1.","B":"between 0 and 1.","C":"in the range-1 to 1."},"answer":"A","topic":"Quantitative Methods","page":10,"solution":"assets/solutions/2-1/42.jpg","confidence":"ocr","explanation":"because for some regression analyses, we could use an indicator variable, or dummy variable, that takes\non only the values 0 or 1 as the independent variable."},{"id":"2-1-43","set":"2-1","number":43,"stem":"The reversal of a prior fiscal year inventory write-down is:","options":{"A":"prohibited.","B":"recognized as a reduction in cost of sales.","C":"recognized as an increase in other operating income."},"answer":"B","topic":"Financial Statement Analysis","page":10,"solution":"assets/solutions/2-1/43.jpg","confidence":"ocr","explanation":"because the reversal of any write-down of inventories is recognized as a reduction in cost of sales\n(reduction in the amount of inventories recognized as an expense)"},{"id":"2-1-44","set":"2-1","number":44,"stem":"During the slowdown phase of the business cycle, inflation most likely.","options":{"A":"remains moderate.","B":"further accelerates.","C":"decelerates but with a lag."},"answer":"B","topic":"Economics","page":10,"solution":"assets/solutions/2-1/44.jpg","confidence":"ocr","explanation":"because, in the “slowdown” phase, inflation further accelerates."},{"id":"2-1-45","set":"2-1","number":45,"stem":"Which of the following statements is most accurate? Network effects:","options":{"A":"lower the barriers to entry for competition.","B":"are created only when crowd sourcing is used.","C":"are present in many older, pre-internet businesses."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/2-1/45.jpg","confidence":"ocr","explanation":"because network effects are also at work in many older, pre-internet businesses, such as telephone\nservice, payment systems including credit cards, and financial infrastructure, such as stock exchanges.\n\nBusiness Models\n\n= describe various types of business models"},{"id":"2-1-46","set":"2-1","number":46,"stem":"The overarching objective of a central bank is most likely to maintain:","options":{"A":"price stability.","B":"full employment.","C":"the stability of the financial system."},"answer":"A","topic":"Economics","page":10,"solution":"assets/solutions/2-1/46.jpg","confidence":"ocr","explanation":"because the overarching goal of a central bank is to maintain price stability."},{"id":"2-1-47","set":"2-1","number":47,"stem":"An analyst gathers the following information (in $ millions) about a company:\nYear 2  Year 1\n\nTotal assets     90    100\n\nTotal liabilities   36     40\n\nTotal net assets   54     60\nUsing vertical common-size balance sheet analysis, the company's total liabilities\nin Year 2 are closest to:","options":{"A":"40%.","B":"67%.","C":"90%."},"answer":"A","topic":"Financial Statement Analysis","page":11,"solution":"assets/solutions/2-1/47.jpg","confidence":"ocr","explanation":"because vertical common-size analysis, involves stating each balance sheet item as a percentage of total\nassets. Accordingly, Total liabilities = 36 / 90 = 40%."},{"id":"2-1-48","set":"2-1","number":48,"stem":"Along the cooperative continuum, which of the following ranks geopolitical\nsystems from the lowest to the highest level of globalization?","options":{"A":"Bilateralism, regionalism, multilateralism","B":"Multilateralism, regionalism, bilateralism","C":"Regionalism, multilateralism, bilateralism"},"answer":"A","topic":"Mixed Topics","page":11,"solution":"assets/solutions/2-1/48.jpg","confidence":"ocr","explanation":"because typically, countries exist on a spectrum between bilateralism and multilateralism. In between the\ntwo extremes is regionalism, in which a group of countries cooperate with one another.\nMultilateralism describes countries that participate in mutually beneficial trade relationships and extensive rules\nharmonization. Private firms are fully integrated into global supply chains with multiple trade partners. Hence, it\nrepresents the highest level of globalization"},{"id":"2-1-49","set":"2-1","number":49,"stem":"An analyst gathers the following information (in $ millions) about a company's\nland reported under the revaluation model:\nOriginal cost                                              12\n\nFair market value at initial revaluation on 31 December Year 1      17\n\nFair market value at second revaluation on 31 December Year 2     12\nAs a result of the second revaluation, the company recognizes in Year 2:","options":{"A":"a $5 million loss on the income statement.","B":"a $5 million loss in other comprehensive income.","C":"neither a loss on the income statement nor a loss in other comprehensive\nincome."},"answer":"B","topic":"Financial Statement Analysis","page":11,"solution":"assets/solutions/2-1/49.jpg","confidence":"ocr","explanation":"because if a revaluation initially increases the carrying amount of the asset class, the increase in the\ncarrying amount of the asset class bypasses the income statement and goes directly to equity under the heading of\nrevaluation surplus. Any subsequent decrease in the asset's value first decreases the revaluation surplus and then\ngoes to income. Under IFRS, other comprehensive income includes certain changes in the value of long-lived\nassets that are measured using the revaluation model rather than the cost model. After initial revaluation, the\nrevaluation surplus is thus 17 — 12 = 5. The second revaluation decreases the revaluation surplus by 5"},{"id":"2-1-50","set":"2-1","number":50,"stem":"Which category of financial ratios is most likely used to measure how efficiently a\ncompany performs day-to-day tasks?","options":{"A":"Activity.","B":"Liquidity.","C":"Solvency."},"answer":"A","topic":"Mixed Topics","page":11,"solution":"assets/solutions/2-1/50.jpg","confidence":"ocr","explanation":"because activity ratios measure how efficiently a company performs day-to-day tasks, such as the\ncollection of receivables and management of inventory."},{"id":"2-1-51","set":"2-1","number":51,"stem":"In a simple linear regression, the standard error of the estimate is also known as\nthe:","options":{"A":"mean square error.","B":"sum of squares error.","C":"root mean square error."},"answer":"C","topic":"Quantitative Methods","page":12,"solution":"assets/solutions/2-1/51.jpg","confidence":"ocr","explanation":"because the standard error of the estimate (s.), is also known as the standard error of the regression or\nthe root mean square error.\n\nSimple Linear Regression\n\n= describe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate\nand interpret the standard error of estimate in a simple linear regression"},{"id":"2-1-52","set":"2-1","number":52,"stem":"An unqualified audit opinion:","options":{"A":"provides absolute assurance about the accuracy or precision of the financial\nstatements.","B":"states that the financial statements are fairly presented in accordance with\napplicable accounting standards.","C":"is issued when the financial statements materially depart from accounting\nstandards and are not fairly presented."},"answer":"B","topic":"Ethics","page":12,"solution":"assets/solutions/2-1/52.jpg","confidence":"ocr","explanation":"because an unqualified audit opinion states that the financial statements give a “true and fair view”\n(international) or are “fairly presented’ (intemational and US) in accordance with applicable accounting standards"},{"id":"2-1-53","set":"2-1","number":53,"stem":"A company holds licenses with a net book value of 12,118 (in USD thousands) as\nof 31 December Year 1. The company reported the following data related to\nimpairment losses and amortization on these licenses (in USD thousands):\nAccumulated impairment losses and amortization as of 31 December Year 1  2,142\n\nExchange movements                                              212\n\nAmortization charge for the year                                     752\n\nImpairment losses                                                 52\n\nDisposals                                                                                     ---\n\nTransfers to investments in associated undertakings                             (7)\nThe cost of licenses as of 31 December Year 2 was 16,435(in USD thousands).\nBased on the data provided, the carrying value of licenses as of 31 December\nYear 2 is closest to (in USD thousands):","options":{"A":"8,967.","B":"13,284.","C":"13,496."},"answer":"B","topic":"Mixed Topics","page":12,"solution":"assets/solutions/2-1/53.jpg","confidence":"ocr","explanation":". To calculate the carrying value of licenses, first calculate the total amount of accumulated impairment\nlosses and amortization based on the data provided as follows: (Accumulated impairment losses and amortization\nas of 31 December Year 1 + Exchange movements + Amortization charge for the year + Impairment losses +\nDisposals + Transfers to investments in associated undertakings) or (2,142 + 212 + 752 + 52-7) = 3,151. That\namount is used to calculate the carrying value as of 31 December Year 2 as follows: (Cost of licenses as of 31\nDecember Year 2 — Accumulated impairment losses and amortization) = (16,435 — 3,151) = 13,284 = carrying value\nas of December 31 Year 2"},{"id":"2-1-54","set":"2-1","number":54,"stem":"Which of the following methods is most appropriate to assess the impact of a\ngeopolitical risk?","options":{"A":"Group think.","B":"Scenario analysis.","C":"Linear quantitative modeling."},"answer":"B","topic":"Mixed Topics","page":12,"solution":"assets/solutions/2-1/54.jpg","confidence":"ocr","explanation":"because scenario analysis is the process of evaluating portfolio outcomes across potential circumstances\nor states of the world. Scenarios help investment teams understand where they stand with respect to a risk that\nmight cause them to change their behavior."},{"id":"2-1-55","set":"2-1","number":55,"stem":"An analyst gathers the following exchange rate information:\nUSD/EUR spot rate              1.0351\n\n1-week USD/EUR forward points    -1.1\nUSD/EUR is the amount of USD per 1 EUR\nThe 1-week USD/EUR forward rate is closest to:","options":{"A":"1.02410.","B":"1.03400.","C":"1.03499."},"answer":"C","topic":"Fixed Income","page":13,"solution":"assets/solutions/2-1/55.jpg","confidence":"ocr","explanation":"because to convert any of the quoted forward points into a forward rate, one would divide the number of\npoints by 10,000 (to scale down to the fourth decimal place, the last decimal place in the spot quote) and then add\nthe result to the spot exchange rate quote. In this case the one-week forward rate is calculated as 1.0351 + (—\n1.1)/10,000 = 1.03499\n\nExchange Rate Calculations\n\n= explain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward\n\nrate using points or in percentage terms, and interpret a forward discount or premium"},{"id":"2-1-56","set":"2-1","number":56,"stem":"An investor is considering three investments:\n·Investment 1 makes 20 annual payments of $50,000, starting one year from\ntoday.\n·Investment 2 makes 25 annual payments of $45,000, starting today.\n·Investment 3 makes annual payments of $40,000 indefinitely, starting one year\nfrom today.\nIf the investor's discount rate is 10% per year, which investment has the highest\npresent value':","options":{"A":"Investment 1.","B":"Investment 2.","C":"Investment 3."},"answer":"B","topic":"Mixed Topics","page":13,"solution":"assets/solutions/2-1/56.jpg","confidence":"ocr","explanation":"because Investment 2 has the highest present value. Investment 2 is an annuity due with a present value\ncalculated as PV = A[(1— 1/(1 + Vr] x (1 + 9), where A is the annual payment, Nis the number of payments, and r\nis the discount rate. Therefore, PV = $45,000 x [(1 — 1/(1.1)°5/0.4] x (1.1) = $449,313. Calculator solution (BGN\nmode): I/Y = 10%; PMT = 45,000; N = 25; solve for PV = 449,313"},{"id":"2-1-57","set":"2-1","number":57,"stem":"A policy rate that is neutral will become contractionary if trend growth:","options":{"A":"increases and expected inflation increases.","B":"decreases and expected inflation remains the same.","C":"decreases and expected inflation increases by the same amount."},"answer":"B","topic":"Economics","page":13,"solution":"assets/solutions/2-1/57.jpg","confidence":"ocr","explanation":"because if trend growth decreases, the neutral rate will decrease, which will put the policy rate above the\nneutral rate. The Neutral rate = Trend growth + Inflation target. The analyst would therefore describe the central\nbank's monetary policy as being contractionary when its policy rate is above the neutral rate, and expansionary\nwhen it is below."},{"id":"2-1-58","set":"2-1","number":58,"stem":"Under the Modigliani-Miller propositions without corporate taxes, if a company's\nD/E ratio increases, its cost of equity:","options":{"A":"decreases.","B":"remains unchanged.","C":"increases"},"answer":"C","topic":"Mixed Topics","page":13,"solution":"assets/solutions/2-1/58.jpg","confidence":"ocr","explanation":"because according to MM Proposition |, the value of the company remains unchanged or constant as the\ncapital structure changes. Therefore, the weighted average cost of capital must also remain constant as capital\nstructure changes. Since the cost of debt is lower than the cost of equity because debtholders have a priority in\nclaims, it holds that as the company uses more debt, its risk goes up and the cost of equity must increase\n\nCapital Structure\n\n= explain the Modigliani-Miller propositions regarding capital structure"},{"id":"2-1-59","set":"2-1","number":59,"stem":"Double taxation of income occurs when a corporation pays taxes on its profits,\nand additional taxes are paid by the.","options":{"A":"shareholders on dividends received.","B":"corporation on distributions to shareholders.","C":"shareholders on gains earned from their equity investment."},"answer":"A","topic":"Mixed Topics","page":13,"solution":"assets/solutions/2-1/59.jpg","confidence":"ocr","explanation":"because double taxation is when shareholders pay an additional tax on distributions (dividends) that are\npassed on to them."},{"id":"2-1-60","set":"2-1","number":60,"stem":"Whenever Variable X increases by four units, Variable Y increases by one unit.\nThe correlation between X and Y is:","options":{"A":"025.","B":"0.75.","C":"1.00."},"answer":"C","topic":"Quantitative Methods","page":14,"solution":"assets/solutions/2-1/60.jpg","confidence":"ocr","explanation":"because X and Y have a perfect positive linear relationship as Y = 0.25X. The correlation is +1.00. A\ncorrelation of 1 indicates a perfect linear relationship."},{"id":"2-1-61","set":"2-1","number":61,"stem":"The following financial statement data are available for a company.\n£ Thousands\n\nNet income                  500\n\nDepreciation                 150\n\nCash flow from operations      600\n\nFree cash flow to the firm      300\n\nBeginning total assets          4,000\n\nEnding total assets             6,000\n\nEnding cash balance           50\n\nBook value                   3,000\nThe company's cash return on assets ratio is closest to:","options":{"A":"10%.","B":"12%.","C":"13%."},"answer":"B","topic":"Financial Statement Analysis","page":14,"solution":"assets/solutions/2-1/61.jpg","confidence":"ocr","explanation":"because cash return on assets = (Cash flow from operations/Average total assets) 600/((4,000 + 6,000)/2)\n= 12%"},{"id":"2-1-62","set":"2-1","number":62,"stem":"Under the revaluation model, an initial revaluation that increases the carrying\namount of assets increases:","options":{"A":"the financial leverage ratio.","B":"other comprehensive income.","C":"current period return on assets."},"answer":"B","topic":"Mixed Topics","page":14,"solution":"assets/solutions/2-1/62.jpg","confidence":"ocr","explanation":"because if a revaluation initially increases the carrying amount of the asset class, the increase in the\ncarrying amount of the asset class bypasses the income statement and goes directly to equity under the heading of\nrevaluation surplus, which would be indicated by an increase in other comprehensive income."},{"id":"2-1-63","set":"2-1","number":63,"stem":"Fully automated robo-advisers are most likely.","options":{"A":"used to implement a passive investment approach.","B":"subject to less regulatory scrutiny than traditional investment advisers.","C":"suitable for investors owning complex portfolios with many different types of\nassets."},"answer":"A","topic":"Portfolio Management","page":14,"solution":"assets/solutions/2-1/63.jpg","confidence":"ocr","explanation":"because although their analyses and recommendations can cover both active and passive management\nstyles, most robo-advisers follow a passive investment approach. These robo-advisers typically have low fees and\nlow account minimums, implementing their recommendations with low-cost, diversified index mutual funds or\n‘exchange-traded funds (ETFs). Furthermore, fully automated digital wealth managers offer a low-cost solution to\ninvesting and recommend an investment portfolio, which is often composed of ETFs. The service package may\ninclude direct deposits, periodic rebalancing, and dividend reinvestment options"},{"id":"2-1-64","set":"2-1","number":64,"stem":"A disadvantage of using the concentration ratio to measure market power is that\nit:","options":{"A":"is difficult to compute.","B":"does not directly quantify market power.","C":"is affected by mergers among market participants."},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-1/64.jpg","confidence":"ocr","explanation":"because the disadvantage [of the concentration ratio] is that it does not directly quantify market power."},{"id":"2-1-65","set":"2-1","number":65,"stem":"A market structure characterized by homogeneous/standardized product\ndifferentiation is best described as:","options":{"A":"monopoly.","B":"monopolistic competition.","C":"perfect competition and oligopoly."},"answer":"C","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-1/65.jpg","confidence":"ocr","explanation":". Perfect competition and oligopoly are characterized by homogeneous/standardized product differentiation.\nMarket Structure Degree of Product Differentiation\nPerfect competition Homogeneous/standardized\nMonopolistic competition Differentiated\nOligopoly Homogeneous/standardized\nMonopoly Unique product\n\nThe Firm and Market Structures\n= describe characteristics of perfect competition, monopolistic competition, oligopoly, and pure monopoly"},{"id":"2-1-66","set":"2-1","number":66,"stem":"Capital restrictions most likely.","options":{"A":"allow capital to earn the highest return.","B":"help a country exercise control over its external balance.","C":"lead to a higher rate of growth than would otherwise occur."},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-1/66.jpg","confidence":"ocr","explanation":"because by limiting the free flow of capital, controls provide a way to exercise control over a country's\nexternal balance whereas more traditional macro-policy tools are used to address other objectives."},{"id":"2-1-67","set":"2-1","number":67,"stem":"The long-run marginal cost schedule serves as a firm's supply curve under a(n):","options":{"A":"oligopoly market.","B":"perfectly competitive market.","C":"monopolistically competitive market."},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-1/67.jpg","confidence":"ocr","explanation":"because the long-run marginal cost schedule is the perfectly competitive firm's supply curve."},{"id":"2-1-68","set":"2-1","number":68,"stem":"An analyst gathers the following company P/E ratios:\n8  13  3  12  8  10\nFor the data given, the:","options":{"A":"median is greater than the mode.","B":"mode is greater than the arithmetic mean.","C":"arithmetic mean is greater than the median."},"answer":"A","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-1/68.jpg","confidence":"ocr","explanation":"because the median of the data is equal to 9, which is greater than the mode of 8. The median is the value\nof the middle item of a set of items that has been sorted into ascending or descending order. In an even-numbered\nsample, we define the median as the mean of the values of items occupying the n/2 and (n + 2)/2 positions (the\ntwo middle items). The items when sorted into ascending order are 3, 8, 8, 10, 12, 13. Hence, the median is (8 +\n10)/2 = 9 since there are an even number of items. The mode is the most frequently occurring value in a\ndistribution. Hence, the mode for the data given is 8 since this is the only value occurring twice."},{"id":"2-1-69","set":"2-1","number":69,"stem":"Under US GAAP, material income items that are unusual and infrequent are\nshown as part of.","options":{"A":"continuing operations and presented separately.","B":"continuing operations and not presented separately.","C":"non-operating activities and not presented separately."},"answer":"A","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-1/69.jpg","confidence":"ocr","explanation":"because under US GAAP, material items that are unusual or infrequent are shown as part of a company's\ncontinuing operations but are presented separately."},{"id":"2-1-70","set":"2-1","number":70,"stem":"All else being equal, if interest expense is not tax deductible, as a company's\nmarginal tax rate increases, the company's WACC:","options":{"A":"decreases.","B":"remains the same.","C":"increases."},"answer":"B","topic":"Financial Statement Analysis","page":16,"solution":"assets/solutions/2-1/70.jpg","confidence":"ocr","explanation":"because taking the sources of capital to be common stock, preferred stock, and debt and allowing for the\nfact that in some jurisdictions, interest expense may be tax deductible, the expression for WACC is\nWACC = wera(1 — f) + Wpfp + Were\nwhere tis the marginal tax rate.\nGiven that the stem states that interest expense is not tax deductible, there should be no adjustment to the before-\ntax cost of debt, and WACC = Ward + Wpfp + Were. Thus, all else being equal, a change in the marginal tax rate\nwould have no impact on the company's WACC."},{"id":"2-1-71","set":"2-1","number":71,"stem":"An analyst wants to test the mean difference between two normally distributed\npopulations using dependent samples. If the population variances are unknown,\nthe most appropriate hypothesis test is a:","options":{"A":"chi-square test.","B":"paired comparisons t-test.","C":"t-test with a pooled estimator of the common variance."},"answer":"B","topic":"Quantitative Methods","page":16,"solution":"assets/solutions/2-1/71.jpg","confidence":"ocr","explanation":"because when we want to conduct tests on two means based on samples that we believe are dependent,\nthese methods apply. The ¢-test is based on data arranged in paired observations, and the test itself is sometimes\ncalled a paired comparisons test"},{"id":"2-1-72","set":"2-1","number":72,"stem":"Which of the following is a common source of financing for an early-stage\nstart-up with minimal revenue?","options":{"A":"Debt.","B":"Equity through public markets.","C":"Equity through venture capital."},"answer":"C","topic":"Alternative Investments","page":16,"solution":"assets/solutions/2-1/72.jpg","confidence":"ocr","explanation":"because the company must raise capital, and since the timing and potential for cash flow generation are\nhighly uncertain, it will generally raise equity rather than debt. Equity for start-ups is usually sourced privately (e.g.\nthrough venture capital rather than in public markets through an IPO), in part because many stock exchange listing\nrequirements include minimum profitability levels, which most start-ups have yet to achieve. At this early stage, debt\ncapital is typically not available or available only at a high cost. Most lenders require stable and positive cash flow to\nservice debt and/or collateral to secure it. An early-stage company often has neither, making it a high-risk prospect\nto lenders.\n\nCapital Structure\n\n= explain factors affecting capital structure and the weighted-average cost of capital"},{"id":"2-1-73","set":"2-1","number":73,"stem":"When conducting an executive remuneration policy review, one warming sign\nthat warrants additional scrutiny is most likely.","options":{"A":"payout provisions linked to strategic milestones.","B":"variable payouts over multiple years when company results vary.","C":"compensation consisting solely of base salary and cash bonuses."},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/2-1/73.jpg","confidence":"ocr","explanation":"because the program doesn't include equity incentive, which means there is little alignment with\nshareholders interests. If a plan offers only cash-based payouts and no equity, there may be a misalignment of\nincentives between executives and investors unless management already owns a significant stake in the company.\n\nCorporate Governance: Conflicts, Mechanisms, Risks, and Benefits\n\n= describe potential risks of poor corporate govemance and stakeholder management and benefits of effective\ncorporate governance and stakeholder management"},{"id":"2-1-74","set":"2-1","number":74,"stem":"Which of the following is a non-probability sampling method?","options":{"A":"Cluster sampling.","B":"Convenience sampling.","C":"Stratified random sampling."},"answer":"B","topic":"Quantitative Methods","page":16,"solution":"assets/solutions/2-1/74.jpg","confidence":"ocr","explanation":"because non-probability sampling methods rely not on a fixed selection process but instead on a\nresearcher's sample selection capabilities. One of the non-probability sampling methods is Convenience Sampling:\nIn this method, an element is selected from the population based on whether or not it is accessible to a researcher\n‘or on how easy it is for a researcher to access the element."},{"id":"2-1-75","set":"2-1","number":75,"stem":"The tendency to classify information based on past experiences and known\nclassifications best defines:","options":{"A":"confirmation bias.","B":"conservatism bias.","C":"representativeness bias."},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/2-1/75.jpg","confidence":"ocr","explanation":"because representativeness bias refers to the tendency to classify information based on past experiences\nand known classifications.\n\nIntroduction to Financial Statement Modeling\n\n= explain how behavioral factors affect analyst forecasts and recommend remedial actions for analyst biases"},{"id":"2-1-76","set":"2-1","number":76,"stem":"According to the static trade-off theory of capital structure, the value of a levered\ncompany is reduced by:","options":{"A":"the present value of inherent tax shields only.","B":"the present value of costs of financial distress only.","C":"both the present value of inherent tax shields and the present value of costs of\nfinancial distress."},"answer":"B","topic":"Corporate Issuers","page":17,"solution":"assets/solutions/2-1/76.jpg","confidence":"ocr","explanation":"because we can write the value of a leveraged company as V, = Vy + {D — PV(Costs of financial distress),\nwhere V, = the value of a levered company, Vy = the value of an unlevered company, tD = the value of the tax\nshield provided by debt, and the last term is the present value of the costs of financial distress. This equation\nrepresents the static trade-off theory of capital structure, which results in an optimal capital structure that is\nsomewhere less than 100% debt."},{"id":"2-1-77","set":"2-1","number":77,"stem":"An investor's transactions in a mutual fund and the fund's returns over a 4-year\nperiod are provided in the following table:\nYear                                          1     2     3     4\nNew investment at the beginning of the year (USD)   2,500  1,500  1,000   0\nInvestment return for the year                  -20%  65%  -25%  10%\nWithdrawal by investor at the end of the year (USD)    0    -500   -500    0\nBased on this data, the money-weighted return (or internal rate of return) for the\ninvestor is closest to:","options":{"A":"2.15%.","B":"3.96%.","C":"7.50%."},"answer":"B","topic":"Corporate Issuers","page":17,"solution":"assets/solutions/2-1/77.jpg","confidence":"ocr","explanation":".\nYear 1 2 3 4\nStarting balance (USS) 0.00 2,000.00 5,275.00 4,206.25\nNew investment at the beginning of the year (US$) 2,500.00 1,500.00 1,000.00 0.00\nNet balance at the beginning of year (US$) 2,500.00 3,500.00 6,275.00 4,206.25\nInvestment retum for the year -20% 65%  -25% 10%\nInvestment gain (loss) (US$) 500.00 2,275.00 1,568.75 420.63\nWithdrawal by investor at the end of the year (US$) 0.00 -500.00 ~-500.00 0.00\nBalance at the end of year (US$) 2,000.00 5,275.00 4,206.25 4,626.88\nThe money-weighted return is calculated by solving for ‘in the following equation\n2, 500 = =! 4 50 4 500, 402688\n7 aa\" aa * G40? * aaa\nCF = -2,500\nCF, =—1,500 (new investment beginning of Year 2)\nCF, = 500 (withdrawal of 500, end of Year 2; -1,000 new investment beginning Year 3)\nCF, = 500 (withdrawal of 500, end of Year 3)\nCF, = 4,626.88 (balance at end of Year 4)\ni= 0.0396"},{"id":"2-1-78","set":"2-1","number":78,"stem":"Which of the following is a secondary source of liquidity for a company?","options":{"A":"Trade credit","B":"Bank line of credit","C":"Bankruptcy protection and reorganization."},"answer":"C","topic":"Mixed Topics","page":17,"solution":"assets/solutions/2-1/78.jpg","confidence":"ocr","explanation":"because secondary sources used by companies include filing for bankruptcy protection and reorganization.\n\nWorking Capital and Liquidity\n\n= explain liquidity and compare issuers’ liquidity levels"},{"id":"2-1-79","set":"2-1","number":79,"stem":"The liquidity premium is 2% and the real risk-free interest rate is 4%. According\nto economic theory, the rate that only reflects the time preferences of individuals\nfor current versus future real consumption is:","options":{"A":"2%.","B":"4%.","C":"6%."},"answer":"B","topic":"Mixed Topics","page":17,"solution":"assets/solutions/2-1/79.jpg","confidence":"ocr","explanation":"because the real risk-free interest rate (here 4%) is the single-period interest rate for a completely risk-free\nsecurity if no inflation were expected. In economic theory, the real risk-free rate reflects the time preferences of\nindividuals for current versus future real consumption"},{"id":"2-1-80","set":"2-1","number":80,"stem":"Which of the following components of a defined benefit pension plan is included\nin net income?","options":{"A":"Remeasurements only.","B":"Employees' service costs only.","C":"Both remeasurements and employees' service costs."},"answer":"B","topic":"Mixed Topics","page":17,"solution":"assets/solutions/2-1/80.jpg","confidence":"ocr","explanation":"because under IFRS, the change in the net pension asset or liability each period is viewed as having three\ngeneral components. Two of the components of this change are recognized as pension expense in profit and loss:\n(1) employees’ service costs and (2) the net interest expense or income accrued on the beginning net pension\nasset or liability. The third component of the change in the net pension asset or liability during a period\n—‘remeasurements’— is recognised in other comprehensive income."},{"id":"2-1-81","set":"2-1","number":81,"stem":"Which of the following actions is most likely considered expansionary fiscal\npolicy? A cut in:","options":{"A":"public spending.","B":"personal income tax rates.","C":"reserve requirements for banks."},"answer":"B","topic":"Financial Statement Analysis","page":18,"solution":"assets/solutions/2-1/81.jpg","confidence":"ocr","explanation":"because an expansionary policy could take one or more of the following forms: Cuts in personal income\ntax raise disposable income with the objective of boosting aggregate demand."},{"id":"2-1-82","set":"2-1","number":82,"stem":"Which of the following statements about the use of financial ratios is most\naccurate?","options":{"A":"Each financial ratio is relevant to all industries.","B":"Financial ratios can be affected by the phase of the business cycle.","C":"Aggregate financial ratios are useful for companies operating in different\nlines of business."},"answer":"B","topic":"Economics","page":18,"solution":"assets/solutions/2-1/82.jpg","confidence":"ocr","explanation":"because both financial ratios [for cyclical companies] tend to improve when the economy is strong and\nweaken during recessions. Therefore, financial ratios should be examined in light of the current phase of the\nbusiness cycle"},{"id":"2-1-83","set":"2-1","number":83,"stem":"Which of the following stakeholders in a mature company would most likely\ntolerate higher risks in return for higher return potential?","options":{"A":"Debtholders.","B":"Shareholders.","C":"Independent directors."},"answer":"B","topic":"Mixed Topics","page":18,"solution":"assets/solutions/2-1/83.jpg","confidence":"ocr","explanation":"because shareholders seek to maximize residual cash flows, or firm profits, once other obligations are met\nSince these investors lose their entire investment in the case of insolvency but have unlimited upside return\npotential, they prefer that management pursue projects with greater calculated risks and higher potential returns\nwhile maximizing the use of debt financing. Additionally, shareholders can demand higher cash dividends, which\ncan increase leverage, thereby increasing risk for debt investors"},{"id":"2-1-84","set":"2-1","number":84,"stem":"An analyst gathers the following information about a company's fiscal year.\nNet income                                                 £45,000,000\n\nPreferred dividends                                           £5,000,000\n\nConvertible bonds outstanding during the year                  £40,000,000\nWeighted average number of common shares outstanding                                                               12,000,000   during the year\nInterest rate on convertible bonds                         10%\n\nIncome tax rate                                     25%\nIf the bonds are convertible into 2,000,000 common shares and there are no other\npotentially dilutive securities outstanding, reported diluted EPS is closest to:","options":{"A":"£2.93.","B":"£3.07.","C":"£3.43."},"answer":"B","topic":"Fixed Income","page":18,"solution":"assets/solutions/2-1/84.jpg","confidence":"ocr","explanation":"because the formula to calculate diluted EPS using the if-converted method is (net income — preferred\ndividends + after-tax interest on convertible debt)/(weighted average number of shares outstanding + additional\ncommon shares that would have been issued at conversion). Diluted EPS is calculated as if the convertible debt\nhad been converted at the beginning of the period. The after-tax interest on the convertible debt is equal to (1 — tax\nrate) x interest expense, or in this case (£40,000,000 x 0.10) x (1 - 0.25) = £4,000,000 x 0.75 = £3,000,000. The\ncalculation for diluted EPS becomes (net income of £45,000,000 — preferred dividends of £5,000,000 + after-tax\ninterest of £3,000,000)/(weighted average number of common shares outstanding of 12,000,000 + additional\ncommon shares issued at conversion of 2,000,000) = (£43,000,000/14,000,000) = £3.07.\nBasic EPS is (net income — preferred dividends)/(weighted average number of common shares outstanding) =\n(£45,000,000 — £5,000,000)/12,000,000 = £3.33.\nSince diluted EPS is lower than basic EPS, the convertible bonds are dilutive and reported diluted EPS is £3.07."},{"id":"2-1-85","set":"2-1","number":85,"stem":"An analyst gathers the following information (in $ thousands)about a company:\nBeginning retained earnings  1,500\n\nEnding retained earnings     2,000\n\nDividends declared and paid   400\nIf there are no other items affecting shareholders' equity, net income (in\n$ thousands)is:","options":{"A":"100.","B":"500.","C":"900."},"answer":"C","topic":"Mixed Topics","page":19,"solution":"assets/solutions/2-1/85.jpg","confidence":"ocr","explanation":"because ending retained earnings = beginning retained earnings + net income — dividends; 2,000 = 1,500\n+ net income — 400; net income = 900.\n\nAnalyzing Statements of Cash Flows |\n\n= describe how the cash flow statement is linked to the income
