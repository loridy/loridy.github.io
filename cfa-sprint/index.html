olios used earlier to demonstrate put-\ncall parity, as follows: At t = 0, an investor purchases a calll option (co) on the same underlying with an exercise\nprice of X and a risk-free bond that pays X at t = T. This portfolio is called the fiduciary call"},{"id":"3-1-01","set":"3-1","number":1,"stem":"Joyce La Valle, CFA, is a portfolio manager at a global bank. La Valle has been told\nshe should use a specific vendor for equity investment research that has been\napproved by the bank's headquarters. Because La Valle is located in a country\ndifferent from the bank's headquarters, she is uncomfortable with the validity of the\nresearch provided by this vendor when it applies to her country and would like to use\na local vendor on whom she has already conducted due diligence. Which research\nvendor(s)should La Valle use to avoid violating the Standards?","options":{"A":"The local research vendor","B":"The bank-approved research vendor","C":"Both the local and the bank-approved research vendors."},"answer":"A","topic":"Ethics","page":1,"solution":"assets/solutions/3-1/01.jpg","confidence":"ocr","explanation":"because when a member has reason to suspect that either secondary or third-party research or\ninformation comes from a source that lacks a sound basis, the member must not rely on that information as\nrequired by Standard V(A), Diligence and Reasonable Basis."},{"id":"3-1-02","set":"3-1","number":2,"stem":"Which of the following is consistent with the Standards?\nStatement 1: \"An IPS should address the client's return requirements.\"\nStatement 2: \"Personal data such as age and occupation are required to provide\ninvestment advice.\"\nStatement 3: \"Clients are primarily responsible for determining if investments\nare suitable for them if they are in an advisory relationship with\nmembers.\"","options":{"A":"Statement 1 only","B":"Statement 1 and Statement 2 only","C":"Statement 1, Statement 2, and Statement 3"},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/3-1/02.jpg","confidence":"ocr","explanation":"because Statement 1 and Statement 2 are consistent with the Standards.\nStatement 1 is consistent because according to Standard III(C), Suitability, this information should be incorporated\ninto a written investment policy statement (IPS) that addresses the client's return requirements. Statement 2 is\nconsistent because according to Standard !II(C), Suitability, when an advisory relationship exists, members and\ncandidates must gather client information at the inception of the relationship. Such information includes the client's\nfinancial circumstances, personal data (such as age and occupation) that are relevant to investment decisions,\nattitudes toward risk, and objectives in investing"},{"id":"3-1-03","set":"3-1","number":3,"stem":"Asset owners most likely benefit from a firm being GIPS compliant because it:","options":{"A":"eliminates the need for in-depth due diligence only.","B":"facilitates the understanding of the sources of risk and excess return only.","C":"both eliminates the need for in-depth due diligence and facilitates the\nunderstanding of the sources of risk and excess return"},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/3-1/03.jpg","confidence":"ocr","explanation":"because, where asset owners require their external managers to comply with the GIPS standards,\nreporting to the oversight body using the same principles facilitates the understanding of the sources of risk and\nexcess return in the funds under supervision. Asset owners provide performance information to their oversight\nbodies that allows them to make investment decisions and evaluate the performance of the funds under their\nsupervision"},{"id":"3-1-04","set":"3-1","number":4,"stem":"Which of the following is not a requirement of the GIPS standards? Firms are\nrequired to:","options":{"A":"have their performance records verified by an independent third party","B":"include all discretionary, fee-paying portfolios in at least one composite","C":"present a minimum of five years of annual investment performance compliant\nwith GIPS standards"},"answer":"A","topic":"Ethics","page":1,"solution":"assets/solutions/3-1/04.jpg","confidence":"ocr","explanation":"because it is a recommendation but not a requirement that firms obtain independent third-party verification\nto claim GIPS compliance."},{"id":"3-1-05","set":"3-1","number":5,"stem":"Immediately after taking the CFA Level II exam, Tim Riley posts on social media\nbroad topic areas that were not tested on the exam. He also posts an article on social\nmedia questioning the relevance of CFA Program for professional practice. Has Riley\nviolated the Standards?","options":{"A":"No","B":"Yes, by posting broad topic areas not tested on the exam","C":"Yes, by questioning the relevance of CFA Program for professional practice"},"answer":"B","topic":"Ethics","page":2,"solution":"assets/solutions/3-1/05.jpg","confidence":"ocr","explanation":"because according to Standard VII (A), Conduct as Participants in CFA Institute Programs, examples of\ninformation that cannot be disclosed by candidates sitting for an exam include but are not limited to broad topical\nareas and formulas tested or not tested on the exam. Riley violates this Standard by posting on social media broad\ntopical areas not tested on the exam"},{"id":"3-1-06","set":"3-1","number":6,"stem":"Ming Mei Xu, CFA, who is a well-known analyst issues a buy recommendation on a\nsmall-cap stock. Xu shares her recommendation with the public two days after\ncommunicating the recommendation with her clients. The public dissemination leads\nto a significant increase in the stock price. Trevor Thomas, CFA, one of Xu's clients,\nbuys a large position in the stock. Thomas sells the entire position for a profit a\nmonth later. His action leads to a significant decline in the stock price. Has the\nStandard relating to market manipulation been violated?","options":{"A":"No","B":"Yes, by Xu","C":"Yes, by Thomas"},"answer":"A","topic":"Ethics","page":2,"solution":"assets/solutions/3-1/06.jpg","confidence":"ocr","explanation":"because market manipulation includes (1) the dissemination of false or misleading information and (2)\ntransactions that deceive or would be likely to mislead market participants by distorting the price-setting mechanism\nof financial instruments. The intent of the action is critical to determining whether it is a violation of this standard. In\nthis case, Xu did not have the intent to mislead anyone by publishing the buy recommendation and Thomas\nundertook a legitimate transaction resulting in a profit but that transaction did also not intend to distort the price-\nsetting mechanism. Therefore, both members have complied with the Standard relating to market manipulation"},{"id":"3-1-07","set":"3-1","number":7,"stem":"Max Ohn, CFA, works as a client advisor for a small firm. He has established a\nreferral program with a real estate agency. Ohn refers clients to the real estate agency\nand the real estate agency refers clients to Ohn. Because the real estate agency does\nnot compete with Ohn's employer and because the arrangement benefits Ohn's firm,\nhe omits disclosure of the arrangement to his firm. Ohn diligently discloses the\nreferral arrangement to all referred clients after they become firm clients. Has Ohn\nmost likely violated the Standard relating to referral fees?","options":{"A":"No","B":"Yes, only by omitting disclosure of the arrangement to his firm","C":"Yes, by omitting disclosure of the arrangement to his firm and by disclosing the\nreferral arrangement to referred clients after they become firm clients"},"answer":"C","topic":"Ethics","page":2,"solution":"assets/solutions/3-1/07.jpg","confidence":"ocr","explanation":"because Standard VI (C), Referral Fees, states that members and candidates must disclose to their\n‘employer, clients, and prospective clients, as appropriate, any compensation, consideration, or benefit received\nfrom or paid to others for the recommendation of products or services. Members and candidates must disclose\nwhen they pay a fee or provide compensation to others who have referred prospective clients to the member or\ncandidate. Therefore, Ohn is required to disclose the arrangement to his employer. Further, he is required to\ndisclose the arrangement before, not after, a referral becomes a client: Appropriate disclosure means that members\nand candidates must advise the client or prospective client, before entry into any formal agreement for services, of\nany benefit given or received for the recommendation of any services provided by the member or candidate"},{"id":"3-1-08","set":"3-1","number":8,"stem":"In a client presentation regarding a potential equity investment, a member makes the\nfollowing statements:\nStatement 1: \"This investment will outperform the S&P 500 over a ten-year period.\"\nStatement 2: \"This investment is likely to outperform the market over a one-year\nperiod.\"\nStatement 3: \"With this product's 100% principal protection, our firm guarantees you\nwill not lose money.\"\nThe member has most likely violated the Standards by making:","options":{"A":"Statement 1 only","B":"Statement 1 and Statement 3 only","C":"Statement 1, Statement 2, and Statement 3"},"answer":"A","topic":"Ethics","page":2,"solution":"assets/solutions/3-1/08.jpg","confidence":"ocr","explanation":"because according to Standard | (C), Misrepresentation, members and candidates are prohibited from\nguaranteeing clients any specific return on volatile investments. So Statement 1 is a violation of the Standard\nStatement 3 does not violate the Standards because Standard I(C) does not prohibit members and candidates from\nproviding clients with information on investment products that have guarantees built into the structure of the\nproducts themselves or for which an institution has agreed to cover any losses. Statement 2 does not violate the\nStandards because Standard I(C) prohibits members and candidates from guaranteeing clients any specific return\non volatile investments. It does not prohibit statements regarding probable retums."},{"id":"3-1-09","set":"3-1","number":9,"stem":"According to the Standard relating to loyalty, members must:","options":{"A":"subordinate any personal obligations to their work.","B":"place the interests of their employer below the interests of clients.","C":"refrain from entering into an independent business while still employed."},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/3-1/09.jpg","confidence":"ocr","explanation":"because according to Standard IV (A), Loyalty, members and candidates must always place the interests\nof clients above the interests of their employer."},{"id":"3-1-10","set":"3-1","number":10,"stem":"Tharushi Ranasinghe, CFA, is president of a small investment firm. Most of her\nclients are longtime associates or family members whose investment portfolios she\nhas managed for many years. Ranasinghe is familiar with her clients' investment\nprofiles and is in regular contact with them. Ranasinghe makes appropriate\nadjustment in her clients' portfolios following significant events in their lives. She\nrarely updates her clients' records given her familiarity with their investment\nrequirements. Ranasinghe has most likely violated the Standard(s) relating to:","options":{"A":"fair dealing only.","B":"record retention only.","C":"both fair dealing and record retention."},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/3-1/10.jpg","confidence":"ocr","explanation":"because Standard V(C), Record Retention states, Members and Candidates must develop and maintain\nappropriate records to support their investment analyses, recommendations, actions, and other investment-related\ncommunications with clients and prospective clients. In this case, Ranasinghe has a responsibility as her clients’\nadviser and as the president of her company to maintain appropriate records when client circumstances change\nWithout necessary, relevant, and up-to-date know-your-client information, Ranasinghe would have difficulty\nestablishing and proving that her firm has identified the needs and circumstances of its clients and has taken them\ninto account in recommending investments. So, Ranasinghe has violated this Standard."},{"id":"3-1-11","set":"3-1","number":11,"stem":"To comply with the Standard relating to knowledge of the law, members are required\nto take which of the following actions?\nAction 1 Acquire detailed knowledge of all the laws relating to their activities\nAction 2 Dissociate from activities of others that they believe are unethical","options":{"A":"Action 1 only","B":"Action 2 only","C":"Both Action 1 and Action 2"},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/3-1/11.jpg","confidence":"ocr","explanation":"because according to Standard I(A), Knowledge of the Law, if a member or candidate has reasonable\ngrounds to believe that imminent or ongoing client or employer activities are illegal or unethical, the member or\ncandidate must dissociate, or separate, from the activity. So, members are required to take Action 2"},{"id":"3-1-12","set":"3-1","number":12,"stem":"A member who pays a higher brokerage commission on behalf of all of his clients\nthan he would normally pay, without any corresponding benefit to the client, violates\nthe Standard relating to:","options":{"A":"suitability.","B":"fair dealing","C":"loyalty, prudence, and care."},"answer":"C","topic":"Ethics","page":3,"solution":"assets/solutions/3-1/12.jpg","confidence":"ocr","explanation":"because according to Standard III(A), Loyalty, Prudence, and Care, a member or candidate who pays a\nhigher brokerage commission than he or she would normally pay to allow for the purchase of goods or services,\nwithout corresponding benefit to the client, violates the duty of loyalty to the client."},{"id":"3-1-13","set":"3-1","number":13,"stem":"Kathy Lau, CFA, is a portfolio manager. After a comprehensive analysis, Lau buys\nTop Technology Company (TTC) IPO for all her clients for whom the investment is\nappropriate, including her brother's fee-paying account. Lau does not have beneficial\nownership in her brother's account. Has Lau violated the Standards by buying shares\nfor her brother's account?","options":{"A":"No","B":"Yes, the Standard relating to disclosure of conflicts","C":"Yes, the Standard relating to priority of transactions"},"answer":"A","topic":"Ethics","page":3,"solution":"assets/solutions/3-1/13.jpg","confidence":"ocr","explanation":"because according to Standard VI(B), Priority of Transactions, family accounts that are client accounts\nshould be treated like any other firm account and should neither be given special treatment nor be disadvantaged\nbecause of the family relationship.\n\nIn addition, according to Standard VI(A), Disclosure of Conflicts, members and candidates must make full and fair\ndisclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere\nwith respective duties to their clients, prospective clients, and employer. Members and candidates must ensure that\nsuch disclosures are prominent, are delivered in plain language, and communicate the relevant information\neffectively.\n\nLau should treat her brother's account fee-paying like any other firm account. Therefore, Lau has not violated to\nStandard Vi(B) and Standard VI(A)."},{"id":"3-1-14","set":"3-1","number":14,"stem":"All clients of John Chapman, CFA, are standard fee-paying clients. Chapman\nbelieves that half of his clients would benefit from premium service in exchange for\nhigher fees. He offers the premium service only to these clients. Later that day,\nChapman distributes an investment recommendation only to those clients for whom\nhe deems it suitable. Has Chapman violated the Standard relating to fair dealing?","options":{"A":"No","B":"Yes, by offering the premium service only to clients he believes would benefit\nfrom it","C":"Yes, by distributing an investment recommendation only to those clients for\nwhom he deems it suitable"},"answer":"B","topic":"Ethics","page":4,"solution":"assets/solutions/3-1/14.jpg","confidence":"ocr","explanation":"because according to Standard III(B), Fair Dealing, the different service levels should be disclosed to\nclients and prospective clients and should be available to everyone (ie, different service levels should not be\noffered selectively). By offering the premium service only to those clients he believes may want them, rather than to\nall clients, Chapman violates the Standard"},{"id":"3-1-15","set":"3-1","number":15,"stem":"According to the GIPS standards, a firm must:.","options":{"A":"provide a GIPS composite report to all prospective clients.","B":"include terminated composites on the firm's list of composite descriptions for at\nleast seven years after the composite termination date.","C":"attain compliance for a minimum of three years or since firm inception if the\nfirm has been in existence for less than three years to initially claim compliance."},"answer":"A","topic":"Ethics","page":4,"solution":"assets/solutions/3-1/15.jpg","confidence":"ocr","explanation":"because according to the GIPS standards, firms must make every reasonable effort to provide a GIPS\ncomposite report to all prospective clients when they initially become prospective clients. Firms must not choose to\nwhich prospective clients it presents a GIPS composite report."},{"id":"3-1-16","set":"3-1","number":16,"stem":"Which of the following parties can perform verification of a firm's claim of\ncompliance with the GIPS standards?","options":{"A":"CFA Institute","B":"An internal auditor of the firm","C":"An independent third-party consultant"},"answer":"C","topic":"Ethics","page":4,"solution":"assets/solutions/3-1/16.jpg","confidence":"ocr","explanation":"because according to GIPS standards, once a firm claims compliance with the Standards, they may\nvoluntarily hire an independent third party to perform a verification in order to increase confidence in the firm's claim\nof compliance. Therefore, only an independent third-party consultant can perform verification of a firm's claim of\ncompliance with the GIPS standards"},{"id":"3-1-17","set":"3-1","number":17,"stem":"Which of the following is a violation of the Standards when local laws require firms\nto maintain client confidentiality? A member:","options":{"A":"discloses information relating to illegal activities of a client to local authorities","B":"refuses to share details of a prospective client with his firm's marketing\ndepartment","C":"refuses to disclose information about a client during an investigation by the CFA\nInstitute Professional Conduct Program"},"answer":"A","topic":"Ethics","page":4,"solution":"assets/solutions/3-1/17.jpg","confidence":"ocr","explanation":"because according to Standard III(E), Preservation of Confidentiality, if applicable law requires members\nand candidates to maintain confidentiality, even if the information concerns illegal activities on the part of the client,\nmembers and candidates should not disclose such information. Therefore, the member has violated Standard III(E)\nby disclosing information relating to illegal activities of a client to local authorities."},{"id":"3-1-18","set":"3-1","number":18,"stem":"The Standards are most likely designed to foster and reinforce a culture of:","options":{"A":"service to the firm.","B":"regulatory compliance.","C":"responsibility and professionalism."},"answer":"C","topic":"Ethics","page":4,"solution":"assets/solutions/3-1/18.jpg","confidence":"ocr","explanation":"because the Standards are designed to foster and reinforce a culture of responsibility and professionalism.\nThey apply to all members and candidates regardless of title, position, occupation, geographic location, or specific\nsituation, and they apply to all professional activities of investment professionals.\n\nEthics and Trust in the Investment Profession\n\n= describe the role of a code of ethics in defining a profession"},{"id":"3-1-19","set":"3-1","number":19,"stem":"Which of the following policy recommendations is consistent with the Standards?\nInvestment banking personnel should approve any changes   Recommendation 1                           in investment recommendations from the research side.\nFirewalls should separate reporting structures for personnel\nRecommendation 2  on the research side and personnel on the investment\nbanking side.\nCompensation arrangements should link research analyst\nRecommendation 3  remuneration directly to investment banking assignments in\nwhich analysts may participate as team members.","options":{"A":"Recommendation 1","B":"Recommendation 2","C":"Recommendation 3"},"answer":"B","topic":"Ethics","page":5,"solution":"assets/solutions/3-1/19.jpg","confidence":"ocr","explanation":"because according to Standard | (B), Independence and Objectivity, members, candidates, and their firms\nmust adopt and follow perceived best practices in maintaining independence and objectivity in the corporate culture\nand protecting analysts from undue pressure by their investment banking colleagues. The firewalls traditionally built\nbetween these two functions must be managed to minimize conflicts of interest; indeed, enhanced firewall policies\nmay go as far as prohibiting all communications between these groups. A key element of an enhanced firewall is\nseparate reporting structures for personnel on the research side and personnel on the investment banking side"},{"id":"3-1-20","set":"3-1","number":20,"stem":"Nidhi Mehta, CFA, is a fund manager at XYZ Investments. Mehta's fund delivers\nexcellent returns for the year. A large investor in the fund offers Mehta cash\ncompensation along with free tickets to the opening night of a sold-out opera as a\nreward for the fund's performance. Firm policy requires employees to inform\nsupervisors about monetary compensation received from clients. Mehta does not\ninform her supervisor as she only accepts the tickets and not the cash compensation.\nHas Mehta violated the Standards?","options":{"A":"No","B":"Yes, the Standard relating to fair dealing","C":"Yes, the Standard relating to additional compensation arrangements"},"answer":"C","topic":"Ethics","page":5,"solution":"assets/solutions/3-1/20.jpg","confidence":"ocr","explanation":"because according to Standard IV(B), Additional Compensation Arrangements, members and Candidates\nmust not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected\nto create a conflict of interest with their employer's interest unless they obtain written consent from all parties\ninvolved. Mehta needs written consent prior from all parties to accepting the tickets"},{"id":"3-1-21","set":"3-1","number":21,"stem":"Frank Schneider, CFA, a securities analyst, applies for a new position. In his\napplication, he makes two statements:\nStatement 1      I passed all three CFA examinations in three consecutive attempts.\nBased on my success in the CFA Program, I have a superior ability to Statement 2                 analyze stocks compared to my peers\nSchneider has most likely violated the Standards by making:","options":{"A":"Statement 1 only","B":"Statement 2 only","C":"Both Statement 1 and Statement 2"},"answer":"B","topic":"Ethics","page":5,"solution":"assets/solutions/3-1/21.jpg","confidence":"ocr","explanation":"because Statement 2 links passing the three examinations on the first try with superior ability, which is a\nViolation of Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program. Members may\nstate that they passed the three examinations on their first try as long as this statement is true, but it must not be\nlinked to performance or imply superior ability."},{"id":"3-1-22","set":"3-1","number":22,"stem":"Colin Gifford, CFA, is finalizing a monthly newsletter to his clients, who are\nprimarily individual investors. Many of the clients' accounts hold the common stock\nof Capricorn Technologies. In the newsletter, Gifford writes, \"Based upon the next\nsix month's earnings of $1.50 per share and a 10% increase in the dividend, the price\nof Capricorn's stock will be $22 per share by the end of the year. \"Regarding his\nstock analysis, the least appropriate action Gifford should take to avoid violating the\nStandards would be to:","options":{"A":"separate fact from opinion.","B":"include earnings estimates.","C":"identify limitations of the analysis."},"answer":"B","topic":"Ethics","page":6,"solution":"assets/solutions/3-1/22.jpg","confidence":"ocr","explanation":"because while pro forma analysis may be standard industry practice, it is not required by the Standards\nEamings estimates are opinions and must be clearly identified as such."},{"id":"3-1-23","set":"3-1","number":23,"stem":"Which of the following are among the recommended procedures that enable\nmembers to meet their obligations under the Standard relating to performance\npresentation?\nMembers should include terminated accounts while presenting     Procedure 1                  performance history.\nProcedure Members should use a single representative account     Procedure 2                     to present the performance of each investment strategy.","options":{"A":"Procedure 1 only","B":"Procedure 2 only","C":"Both Procedure 1 and Procedure 2"},"answer":"A","topic":"Ethics","page":6,"solution":"assets/solutions/3-1/23.jpg","confidence":"ocr","explanation":"because members and candidates can also meet their obligations under Standard III(D), Performance\nPresentation, by including terminated accounts as part of performance history with a clear indication of when the\naccounts were terminated. Terminated accounts should be included in the performance presentation."},{"id":"3-1-24","set":"3-1","number":24,"stem":"Jacques Lagarde, CFA, is a sell-side analyst at Springhill Financial, a small\ninvestment bank. Springhill is the lead manager for the equity offering of Chorale\nMusic. Lagarde is not part of the IPO team for this offering. While finalizing a\nresearch report on Chorale, Lagarde discovers inconsistencies that makes him\nbelieve the company may have concealed losses in its leasing division last quarter\nthat would significantly reduce its earnings. Lagarde suspects that Springhill's\ninvestment banking team is aware of these unreported losses. The prospectus for\nChorale's equity offering has already been approved by regulators and distributed to\npotential investors. According to the Standards, Lagarde should most likely:","options":{"A":"report the issue to his supervisor.","B":"issue a report showing the leasing division losses.","C":"issue the report using data as reported in the prospectus."},"answer":"A","topic":"Ethics","page":6,"solution":"assets/solutions/3-1/24.jpg","confidence":"ocr","explanation":"because Lagarde has potentially uncovered material omissions that would impact Chorale’s IPO, and,\naccording to Standard I(A), Knowledge of the Law, the most appropriate first step would be to report this issue to\nhis supervisor. This issue should be investigated more fully. If the losses are confirmed, Lagarde should insist that\nthese losses be made public."},{"id":"3-1-25","set":"3-1","number":25,"stem":"According to the recommended procedures for compliance with the Standard relating\nto responsibilities of supervisors, a member in a supervisory position should:","options":{"A":"incorporate a professional conduct evaluation as part of an employee's\nperformance review.","B":"rely on an employee's statement about the extent of a violation of the law if the\nemployee gives written assurance that the wrongdoing will not reoccur.","C":"implement the CFA Institute Code and Standards in her department if she cannot\ndischarge supervisory responsibilities because of inadequate compliance system."},"answer":"A","topic":"Ethics","page":6,"solution":"assets/solutions/3-1/25.jpg","confidence":"ocr","explanation":"because according to the recommended procedures for compliance with Standard IV(C), Responsibilities\nof Supervisors, once a compliance program is in place, a supervisor should incorporate a professional conduct\nevaluation as part of an employee's performance review."},{"id":"3-1-26","set":"3-1","number":26,"stem":"Abdul Naib, CFA, was recently asked by his employer to submit an updated\ndocument providing the history of his employment and qualifications. The existing\ndocument on file was submitted when he was hired five years ago. His employer\nnotices that the updated version shows that Naib obtained his Masters of Business\nAdministration (MBA) two years ago, while the earlier version indicated he had\nalready obtained his MBA. As the position Naib was hired for required a minimum\nqualification of an MBA, Naib is asked to explain the discrepancy. He justifies his\nactions by stating,\" I knew you wouldn't hire me if I didn't have an MBA degree but I\nalready had my CFA designation. Knowing you required an MBA, I went back to\nschool on a part-time basis after I was hired to obtain it. I graduated at the top of my\nclass, but this shouldn't come as any surprise, as you have seen evidence I passed all\nof my CFA exams on the first attempt.\" Did Naib most likely violate the Standards?","options":{"A":"No","B":"Yes, the Standard relating to misconduct","C":"Yes, the Standard relating to reference to CFA Institute, the CFA Designation,\nand the CFA Program"},"answer":"B","topic":"Ethics","page":7,"solution":"assets/solutions/3-1/26.jpg","confidence":"ocr","explanation":"because Naib knowingly misrepresented his qualifications by stating he had obtained an MBA degree at\nthe time of his hire when in fact he had not. This reflects adversely on his professional integrity, violating Standard\n\\(D), Misconduct. Stating that he passed his CFA exams in three consecutive years is not a violation of Standard\nVII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, if it is factual. There is no evidence\ngiven to indicate he did not pass as claimed"},{"id":"3-1-27","set":"3-1","number":27,"stem":"Suni Kioshi, CFA, is an analyst at Pacific Asset Management, where she covers\nsmall capitalization companies. On her own time, Kioshi often speculates in low\nprice thinly traded stocks for her own account. Over the last three months, Kioshi has\npurchased 50,000 shares of Basic Biofuels Company giving her a 5% ownership\nstake. A week after this purchase, Kioshi is asked to write a report on stocks in the\nbiofuels industry with a request to complete the report within two days. Kioshi wants\nto rate Basic as a \"buy\" in this report but is uncertain how to proceed. Concerning the\nresearch report, what action should Kioshi most likely take to prevent violating any\nof the Standards?","options":{"A":"Sell her shares","B":"Don't recommend a buy","C":"Disclose her stock ownership"},"answer":"C","topic":"Ethics","page":7,"solution":"assets/solutions/3-1/27.jpg","confidence":"ocr","explanation":"because the manager's ownership stake is a potential conflict of interest, which should be disclosed as\nrequired by Standard VI(A), Disclosure of Conflicts"},{"id":"3-1-28","set":"3-1","number":28,"stem":"Which of the following tools is available to implement monetary policy?","options":{"A":"Indirect tax rates","B":"Corporate tax rates","C":"Open market operations"},"answer":"C","topic":"Financial Statement Analysis","page":7,"solution":"assets/solutions/3-1/28.jpg","confidence":"ocr","explanation":"because central banks have three primary tools available to them: open market operations, the refinancing\nrate, and reserve requirements.\n\nMonetary Policy\n\n= describe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the\n\nrelationships between monetary policy and economic growth, inflation, interest, and exchange rates"},{"id":"3-1-29","set":"3-1","number":29,"stem":"Compared to shareholders in public companies, shareholders in private companies\ntypically:","options":{"A":"have longer holding periods.","B":"can sell their shares more easily.","C":"have less control over management."},"answer":"A","topic":"Equity Investments","page":7,"solution":"assets/solutions/3-1/29.jpg","confidence":"ocr","explanation":"because corporate issuers may issue additional equity shares in the capital markets from time to time. For\npublic issuer, these shares can be traded in the secondary market once they're issued. In contrast, private\ncompanies finance smaller amounts in the primary market (private debt or equity) from fewer investors who typically\nhave longer holding periods"},{"id":"3-1-30","set":"3-1","number":30,"stem":"When analyzing differences between the variances of two normally distributed\npopulations, the most appropriate test is a(n):","options":{"A":"F-test.","B":"chi-square test.","C":"paired comparisons test."},"answer":"A","topic":"Mixed Topics","page":8,"solution":"assets/solutions/3-1/30.jpg","confidence":"ocr","explanation":"because an F-test is the appropriate test statistic concerning differences between the variances of the\npopulations under these conditions."},{"id":"3-1-31","set":"3-1","number":31,"stem":"The following table represents the history of an investment in a company:\nTime               Activity        Price per Share  Dividends Paid per Share\nBeginning of Year 1   Purchase 10 shares      €160\nEnd of Year 1      Purchase 5 shares       €168                €3.00\nEnd of Year 2                 ---             €175                €4.00\nEnd of Year 3         Sell 15 shares         €165                €0.00\nThe investor does not reinvest the dividends received. Ignoring taxes, the\ntime-weighted rate of return on this investment is closest to:","options":{"A":"1.93%.","B":"2.40%.","C":"2.57%."},"answer":"B","topic":"Equity Investments","page":8,"solution":"assets/solutions/3-1/31.jpg","confidence":"ocr","explanation":"because the portfolio value at the beginning and end of each period and the dividends received over the\nthree years are calculated as follows:\nYear 1 Year 2 Year 3\nBeginning value 10 x €160 = €1,600 15 x €168 = €2,520 15 x €175 = €2,625\nEnding value 10 x €168 = €1,680 15 x €175 = €2,625 15 x €165 = €2,475\nDividend received 10x €3.00=€30 15x€400=€60 15x €0.00=€0\nThe holding period return (HPR) for the three years is calculated as follows:\nHPR = (Prat — Pe + Desa)lP\nHPR yeor 1 = (€1,680 - €1,600 + €30)/€1,600 = 6.88%\nHPR yer 2 = (€2,625 - €2,520 + €60)/€2,520 = 6.55%\nHPR yeor 3 = (€2,475 — €2,625)/€2,625 = 5.71%\nThe time-weighted return (TWR) is found by taking the geometric mean of the three holding period returns:\nTWR = [(1 + HPRyear 1) ¥ (1 + HPRyear 2) * (1 + HPRyeor a)\" = 1\nTWR = [(1 + 6.88%) x (1 + 6.55%) x (1 -5.71%)]\" - 1\n= 1.073819 - 1\n= 2.40%\nAlternatively: TWR = {{(€168 + €3)/€160] x [(€175 + €4)/€168] x (€165/€175)}\"? ~ 1 = (1.0688 x 1.0655 x 0.9429)'9\n~1=2.40%"},{"id":"3-1-32","set":"3-1","number":32,"stem":"Substantial government borrowing is less likely to be of concern when:","options":{"A":"the private sector decreases savings to offset the debt.","B":"most of the borrowing is owed internally to local citizens.","C":"the private sector is crowded out to make room for the debt."},"answer":"B","topic":"Mixed Topics","page":8,"solution":"assets/solutions/3-1/32.jpg","confidence":"ocr","explanation":"because the issue of significant debt may be overstated because the debt is owed internally to fellow\ncitizens."},{"id":"3-1-33","set":"3-1","number":33,"stem":"Ensuring that the composition of a board of directors is aligned with a company's\ngovernance principles is most likely a responsibility of the:","options":{"A":"risk committee.","B":"audit committee.","C":"nominating committee."},"answer":"C","topic":"Mixed Topics","page":8,"solution":"assets/solutions/3-1/33.jpg","confidence":"ocr","explanation":"because the nomination committee can help ensure that the board's composition is well balanced and\naligned with the company’s governance principles.\n\nCorporate Governance: Conflicts, Mechanisms, Risks, and Benefits\n\n= describe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks"},{"id":"3-1-34","set":"3-1","number":34,"stem":"Which of the following most accurately describes a distribution that is more peaked\nthan normal?","options":{"A":"Leptokurtic","B":"Mesokurtic","C":"Platykurtic"},"answer":"A","topic":"Quantitative Methods","page":8,"solution":"assets/solutions/3-1/34.jpg","confidence":"ocr","explanation":"because a distribution that is more peaked than normal is called leptokurtic."},{"id":"3-1-35","set":"3-1","number":35,"stem":"Which of the following statements about dispersion measures is most accurate?","options":{"A":"The range shows how the data are distributed","B":"The variance is expressed in the same unit of measurement as the observations","C":"The number of degrees of freedom in estimating the population variance with\nthe sample variance is equal to the sample size minus one"},"answer":"C","topic":"Mixed Topics","page":8,"solution":"assets/solutions/3-1/35.jpg","confidence":"ocr","explanation":"because, in the formula for the sample variance, the quantity n — 1 is also known as the number of degrees\nof freedom in estimating the population variance, where n is the number of observations in the sample.\n\nStatistical Measures of Asset Returns\n\n= calculate, interpret, and evaluate measures of dispersion to address an investment problem"},{"id":"3-1-36","set":"3-1","number":36,"stem":"Which pricing model combines multiple products so that customers are incentivized\nto buy them together?","options":{"A":"Bundling","B":"Tiered pricing","C":"Value-based pricing"},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/3-1/36.jpg","confidence":"ocr","explanation":"because bundling refers to combining multiple products or services so that customers are incentivized or\nrequired to buy them together. Bundling can be effective, particularly for products that are complementary and that\nhave high incremental profit margins and high marketing costs relative to the cost of the product itself."},{"id":"3-1-37","set":"3-1","number":37,"stem":"The correction of a material error for a prior period is handled by:","options":{"A":"adding a note disclosure regarding the error in the current financial statements\nonly.","B":"restating the financial statements for the prior periods presented in the current\nfinancial statements only.","C":"both adding a note disclosure regarding the error in the current financial\nstatements and restating the financial statements for the prior periods presented\nin the current financial statements."},"answer":"C","topic":"Ethics","page":9,"solution":"assets/solutions/3-1/37.jpg","confidence":"ocr","explanation":"because another possible adjustment is a correction of an error for a prior period (e.g., in financial\nstatements issued for an earlier year). This cannot be handled by simply adjusting the current period income\nstatement. Correction of an error for a prior period is handled by restating the financial statements (including the\nbalance sheet, statement of owners’ equity, and cash flow statement) for the prior periods presented in the current\nfinancial statements. (IAS No. 8, Accounting Policies, Changes in Accounting Estimates and Errors, and FASB ASC\nTopic 250 [Accounting Changes and Error Corrections}) Note disclosures are required regarding the error.\n\nAnalyzing Income Statements\n\n= describe the financial reporting treatment and analysis of non-recurring items (including discontinued operations,\nunusual or infrequent items) and changes in accounting policies"},{"id":"3-1-38","set":"3-1","number":38,"stem":"Which of the following is not generally considered one of the three key\ncharacteristics of Big Data?","options":{"A":"Variety","B":"Volume","C":"Visibility"},"answer":"C","topic":"Mixed Topics","page":9,"solution":"assets/solutions/3-1/38.jpg","confidence":"ocr","explanation":"because the term Big Data typically refers to datasets that have the following characteristics: Volume,\nVelocity, Variety, i.e., visibility is not one of the three characteristics.\n\nIntroduction to Big Data Techniques\n\n= describe Big Data, artificial intelligence, and machine leaming"},{"id":"3-1-39","set":"3-1","number":39,"stem":"Based on the information in the table, which of the following is closest to the\ngeometric mean annual return for the full period of 5 years?\nAnnual Return\nYear 1        -8.0%\nYear 2        -5.5%\nYear 3        -7.2%\nYear 4       20.8%\nYear 5       4.4%","options":{"A":"0.35%","B":"0.90%","C":"1.75%"},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/3-1/39.jpg","confidence":"ocr","explanation":"because the geometric mean annual return is computed multiplicatively as the nth root of the holding\nperiod\nVU 8.0%) x (1 — 5.5%) x I — 7.2%) x (I + 20.8%) x (I + 44%) — 1 = 0.35%"},{"id":"3-1-40","set":"3-1","number":40,"stem":"When constructing a forecast, an analyst with a conservatism bias is most likely to:","options":{"A":"deemphasize new information when updating their forecast.","B":"seek opinions and information that agrees with their forecast.","C":"build complex models using a wide breadth of data to create a forecast."},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/3-1/40.jpg","confidence":"ocr","explanation":"because people with conservatism bias maintain their prior views or forecasts by inadequately\nincorporating new information. This often happens in forecasting when an analyst does not update their forecasting\nafter receiving conflicting information, such as disappointing earnings results or a competitor action"},{"id":"3-1-41","set":"3-1","number":41,"stem":"An investment pays $1,000 at the end of each year in perpetuity, with the first\npayment occurring six years from today. If the discount rate is 9% per year, the\npresent value of the investment today is closest to:","options":{"A":"$4,486.","B":"$6,625.","C":"$7,221."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/3-1/41.jpg","confidence":"ocr","explanation":"because it is the present value of the perpetuity that starts in six years: PV of investment today = (PV of\nperpetuity in 5 years)/(1 + r)°, where PV of perpetuity in 5 years = Air = $1,000/0.09 = $11,111.11. Thus, PV of\ninvestment today = $11,111.11/(1 + 0.09)° = $7,221.46 = $7,221. Calculator solution: N = 5; | = 9%; FV =\n11,111.11; compute PV = 7,221.46.\n\nTime Value of Money in Finance\n\n= calculate and interpret the present value (PV) of fixed-income and equity instruments based on expected future\ncash flows"},{"id":"3-1-42","set":"3-1","number":42,"stem":"A liquidity trap is most closely associated with:","options":{"A":"deflation.","B":"an inelastic demand for money.","C":"a positive nominal central bank policy rate."},"answer":"A","topic":"Economics","page":10,"solution":"assets/solutions/3-1/42.jpg","confidence":"ocr","explanation":"because a liquidity trap arises when the demand for money is infinitely elastic because individuals elect to\nhold additional money balances rather than respond to stimulative rate cuts by spending. As a result, weakening\nconsumption leads to deflation"},{"id":"3-1-43","set":"3-1","number":43,"stem":"An analyst gathered the following information about a stock index:\nMean net income for all companies in the index                   $2.4 million\nStandard deviation of net income for all companies in the index    $3.2 million\nIf the analyst takes a sample of 36 companies from the index, the standard error of\nthe sample mean is closest to:","options":{"A":"$88.889","B":"$400,000.","C":"$533,333."},"answer":"C","topic":"Quantitative Methods","page":10,"solution":"assets/solutions/3-1/43.jpg","confidence":"ocr","explanation":"because the standard error of the sample mean is equal to the population standard deviation (a) divided by\nthe square root of the number of observations in the sample (n)\noy = oly/n = $3, 200, 000/36 = $533, 333\nEstimation and Inference\n= explain the central limit theorem and its importance for the distribution and standard error of the sample mean"},{"id":"3-1-44","set":"3-1","number":44,"stem":"Using long-term debt or equity to finance working capital needs most likely:.","options":{"A":"reduces the cost of financing working capital.","B":"provides the opportunity to borrow only as needed.","C":"reduces the need to access capital markets in times of stress."},"answer":"C","topic":"Corporate Issuers","page":10,"solution":"assets/solutions/3-1/44.jpg","confidence":"ocr","explanation":"because a conservative approach to working capital management involve greater reliance on long-term\nfunding sources, including long-term debt and equity. Further, a conservative working capital strategy reduces the\nneed to access capital during times of market stress.\n\nWorking Capital and Liquidity\n\n= Describe issuers’ objectives and compare methods for managing working capital and liquidity"},{"id":"3-1-45","set":"3-1","number":45,"stem":"A company plans to do an upward revaluation of an asset under the revaluation\nmodel. All else being equal, the company's debt-to-assets ratio will:","options":{"A":"decrease.","B":"remain unchanged.","C":"increase."},"answer":"A","topic":"Mixed Topics","page":10,"solution":"assets/solutions/3-1/45.jpg","confidence":"ocr","explanation":"because an upward revaluation will increase the value of assets, which is the denominator of the debt-to-\nassets ratio. Debt is not affected by the upward revaluation. The ratio will decrease"},{"id":"3-1-46","set":"3-1","number":46,"stem":"When estimating the average return of an investment over multiple consecutive\nperiods, it is most appropriate to use the:","options":{"A":"harmonic mean.","B":"arithmetic mean.","C":"geometric mean."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/3-1/46.jpg","confidence":"ocr","explanation":"because if we want to estimate the average returns over more than one period, we should use the\ngeometric mean of returns because the geometric mean captures how the total returns are linked over time\n\nStatistical Measures of Asset Returns\n\n= calculate, interpret, and evaluate measures of central tendency and location to address an investment problem"},{"id":"3-1-47","set":"3-1","number":47,"stem":"A well-defined supply function is most likely available to:","options":{"A":"a monopolist.","B":"a firm operating in perfect competition.","C":"a firm operating in monopolistic competition."},"answer":"B","topic":"Mixed Topics","page":11,"solution":"assets/solutions/3-1/47.jpg","confidence":"ocr","explanation":"because in perfect competition, the firm's supply schedule is represented by the marginal cost schedule."},{"id":"3-1-48","set":"3-1","number":48,"stem":"An analyst gathers the following information about a company:\nBook value of debt                       $80 million\nMarket value of debt                     $150 million\nShare price                                    $60\nShares outstanding                        10 million\nCost of equity                         7%\nCost of debt                           4%\nTax rate                               30%\nBased on this information, the company's WACC is closest to:","options":{"A":"6.16%.","B":"6.40%.","C":"6.51%."},"answer":"A","topic":"Financial Statement Analysis","page":11,"solution":"assets/solutions/3-1/48.jpg","confidence":"ocr","explanation":"because one method to approximate the company’s target capital structure is to assume the company’s\ncurrent capital structure, at market value weights for the components, represents the company’s target capital\nstructure.\n\nMarket value of debt = $150 million\n\nMarket value of equity = $6010 million = $600 million\n\nWeight of debt, ws = $150 million/($150 million+$600 million) = 0.20\n\nWeight of equity, w. = $600 million/($150 million+$600 million) = 0.80\n\nWACC = watg(1 —t) + Wplp + Wele=(0.2)(4%)(1-30%)+0+(0.8)(7%) = 6.160% = 6.16%\n\nwhere\n\nWy = the target proportion of debt in the capital structure when the company raises new funds\n\nTy = the before-tax marginal cost of debt\n\nt= the company’s marginal tax rate\n\nWp = the target proportion of preferred stock in the capital structure when the company raises new funds\nT, = the marginal cost of preferred stock\n\nW, = the target proportion of common stock in the capital structure when the company raises new funds\nT, = the marginal cost of common stock"},{"id":"3-1-49","set":"3-1","number":49,"stem":"An option in a capital project to alter production when demand exceeds supply is a\ntype of.","options":{"A":"sizing option.","B":"timing option.","C":"flexibility option."},"answer":"C","topic":"Derivatives","page":11,"solution":"assets/solutions/3-1/49.jpg","confidence":"ocr","explanation":"because a production-flexibility option is a type of flexibility option. Production-flexibility options offer the\noperational flexibility to alter production when demand varies from what is forecast.\n\nCapital Investments and Capital Allocation\n\n= describe types of real options relevant to capital investments"},{"id":"3-1-50","set":"3-1","number":50,"stem":"Which of the following statements is most accurate?\nThe IRR assumes reinvestment of cash flows at the required rate of   Statement 1                    return.\nIRR is strongly preferred when NPV and IRR rank two mutually   Statement 2                 exclusive projects differently.\nStatement 3  NPV is zero when IRR equals the hurdle rate.","options":{"A":"Statement 1","B":"Statement 2","C":"Statement 3"},"answer":"C","topic":"Mixed Topics","page":11,"solution":"assets/solutions/3-1/50.jpg","confidence":"ocr","explanation":"because the required rate of return is often called the hurdle rate, the rate that a project's IRR must exceed\nfor the project to be accepted by the company. In the unlikely event that the IRR is equal to r, the project is\ntheoretically acceptable because it meets the required retum. In fact, NPV equals zero when IRR equals\n\nCapital Investments and Capital Allocation\n\n= describe the capital allocation process, calculate net present value (NPV), intemal rate of return (IRR), and return\n\n‘on invested capital (ROIC), and contrast their use in capital allocation"},{"id":"3-1-51","set":"3-1","number":51,"stem":"Which of the following statements is most accurate? According to Modigliani-Miller\nProposition I without taxes:","options":{"A":"firm value can be created by changing a company's capital structure.","B":"any increase in the cost of equity must exactly offset the greater use of lower\ncost debt.","C":"equity holders demand a higher return as leverage increases in order to offset\nincreased risk."},"answer":"C","topic":"Corporate Issuers","page":11,"solution":"assets/solutions/3-1/51.jpg","confidence":"ocr","explanation":"because MM Proposition | without taxes states: The market value of a company is not affected by the\ncapital structure of the company. It demonstrates that managers cannot create firm value simply by changing the\ncompany's capital structure. In other words, the value of a company is determined solely by its cash flows, not by its\nrelative reliance on debt and equity capital. Adding leverage increases the risk to equity holders because greater\ndebt increases the probability of bankruptcy. As a result, equity holders will demand a higher return as leverage\nincreases in order to offset the increase in risk. However, overall cost of capital does not change, so there is no\nchange in the value of the company.\n\nCapital Structure\n\n= explain the Modigliani-Miller propositions regarding capital structure"},{"id":"3-1-52","set":"3-1","number":52,"stem":"An analyst gathers the following information:\nCHF/USD spot exchange rate                       1.0072\n270-day CHF risk-free interest rate (annualized)       0.63%\n270-day USD risk-free interest rate (annualized)       0.75%\nCHF/USD is the amount of CHF per 1 USD.\nThe number of forward points for the 270-day CHF/USD forward rate is closest to:","options":{"A":"-12.0","B":"-9.0.","C":"0.5."},"answer":"B","topic":"Economics","page":12,"solution":"assets/solutions/3-1/52.jpg","confidence":"ocr","explanation":"because the forward rate is calculated as CHF/USD forward rate = CHF/USD spot rate x [1 + (CHF rate x\n270/360)] / [1 + (USD rate x 270/360)] = 1.0072 x 1.004725 / 1.005625 = 1.0072 x 0.999105 = 1.0063. The forward\npoints are calculated as 1.0063 — 1.0072 = -0.00090 or -9.0 points (multiply by 10,000)"},{"id":"3-1-53","set":"3-1","number":53,"stem":"Which of the following functional forms of a simple linear regression is most\nappropriate to test the linear relationship between relative changes in the dependent\nvariable and relative changes in the independent variable?","options":{"A":"The lin-log model","B":"The log-lin model","C":"The log-log model"},"answer":"C","topic":"Quantitative Methods","page":12,"solution":"assets/solutions/3-1/53.jpg","confidence":"ocr","explanation":"because the log-log model, in which both the dependent variable and the independent variable are linear in\ntheir logarithmic forms, is also referred to as the double-log model. This model is useful in calculating elasticities\nbecause the slope coefficient is the relative change in the dependent variable for a relative change in the\nindependent variable\n\nSimple Linear Regression\n\n= describe different functional forms of simple linear regressions"},{"id":"3-1-54","set":"3-1","number":54,"stem":"A write-down of inventory to its net realizable value by a manufacturing company\nmost likely results in a lower.","options":{"A":"cost of sales than if the write-down had not occurred.","B":"current ratio than if the write-down had not occurred.","C":"inventory turnover than if the write-down had not occurred."},"answer":"B","topic":"Financial Statement Analysis","page":12,"solution":"assets/solutions/3-1/54.jpg","confidence":"ocr","explanation":"because an inventory write-down reduces both profit and the carrying amount of inventory on the balance\nsheet and thus has a negative effect on profitability, liquidity, and solvency ratios. Major liquidity ratios include the\ncurrent ratio. The Current ratio, being Current assets + Current liabilities is lower because the numerator (Current\nassets) is lower due to lower carrying amount of inventories as a result of the write-down while the denominator\n(Current liabilities) remains unchanged."},{"id":"3-1-55","set":"3-1","number":55,"stem":"Which of the following best describes a principal-agent conflict? A company's\nmanagement puts their own interests above those of","options":{"A":"regulators.","B":"customers.","C":"shareholders."},"answer":"C","topic":"Mixed Topics","page":12,"solution":"assets/solutions/3-1/55.jpg","confidence":"ocr","explanation":"because a principal-agent relationship (also known as an agency relationship) is created when a principal\nhires an agent to perform a particular task or service. The principal\nagent relationship involves obligations, trust, and expectations of loyalty; the agent\nis expected to act in the best interests of the principal. In a company, agency theory\nstipulates that principal-agent relationships often lead to conflicts—for example, when\nmanagers do not act in the best interests of shareholders. Managers must act in the best interest of shareholders\nWhile there may be a duty to multiple stakeholders, this specifically describes the principal-agency conflict.\n\nCorporate Governance: Conflicts, Mechanisms, Risks, and Benefits\n\n= describe the principal-agent relationship and conflicts that may arise between stakeholder groups"},{"id":"3-1-56","set":"3-1","number":56,"stem":"An analyst gathers the following information about a currency pair.\nCurrency Pair         Spot Rate Expected    Spot Rate in One Year\nUSD/EUR                   1.1800                1.1650\nUSD/EUR is the amount of USD per one EUR\nThe expected change in value of the dollar relative to the euro over the next year is\nclosest to a(n)","options":{"A":"depreciation of 1.27%.","B":"appreciation of 1.27%.","C":"appreciation of 1.29%."},"answer":"C","topic":"Fixed Income","page":12,"solution":"assets/solutions/3-1/56.jpg","confidence":"ocr","explanation":"because to convert the dollar to the base currency, the calculation is (1/1.1650)/(1/1.1800) — 1 =\n(1.18/1.165) = 1.2876 ~ 1.29% which is an appreciation\n\nExchange Rate Calculations\n\n= calculate and interpret currency cross-rates"},{"id":"3-1-57","set":"3-1","number":57,"stem":"An analyst gathers the following information about a company:\nDebt-to-equity ratio based on market value    43%\nDebt-to-equity ratio based on book value     52%\nThe weight of debt the analyst should use when determining the company's target\ncapital structure is closest to:","options":{"A":"30%.","B":"43%.","C":"52%."},"answer":"A","topic":"Corporate Issuers","page":13,"solution":"assets/solutions/3-1/57.jpg","confidence":"ocr","explanation":"because individuals outside the company, however, such as analysts, typically do not know the target\ncapital structure and must estimate it using one of several methods. Assume the company's current capital\nstructure, at market value weights for the components, represents the company's target capital structure. A simple\nway of transforming a debt-to-equity ratio (D/E) into a weight—that is, D/(D + E)—is to divide DIE by 1 + DIE. Thus\nthe analyst should use 0.43 / (1 + 0.43) = 30.07% ~ 30% as the weight of debt in any estimate of the company's\ntarget capital structure."},{"id":"3-1-58","set":"3-1","number":58,"stem":"In contrast to the Herfindahl-Hirschman index (HHI), the concentration ratio:","options":{"A":"considers the elasticity of demand.","B":"accounts for the possibility of new entrants.","C":"is less affected by mergers among the top market incumbents."},"answer":"C","topic":"Mixed Topics","page":13,"solution":"assets/solutions/3-1/58.jpg","confidence":"ocr","explanation":"because another disadvantage of the concentration ratio is that it tends to be unaffected by mergers\namong the top market incumbents. For example, if the largest and second-largest incumbents merge, the pricing\npower of the combined entity is likely to be larger than that of the two pre-existing companies. But the concentration\nratio may not change much. To avoid the known issues with concentration ratios, economists O.C. Herfindahl and\nAO. Hirschman suggested an index where the market shares of the top N companies are first squared and then\nadded. The HHI for the top three companies in the example in the box above would be 0.352 + 0.25? + 0.20? =\n0.225 before the merger, while after the merger, it would be 0.60? + 0.20? + 0.10? = 0.410, which is substantially\nhigher than the initial 0.225. The HHI is widely used by competition regulators.\n\nThe Firm and Market Structures\n\n= identify the type of market structure within which a firm operates and describe the use and limitations of\nconcentration measures"},{"id":"3-1-59","set":"3-1","number":59,"stem":"Assuming interest deductibility is allowed, an increase in the tax rate will cause a\ncompany's cost of capital to:","options":{"A":"decrease.","B":"remain the same.","C":"increase."},"answer":"A","topic":"Financial Statement Analysis","page":13,"solution":"assets/solutions/3-1/59.jpg","confidence":"ocr","explanation":"because if interest can be deducted in full, the tax deductibility of debt reduces the effective marginal cost\nof debt. Consequently, the cost of capital will decrease"},{"id":"3-1-60","set":"3-1","number":60,"stem":"Under US GAAP, for a long-term operating lease, the lessee reports:","options":{"A":"after inception, the lease payment split between financing and operating\noutflows on the statement of cash flows.","B":"at inception, a right-of use asset and a lease liability calculated as the\nundiscounted value of its fixed lease payments","C":"after inception, a single lease expense each year, which is a straight-line\nallocation of the cost of the lease over its term."},"answer":"C","topic":"Mixed Topics","page":13,"solution":"assets/solutions/3-1/60.jpg","confidence":"ocr","explanation":"because under US GAAP, there are two accounting models for lessees: one for finance leases and another\nfor operating leases. The finance lease accounting model is identical to the lessee accounting model for IFRS. The\noperating lease accounting model is different. The key difference between an operating lease and a finance lease is\nhow the amortization of the ROU asset is calculated. For an operating lease, the lessee’s ROU asset amortization\n‘expense is the lease payment minus the interest expense. The implication is that the total expense reported on the\nincome statement (interest plus amortization) will equal the lease payment.\n\nTopics in Long-Term Liabilities and Equity\n\n= explain the financial reporting of leases from the perspectives of lessors and lessees"},{"id":"3-1-61","set":"3-1","number":61,"stem":"An analyst gathers the following information (in£millions)from a company's\nyear-end balance sheet.\nYear 2      Year 1\nAccounts receivable              65         55\nInventory                      120        140\nPP&E                           1,400       1,400\nAccumulated depreciation         120         80\nAccounts payable                25         40\nDuring Year 2, net income was£860 million. There were no acquisitions or sales of\nproperty, plant, and equipment and no write-downs. Cash flow from operating\nactivities (in£millions) for Year 2 is:","options":{"A":"855.","B":"895.","C":"925."},"answer":"B","topic":"Financial Statement Analysis","page":13,"solution":"assets/solutions/3-1/61.jpg","confidence":"ocr","explanation":"because using the indirect method, operating cash flow is calculated as net income + depreciation expense\n~ increase in current operating asset accounts (accounts receivable) + decrease in current operating asset account\n(inventory) — decrease in current operating liability accounts (accounts payable) = 860 + 40 — 10 + 20 — 15 = 895."},{"id":"3-1-62","set":"3-1","number":62,"stem":"Which of the following is most likely a benefit of globalization?","options":{"A":"Increased profits","B":"Interdependence","C":"Stronger environmental, social, and governance standards"},"answer":"A","topic":"Ethics","page":14,"solution":"assets/solutions/3-1/62.jpg","confidence":"ocr","explanation":"because the opportunity to generate higher profits may motivate companies to globalize. The first way to\ngenerate profit is to increase sales. Companies may choose to engage in globalization in order to access new\ncustomers for their goods and services. Another way to increase profits is to reduce costs. Globalization allows\ncompanies to access lower tax-operating environments, reduce labor costs, or seek other supply chain efficiency\ngains"},{"id":"3-1-63","set":"3-1","number":63,"stem":"An analyst gathers the following information (in $ thousands) about an electronics\nmanufacturing company:\nYear 2      Year 1\nCost of sales                          1,250       1,000\nCost of inventor                     225        375\nNet realizable value of inventory        300        325\nChanges to the allowance for inventory obsolescence have already been reflected in\ncost of sales. The inventory turnover (based on average inventory) for Year 2 is\nclosest to:","options":{"A":"4.0","B":"4.2.","C":"4.5."},"answer":"C","topic":"Financial Statement Analysis","page":14,"solution":"assets/solutions/3-1/63.jpg","confidence":"ocr","explanation":"because IFRS state that inventories shall be measured (and carried on the balance sheet) at the lower of\ncost and net realizable value and Inventory turnover ratio = Cost of sales + Average inventory. Accordingly,\nInventory turnover ratio = 1,250 / [(225 + 325)] / 2 = 1,250/ 275 = 4.545 = 4.5\n\nAnalysis of Inventories\n\n= describe the measurement of inventory at the lower of cost and net realisable value and its implications for financial\n\nstatements and ratios"},{"id":"3-1-64","set":"3-1","number":64,"stem":"The continuously compounded return:","options":{"A":"is higher than the holding period return for a given time period.","B":"for multiple time periods is the sum of the one-period continuously compounded\nreturns.","C":"cannot be calculated for negative holding period returns because the natural\nlogarithm of a negative number is not a real number."},"answer":"B","topic":"Mixed Topics","page":14,"solution":"assets/solutions/3-1/64.jpg","confidence":"ocr","explanation":"because the continuously compounded return to time Tis the sum of the one-period continuously\ncompounded returns"},{"id":"3-1-65","set":"3-1","number":65,"stem":"A characteristic of a dollarized exchange regime is:","options":{"A":"imposed fiscal discipline.","B":"the ability to earn seigniorage profits.","C":"that monetary policy can be used as a source of economic stabilization."},"answer":"A","topic":"Economics","page":14,"solution":"assets/solutions/3-1/65.jpg","confidence":"ocr","explanation":"because dollarization imposes fiscal discipline by eliminating the possibility that the central bank will be\ninduced to monetize government debt (i.e., to persistently purchase government debt with newly created local\ncurrency)"},{"id":"3-1-66","set":"3-1","number":66,"stem":"Companies most likely have the largest proportion of equity in their capital structure\nin the:","options":{"A":"start-up stage","B":"growth stage.","C":"maturity stage."},"answer":"A","topic":"Corporate Issuers","page":14,"solution":"assets/solutions/3-1/66.jpg","confidence":"ocr","explanation":"because companies in the growth stage have a \"Rising\" \"Debt Availability\", while mature companies have\na \"High\" \"Debt Availability.\" By contrast, startup companies have a \"Little or None\" \"Debt Availability\". Thus, a\nstartup company has most the smallest amount of debt (if any) in its capital structure compared to a growth or\nmature company. This means that the equity portion in the capital structure for startups is higher than for growth or\nmature companies."},{"id":"3-1-67","set":"3-1","number":67,"stem":"An analyst gathers the following information (in € thousands) about a machine:\nCarrying amount prior to impairment            50\nPresent value of expected future cash flows       46\nFair value                                 48\nCosts to sell                                3\nImpairment loss (in € thousands)is:","options":{"A":"A.2","B":"B.4.","C":"C.5"},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/3-1/67.jpg","confidence":"ocr","explanation":"because under IAS 36, an impairment loss is measured as the excess of carrying amount over the\nrecoverable amount of the asset. The recoverable amount of an asset is defined as the higher of its fair value less\ncosts to sell and its value in use. Value in use is based on the present value of expected future cash flows.\nAccordingly, Impairment loss = Carry amount — Max{(Fair value — Costs to sell), Present value of expected future\ncash flows] = 50 — Max{(48 — 3), 46] = 50 — 46 = 4"},{"id":"3-1-68","set":"3-1","number":68,"stem":"Which of the following fiscal policy tools is an automatic stabilizer?","options":{"A":"Capital expenditures","B":"Social benefits through transfer payments","C":"Current government spending on goods and services"},"answer":"B","topic":"Economics","page":15,"solution":"assets/solutions/3-1/68.jpg","confidence":"ocr","explanation":"because automatic stabilizers will lead to changes in the budget deficit unrelated to fiscal policy changes\nAutomatic stabilizers—such as income tax, VAT, and social benefits—are important because as output and\nemployment fall and reduce tax revenues, so net tax revenues also fall as unemployment benefits rise. This acts as\na fiscal stimulus and serves to reduce the size of the multiplier, dampening the output response of whatever caused\nthe fall in output in the first place. Transfer payments are welfare payments made through the social security system\nand, depending on the country, comprise payments for state pensions, housing benefits, tax credits and income\nsupport for poorer families, child benefits, unemployment benefits, and job search allowances."},{"id":"3-1-69","set":"3-1","number":69,"stem":"An analyst gathers the following information about three portfolios:\nPortfolio      Return Standard    Deviation\n1           8.0%            6.0%\n2           10.2%           8.0%\n3            11.8%           10.0%\nIf the risk-free rate is 2.0% and the shortfall level is 4.0%, the portfolio with the\nhighest safety-first ratio is:","options":{"A":"Portfolio 1.","B":"Portfolio 2.","C":"Portfolio 3."},"answer":"C","topic":"Portfolio Management","page":15,"solution":"assets/solutions/3-1/69.jpg","confidence":"ocr","explanation":"because the safety-first ratio (SFRatio): SFRatio = [E(Rz) ~ Ri/op. Hence, Portfolio 3 has the highest\nSFRatio: SFRatio = (11.8 — 4.0)/10.0 = 0.780. The SFRatio for Portfolio 1 is (8.0 — 4.0)/6.0 = 0.667. The SFRatio for\nPortfolio 2 is (10.2 — 4.0/8.0 = 0.75\n\nPortfolio Mathematics\n\n= define shortfall risk, calculate the safety-first ratio, and identify an optimal portfolio using Roy's safety-first criterion"},{"id":"3-1-70","set":"3-1","number":70,"stem":"Which of the following is best described as a non-cooperative economic tool?","options":{"A":"Globalization","B":"Nationalization","C":"Restriction of foreign investment"},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/3-1/70.jpg","confidence":"ocr","explanation":"because economic tools can also be non-cooperative in nature. Nationalization, the process of transferring\nan activity or industry from private to state control, is a non-cooperative approach to asserting economic control"},{"id":"3-1-71","set":"3-1","number":71,"stem":"Which of the following statements is most accurate?","options":{"A":"Deferred tax assets occur when the tax base of an asset is lower than its carrying\namount","B":"A company's current tax liability is the amount payable in taxes and is based on\ncurrent taxable income","C":"Deferred tax liabilities occur when regulatory income tax expense is greater than\naccounting income tax expense"},"answer":"B","topic":"Financial Statement Analysis","page":15,"solution":"assets/solutions/3-1/71.jpg","confidence":"ocr","explanation":"because a company’s taxable income is the basis for its income tax payable (a liability) or recoverable (an\nasset), which appears on its balance sheet"},{"id":"3-1-72","set":"3-1","number":72,"stem":"In the context of considering ESG factors, \"stranded asset\" risk most likely applies to\ncompanies in which sector?","options":{"A":"Energy","B":"Financial","C":"Industrial"},"answer":"A","topic":"Mixed Topics","page":16,"solution":"assets/solutions/3-1/72.jpg","confidence":"ocr","explanation":"because stranded asset risk refers to carbon-intensive assets that are at risk of no longer being\neconomically viable because of changes in regulation or investor sentiment and would most likely apply to the\nenergy sector."},{"id":"3-1-73","set":"3-1","number":73,"stem":"An analyst gathers the following information about a company:\nRevenue                         €20 million\nAverage shareholders' equity         €10 million\nROE                            10%\nROA                          4%\nThe total asset turnover ratio is:","options":{"A":"0.80.","B":"1.25.","C":"2.50."},"answer":"A","topic":"Mixed Topics","page":16,"solution":"assets/solutions/3-1/73.jpg","confidence":"ocr","explanation":"because ROE = ROA x Leverage = Net profit margin x Total asset turnover x Leverage where:\nROE = Net Income / Average shareholders’ equity;\nROA = Net Income / Average total assets;\nLeverage = Average total assets / Average shareholders’ equity;\nNet profit margin = Net Income / Revenue\nTotal asset turnover = Revenue / Average total assets.\nThere are a number of options to solve this:\nOption 1\nNet income = ROE x Average shareholders’ equity = 10% x €10,000,000 = €1,000,000;\nAverage total assets = Net Income / ROA = €1,000,000 / 4% = €25,000,000;\nTotal asset tumover = Revenue / Average total assets = €20,000,000 / €25,000,000 = 0.80.\nOption 2\nNet profit margin = Net Income / Revenue = €1,000,000 / €20,000,000 = 5%;\nLeverage = ROE / ROA = 10% / 4% = 2.50;\nROE = Net profit margin x Total asset turnover x Leverage; thus\nTotal asset tumover = ROE / (Net profit margin x Leverage) = 10% / (5% x 2.50) = 10% / 12.5% = 0.80.\nOption 3\nNet profit margin = Net Income / Revenue = €1,000,000 / €20,000,000 = 5%;\nROA = Net profit margin x Total asset turnover; thus\nTotal asset turnover = ROA / Net profit margin = 4% / 5% = 0.80."},{"id":"3-1-74","set":"3-1","number":74,"stem":"Credit cycles:","options":{"A":"can amplify business cycles.","B":"are defined as fluctuations in real GDP","C":"tend to be shorter than business cycles."},"answer":"A","topic":"Economics","page":16,"solution":"assets/solutions/3-1/74.jpg","confidence":"ocr","explanation":"because it is recognized that in a world with financial frictions, business cycles can be amplified, with\ndeeper recessions and more extensive expansions because of changes in access to external financing. In line with\nthis, it is found that the duration and magnitude of recessions and recoveries are often shaped by linkages between\nbusiness and credit cycles"},{"id":"3-1-75","set":"3-1","number":75,"stem":"An analyst examining the statement of cash flows for possible manipulation is least\nlikely to be concerned about a(n):","options":{"A":"cash flow from operations to net income ratio consistently higher than 1.","B":"increase in cash from operations arising from a large change in accounts\npayable.","C":"change in the classification of interest paid from an operating cash flow to a\nfinancing cash flow."},"answer":"A","topic":"Mixed Topics","page":16,"solution":"assets/solutions/3-1/75.jpg","confidence":"ocr","explanation":"because a cash flow from operations to net income ratio that is consistently higher than 1 indicates that\noperating cash flow is consistently higher than net income and signals high earnings quality."},{"id":"3-1-76","set":"3-1","number":76,"stem":"An analyst gathers the following information (in € millions) about a company's\n4-year construction contract\nContract price               106\nExpected total costs             70\nActual costs incurred in Year 1        21\nBonus for on-time completion         8\nCosts incurred are an appropriate measure of progress toward completion. The\nconstruction company is very experienced with similar contracts. If it is highly\nprobable revenue will not be subsequently reversed, revenue (in € millions)\nrecognized in Year 1 is most likely.","options":{"A":"31.8.","B":"33.8.","C":"34.2."},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/3-1/76.jpg","confidence":"ocr","explanation":"because both the contract revenue and bonus should be calculated based on progress toward completion\nA company is only allowed to recognize variable consideration if it can conclude that it will not have to reverse the\ncumulative revenue in the future. Answer is calculated as 21/70 x (106 + 8) = 30% x 114 = 34.2\n\nAnalyzing Income Statements\n\n= describe general principles of revenue recognition, specific revenue recognition applications, and implications of\n\nTevenue recognition choices for financial analysis"},{"id":"3-1-77","set":"3-1","number":77,"stem":"All else being equal, in periods of decreasing inventory unit costs and constant\ninventory quantities, using the FIFO inventory valuation method results in:","options":{"A":"lower gross profit and lower inventory turnover than using the LIFO inventory\nvaluation method.","B":"lower gross profit and higher inventory turnover than using the LIFO inventory\nvaluation method.","C":"higher gross profit and higher inventory turnover than using the LIFO inventory\nvaluation method."},"answer":"B","topic":"Financial Statement Analysis","page":17,"solution":"assets/solutions/3-1/77.jpg","confidence":"ocr","explanation":"because using FIFO in periods of declining prices, the costs assigned to the units in ending inventory are\nlower than the costs assigned to the units sold. Conversely, [using LIFO] in periods of declining prices, the costs\nassigned to the units in ending inventory are higher than the costs assigned to the units sold. Therefore, when\nusing FIFO, cost of goods sold will be higher than using LIFO, and accordingly, gross profit (revenue cost of goods\nsold) will be lower. Inventory turnover ratio = Cost of goods sold / Average inventory, as the numerator is higher and\ndenominator lower, the inventory turnover ratio using FIFO will be higher than using LIFO."},{"id":"3-1-78","set":"3-1","number":78,"stem":"An analyst gathers the following information about a company's fiscal year\nbeginning on 1 January:\nNet income                                              £1,800,000\nPreferred dividends declared and paid                         £600,000\nCommon shares outstanding on 31 December                        300,000\nWeighted average common shares outstanding during the year           500,00\nConvertible preferred shares outstanding during the year                25,000\nIf one preferred share can be converted into four common shares and there are no\nother potentially dilutive securities outstanding, reported diluted EPS should be:","options":{"A":"£2.40.","B":"£3.00","C":"£4.00."},"answer":"A","topic":"Equity Investments","page":17,"solution":"assets/solutions/3-1/78.jpg","confidence":"ocr","explanation":"because reported diluted EPS is equal to basic EPS as the convertible security is antidilutive (i. their\ninclusion would result in an EPS higher than the company’s basic EPS). Under IFRS and US GAAP, antidilutive\nsecurities are not included in the calculation of reported diluted EPS. Reported diluted EPS will always be less than\nor equal to basic EPS. Reported diluted EPS is calculated using the if-converted method. The if-converted method\nis based on what EPS would have been if the convertible preferred securities had been converted at the beginning\nof the period\nDiluted EPS using the if-converted method for preferred stock is Net income/ (Weighted average number of shares\n‘outstanding + New common shares that would have been issued at conversion); or = £1,800,000 / [500,000 +\n(25,000 x 4)] = £1,800,000 / 600,000 = £3.00. Basic EPS = (Net income — Preferred dividends)/ Weighted average\nnumber of shares outstanding = (£1,800,000 — £600,000) / 500,000 = £1,200,000 / 500,000 = £2.40.\nAs Basic EPS of £2.40 is lower than the diluted EPS of £3.00, the convertible preferred stock is antidilutive, the\nreported dilutive EPS should thus be equal to basic EPS of £2.40"},{"id":"3-1-79","set":"3-1","number":79,"stem":"An analyst gathers the following information about a company:\nCanadian Dollars (millions)\nCash flow from operating activities (CFO)                          105.9\nCash flow from investing activities                                     (11.8)\nCash flow from financing activities                                   46.5\nNet change in cash for the year                                    140.6\nInterest paid (included in CFO)                                      22.4\nTaxes p
