proportions of debt and equity as opposed to the actual weightings. If we know the company’s target capital\nstructure, then of course we should use this in our analysis.\nWeight of debt, w, = (D/E)/(1+(D/E)) = 0.8/(1+0.8) = 0.4444\nWeight of equity, we = 1-wy = 0.5556\nWACC = Wata(1 — t) + Wplp + Wete=(0.4444)(4%)(1-30%)+0+(0.5556)(9%) = 6.2444% ~ 6.24%\nwhere\nWy = the target proportion of debt in the capital structure when the company raises new funds\nTq = the before-tax marginal cost of debt\nt= the company’s marginal tax rate\nWp = the target proportion of preferred stock in the capital structure when the company raises new funds\n, = the marginal cost of preferred stock\nW, = the target proportion of common stock in the capital structure when the company raises new funds\nT, = the marginal cost of common stock"},{"id":"1-1-84","set":"1-1","number":84,"stem":"In the event that the value of inventory declines below the carrying amount on the\nbalance sheet, the inventory carrying amount must be written down and the\nreduction in value recognized as a(n):","options":{"A":"expense on the income statement.","B":"decrease in the revaluation surplus account.","C":"decrease in the inventory valuation allowance account."},"answer":"A","topic":"Financial Statement Analysis","page":19,"solution":"assets/solutions/1-1/84.jpg","confidence":"ocr","explanation":"because in the event that the value of inventory declines below the carrying amount on the balance sheet,\nthe inventory carrying amount must be written down to its net realizable value and the loss (reduction in value)\nrecognized as an expense on the income statement."},{"id":"1-1-85","set":"1-1","number":85,"stem":"The international organization most likely to provide funds to create basic\neconomic infrastructure in developing countries is the:","options":{"A":"World Bank.","B":"World Trade Organization.","C":"International Monetary Fund."},"answer":"A","topic":"Alternative Investments","page":19,"solution":"assets/solutions/1-1/85.jpg","confidence":"ocr","explanation":"because the World Bank helps to create the basic economic infrastructure that is essential for the creation\nof domestic financial markets and a well-functioning financial industry in developing countries."},{"id":"1-1-86","set":"1-1","number":86,"stem":"If a paired comparison test of mean differences supports rejecting the null\nhypothesis, then the:","options":{"A":"difference in means is not statistically significant.","B":"independence of the samples is statistically significant.","C":"standard error of the mean differences is low relative to the sample mean\ndifference."},"answer":"C","topic":"Mixed Topics","page":19,"solution":"assets/solutions/1-1/86.jpg","confidence":"ocr","explanation":"because, according to the test statistic, ¢ = ite, the lower the standard error in the denominator, the\nhigher the value of the t-statistic. The t-statistic calculation includes the sample mean difference in the numerator.\nTherefore, a lower standard error (denominator) relative to the sample mean difference (numerator) results in a\nhigher t-statistic value.\n\nHypothesis Testing\n\n= construct hypothesis tests and determine their statistical significance, the associated Type | and Type Il errors, and\npower of the test given a significance level"},{"id":"1-1-87","set":"1-1","number":87,"stem":"The possibility of new entrants into an industry is considered in the calculation of","options":{"A":"the concentration ratio.","B":"the Herfindahl-Hirschman index.","C":"neither the concentration ratio nor the Herfindahl-Hirschman index."},"answer":"C","topic":"Mixed Topics","page":19,"solution":"assets/solutions/1-1/87.jpg","confidence":"ocr","explanation":"because just like the concentration ratio, the HHI does not take the possibility of entry into account.\nThe Firm and Market Structures\n= identify the type of market structure within which a firm operates and describe the use and limitations of\nconcentration measures"},{"id":"1-1-88","set":"1-1","number":88,"stem":"Under the indirect method, which of the following should be subtracted from net\nincome to arrive at cash flow from operating activities?","options":{"A":"Purchase of equipment","B":"Decrease in accounts payable","C":"Amortization expense of intangible assets"},"answer":"B","topic":"Mixed Topics","page":19,"solution":"assets/solutions/1-1/88.jpg","confidence":"ocr","explanation":", because a decrease in current operating liabilities (e.g., accounts payable and accrued expense liabilities)\nis a subtraction from net income using the indirect method"},{"id":"1-1-89","set":"1-1","number":89,"stem":"An analyst gathers the following probabilities concerning Event X and some new\ninformation:\n\nPrior probability of X                               0.70\nProbability of the new information given X            0.50\nUnconditional probability of the new information      0.60\n\nUsing Bayes' formula, the updated probability of X given the new information is\nclosest to:","options":{"A":"0.43.","B":"0.58.","C":"0.84."},"answer":"B","topic":"Quantitative Methods","page":20,"solution":"assets/solutions/1-1/89.jpg","confidence":"ocr","explanation":"because applying Bayes’ formula, Probability of X given the new information = Probability of the new\ninformation given X/ Unconditional probability of the new information x Prior probability of X, results in 0.5/0.6 x 0.7\n= 0.5833 ~ 0.58"},{"id":"1-1-90","set":"1-1","number":90,"stem":"Conflicts of interest between shareholders and management most likely occur\nwhen:","options":{"A":"executive remuneration plans include deferred shares.","B":"shareholders do not influence the design of executive compensation\npackages.","C":"risky projects that match shareholders' risk tolerance are pursued by the\ncompany."},"answer":"B","topic":"Equity Investments","page":20,"solution":"assets/solutions/1-1/90.jpg","confidence":"ocr","explanation":"because by allowing shareholders to express their views on remuneration matters, companies can limit the\ndiscretion of directors and managers in granting themselves excessive (or inadequate) remuneration, thus not\nallowing managers to have greater discretion over their own pay. Hence, if shareholders do not or miss to influence\nthe design of executive compensation packages, conflicts of interest between shareholders and management may\n‘occur."},{"id":"1-2-01","set":"1-2","number":1,"stem":"An analyst gathers the following information (in $millions)about a hedge fund:\nInitial investment cost          100\nProfit, Year 1                  25\nLoss. Year 2                  10\n\nIf the incentive fee is 20%and there is a clawback provision, the total incentive\nfee (in  $millions)for Years 1 and 2 is:","options":{"A":"0.","B":"3.","C":"5."},"answer":"B","topic":"Alternative Investments","page":1,"solution":"assets/solutions/1-2/01.jpg","confidence":"ocr","explanation":"because the GP would initially accrue a 20% of $[25] million profit at the end of the first year, equal to $[5]\nmillion. Typically, this amount would be held in escrow for the benefit of the GP but not actually paid. But then the\nGP loses $10 million of the initial ${25] million gain, so the aggregate whole-of-fund gain at the end of the second\nyear would be only $[15] million; this amount times 20% would result in only an [$3 million] incentive fee. The\ngeneral partner would then have to return $2 million of the previously accrued incentive fees to the capital accounts\nof LP investors because of the clawback provision"},{"id":"1-2-02","set":"1-2","number":2,"stem":"To be eligible for the upcoming dividend, the latest date an investor needs to\npurchase the share is on the trading day before the:","options":{"A":"ex-date.","B":"record date.","C":"declaration date."},"answer":"A","topic":"Mixed Topics","page":1,"solution":"assets/solutions/1-2/02.jpg","confidence":"ocr","explanation":"because the ex-date is the first date that a share trades without (ie., “ex’) the dividend. Because buyers of\na company’s shares on the ex-dividend date are no longer eligible to receive the upcoming dividend, all else being\nequal, on that day the company’s share price immediately decreases by the amount of the foregone dividend\nTherefore, the trading day before the ex-date is the last date for an investor to purchase shares to be eligible for\nupcoming dividends."},{"id":"1-2-03","set":"1-2","number":3,"stem":"A zero coupon bond is priced at 90 and has three years to maturity. Based on a\ncompounding periodicity of 4, the bond's annual yield-to-maturity is closest to:","options":{"A":"1.8%.","B":"2.7%.","C":"3.5%."},"answer":"C","topic":"Fixed Income","page":1,"solution":"assets/solutions/1-2/03.jpg","confidence":"ocr","explanation":"because since this is a zero coupon bond, we use a version of the equation\nPV = (PMT + FV)/ (1 +Zy)\", where PMT and FV are the single payment received at maturity and N is the number\nof periods until maturity (equation also shown as 80 = 100/ (1 + r)%°. In this case 90 = 100/ (1 + Z;2)!2. 100/90 = (1\n+Z,))\"?. Solving this equation Z,, = .00882. To get to the annual yield to maturity, multiply Z,. by 4 for 3.527%.\n\nYield and Yield Spread Measures for Fixed-Rate Bonds\n\n= calculate annual yield on a bond for varying compounding periods in a year"},{"id":"1-2-04","set":"1-2","number":4,"stem":"Investors are least likely to use derivatives to:","options":{"A":"take short positions.","B":"replicate a cash market strategy.","C":"offset market-based exposures incidental to their financing activities."},"answer":"C","topic":"Derivatives","page":1,"solution":"assets/solutions/1-2/04.jpg","confidence":"ocr","explanation":"because issuers predominantly use derivatives to offset or hedge market-based underlying exposures\nincidental to their commercial operations and financing activities. In contrast, investors use derivatives to replicate\na cash market strategy, hedge a fund's value against adverse movements in underlyings, or modify or add\n‘exposures using derivatives, which in some cases are unavailable in cash markets\n\nDerivative Benefits, Risks, and Issuer and Investor Uses\n\n= compare the use of derivatives among issuers and investors"},{"id":"1-2-05","set":"1-2","number":5,"stem":"A swap is most likely similar to a series of forward contracts when:","options":{"A":"the combined value of all forward contracts is zero.","B":"all the forward contracts have the same maturity date.","C":"the value of the long forward contracts are matched with the value of the\nshort forward contracts at each swap payment date"},"answer":"A","topic":"Derivatives","page":1,"solution":"assets/solutions/1-2/05.jpg","confidence":"ocr","explanation":"because each forward contract will be created at the fixed price that corresponds to the fixed price of a\n‘swap of the same maturity with payments made at the same dates as the series of forward contracts. That means\nthat some of the forward contracts would have positive values and some would have negative values, but their\ncombined values would equal zero"},{"id":"1-2-06","set":"1-2","number":6,"stem":"Which of the following is the most conservative price for valuing a hedge fund's\nshort position?","options":{"A":"The bid price","B":"The ask price","C":"The average of the bid and ask prices"},"answer":"B","topic":"Alternative Investments","page":2,"solution":"assets/solutions/1-2/06.jpg","confidence":"ocr","explanation":"because a more conservative and accurate approach is to use bid prices for long positions and ask prices\nfor short positions because these are more realistic prices at which the positions could be closed"},{"id":"1-2-07","set":"1-2","number":7,"stem":"A security is most likely undervalued if its estimated intrinsic value is higher than\nits:","options":{"A":"par value.","B":"book value.","C":"market price."},"answer":"C","topic":"Mixed Topics","page":2,"solution":"assets/solutions/1-2/07.jpg","confidence":"ocr","explanation":"because if the estimated value exceeds the market price, the analyst infers the security is undervalued\n\nEquity Valuation: Concepts and Basic Tools\n\n= evaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or\n\nundervalued by the market"},{"id":"1-2-08","set":"1-2","number":8,"stem":"Which of the following measures is the slope of the capital allocation line?","options":{"A":"Sharpe ratio","B":"Treynor ratio","C":"Jensen's alpha"},"answer":"A","topic":"Portfolio Management","page":2,"solution":"assets/solutions/1-2/08.jpg","confidence":"ocr","explanation":"because the Sharpe ratio, also called the reward-to-variability ratio, is simply the slope of the capital\nallocation line equal to [E(R,) — Ril / 0p"},{"id":"1-2-09","set":"1-2","number":9,"stem":"An analyst gathers the following information about a hedge fund established at\nthe beginning of Year 1:\n\nAssets under management (AUM), beginning of Year 1    $100 million\nAUM, end of Year 1                                $125 million\n\nAUM, end of Year 2                                 $110 million\n\nManagement fee (calculated on end-of-year AUM)         2%\n\nPerformance fee above high-water mark (calculated net of    20%\nfees)\n\nThe cumulative fee (in $millions) earned by the hedge fund manager for the two\nyears is closest to:","options":{"A":"5.2.","B":"7.2","C":"9.2."},"answer":"C","topic":"Alternative Investments","page":2,"solution":"assets/solutions/1-2/09.jpg","confidence":"ocr","explanation":"because\nManagement fee for Year 1 = 125 x 2% = 2.5\nPerformance fee for Year 1 = (125 -— 2.5 - 100) x 20% = 4.5\nAssets under management (AUM) at beginning of Year 2 = 125 — 2.5 — 4.5 = 118 (high-water mark)\nManagement fee for Year 2 = 110 x 2% =2.2\nAs the fund has a loss in Year 2 and the AUM falls below the high-water mark, there is no performance fee for Year\n2\nTotal fees to the hedge fund manager = 2.5+4.5+2.2 = 9.2\n\nAlternative Investment Performance and Returns\n\n= calculate and interpret alternative investment returns both before and after fees"},{"id":"1-2-10","set":"1-2","number":10,"stem":"Over time, a forward contract most likely has variable:","options":{"A":"value and constant price.","B":"price and constant value.","C":"value and variable price."},"answer":"A","topic":"Derivatives","page":2,"solution":"assets/solutions/1-2/10.jpg","confidence":"ocr","explanation":"because the price of a forward contract remains constant throughout its life. It is set as part of the contract\nspecifications. The value varies with changes in the price of the underlying."},{"id":"1-2-11","set":"1-2","number":11,"stem":"An analyst gathers the following information (in $billions) about a company:\n\nMarket value of debt        5\nMarket capitalization       43\nEnterprise value           33\n\nThe balance (in $billions) of the company's cash and short-term investments is:","options":{"A":"5.","B":"10.","C":"15."},"answer":"C","topic":"Equity Investments","page":3,"solution":"assets/solutions/1-2/11.jpg","confidence":"ocr","explanation":"because enterprise value is determined as market capitalization plus market value of preferred stock plus\nmarket value of debt minus cash and investments (cash equivalents and short-term investments). Therefore cash\nand short-term investments = Market capitalization + Market value of debt - Enterprise value = $43 + $5 - $33 =\n$15 billion\n\nEquity Valuation: Concepts and Basic Tools\n\n= describe enterprise value multiples and their use in estimating equity value"},{"id":"1-2-12","set":"1-2","number":12,"stem":"All else being equal, the value of a European put option is most likely inversely\nrelated to the time to expiration when interest rates are high, the time to\nexpiration is long and the put is:","options":{"A":"at-the-money","B":"deep in-the-money.","C":"deep out-of-the-money."},"answer":"B","topic":"Fixed Income","page":3,"solution":"assets/solutions/1-2/12.jpg","confidence":"ocr","explanation":"because the value of a European put option can be either directly or inversely related to the time to\nexpiration. The direct effect is more common, but the inverse effect can prevail with a put the longer the time to\nexpiration, the higher the risk-free rate, and the deeper it is in-the-money."},{"id":"1-2-13","set":"1-2","number":13,"stem":"Which of the following provides the best behavioral explanation of the value\nstock anomaly?","options":{"A":"The halo effect","B":"The disposition effect","C":"The effects of the framing bias"},"answer":"A","topic":"Mixed Topics","page":3,"solution":"assets/solutions/1-2/13.jpg","confidence":"ocr","explanation":"because behavioral explanations for value anomalies, presenting the anomalies as mispricing rather than\ncompensation for increased risk. These studies recognize the emotional factors involved in appraising stocks. The\nhalo effect, for example, extends a favorable evaluation of some characteristics to other characteristics. A company\nwith a good growth record and good previous share price performance might be seen as a good investment, with\nhigher expected returns than its risk characteristics merit. This view is a form of representativeness that can lead\ninvestors to extrapolate recent past performance into expected returns. Overconfidence can also be involved in\npredicting growth rates, potentially leading growth stocks to be overvalued"},{"id":"1-2-14","set":"1-2","number":14,"stem":"A market index consists of 100 assets. Investment 1 consists of one asset that is\nrandomly chosen from the index. Every month the asset is replaced by a new\nrandomly chosen asset. Investment 2 equally weights all assets in the index. Over\na period of 100 months, the annualized standard deviation of Investment 1 is most\nlikely:","options":{"A":"less than the annualized standard deviation of Investment 2.","B":"equal to the annualized standard deviation of Investment 2.","C":"greater than the annualized standard deviation of Investment 2."},"answer":"C","topic":"Quantitative Methods","page":3,"solution":"assets/solutions/1-2/14.jpg","confidence":"ocr","explanation":"because the equally weighted portfolio's return is the same as the retum on the randomly selected\nsecurity. However, the same does not hold true for the portfolio standard deviation. That is, the standard deviation\nof an equally weighted portfolio is not simply the average of the standard deviations of the individual shares\nInvestment 2 offers a lower standard deviation of return than the average of its individual components due to the\ncorrelations or interactions between the individual securities.\n\nPortfolio Management: An Overview\n\n= describe the portfolio approach to investing"},{"id":"1-2-15","set":"1-2","number":15,"stem":"The current yield for a coupon-paying bond trading at a premium is:","options":{"A":"less than the coupon rate.","B":"equal to the coupon rate.","C":"greater than the coupon rate."},"answer":"A","topic":"Fixed Income","page":3,"solution":"assets/solutions/1-2/15.jpg","confidence":"ocr","explanation":"because the current yield is the sum of the coupon payments received over the year divided by the flat\nprice. If a bond is trading at a premium, the denominator in the current yield calculation will be greater than 100 and\nthe current yield will be less than the coupon rate."},{"id":"1-2-16","set":"1-2","number":16,"stem":"The market portfolio has an expected return of 10% and a standard deviation of\n11%. If the risk-free rate is 2%, the slope of the capital market line is closest to:","options":{"A":"0.73.","B":"0.91","C":"1.38."},"answer":"A","topic":"Portfolio Management","page":4,"solution":"assets/solutions/1-2/16.jpg","confidence":"ocr","explanation":"because the slope of the [capital market] line referred to as the market price of risk is [E(Rm) — RillOm,\nwhere E(R,) is the expected market return, Ryis the risk-free rate, and o,,is the standard deviation of market\nreturns\nThus, the slope of the capital market line is (0.10 — 0.02)/0.11 = 0.08/0.11 = 0.7273 + 0.73"},{"id":"1-2-17","set":"1-2","number":17,"stem":"A key catalyst for the relative growth of passive investing compared to active\ninvesting is most likely the:","options":{"A":"lower costs of index funds.","B":"higher returns to investors from outperforming benchmarks.","C":"increased correlation of returns between traditional investments and\nalternative investments."},"answer":"A","topic":"Alternative Investments","page":4,"solution":"assets/solutions/1-2/17.jpg","confidence":"ocr","explanation":"because one key catalyst supporting the growth of passive investing is low cost for investors\n—management fees for index (or other passive) funds are often a fraction of those for active strategies."},{"id":"1-2-18","set":"1-2","number":18,"stem":"An analyst gathers the following information about a bond:\n\nPrice      Yield-to-Maturity (%)\n103.52                3.7\n103.84                3.3\n\nIf the bond currently trades at a price of 103.67 with a yield-to-maturity of\n3.5%, the approximate convexity is closest to:","options":{"A":"0.048.","B":"0.096.","C":"48.230."},"answer":"C","topic":"Fixed Income","page":4,"solution":"assets/solutions/1-2/18.jpg","confidence":"ocr","explanation":"because approximate convexity is computed as: [(PV_) + (PV.) — (2 x PVo)J/[(AYield)? x (PVo)] = [103.52 +\n103.84 — (2 x 103.67))/[(0.002)? x 103.67] = 48.22996 ~ 48.230.\n\nYield-Based Bond Convexity and Portfolio Properties\n\n= calculate and interpret convexity and describe the convexity adjustment"},{"id":"1-2-19","set":"1-2","number":19,"stem":"If 1,000 shares of stock purchased at $30 per share on 75%margin are later sold at\n$26 per share, the return on equity is closest to:","options":{"A":"-17.8%","B":"-13.3%.","C":"-10.0%."},"answer":"A","topic":"Equity Investments","page":4,"solution":"assets/solutions/1-2/19.jpg","confidence":"ocr","explanation":"because it has correctly applied margin requirement and calculated the effect of leverage on the return\ncalculation, accordingly:\nCost of purchase = Shares purchased x Purchase price = 1,000 = $30 = $30,000\nInitial investment = Equity invested = Cost of purchase x Margin requirement\n= $30,000 x 75% = $22,500\nProceeds from sale = Shares sold x Sales price = 1,000 x $26 = $26,000\nLoss on the position = Proceeds from Sale — Cost of purchase\n= $26,000 — $30,000 = -$4,000\nReturn on investment = Loss on the position / Initial investment\n=—$4,000 / $22,500 = 0.1777... = 17.78%\nAlternatively, it can also be calculated as Return on investment = Loss on the position / Cost of purchase / Margin\nrequirement = (-$4,000 / $30,000) / 75% =-0.1777... =-17.78%"},{"id":"1-2-20","set":"1-2","number":20,"stem":"An American waterfall distributes performance fees on a(n):","options":{"A":"deal-by-deal basis and is more advantageous to the general partner than a\nEuropean waterfall.","B":"deal-by-deal basis and is more advantageous to the limited partners than a\nEuropean waterfall.","C":"aggregated fund level and is more advantageous to the limited partners than a\nEuropean waterfall."},"answer":"A","topic":"Alternative Investments","page":4,"solution":"assets/solutions/1-2/20.jpg","confidence":"ocr","explanation":"because there are two types of waterfalls: deal-by-deal (or American) waterfalls and whole-of-fund (or\nEuropean) waterfalls. Deal-by-deal waterfalls are more advantageous to the GP because performance fees are\ncollected on a per-deal basis, allowing the GP to get paid before LPs receive both their initial investment and their\npreferred rate of return (ie., the hurdle rate) on the entire fund."},{"id":"1-2-21","set":"1-2","number":21,"stem":"All else being equal, non-cumulative preference shares are more risky for\ninvestors than:","options":{"A":"cumulative preference shares.","B":"dividend-paying common shares.","C":"non-dividend-paying common shares."},"answer":"A","topic":"Equity Investments","page":5,"solution":"assets/solutions/1-2/21.jpg","confidence":"ocr","explanation":"because cumulative preference shares have lower risk than non-cumulative preference shares because\nthe cumulative feature gives investors the right to receive any unpaid dividends before any dividends can be paid\nto common shareholders"},{"id":"1-2-22","set":"1-2","number":22,"stem":"Which of the following statements is most likely correct regarding the spot and\nforward curves. The spot curve:","options":{"A":"can be calculated from the forward curve, and the forward curve can be\ncalculated from the spot curve.","B":"can be calculated from the forward curve, but the forward curve cannot be\ncalculated from the spot curve.","C":"cannot be calculated from the forward curve, but the forward curve can be\ncalculated from the spot curve."},"answer":"A","topic":"Mixed Topics","page":5,"solution":"assets/solutions/1-2/22.jpg","confidence":"ocr","explanation":"because the forward and spot curves are interconnected to each other. The spot curve can be calculated\nfrom the forward curve, and the forward curve can be calculated from the spot curve. Either curve can be used to\nvalue fixed-rate bonds."},{"id":"1-2-23","set":"1-2","number":23,"stem":"An investor sells a European put option with the following characteristics:\nPut price             30\nExercise price        600\n\nIf the price of the underlying at expiration is 620, the profit for the seller is:","options":{"A":"10.","B":"20.","C":"30."},"answer":"C","topic":"Derivatives","page":5,"solution":"assets/solutions/1-2/23.jpg","confidence":"ocr","explanation":"because to the put seller, the profit is [ = -Max(0,X — Sr) + po, where X is the exercise price, Sis the\nprice of the underlying at expiration, and p, is the put price. Therefore, 1 = —Max(0,600 — 620) + 30 = 30.\n\nForward Commitment and Contingent Claim Features and Instruments\n\n= determine the value at expiration and profit from a long or a short position in a call or put option"},{"id":"1-2-24","set":"1-2","number":24,"stem":"With respect to an investment policy statement, which of the following is best\nclassified as a legal and regulatory constraint?","options":{"A":"An investor's tax status","B":"A pension fund's self-investment limit","C":"An investor's desire to avoid investments in the gambling industry"},"answer":"B","topic":"Portfolio Management","page":5,"solution":"assets/solutions/1-2/24.jpg","confidence":"ocr","explanation":"because the IPS (investment policy statement) should state any legal and regulatory restrictions that\nconstrain how the portfolio is invested. In some countries, such institutional investors as pension funds are subject\nto restrictions on the composition of the portfolio. Pension funds also often face restrictions on the percentage of\nassets that can be invested in securities issued by the plan sponsor, so called self-investment limits"},{"id":"1-2-25","set":"1-2","number":25,"stem":"According to put-call-forward parity, the difference between the price of a put\nand the price of a call is most likely equal to the difference between:","options":{"A":"forward price and spot price discounted at the risk-free rate.","B":"spot price and exercise price discounted at the risk-free rate.","C":"exercise price and forward price discounted at the risk-free rate."},"answer":"C","topic":"Derivatives","page":5,"solution":"assets/solutions/1-2/25.jpg","confidence":"ocr","explanation":"because put-call-forward parity can be written as\nPo ~ G =1X— FMA + 7\nThis means that the difference between the price of a put and the price of a call is equal to the difference between\nexercise price and forward price discounted at the risk-free rate\nOption Replication Using Put—Call Parity\n= explain put-call forward parity for European options"},{"id":"1-2-26","set":"1-2","number":26,"stem":"With respect to a client's IPS, which of the following measures is most likely used\nwhen stating a relative risk objective?","options":{"A":"Value at risk","B":"Tracking risk","C":"Standard deviation of returns"},"answer":"B","topic":"Quantitative Methods","page":6,"solution":"assets/solutions/1-2/26.jpg","confidence":"ocr","explanation":"because quantitative risk objectives can be absolute or relative or a combination of the two. Some clients\nmay choose to express relative risk objectives, which relate risk relative to one or more benchmarks perceived to\nrepresent appropriate risk standards. For risk relative to a benchmark, the measure could be tracking risk, or\ntracking error."},{"id":"1-2-27","set":"1-2","number":27,"stem":"A call option is in the money if the exercise price minus the price of the\nunderlying at expiration is:","options":{"A":"less than zero.","B":"equal to zero.","C":"greater than zero."},"answer":"A","topic":"Derivatives","page":6,"solution":"assets/solutions/1-2/27.jpg","confidence":"ocr","explanation":"because when the underlying is beyond the exercise price in the appropriate direction (higher for a call,\nlower for a put), the option is said to be in the money. Thus, if the underlying value [at expiration] exceeds the\n‘exercise price (S; > X), then the option value is positive and equal to S;—X. The call option is then said to be in\nthe money. Accordingly, if X- S;<0, the call option is in the money."},{"id":"1-2-28","set":"1-2","number":28,"stem":"A 5% semi-annual pay bond with a par value of $1,000 is priced for settlement on\nFebruary 5. If interest payments are made on May 31 and November 30, accrued\ninterest based on 30/360 day-count convention is closest to:","options":{"A":"$9.03.","B":"$9.18.","C":"$9.31."},"answer":"A","topic":"Fixed Income","page":6,"solution":"assets/solutions/1-2/28.jpg","confidence":"ocr","explanation":"because accrued interest is calculated using Equation Al =T xPMT. Further, the 30/360 day-count\nconvention often is used for corporate bonds. It assumes that each month has 30 days and that a full year has 360\ndays. Therefore for settlement on February 5, interest will have accrued for two months and 5 days, or 65 days.\n(65/180) x (5.0/2) = 0.9028 per 100 par value ~ $9.03 per bond."},{"id":"1-2-29","set":"1-2","number":29,"stem":"An analyst gathers the following information about returns for an equity index:\nYear        Return %\n1              5\n2              3\n3             12\n\nThe index's total return over three years is closest to:","options":{"A":"18%.","B":"20%.","C":"21%."},"answer":"C","topic":"Mixed Topics","page":6,"solution":"assets/solutions/1-2/29.jpg","confidence":"ocr","explanation":"because the calculation of index values over multiple time periods requires geometrically linking the series\nof index returns. The formula is: Return = ((1 + Ry) x (1+ Ry) x (1 + Ri) - 1. Where R,,= retum in period x. ((1 +\n0.05) x (1 + 0.03) x (4 +0.12))-1=0.21 or 21%.\n\nSecurity Market Indexes\n\n= calculate and interpret the value, price return, and total return of an index"},{"id":"1-2-30","set":"1-2","number":30,"stem":"An analyst discovers that several stocks exhibit a pattern of price declines in the\nspring and price increases in the fall. If the analyst can consistently earn abnormal\nreturns using this information, the market is most likely.","options":{"A":"inefficient","B":"weak-form efficient.","C":"semi-strong-form."},"answer":"A","topic":"Mixed Topics","page":6,"solution":"assets/solutions/1-2/30.jpg","confidence":"ocr","explanation":"because weak form efficiency implies security prices reflect all past market data and investors cannot\npredict future price changes by extrapolating prices or patterns of prices from the past. If the analyst can profitably\ntrade on price patterns, then the market is not weak form efficient, and consequently cannot be semi-strong or\nstrong form efficient either."},{"id":"1-2-31","set":"1-2","number":31,"stem":"An investor gathered the following data:\nPar value of preferred stock offered with a 6% dividend rate      $100\nCompany's sustainable growth rate                    5%\nYield on comparable preferred stock issues                  11.5%\nInvestor's marginal tax rate                          30%\n\nThe value of the company's preferred stock is closest to:","options":{"A":"$52.17.","B":"$54.78.","C":"$96.92."},"answer":"A","topic":"Fixed Income","page":7,"solution":"assets/solutions/1-2/31.jpg","confidence":"ocr","explanation":"because the value of the company's preferred stock is given as:\nVo = Do/t = $100(0.06)/0.115 = $51.17"},{"id":"1-2-32","set":"1-2","number":32,"stem":"In an order-driven market, if the trade price is determined by the limit price of an\norder, the market most likely operates under the:","options":{"A":"uniform pricing rule.","B":"derivative pricing rule.","C":"discriminatory pricing rule."},"answer":"C","topic":"Derivatives","page":7,"solution":"assets/solutions/1-2/32.jpg","confidence":"ocr","explanation":"because under the discriminatory pricing rule the limit price of the order or quote that first arrived—the\nstanding order—determines the trade price.\n\nMarket Organization and Structure\n\n= describe how securities, contracts, and currencies are traded in quote-driven, order-driven, and brokered markets"},{"id":"1-2-33","set":"1-2","number":33,"stem":"An analyst gathers the following information on three investors. Each investor\nholds a bond with a Macaulay duration of 5.5 years in his portfolio:\n\nInvestment Horizon\nInvestor A            5 years\nInvestor B            2 years\nInvestor C            8 years\n\nAll else equal, which investor is currently most vulnerable to an increase in\ninterest rates?","options":{"A":"Investor A","B":"Investor B","C":"Investor C"},"answer":"B","topic":"Fixed Income","page":7,"solution":"assets/solutions/1-2/33.jpg","confidence":"ocr","explanation":"because Investor B has an investment horizon shorter than the Macaulay duration of 5.5 years. When the\ninvestment horizon is shorter than the Macaulay duration of the bond, market price risk dominates coupon\nreinvestment risk. The investor is vulnerable to higher interest rates"},{"id":"1-2-34","set":"1-2","number":34,"stem":"An analyst gathers the following data about three assets' returns:\nCorrelation with the Market\nAsset         Portfolio's Returns        Beta\n1                   0.8                1.000\n2                   0.7                1.225\n3                   0.5                1.125\nIf the market portfolio's standard deviation of returns is 20%, the asset with the\nhighest standard deviation is:","options":{"A":"Asset 1.","B":"Asset 2.","C":"Asset 3."},"answer":"C","topic":"Quantitative Methods","page":8,"solution":"assets/solutions/1-2/34.jpg","confidence":"ocr","explanation":"because beta is defined as: 8; = Pjm0;/ Om , 80 0) = (B;* Om)! Py,\nWhere: p; m is the correlation between Asset i and the market portfolio, 0; is the standard deviation of Asset i, and\nOm is the standard deviation of the market portfolio.\nAsset 1's standard deviation = (1.000 x 0.2)/0.8 = 0.25\nAsset 2's standard deviation = (1.225 x 0.2)/0.7 = 0.35\nAsset 3's standard deviation = (1.125 x 0.2)/0.5 = 0.45\nTherefore, the asset with the highest standard deviation is Asset 3, where standard deviation = 0.45"},{"id":"1-2-35","set":"1-2","number":35,"stem":"Jim Cotter is considering investing in a stock index fund and a property\ninvestment fund. His planned investment amounts, fund returns, and standard\ndeviations are given in the table. The correlation between the two funds is -0.1.\nFund         Investment Amount  Expected Return  Standard Deviation\nStock index          10M            20%            35%\nProperty investment       90M            33%            70%\nThe portfolio's standard deviation is closest to:","options":{"A":"62.75%.","B":"63.10%","C":"63.45%."},"answer":"A","topic":"Quantitative Methods","page":8,"solution":"assets/solutions/1-2/35.jpg","confidence":"ocr","explanation":". The standard deviation of the portfolio is calculated as follows\n0, = y/(0.17 x 0.35?) + (0.9? x 0.77) + 2 x 0.1 x 0.9 x (0.1) x 0.35 x 0.7)\n= 62.75%"},{"id":"1-2-36","set":"1-2","number":36,"stem":"For an option-free bond, effective duration:","options":{"A":"will be equal to modified duration if the yield curve is absolutely flat.","B":"measures interest rate risk for both parallel and non-parallel benchmark yield\ncurve shifts.","C":"is an estimate of the percentage change in bond price given a change in the\nbond's yield to maturity."},"answer":"A","topic":"Fixed Income","page":8,"solution":"assets/solutions/1-2/36.jpg","confidence":"ocr","explanation":"because the effective duration and modified duration of an option-free bond are identical only in the rare\ncircumstance of an absolutely flat yield curve. Typically, the two duration measures will differ, but the difference\nnarrows when the yield curve is flatter, the bond's time to maturity is shorter, and the bond is priced closer to its par\nvalue."},{"id":"1-2-37","set":"1-2","number":37,"stem":"An analyst observes that stock markets usually demonstrate return distributions\nconcentrated to the right with a higher frequency of negative deviation from the\nmean. This feature is most likely known as:","options":{"A":"kurtosis.","B":"positive skewness.","C":"negative skewness."},"answer":"C","topic":"Quantitative Methods","page":8,"solution":"assets/solutions/1-2/37.jpg","confidence":"ocr","explanation":"because the negatively skewed investment characteristic is usually related to the stock retums whose\ndistribution is concentrated to the right.\nPortfolio Risk and Return: Part |\n= describe characteristics of the major asset classes that investors consider in forming portfolios"},{"id":"1-2-38","set":"1-2","number":38,"stem":"Which of the following statements is most accurate? In derivatives pricing:","options":{"A":"investors are assumed to be risk averse.","B":"expected payoffs of the derivative can be discounted at the risk-free rate.","C":"a portfolio consisting of the underlying and the derivative must earn the\nrisk-free rate plus a risk premium."},"answer":"B","topic":"Derivatives","page":9,"solution":"assets/solutions/1-2/38.jpg","confidence":"ocr","explanation":"because the risk aversion of the investor is not relevant to pricing the derivative, one can just as easily\nobtain the derivative price by assuming that the investor is risk neutral. That means that the expected payoff of the\nderivative can be discounted at the risk-free rate rather than the risk-free rate plus a risk premium."},{"id":"1-2-39","set":"1-2","number":39,"stem":"Which of the following statements about digital assets is most accurate?","options":{"A":"Most have an inherent value based on the expected cash flow","B":"They can be purchased through indirect investment vehicles such as hedge\nfunds","C":"They are generally recorded in private ledgers maintained by central\nintermediaries"},"answer":"B","topic":"Mixed Topics","page":9,"solution":"assets/solutions/1-2/39.jpg","confidence":"ocr","explanation":"because the main similarity between digital assets and traditional financial assets is the emergence of\nindirect investment vehicles such as exchange-traded funds and hedge funds that invest both in traditional financial\nassets and in digital assets."},{"id":"1-2-40","set":"1-2","number":40,"stem":"The portion of a bond's value that an investor loses in an event of default best\ndefines:","options":{"A":"default risk.","B":"loss severity","C":"expected loss."},"answer":"B","topic":"Fixed Income","page":9,"solution":"assets/solutions/1-2/40.jpg","confidence":"ocr","explanation":"because credit risk has two components. The second component is loss severity (also known as “loss\ngiven default’) in the event of default—that is, the portion of a bond’s value (including unpaid interest) an investor\nloses."},{"id":"1-2-41","set":"1-2","number":41,"stem":"Which investment will most likely expose investors to the greatest level of\nextension risk?","options":{"A":"Commercial mortgage-backed securities with a balloon payment","B":"Shorter-term tranches in a collateralized mortgage obligation structure","C":"Planned amortization class tranches in a collateralized mortgage obligation\nstructure"},"answer":"A","topic":"Fixed Income","page":9,"solution":"assets/solutions/1-2/41.jpg","confidence":"ocr","explanation":"because many commercial loans backing commercial mortgage-backed securities (CMBS) are balloon\nloans that require significant repayment of principal at maturity. The risk that the borrower will not be able to make\nthe balloon payment is called balloon risk. The lender may decide to extend the loan over a period of time called the\nworkout period. Because the term of the loan can be extended, balloon risk is a type of extension risk"},{"id":"1-2-42","set":"1-2","number":42,"stem":"A fiduciary call is equal to which of the following positions?","options":{"A":"Long a call and long a risk-free bond","B":"Long a call, long a risk-free bond, and short a put","C":"Long a call, short the underlying, and long a risk-free bond"},"answer":"A","topic":"Fixed Income","page":9,"solution":"assets/solutions/1-2/42.jpg","confidence":"ocr","explanation":"because a fiduciary call consists of a long call and long bond."},{"id":"1-2-43","set":"1-2","number":43,"stem":"An analyst gathers the following information about a company:\nNext year's EPS forecast            $0.60\nDividend payout ratio           45%\nGrowth rate                7%\nUsing the Gordon growth model, if the analyst's required return is 10%, the\njustified forward P/E for the company is closest to:","options":{"A":"15.","B":"18.","C":"20."},"answer":"A","topic":"Mixed Topics","page":10,"solution":"assets/solutions/1-2/43.jpg","confidence":"ocr","explanation":"because the justified forward P/E = p/r—g, where pis the dividend payout ratio, ris the required return\nand gis the growth rate. P/E = 0.45 / (0.10 — 0.07) = 0.45 / 0.03 =15."},{"id":"1-2-44","set":"1-2","number":44,"stem":"An analyst gathers the following information about a company and its common\nstock:\n\nExpected dividend per share (D1)        $2\nEstimated dividend growth rate       4%\nReturn on equity               9%\n\nBased on the Gordon growth model, if the required rate of return increases from\n8%to 14%, the value of the stock decreases by:","options":{"A":"50%","B":"60%.","C":"75%."},"answer":"B","topic":"Mixed Topics","page":10,"solution":"assets/solutions/1-2/44.jpg","confidence":"ocr","explanation":"because the estimated value (Vp) is expressed as:\nVo = 2\nWhere: D; = next year's expected dividend\nr= required return\ng = dividend growth rate\nUnder the two required rate of return scenarios, the value is\nT= 8%: Vo = 2/ (0.08 — 0.04) = 2/ 0.04 = $50\nT= 14%: Vo =2/ (0.14 - 0.04) = 2/ 0.10 = $20\nWhen the required rate of return increases to 14%, the value estimate decreases $30 from $50, or 60%"},{"id":"1-2-45","set":"1-2","number":45,"stem":"Which of the following derivative contracts has a hard commodity underlying?","options":{"A":"Cattle futures","B":"Soybean futures","C":"Aluminum futures"},"answer":"C","topic":"Derivatives","page":10,"solution":"assets/solutions/1-2/45.jpg","confidence":"ocr","explanation":"because aluminum futures are an example of a metals contract, which is a derivative with a hard\ncommodity underlying,\n\nDerivative Instrument and Derivative Market Features\n\n= define a derivative and describe basic features of a derivative instrument"},{"id":"1-2-46","set":"1-2","number":46,"stem":"The historical results forecasting approach is most appropriate for a company:","options":{"A":"making a large acquisition.","B":"operating in a cyclical industry.","C":"with a low sensitivity to the business cycle."},"answer":"C","topic":"Economics","page":10,"solution":"assets/solutions/1-2/46.jpg","confidence":"ocr","explanation":"because the historical results forecasting approach may be appropriate for companies operating in\nindustries where the analyst does not expect the industry structure (e.g., Porter’s Five Forces, PESTLE influences)\nto change, as well as for companies that have a low sensitivity to changes in the business cycle.\n\nCompany Analysis: Forecasting\n\n= explain principles and approaches to forecasting a company’s financial results and position"},{"id":"1-2-47","set":"1-2","number":47,"stem":"At the initiation of a securitization, the primary role of the special purpose entity\nis to:","options":{"A":"sell the collateral.","B":"service the collateral.","C":"purchase the collateral."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/1-2/47.jpg","confidence":"ocr","explanation":"because the three main parties to a securitization are the seller of the collateral, sometimes called the\ndepositor, the SPE that purchases the loans or receivables and uses them as collateral to issue the ABS and the\nservicer of the loans. Therefore the SPE purchases the collateral\n\nFixed-Income Securitization\n\n= describe securitization, including the parties and the roles they play"},{"id":"1-2-48","set":"1-2","number":48,"stem":"Investing in correctional facilities to be constructed and sold to the government is\nbest described as a(n):","options":{"A":"greenfield investment.","B":"brownfield investment.","C":"an economic infrastructure investment."},"answer":"A","topic":"Alternative Investments","page":11,"solution":"assets/solutions/1-2/48.jpg","confidence":"ocr","explanation":"because infrastructure investments can also be categorized by the underlying assets’ stage of\ndevelopment. Greenfield investments, developing new assets and new infrastructure, are opportunistic\ninvestments. The intent may be to lease or sell the assets to the government after construction or to hold and\noperate the assets. If they are held, it can be over the long term or for a shorter period until operational maturity,\nwith subsequent sale to new investors, thus ensuring capital appreciation to reflect the construction and\n‘commissioning risk."},{"id":"1-2-49","set":"1-2","number":49,"stem":"On 1 January, an investor purchases an option-free bond that pays an annual\ncoupon rate of 10% on Dec 31 and matures in ten years at its par value of\n$100.The investor plans to sell the bond immediately after receiving the seventh\ncoupon. If the coupons are reinvested at an annual interest rate of 8% over the\ninvestor's holding period, the future value of the reinvested coupon payments at\nthe end of the investor's holding period is closest to:","options":{"A":"$70.00","B":"$75.90.","C":"$89.23."},"answer":"C","topic":"Fixed Income","page":11,"solution":"assets/solutions/1-2/49.jpg","confidence":"ocr","explanation":"because the future value of the reinvested coupon payments is computed as the sum of payments, with\neach payment compounded at reinvestment rate of 8% for the number of years remaining in the holding period. The\ncalculation is as follows:\n10(1.08)8 + 10(1.08)5 + 10(1.08)* + 101.08) + 10(1.08)? + 10(1.08)' + 10 = 89.23\nInterest Rate Risk and Return\n= calculate and interpret the sources of return from investing in a fixed-rate bond;"},{"id":"1-2-50","set":"1-2","number":50,"stem":"An analyst gathers the following information (in $ millions) about a company's\nfiscal year:\nNet income                     1,500\nAverage total assets             11,500\nAverage shareholders' equity      7,500\nIf the dividend payout ratio is 45%, the sustainable growth rate is closest to:","options":{"A":"7%.","B":"9%.","C":"11%."},"answer":"C","topic":"Mixed Topics","page":11,"solution":"assets/solutions/1-2/50.jpg","confidence":"ocr","explanation":"because the sustainable growth rate = Retention rate x ROE, where the retention rate = (1— payout ratio)\nand ROE = Net income / Average shareholders’ equity.\nThus sustainable growth rate = (1 — 0.45) x 1,500/7,500 = 0.55 x 0.2 = 0.11 = 11%\n\nEquity Valuation: Concepts and Basic Tools\n\n= calculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend\n\ndiscount model or a two-stage dividend discount model, as appropriate"},{"id":"1-2-51","set":"1-2","number":51,"stem":"In an efficient market, asset prices most likely react to the release of:","options":{"A":"expected information only.","B":"unexpected information only.","C":"both expected information and unexpected information."},"answer":"B","topic":"Mixed Topics","page":11,"solution":"assets/solutions/1-2/51.jpg","confidence":"ocr","explanation":"because in an efficient market, prices should be expected to react only to the elements of information\nreleases that are not anticipated fully by investors — that is, to the ‘unexpected’ or ‘surprise’ element of such\nreleases"},{"id":"1-2-52","set":"1-2","number":52,"stem":"The multiple of invested capital (MOIC) measure takes into account.","options":{"A":"the realized value of an investment only.","B":"the residual asset value of an investment only.","C":"both the realized value of an investment and the residual asset value of an\ninvestment."},"answer":"C","topic":"Mixed Topics","page":11,"solution":"assets/solutions/1-2/52.jpg","confidence":"ocr","explanation":"because MOIC is calculated as follows: MOIC = (Realized value of investment + Unrealized [or residual]\nvalue of investment)/(Total amount of invested capital). With MOIC, one simply measures the total value of all\nrealized investments and residual asset values (assets that may still be awaiting their ultimate sale) relative to an\ninitial total investment.\n\nAlternative Investment Performance and Returns\n\n= describe the performance appraisal of alternative investments"},{"id":"1-2-53","set":"1-2","number":53,"stem":"Consider two 10-year bonds, one that contains no embedded options and the other\nthat gives its owner the right to convert the bond to a fixed number of shares of\nthe issuer's common stock. The convertibility option in the second bond cannot be\nexercised for five years. The bonds are otherwise identical. Compared with the\nyield on the convertible bond, the yield on the option-free bond is most likely.","options":{"A":"lower.","B":"the same.","C":"higher."},"answer":"C","topic":"Fixed Income","page":12,"solution":"assets/solutions/1-2/53.jpg","confidence":"inferred","explanation":""},{"id":"1-2-54","set":"1-2","number":54,"stem":"The type of index weighting system in which a stock split on one constituent\nsecurity changes the weights on all the securities in the index is:","options":{"A":"price weighting.","B":"equal weighting.","C":"value weighting."},"answer":"A","topic":"Mixed Topics","page":12,"solution":"assets/solutions/1-2/54.jpg","confidence":"ocr","explanation":"because a property unique to price-weighted indexes is that a stock split on one constituent security\nchanges the weights on all the securities in the index."},{"id":"1-2-55","set":"1-2","number":55,"stem":"Two assets are correctly priced according to the CAPM. If the assets have the\nsame expected variance of returns but different expected returns, the two assets\nmust have different levels of:","options":{"A":"systematic risk only.","B":"unsystematic risk only.","C":"both systematic risk and unsystematic risk."},"answer":"C","topic":"Portfolio Management","page":12,"solution":"assets/solutions/1-2/55.jpg","confidence":"ocr","explanation":"because the CAPM asserts that the expected returns of assets vary only by their systematic risk as\nmeasured by beta. Hence, if the two assets have different expected returns and are correctly priced according to\nthe CAPM, they must have different levels of systematic risk. Moreover, Total variance = Systematic variance +\nNonsystematic variance. Although the equality relationship is between variances, you will find frequent references\nto total risk as the sum of systematic risk and nonsystematic risk. The assets must have different levels of\nunsystematic risk since their total variances are the same but they each have different levels of systematic\nvariancelrisk."},{"id":"1-2-56","set":"1-2","number":56,"stem":"An analyst gathers the following information about a market for a stock:\nBest offer                     $48\nMarket bid-ask spread           $2\nIf a new sell limit order is placed at $49, the limit order.","options":{"A":"takes the market.","B":"makes the market.","C":"is behind the market."},"answer":"C","topic":"Mixed Topics","page":12,"solution":"assets/solutions/1-2/56.jpg","confidence":"ocr","explanation":"because a sell order placed above the best offer is behind the market. In this example the sell order [$49]\nis placed above the best offer [$48] and is therefore behind the market\n\nMarket Organization and Structure\n\n= compare market orders with limit orders"},{"id":"1-2-57","set":"1-2","number":57,"stem":"Which of the following statements regarding certificates of deposit (CDs) is most\naccurate?","options":{"A":"Small-denomination CDs are typically traded among institutional investors.","B":"Non-negotiable CDs can be sold in the open market prior to the maturity\ndate.","C":"CDs are available in domestic bond markets as well as in the Eurobond\nmarket."},"answer":"C","topic":"Fixed Income","page":12,"solution":"assets/solutions/1-2/57.jpg","confidence":"ocr","explanation":"because like other money market securities, CDs are available in domestic bond markets as well as in the\nEurobond market.\n\nFixed-Income Markets for Corporate Issuers\n\n= compare short-term funding alternatives available to corporations and financial institutions"},{"id":"1-2-58","set":"1-2","number":58,"stem":"Which of the following lines is depicted on a graph using systematic risk on the\nhorizontal axis?","options":{"A":"Capital market line (CML)","B":"Security market line (SML)","C":"Capital allocation line (CAL)"},"answer":"B","topic":"Portfolio Management","page":13,"solution":"assets/solutions/1-2/58.jpg","confidence":"ocr","explanation":"because the security market line (SML) is a graphical representation of the capital asset pricing model with\nbeta reflecting systematic risk, on the x-axis and expected retumn on the y-axis."},{"id":"1-2-59","set":"1-2","number":59,"stem":"Which of the following investors is least likely to be concerned about liquidity\nrisk?","options":{"A":"A manager of a fixed-income mutual fund","B":"An individual investor intending to hold a bond to maturity","C":"An investor using repurchase agreements to purchase bonds"},"answer":"B","topic":"Fixed Income","page":13,"solution":"assets/solutions/1-2/59.jpg","confidence":"ocr","explanation":"because the liquidity risk refers to the transaction costs associated with selling a bond. More specifically,\nmarket liquidity risk refers to the risk that the price at which investors can actually transact may differ from the price\nindicated in the market. An investor who plans to hold the bond to maturity most likely would not be concerned with\nliquidity risk as it does not intend to sell the bond."},{"id":"1-2-60","set":"1-2","number":60,"stem":"Information-motivated traders are most likely to differ from pure investors in that\nthey:","options":{"A":"pay lower transaction fees.","B":"expect to earn excess returns.","C":"hold well-diversified portfolios."},"answer":"B","topic":"Portfolio Management","page":13,"solution":"assets/solutions/1-2/60.jpg","confidence":"ocr","explanation":", information-motivated traders expect to earn returns in excess of market returns because they trade on\nsecurities they believe the market has over- or undervalued. Unlike pure investors, they expect to earn a return on\ntheir information in addition to the normal return expected for bearing risk. Excess returns are generated when the\nmarket recognizes and corrects the valuation error on such a security."},{"id":"1-2-61","set":"1-2","number":61,"stem":"An investor bears more risk than  initially thought because of the failure to\nconsider the interaction of credit risk and market risk. This type of risk interaction\nis best described as:","options":{"A":"solvency risk.","B":"wrong-way risk.","C":"operational risk."},"answer":"B","topic":"Mixed Topics","page":13,"solution":"assets/solutions/1-2/61.jpg","confidence":"ocr","explanation":"because the investor's expected payoff is lower as a result of facing a credit risk that is compounded by\nmarket risk. Thus, the investor bears much more risk than initially thought as a result of the failure to consider the\ninteraction of the two risks this sort of risk interaction is so common in markets that practitioners have given it a very\nfitting term—wrong-way risk.’"},{"id":"1-2-62","set":"1-2","number":62,"stem":"Which  of  the  following  industry  classification  schemes  cover  private\ncompanies, non-profits, and government entities?","options":{"A":"The Industry Classification Benchmark (ICB)","B":"The Refinitiv Business Classification (TRBC)","C":"The Global Industry Classification Standard (GICS)"},"answer":"B","topic":"Mixed Topics","page":13,"solution":"assets/solutions/1-2/62.jpg","confidence":"ocr","explanation":"because GICS and ICB cover public companies, while TRBC also covers private companies, non-profits,\nand government entities"},{"id":"1-2-63","set":"1-2","number":63,"stem":"A high-quality and a high-yield corporation are each issuing subordinated debt\nwith similar characteristics. Compared to the high-yield issuer, the notching\nadjustment for the high-quality issuer will most likely be:","options":{"A":"smaller.","B":"the same.","C":"larger."},"answer":"A","topic":"Fixed Income","page":13,"solution":"assets/solutions/1-2/63.jpg","confidence":"ocr","explanation":"because as a general rule, the higher the senior unsecured rating, the smaller the notching adjustment will\nbe. The reason behind this is that the higher the rating, the lower the perceived risk of default, so the need to ‘notch’\nthe rating to capture the potential difference in loss severity is greatly reduced. For lower-rated credits, however, the\nrisk of default is greater and thus the potential difference in loss from a lower (or higher) priority ranking is a bigger\nconsideration in assessing an issue's credit riskiness. Thus, the rating agencies will typically apply larger rating\nadjustments."},{"id":"1-2-64","set":"1-2","number":64,"stem":"The holders of common shares of a company are legally entitled to:","options":{"A":"receive regular dividends from the company.","B":"a repayment of the purchase price of their shares.","C":"a claim on the company's net assets in the event of liquidation."},"answer":"C","topic":"Equity Investments","page":14,"solution":"assets/solutions/1-2/64.jpg","confidence":"ocr","explanation":"because common shares represent an ownership interest in a company and are the predominant type of\nequity security. As a result, investors share in the operating performance of the company, participate in the\ngovernance process through voting rights, and have a claim on the company's net assets in the case of liquidation\n\nOverview of Equity Securities\n\n= describe characteristics of types of equity securities"},{"id":"1-2-65","set":"1-2","number":65,"stem":"Which of the following categories of private debt most likely has the highest level\nof risk for an investor?","options":{"A":"Mezzanine debt","B":"Senior direct debt","C":"Infrastructure debt"},"answer":"A","topic":"Alternative Investments","page":14,"solution":"assets/solutions/1-2/65.jpg","confidence":"ocr","explanation":"because mezzanine debt is riskier than senior secure debt which is riskier than infrastructure debt\n(graphically displayed by the Private Capital Risk and Retum Levels by Category chart). Because of its typically\njunior ranking and its usually unsecured status, mezzanine debt is riskier than senior secured debt. Investments in\nprivate capital vary in terms of risk and return across the corporate capital structure hierarchy. Typically, private\n‘equity, as the riskiest alternative, offers the highest returns, with private debt retums declining on a continuum down\nto the safest, most secured form of debt—infrastructure debt."},{"id":"1-2-66","set":"1-2","number":66,"stem":"Hedge funds are least likely to have restrictions concerning:","options":{"A":"the use of derivatives.","B":"the withdrawal of invested funds.","C":"the number of investors in the fund."},"answer":"A","topic":"Derivatives","page":14,"solution":"assets/solutions/1-2/66.jpg","confidence":"ocr","explanation":"because the use of derivatives is a typical feature of contemporary hedge funds."},{"id":"1-2-67","set":"1-2","number":67,"stem":"After issuance, the coupon rate of a floating-rate bond is most likely influenced\nby  changes in:","options":{"A":"the reference rate only.","B":"the issuer's credit quality only.","C":"both the reference rate and the issuer's credit quality."},"answer":"A","topic":"Fixed Income","page":14,"solution":"assets/solutions/1-2/67.jpg","confidence":"ocr","explanation":"because the coupon rate of a floating rate bond is typically expressed as a reference rate plus a spread or\nmargin. The spread is usually set when the bond is issued and remains constant until maturity. The reference rate,\nhowever, resets periodically. Therefore, the coupon rate adjusts to the level of market interest rates each time the\nreference rate is reset"},{"id":"1-2-68","set":"1-2","number":68,"stem":"An investor buys a stock for $108 on margin by posting 40% of the initial stock\nprice as equity. If the maintenance margin requirement for the position is 20%, a\nmargin call first occurs when the price falls below:","options":{"A":"$64.80.","B":"$81.00.","C":"$86.40."},"answer":"B","topic":"Mixed Topics","page":14,"solution":"assets/solutions/1-2/68.jpg","confidence":"ocr","explanation":"because the price below which a margin call will take place is calculated with the following equation\n(Equity/share) / (Price/share) = ($43.20 + P — $108)/P = 20%, which can be solved for P = $81.00."},{"id":"1-2-69","set":"1-2","number":69,"stem":"All else being equal, which of the following statements based on the binomial\nmodel is accurate? When the volatility of the underlying increases, the value of a:","options":{"A":"put option and the value of a call option on the underlying will increase.","B":"put option on the underlying will increase while the value of a call option on\nthe underlying will decrease.","C":"call option on the underlying will increase while the value of a put option on\nthe underlying will decrease."},"answer":"A","topic":"Derivatives","page":14,"solution":"assets/solutions/1-2/69.jpg","confidence":"ocr","explanation":"because if volatility increases, the difference between S,* and S,- increases, which widens the range\nbetween c;. and ¢~ , leading to a higher option value. Changing the c’s to p's leads to the same pricing formula for\nput options as for call options. Therefore both put and call option values will increase"},{"id":"1-2-70","set":"1-2","number":70,"stem":"An analyst calculates the duration of a portfolio containing only fixed-rate\nbonds, callable bonds, and asset-backed securities. Which duration measure is the\nmost appropriate to use?","options":{"A":"Macaulay duration","B":"Effective duration","C":"Modified duration"},"answer":"B","topic":"Fixed Income","page":15,"solution":"assets/solutions/1-2/70.jpg","confidence":"ocr","explanation":"because effective duration is suitable for instruments with uncertain future cash flows like callable bonds,\nsince in brief, a callable bond does not have a well-defined internal rate of return (yield-to-maturity). Therefore, yield\nduration statistics, such as modified and Macaulay durations, do not apply; effective duration is the appropriate\nduration measure"},{"id":"1-2-71","set":"1-2","number":71,"stem":"Consider a put option selling for $4 in which the exercise price is $58. What is\nthe profit for a put buyer if the price of the underlying at expiration is $57?","options":{"A":"-$3","B":"$1","C":"$3"},"answer":"A","topic":"Derivatives","page":15,"solution":"assets/solutions/1-2/71.jpg","confidence":"ocr","explanation":"because the put’s value at expiration = pr = Max(0,X — S;), where pr is the value of the put at expiration, X\nis the exercise price, and S;is the price of the underlying at expiration. In this case, Max(0,58 — 57) = $1. The put\nbuyer's profit = M = py—o (where po is the price of the put at time 0) = 1-4 = -$3."},{"id":"1-2-72","set":"1-2","number":72,"stem":"A short exposure to an underlying instrument is achieved by:","options":{"A":"writing a put option.","B":"buying a put option.","C":"buying a call option."},"answer":"B","topic":"Derivatives","page":15,"solution":"assets/solutions/1-2/72.jpg","confidence":"ocr","explanation":"because put contract holders [buyers] have long exposure to their option contract and short exposure to\nthe underlying instrument."},{"id":"1-2-73","set":"1-2","number":73,"stem":"All else equal, interest rate risk is lowest for which of the following non-callable\nbonds?","options":{"A":"Discount","B":"Premium","C":"Zero-coupon"},"answer":"B","topic":"Fixed Income","page":15,"solution":"assets/solutions/1-2/73.jpg","confidence":"ocr","explanation":"because, all else equal, high-coupon bonds have less interest rate risk (lower duration) than low-coupon\nbonds. Therefore, a bond trading at a premium will have lower interest rate risk than a comparable zero-coupon or\ndiscount bond."},{"id":"1-2-74","set":"1-2","number":74,"stem":"Which of the following types of investors most likely has the highest risk\ntolerance?","options":{"A":"Banks","B":"Endowments","C":"Insurance companies"},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/1-2/74.jpg","confidence":"ocr","explanation":"because the risk tolerance of endowments is typically high whereas the risk tolerance of insurance\ncompanies are typically quite low. The risk tolerance of banks is quite low. Therefore, the risk tolerance of\nendowments is highest."},{"id":"1-2-75","set":"1-2","number":75,"stem":"For an investor with a long position, the price of a futures contract will most\nlikely be higher than the price on a forward contract on the same asset with the same\nexpiration date if there is a:","options":{"A":"negative correlation between the futures price and interest rates.","B":"zero correlation between the futures price and interest rates.","C":"positive correlation between the futures price and interest rates."},"answer":"C","topic":"Derivatives","page":15,"solution":"assets/solutions/1-2/75.jpg","confidence":"ocr","explanation":"because if there is a positive correlation between futures prices and interest rates, an investor with a long\nposition will favor futures over forwards because rising prices lead to futures profits that are reinvested at higher\ninterest rates. With forwards, all the gains are received at expiration and thus there is no gain from reinvestment.\n\nPricing and Valuation of Futures Contracts\n\n= explain why forward and futures prices differ"},{"id":"1-2-76","set":"1-2","number":76,"stem":"Which of the following investments most likely provides an investor with indirect\nequity exposure to real estate?","options":{"A":"Real estate investment trusts","B":"Real estate limited partnerships","C":"Commercial mortgage-backed securities"},"answer":"A","topic":"Fixed Income","page":16,"solution":"assets/solutions/1-2/76.jpg","confidence":"ocr","explanation":"because real estate investment trusts (REITs) provide investors with indirect equity real estate exposure.\nReal estate limited partnerships are a form of direct real estate equity investment. Commercial mortgage-backed\nsecurities (CMBS) provide investors with indirect debt investment opportunities in real estate"},{"id":"1-2-77","set":"1-2","number":77,"stem":"Two risk managers are discussing how an organization's risk tolerance should be\ndetermined. The first manager says, \"The risk tolerance must reflect the losses or\nshortfalls that will cause the organization to fail to meet critical objectives.\" The\nsecond manager responds,\" The risk tolerance must reflect the external forces that\nbring uncertainty to the organization.\" Which of them is most likely correct?","options":{"A":"Both risk managers","B":"The first risk manager","C":"The second risk manager"},"answer":"A","topic":"Mixed Topics","page":16,"solution":"assets/solutions/1-2/77.jpg","confidence":"ocr","explanation":"because the risk tolerance of an organization should reflect both an “inside” view and an “outside” view.\nThe inside view asks what level of loss will leave the organization unable to meet critical objectives. The outside\nview asks what sources of uncertainty or risk the organization faces"},{"id":"1-2-78","set":"1-2","number":78,"stem":"In contrast to a contingent claim, a forward commitment creates counterparty risk\nfor.","options":{"A":"the long position only.","B":"the short position only.","C":"both the long and the short positions."},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/1-2/78.jpg","confidence":"ocr","explanation":"because a firm commitment requires both counterparties to perform under a derivative contract\n[introducing counterparty risk], while an option [a contingent claim] buyer can decide whether to perform under the\ncontract at maturity depending on the underlying price relative to the exercise price.\n\nForward Commitment and Contingent Claim Features and Instruments.\n\n= contrast forward commitments with contingent claims"},{"id":"1-2-79","set":"1-2","number":79,"stem":"Management fees for private equity funds are most likely based on:","options":{"A":"invested capital.","B":"committed capital","C":"assets under management."},"answer":"B","topic":"Alternative Investments","page":16,"solution":"assets/solutions/1-2/79.jpg","confidence":"ocr","explanation":"because private equity funds raise committed capital and draw down on those commitments, generally\nover three to five years, when they have a specific investment to make. Note that the management fee is typically\nbased on committed capital, not invested capital; the committed-capital basis for management fees is an important\ndistinction from hedge funds, whose management fees are based on assets under management (AUM)."},{"id":"1-2-80","set":"1-2","number":80,"stem":"Which of the following offers the flexibility of delaying harvests when their\nprices are down?","options":{"A":"Farmland only","B":"Timberland only","C":"Both farmland and timberland"},"answer":"B","topic":"Mixed Topics","page":16,"solution":"assets/solutions/1-2/80.jpg","confidence":"ocr","explanation":"because timberland serves as both a factory and a warehouse. Timber (trees) can be grown (ie.,\ntimberland's factory characteristic) and easily stored by simply not harvesting the trees (‘., timberland’s\nwarehouse characteristic). This characteristic offers the flexibility of harvesting when timber prices are up and\ndelaying harvests when prices are down."},{"id":"1-2-81","set":"1-2","number":81,"stem":"Compared with co-investing, direct investing in alternative investments most\nlikely offers:","options":{"A":"reduced control over the investment selection process.","B":"the same level of control over the investment selection process.","C":"higher control over the investment selection process."},"answer":"C","topic":"Alternative Investments","page":16,"solution":"assets/solutions/1-2/81.jpg","confidence":"ocr","explanation":"because co-investing offers reduced control over the investment selection process compared with direct\ninvesting. Hence, direct investing offers higher control over the investment selection process\n\nAlternative Investment Features, Methods, and Structures\n\n= compare direct investment, co-investment, and fund investment methods for alternative investments"},{"id":"1-2-82","set":"1-2","number":82,"stem":"An investor who prefers an asset with an uncertain expected payoff of $50 to a\nguaranteed payoff of $50 is best described as:","options":{"A":"risk averse.","B":"risk neutral.","C":"risk seeking"},"answer":"C","topic":"Derivatives","page":17,"solution":"assets/solutions/1-2/82.jpg","confidence":"ocr","explanation":"because the expected value in both cases is $50, one with certainty and the other with uncertainty. If an\ninvestor chooses the gamble (the option with uncertainty), then the investor is said to be risk loving or risk seeking"},{"id":"1-2-83","set":"1-2","number":83,"stem":"Which of the following market anomalies describes the consistent\noutperformance of stocks with low P/E ratios?","options":{"A":"The size effect","B":"The value effect","C":"The earnings surprise anomaly"},"answer":"B","topic":"Mixed Topics","page":17,"solution":"assets/solutions/1-2/83.jpg","confidence":"ocr","explanation":"because the value effect is based on the observation that stocks that have below-average price-to-\nearings (P/E) have consistently outperformed growth stocks over long periods of time."},{"id":"1-2-84","set":"1-2","number":84,"stem":"The Procedures section of an investment policy statement (IPS) most likely:","options":{"A":"explains the steps to keep the IPS current.","B":"provides information about the permissible use of leverage.","C":"details the investor's policy with respect to rebalancing asset class weights."},"answer":"A","topic":"Portfolio Management","page":17,"solution":"assets/solutions/1-2/84.jpg","confidence":"ocr","explanation":"because the Procedures section of the IPS explains the steps to take to keep the IPS current and the\nprocedures to follow to respond to various contingencies."},{"id":"1-2-85","set":"1-2","number":85,"stem":"In a positive interest rate environment, the modified duration of an option-free\nbond is most likely:","options":{"A":"less than the Macaulay duration.","B":"the same as the Macaulay duration.","C":"greater than the Macaulay duration."},"answer":"A","topic":"Fixed Income","page":17,"solution":"assets/solutions/1-2/85.jpg","confidence":"ocr","explanation":"because the calculation of the modified duration (ModDur) statistic of a bond requires a simple adjustment\nto Macaulay duration. It is the Macaulay duration statistic divided by one plus the yield per period. If interest rates\nare positive, modified duration is less than Macaulay duration because the denominator in the calculation is greater\nthan 1"},{"id":"1-2-86","set":"1-2","number":86,"stem":"Which of the following asset-backed securities provides the highest level of\nprotection against prepayment risk?","options":{"A":"A mortgage pass-through security","B":"A collateralized mortgage obligation","C":"A commercial mortgage-backed security"},"answer":"C","topic":"Fixed Income","page":17,"solution":"assets/solutions/1-2/86.jpg","confidence":"ocr","explanation":"because a critical investment feature that distinguishes CMBS from RMBS is the protection against early\nprepayments available to investors known as call protection. An investor in an RMBS is exposed to considerable\nprepayment risk because the borrower has the right to prepay a loan, in whole or in part, before the scheduled\nprincipal repayment date. The discussion of CMOs highlighted how investors can purchase certain types of\ntranches to modify or reduce prepayment risk. CMBS investors have considerable call protection, which results in\nCMBS trading more like corporate bonds than RMBS.\n\nMortgage-Backed Security (MBS) Instrument and Market Features\n\n= describe characteristics and risks of commercial mortgage-backed securities"},{"id":"1-2-87","set":"1-2","number":87,"stem":"Consider a $100 par value bond with a 7% coupon paid annually and five years to\nmaturity. At a discount rate of 6.5%, the value of the bond today is $102.08. One\nday later, the discount rate increases to 7.5%. Assuming the discount rate remains\nat 7.5% over the remaining life of the bond, what is most likely to occur to the\nprice of the bond between today and maturity? The price:","options":{"A":"decreases then increases.","B":"increases then decreases.","C":"decreases then remains unchanged."},"answer":"A","topic":"Fixed Income","page":17,"solution":"assets/solutions/1-2/87.jpg","confidence":"ocr","explanation":"because if the discount rate increases to 7.5% from 6.5%, the price of a bond decreases. Ata discount\nrate of 7.5%, the bond sells at a discount to face value. As a discount bond approaches maturity, it will increase in\nprice over time until it reaches par at maturity."},{"id":"1-2-88","set":"1-2","number":88,"stem":"Which  of  the  following  best  describes  an  investment  principle  used  in\nformulating a client's strategic asset allocation?","options":{"A":"Assets with greater nonsystematic risk should be given less weight in a\nportfolio","B":"Returns on asset classes are a function of systematic factors relevant to those\nasset classes","C":"The more efficient an asset class, the more skillful an asset manager has to be\nto add value"},"answer":"B","topic":"Portfolio Management","page":18,"solution":"assets/solutions/1-2/88.jpg","confidence":"ocr","explanation":"because the focus on the SAA (strategic asset allocation) is the result of a number of important investment\nprinciples. One principle is that a portfolio's systematic risk accounts for most of its change in value over the long\nterm. A second principle is that the returns to groups of similar assets (e.g., long- term debt claims) predictably\nreflect exposures to certain sets of systematic factors (e.g., for the debt claims, unexpected changes in the inflation\nrate). Thus, the SAA is a means of providing the investor with exposure to the systematic risks of asset classes in\nproportions that meet the risk and return objectives. Further, apart from the exposures to systematic risk factors\nspecified in the strategic asset allocation, the returns of an investment strategy depend on two other sources:\ntactical asset allocation and security selection"},{"id":"1-2-89","set":"1-2","number":89,"stem":"Which type of index does not use market capitalization as a weighting method?","options":{"A":"A commodity index","B":"A broad equity market index","C":"A real estate investment trust (REIT) index"},"answer":"A","topic":"Alternative Investments","page":18,"solution":"assets/solutions/1-2/89.jpg","confidence":"ocr","explanation":"because commodity indexes do not have an obvious weighting mechanism, such as market capitalization,\ncommodity index providers create their own weighting methods."},{"id":"1-2-90","set":"1-2","number":90,"stem":"A bond has a duration of 4.50 and convexity of 39.20. If interest rates increase by\n0.5%, the percentage change in the bond's price will be closest to:","options":{"A":"-2.30%.","B":"-2.25%","C":"-2.20%"},"answer":"C","topic":"Fixed Income","page":18,"solution":"assets/solutions/1-2/90.jpg","confidence":"ocr","explanation":"because incorporating both duration and convexity, the percentage change in a bond's price = (Duration x\nAy) + (0.5 x Cx (Ay?) = (4.50 x 0.005) + (0.5 x 39.20 x 0.0052) = -0.0220 or -2.20%.\n\nYield-Based Bond Convexity and Portfolio Properties\n\n= calculate the percentage price change of a bond for a specified change in yield, given the bond's duration and\n\nconvexity"},{"id":"2-1-01","set":"2-1","number":1,"stem":"Raymond Ortiz, CFA, provides investment advice to high-net-worth investors.\nOrtiz has just completed an analysis of Continental Wheat, a manufacturer of\nwheat-based food products. He rated the company a long-term hold for investors\nseeking growth and income. Ortiz's analysis included a review of the company's\nmanagement team, financial data, pro forma financial positions, dividends and\ndividend policy, and a comparison of Continental with its competitors. Although\nhe does not tell anyone, five years ago, Ortiz worked for and ma
