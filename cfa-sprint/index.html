an return of 2.2% and a standard deviation of returns of 2.5%.\nIf the specified minimum target return is 2.2%, the sample target semideviation\nis:","options":{"A":"less than 2.5%.","B":"equal to 2.5%.","C":"greater than 2.5%."},"answer":"A","topic":"Quantitative Methods","page":19,"solution":"assets/solutions/4-1/81.jpg","confidence":"ocr","explanation":"because the target downside deviation = [2(X;— B)2/(n — 1)]?5, where X; are the periodic returns below the\ntarget return, B is the target return, and nis the total number of periods. Since the sample has a standard deviation\nof 2.5%, it will have values below and above its mean of 2.2%. Since the target downside deviation ignores the\ndeviations above the mean, it will be less than the standard deviation."},{"id":"4-1-82","set":"4-1","number":82,"stem":"Members of a company's board of directors are most likely required to:","options":{"A":"report to the company's CEO.","B":"display loyalty to the company.","C":"work for the company or the industry in which the company operates."},"answer":"B","topic":"Ethics","page":19,"solution":"assets/solutions/4-1/82.jpg","confidence":"ocr","explanation":"because directors are required under law to display a high standard of prudence, care, and loyalty to the\ncompany."},{"id":"4-1-83","set":"4-1","number":83,"stem":"With respect to a simple linear regression, the F-distributed test statistic is most\nappropriate to use when testing if","options":{"A":"the intercept is significantly different from zero.","B":"the independent and dependent variables are significantly positively\ncorrelated.","C":"there is a significant linear relationship between the dependent and\nindependent variables."},"answer":"C","topic":"Quantitative Methods","page":20,"solution":"assets/solutions/4-1/83.jpg","confidence":"ocr","explanation":"because in regression analysis, we can use an F-distributed test statistic to test whether the slopes in a\nregression are equal to zero, with the slopes designated as b,, against the alternative hypothesis that at least one\nslope is not equal to zero\nHet te—b,— = bp—O\nH,: At least one b, is not equal to zero.\n\nFor simple linear regression, these hypotheses simplify to\n\nHp: b; = 0.\n\nH,: b; #0.\" If we fail to reject the null hypothesis that the slope is 0, it implies that there is a linear relationship\nbetween the dependent and independent variables.\n\nSimple Linear Regression\n\n= calculate and interpret measures of fit and formulate and evaluate tests of fit and of regression coefficients in a\nsimple linear regression"},{"id":"4-1-84","set":"4-1","number":84,"stem":"Which of the following strategies is most common in business-to-business\nmarkets where the universe of potential customers is relatively small and easily\nreached?","options":{"A":"Direct sales","B":"Omnichannel","C":"Traditional channel"},"answer":"A","topic":"Mixed Topics","page":20,"solution":"assets/solutions/4-1/84.jpg","confidence":"ocr","explanation":"because direct sales is a common strategy in B2B markets where the universe of potential customers is\nrelatively small and easily reached"},{"id":"4-1-85","set":"4-1","number":85,"stem":"Which of the following statements about bootstrap resampling is most accurate?","options":{"A":"Multiple samples are taken from the population","B":"In each resample, items are drawn without replacement","C":"The randomly drawn sample is treated as if it were the population"},"answer":"C","topic":"Quantitative Methods","page":20,"solution":"assets/solutions/4-1/85.jpg","confidence":"ocr","explanation":"because a random sample offers a good representation of the population, therefore we can simulate\nsampling from the population by sampling from the observed sample. In other words, the bootstrap mimics the\nprocess by treating the randomly drawn sample as if it were the population.\n\nEstimation and Inference\n\n= describe the use of resampling (bootstrap, jackknife) to estimate the sampling distribution of a statistic"},{"id":"4-1-86","set":"4-1","number":86,"stem":"An analyst collects the following information about a company and its capital\nstructure:\nProportion of debt                   40%\nProportion of equity                  50%\nProportion of preferred shares           10%\nBefore-tax cost of debt               8%\nCost of equity                      16%\nCost of preferred shares               10%\nMarginal tax rate                    25%\nIf interest expense is tax deductible, the company's WACC is closest to:","options":{"A":"11.2%.","B":"11.4%.","C":"12.2%."},"answer":"B","topic":"Equity Investments","page":20,"solution":"assets/solutions/4-1/86.jpg","confidence":"ocr","explanation":"because WACC = Werg(1 —t) + Wofp + Wele = 0.4 x 0.08 (1 — 0.25) + 0.1 x 0.1+0.5x 0.16 =0.1140 =\n11.4%."},{"id":"4-1-87","set":"4-1","number":87,"stem":"A zero correlation between two variables implies the absence of:","options":{"A":"a linear relationship between the variables only.","B":"a non-linear relationship between the variables only.","C":"both a linear relationship and a non-linear relationship between the variables."},"answer":"A","topic":"Quantitative Methods","page":20,"solution":"assets/solutions/4-1/87.jpg","confidence":"ocr","explanation":"because a correlation of 0 (uncorrelated variables) indicates an absence of any linear (that is, straight-line)\nrelationship between the variables."},{"id":"4-1-88","set":"4-1","number":88,"stem":"An analyst gathers the following information (in € thousands) about an\nelectronics manufacturing company:\nYear 2       Year 1\nCost of sales                             1,000        800\nCost of ending inventory                 150        120\nNet realizable value of inventory           125        160\nChanges to the allowance for inventory obsolescence have already been reflected\nin cost of sales. The days of inventory on hand (based on average inventory and\n365-day year) for Year 2 is closest to:","options":{"A":"45.","B":"49.","C":"52."},"answer":"A","topic":"Financial Statement Analysis","page":21,"solution":"assets/solutions/4-1/88.jpg","confidence":"ocr","explanation":"because IFRS state that inventories shall be measured (and carried on the balance sheet) at the lower of\ncost and net realizable value; Inventory tumover ratio = Cost of sales + Average inventory and Days of inventory on\nhand = Number of days in period / Inventory turnover ratio. Accordingly, Inventory turnover ratio = 1,000 / [(125 +\n120) / 2] + 8.163; and Days of inventory on hand = Number of days in period / Inventory turnover ratio = 365 /\n8.163 = 44.7 = 45"},{"id":"4-1-89","set":"4-1","number":89,"stem":"The amount of time that elapses from the point when a company invests in\nworking capital until the point at which the company collects cash is:","options":{"A":"net operating cycle.","B":"defensive interval ratio.","C":"number of days of sales outstanding."},"answer":"A","topic":"Corporate Issuers","page":21,"solution":"assets/solutions/4-1/89.jpg","confidence":"ocr","explanation":"because the net operating cycle indicates the amount of time that elapses from the point when a company\ninvests in working capital until the point at which the company collects cash."},{"id":"4-1-90","set":"4-1","number":90,"stem":"In company analysis, which of the following is most likely a solvency ratio?","options":{"A":"Quick ratio","B":"Current ratio","C":"Interest coverage ratio"},"answer":"C","topic":"Mixed Topics","page":21,"solution":"assets/solutions/4-1/90.jpg","confidence":"ocr","explanation":"because the interest coverage ratio is a solvency ratio. Solvency ratios measure a company's ability to\nmeet long-term obligations. Subsets of these ratios are also known as “leverage” and “long-term debt\" ratios.\n\nFinancial Analysis Techniques\n\n= calculate and interpret activity, liquidity, solvency, and profitability ratios"},{"id":"4-2-01","set":"4-2","number":1,"stem":"Which of the following statements is most accurate?","options":{"A":"The value of a swap fluctuates as market conditions change","B":"The price and the value of a swap are the same at expiration","C":"The price of a swap at initiation is zero as there is no initial outlay of cash"},"answer":"A","topic":"Derivatives","page":1,"solution":"assets/solutions/4-2/01.jpg","confidence":"ocr","explanation":"because the value of a swap will fluctuate as market conditions change"},{"id":"4-2-02","set":"4-2","number":2,"stem":"With respect to the portfolio management process, the execution step most likely\nincludes:","options":{"A":"asset allocation.","B":"portfolio monitoring.","C":"developing the investment policy statement."},"answer":"A","topic":"Portfolio Management","page":1,"solution":"assets/solutions/4-2/02.jpg","confidence":"ocr","explanation":". Asset allocation is part of the execution step of the portfolio management process. The execution step\nalso includes security analysis and portfolio construction."},{"id":"4-2-03","set":"4-2","number":3,"stem":"Which of the following types of mutual funds most likely places the highest\npressure on the portfolio manager to manage liquidity?","options":{"A":"A load closed-end fund","B":"A no-load open-end fund","C":"A no-load closed-end fund"},"answer":"B","topic":"Portfolio Management","page":1,"solution":"assets/solutions/4-2/03.jpg","confidence":"ocr","explanation":". A no-load open-end fund accepts new investment money and issues additional shares at a value equal to\nthe net asset value of the fund at the time of investment. This structure makes it easy to grow in size but creates\npressure on the portfolio manager to manage the cash inflows and outflows. Redemptions may create the need to\nliquidate assets that the portfolio manager might not want to sell at the time or to hold cash to meet redemptions\n‘As a no-load fund, it charges no fee for investing in the fund or for redemption."},{"id":"4-2-04","set":"4-2","number":4,"stem":"A limit order is an example of a(n):","options":{"A":"validity instruction.","B":"clearing instruction.","C":"execution instruction."},"answer":"C","topic":"Mixed Topics","page":1,"solution":"assets/solutions/4-2/04.jpg","confidence":"ocr","explanation":"because execution instructions indicate how to fill the order. Market and limit orders convey the most\n‘common execution instructions.\nMarket Organization and Structure\n= compare execution, validity, and clearing instructions"},{"id":"4-2-05","set":"4-2","number":5,"stem":"Jensen's alpha is most appropriate in measuring portfolio performance when:","options":{"A":"idiosyncratic risk is relevant for an investor.","B":"evaluating the performance of real estate against equity investments.","C":"the investor holds a well-diversified portfolio with negligible diversifiable\nrisk."},"answer":"C","topic":"Portfolio Management","page":1,"solution":"assets/solutions/4-2/05.jpg","confidence":"ocr","explanation":"because performance measures relative to beta risk—Treynor ratio and Jensen's alpha—are relevant\nwhen the investor holds a well-diversified portfolio with negligible diversifiable risk"},{"id":"4-2-06","set":"4-2","number":6,"stem":"The bond equivalent yield for a semiannual pay bond is most likely.","options":{"A":"equal to the effective annual yield.","B":"more than the effective annual yield.","C":"equal to double the yield per semiannual period."},"answer":"C","topic":"Fixed Income","page":1,"solution":"assets/solutions/4-2/06.jpg","confidence":"ocr","explanation":"because an annual rate having a periodicity of two is known as a semiannual bond basis yield, or\nsemiannual bond equivalent yield. Therefore, a semiannual bond basis yield is the yield per semiannual period\ntimes 2\n\nYield and Yield Spread Measures for Floating-Rate Instruments\n\n= calculate and interpret yield measures for money market instruments"},{"id":"4-2-07","set":"4-2","number":7,"stem":"As compared to exchange-traded derivative markets, over-the-counter derivative\nmarkets are typically more:","options":{"A":"liquid.","B":"flexible.","C":"transparent."},"answer":"B","topic":"Derivatives","page":2,"solution":"assets/solutions/4-2/07.jpg","confidence":"ocr","explanation":"because OTC (over-the-counter) and ETD (exchange-traded derivative) markets differ in several ways\nOTC derivatives offer greater flexibility and customization than ETD. Specifically, the terms of OTC contracts can\nbe customized to match a desired risk exposure profile. This flexibility is important to end users seeking to hedge a\nspecific existing or anticipated underlying exposure based upon non-standard terms.\n\n€. Incorrect because ETD markets have transparency, which means that full information on all transactions is\ndisclosed to exchanges and national regulators. Moreover, when compared to OTC derivative markets, ETD\ncontracts are more formal and standardized, which facilitates a more liquid and transparent market. Hence, OTC\nderivative markets are typically less, not more, transparent than ETD markets.\n\nDerivative Instrument and Derivative Market Features\n\n= describe the basic features of derivative markets, and contrast over-the-counter and exchange-traded derivative\n\nmarkets"},{"id":"4-2-08","set":"4-2","number":8,"stem":"In which form of market efficiency do security prices fully reflect private\ninformation?","options":{"A":"Weak-form efficient","B":"Semi-strong-form efficient","C":"Strong-form efficient"},"answer":"C","topic":"Mixed Topics","page":2,"solution":"assets/solutions/4-2/08.jpg","confidence":"ocr","explanation":"because in a strong-form efficient market, security prices fully reflect private information\n\nMarket Efficiency\n\n= contrast weak-form, semi-strong-form, and strong-form market efficiency"},{"id":"4-2-09","set":"4-2","number":9,"stem":"An investor sells a European put option with the following characteristics:\nPut price               $40\nExercise price         $1,500\nIf the price of the underlying at expiration is $1,550, the profit or loss for the\nseller is:","options":{"A":"-$10.","B":"$40.","C":"$50."},"answer":"B","topic":"Derivatives","page":2,"solution":"assets/solutions/4-2/09.jpg","confidence":"ocr","explanation":"because to the put seller, the profit is [ = -Max(0,X — Sr) + po, where X is the exercise price, Sis the\nprice of the underlying at expiration, and pp is the put price. Therefore, 1 = —Max(0,(1,500 — 1,550)) + 40 = 40."},{"id":"4-2-10","set":"4-2","number":10,"stem":"An analyst gathers the following information about a security and the market for\na 12-month period:\nRealized Return        Beta\nSecurity        10.5%              0.8\nMarket         12.0%              1.0\nThe risk-free rate is 2.0%. According to the market model, the security's\nabnormal return for the period is closest to:","options":{"A":"-1.1%.","B":"0.5%.","C":"2.5%."},"answer":"B","topic":"Mixed Topics","page":2,"solution":"assets/solutions/4-2/10.jpg","confidence":"ocr","explanation":"because the abnormal return of a security during a period is the difference between expected return and\nrealized return, or the error term e; in the market model, R; = aj + BiRm + @;. The term ajis R, x (1 — Bj) = 0.02 x 0.2\n= 0.004, which results in e; = 0.105 — 0.004 — 0.8 x 0.12 = 0.005 = 0.5%. Another approach to compute the\nabnormal return of a security is using the capital asset pricing model, E(R)) = R;+ Bj(Rm— Ri), such that E(R) =\n0.02 + 0.8 x (0.12 - 0.02) = 0.10. It follows that the abnormal retum of the security is 0.105 — 0.10 = 0.005 = 0.5%."},{"id":"4-2-11","set":"4-2","number":11,"stem":"Following an increase in interest rates, the point in time at which a bondholder's\ngain on reinvested coupons equals the loss on the sale price is best measured by:","options":{"A":"effective duration.","B":"modified duration.","C":"Macaulay duration."},"answer":"C","topic":"Fixed Income","page":2,"solution":"assets/solutions/4-2/11.jpg","confidence":"ocr","explanation":"because for a particular assumption about yield volatility, Macaulay duration indicates the investment\nhorizon for which coupon reinvestment risk and market price risk offset each other. In addition, at some point in the\nlifetime of the bond the effect from an increase in interest rates on the reinvested coupons and bond price offset\neach other and the gain on reinvested coupons is equal to the loss on the sale of the bond. That point in time is the\nMacaulay duration statistic.\n\nInterest Rate Risk and Return\n\n= define, calculate, and interpret Macaulay duration."},{"id":"4-2-12","set":"4-2","number":12,"stem":"Which of the following best describes the risk of having to make a significant\nprice concession when selling an asset?","options":{"A":"Liquidity risk","B":"Solvency risk","C":"Settlement risk"},"answer":"A","topic":"Mixed Topics","page":3,"solution":"assets/solutions/4-2/12.jpg","confidence":"ocr","explanation":"because liquidity risk is the risk of a significant downward valuation adjustment when selling a financial\nasset. In order to sell an asset, a party may need to reduce the price to a level that is less than the marked value or\nthe seller's assessment of the asset's true value based on the fundamentals of the asset. In certain market\nconditions, the seller must make a significant price concession"},{"id":"4-2-13","set":"4-2","number":13,"stem":"Using put-call parity, a long call can best be replicated by going:","options":{"A":"long the put, short the asset, and long the bond.","B":"short the put, long the asset, and short the bond.","C":"long the put, long the asset, and short the bond."},"answer":"C","topic":"Fixed Income","page":3,"solution":"assets/solutions/4-2/13.jpg","confidence":"ocr","explanation":"because according to put-call parity, a long call is equal to long put, long asset, short bond.\n\nOption Replication Using Put-Call Parity\n\n= explain put-call parity for European options"},{"id":"4-2-14","set":"4-2","number":14,"stem":"A portfolio manager plans to add three securities with the following\ncharacteristics to a well-diversified portfolio:\n   Security 1 has the highest Jensen's alpha;\n   Security 2 has the highest information ratio;\n   Security 3 has the lowest nonsystematic variance.\nTo maximize the portfolio's risk-adjusted return, the manager should assign the\nhighest relative weight to:","options":{"A":"Security 1.","B":"Security 2.","C":"Security 3."},"answer":"B","topic":"Portfolio Management","page":3,"solution":"assets/solutions/4-2/14.jpg","confidence":"ocr","explanation":"because, when choosing relative weights in a portfolio, as we are concerned with maximizing risk-adjusted\nreturn, securities with a higher aj should have a higher weight, and securities with greater nonsystematic risk\nshould be given less weight in the portfolio. The weight in each nonmarket security should be proportional to ay/o,?,\nwhere the denominator is the nonsystematic variance of security i. The information ratio, aj/o,? (i.e., alpha divided\nby nonsystematic risk), measures the abnormal return per unit of risk added by the security to a well-diversified\nportfolio. The larger the information ratio is, the more valuable the security.\n\nThus, Security 2 with the highest information ratio should have the highest relative weight when added to a well-\ndiversified portfolio."},{"id":"4-2-15","set":"4-2","number":15,"stem":"In an investment policy statement, an individual investor's desire to implement\nimpact investing in the portfolio construction process is most likely reflected as a:","options":{"A":"tax concern","B":"unique circumstance.","C":"legal and regulatory constraint."},"answer":"B","topic":"Portfolio Management","page":3,"solution":"assets/solutions/4-2/15.jpg","confidence":"ocr","explanation":"because the unique circumstances section of the IPS should cover any other aspect of the client's\ncircumstances, including beliefs and values, that is likely to have a material impact on the composition of the\nportfolio. A client may have personal objections to certain products (e.g., weapons, tobacco, gambling) or practices\n(eg., environmental impact of business activities, human impact of government policies, labor standards), which\ncould lead to the exclusion of certain companies, countries, or types of securities (e.g., interest- bearing debt) from\nthe investable universe as well as the client's benchmark. Such considerations are often referred to as ESG\n(environmental, social, governance), and investing in accordance with such considerations is referred to as SRI\n(socially responsible investing). There are several implementation approaches in which ESG considerations can be\n‘expressed in an investment portfolio. Thematic investing and impact investing focus on investment in objectives,\nthemes, and trends that relate positively to ESG issues. In impact investing, an investment is selected primarily on\nits expected social or environmental benefits with measurable investment returns"},{"id":"4-2-16","set":"4-2","number":16,"stem":"An annual-pay bond with a £1,000 face value has a coupon rate of 4% and\nmatures in three years. If the yield to maturity is 3%, the current value of the\nbond is closest to:","options":{"A":"£972.","B":"£1,028.","C":"£1,142."},"answer":"B","topic":"Fixed Income","page":3,"solution":"assets/solutions/4-2/16.jpg","confidence":"ocr","explanation":"because\nFV=£1,000\nes\nN=3\nPMT = 40\nPV =£1,028\nOr\nPV = 40/1.03 + 40/(1.03)? + 1,040/(1.03)? = £1,028.30, rounded to £1,028"},{"id":"4-2-17","set":"4-2","number":17,"stem":"An investor makes the following statements:\nStatement 1    \"Swaps are contingent claims.\"\nStatement 2    \"Swaps are characterized by a series of cash flows.\"\nWhich of the statements is correct?","options":{"A":"Statement 1 only","B":"Statement 2 only","C":"Both Statement 1 and Statement 2"},"answer":"B","topic":"Derivatives","page":4,"solution":"assets/solutions/4-2/17.jpg","confidence":"ocr","explanation":"because a swap is an over-the-counter derivative contract in which two parties agree to exchange a series\nof cash flows whereby one party pays a variable series that will be determined by an underlying asset or rate and\nthe other party pays either (1) a variable series determined by a different underlying asset or rate or (2) a fixed\nseries."},{"id":"4-2-18","set":"4-2","number":18,"stem":"Which of the following measures is an example of a top-down driver for\nforecasting a fim's revenue?","options":{"A":"Same-store sales growth","B":"Growth relative to GDP growth","C":"Volumes and average selling prices"},"answer":"B","topic":"Economics","page":4,"solution":"assets/solutions/4-2/18.jpg","confidence":"ocr","explanation":"because growth relative to GDP growth is an example of a top-down forecast object. Common top-down\nforecast objects include ‘growth relative to GDP growth’ and 'market growth and market share.’"},{"id":"4-2-19","set":"4-2","number":19,"stem":"The money duration of a bond is best defined as:","options":{"A":"the bond's Macaulay duration times the bond's full price.","B":"the estimated change in the bond's full price in currency units for a given\nchange in the annual yield to maturity.","C":"one half of the difference in the bond's full prices given a 1 basis point\ndecrease and 1 basis point increase in yield-to-maturity."},"answer":"B","topic":"Fixed Income","page":4,"solution":"assets/solutions/4-2/19.jpg","confidence":"ocr","explanation":"because this describes the interpretation of money duration. The money duration of a bond is a measure\nof the price change in units of the currency in which the bond is denominated. For a given change in the annual\nyield-to-maturity (AYield), modified duration estimates the percentage price change and money duration estimates\nthe change in currency units."},{"id":"4-2-20","set":"4-2","number":20,"stem":"All else being equal, forward and futures prices are equal when:","options":{"A":"futures prices and interest rates are negatively correlated.","B":"futures prices and interest rates are uncorrelated.","C":"futures prices and interest rates are positively correlated."},"answer":"B","topic":"Derivatives","page":4,"solution":"assets/solutions/4-2/20.jpg","confidence":"ocr","explanation":"because if futures prices and interest rates are uncorrelated, forwards and futures prices will be the same.\nFuture and forward prices differ due to differences in cash flows. When these cashflows are uncorrelated with\ninterest rates, the desirability of own futures vs owning forwards is the same and hence their prices are the same."},{"id":"4-2-21","set":"4-2","number":21,"stem":"An analyst gathers the following information about a company's common stock:\nDividend per share-Year 1                    $2.00\nDividend per share -Year 2                   $2.10\nAnnual dividend per share-Year 3 and beyond  $2.21\nIf the required rate of return is 10%, the intrinsic value per share is closest to:","options":{"A":"$21.82.","B":"$22.10.","C":"$27.31."},"answer":"A","topic":"Equity Investments","page":4,"solution":"assets/solutions/4-2/21.jpg","confidence":"ocr","explanation":"because it is the present value of all future dividends. The present value of the perpetual level dividends,\nthree year from now, is: $2.21 / (0.10 — 0) = $22.10. The present value of the perpetual level dividends now is\n$22.10 / (1.10)*3 = $16.604. The present of dividends in the first three years is: $2.00 / 1.10 + $2.10 / (1.10)\"2+\n$2.21 | (1.10) * 3 = $1.818 + $1.736 + $1.660 = $5.214 . So, the intrinsic value of the stock is closest to: $16.604 +\n$5.214 = $21.818 = $21.82."},{"id":"4-2-22","set":"4-2","number":22,"stem":"A company's cost of equity is a proxy for the:","options":{"A":"company's intrinsic value.","B":"company's accounting return on equity.","C":"minimum required rate of return of investors in the company's equity."},"answer":"C","topic":"Mixed Topics","page":4,"solution":"assets/solutions/4-2/22.jpg","confidence":"ocr","explanation":"because companies try to raise capital at the lowest possible cost, [and] the company’s cost of equity is\noffen used as a proxy for the investors’ minimum required rate of return\n\nOverview of Equity Securities\n\n= compare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return"},{"id":"4-2-23","set":"4-2","number":23,"stem":"The focus strategy is most likely used to defend against which of Porter's five\nforces?","options":{"A":"Industry rivalry","B":"Threat of new entrants","C":"Bargaining power of suppliers"},"answer":"B","topic":"Mixed Topics","page":5,"solution":"assets/solutions/4-2/23.jpg","confidence":"ocr","explanation":"because with the focus strategy, customer loyalty to unique product can deter switching, protect market\nshare."},{"id":"4-2-24","set":"4-2","number":24,"stem":"Which of the following is most likely a high-risk infrastructure investment?","options":{"A":"An asset with a history of steady cash flows","B":"A brownfield asset leased back to a government","C":"A greenfield project without guarantees of demand upon completion"},"answer":"C","topic":"Alternative Investments","page":5,"solution":"assets/solutions/4-2/24.jpg","confidence":"ocr","explanation":"because greenfield projects without guarantees of demand upon completion—e.g., variable electricity\nprices, uncertain traffic on roads and through ports, are examples of higher-risk profile investments.\n\nReal Estate and Infrastructure\n\n= explain the investment characteristics of infrastructure investments"},{"id":"4-2-25","set":"4-2","number":25,"stem":"An example of a negative bond covenant is a:","options":{"A":"promise to pay required taxes.","B":"limit on the issuance of additional debt.","C":"requirement to comply with existing laws and regulations."},"answer":"B","topic":"Fixed Income","page":5,"solution":"assets/solutions/4-2/25.jpg","confidence":"ocr","explanation":"because examples of negative covenants include the Restrictions on debt regulate the issue of additional\ndebt."},{"id":"4-2-26","set":"4-2","number":26,"stem":"An investor collects the following information about a call option:\nSpot price of the underlying         $10.50\nStrike price of the option             $9.40\nOption premium                     $1.15\nAt expiration, if the price of the underlying is $9.35, the profit to the call seller is:","options":{"A":"$0.","B":"$1.10.","C":"$1.15."},"answer":"C","topic":"Derivatives","page":5,"solution":"assets/solutions/4-2/26.jpg","confidence":"ocr","explanation":"because M = —Max(0,8;—X) + cp (profit to the call seller), where S; is the price of the underlying at\nexpiration, X’is the strike price and cpis the option premium. Therefore, the correct calculation yields: $1.15 =\n—Max(0,$9.35 — $9.40) + $1.15.\n\nForward Commitment and Contingent Claim Features and Instruments\n\n= determine the value at expiration and profit from a long or a short position in a call or put option"},{"id":"4-2-27","set":"4-2","number":27,"stem":"For a given currency and tenor, a bond's yield spread over the standard swap rate\nis best described as the:","options":{"A":"I-spread.","B":"G-spread.","C":"Z-spread."},"answer":"A","topic":"Fixed Income","page":5,"solution":"assets/solutions/4-2/27.jpg","confidence":"ocr","explanation":"because the yield spread of a specific bond over the standard swap rate in that currency of the same tenor\nis known as the I-spread or interpolated spread to the swap curve. This yield spread over MRR allows comparison\nof bonds with differing credit and liquidity risks against an interbank lending benchmark."},{"id":"4-2-28","set":"4-2","number":28,"stem":"An analyst gathers the following information about a hedge fund:\nBeginning-of-year assets under management (AUM)       $350 million\nManagement fee, based on year-end AUM before fees          2%\nIncentive fee                                     20%\nHard hurdle rate                                 5%\nAnnual return before fees                             10%\nIf the incentive fee is based on returns net of management fees, the incentive fee\n(in $ millions) is:","options":{"A":"1.96","B":"5.46.","C":"7.00."},"answer":"A","topic":"Alternative Investments","page":6,"solution":"assets/solutions/4-2/28.jpg","confidence":"ocr","explanation":"because the hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to earn\nthe performance fee. GPs typically receive 20% of the total profit of the private equity fund net of any hard hurdle\nrate, in which case the GP eams fees on annual returns in excess of the hurdle rate, or net of the soft hurdle rate, in\nwhich case the fee is calculated on the entire annual gross return as long as the set hurdle is exceeded.\nManagement Fee = $350 x 1.10 x 0.02 = $7.7\nHurdle Rate (in $) = $350 x 0.05 = $17.5\nProfit on Hedge Fund = $350 x 0.10 = $35\nIncentive Fee = ($35 — $7.7 — $17.5) x 0.20 = $1.96."},{"id":"4-2-29","set":"4-2","number":29,"stem":"The methodology used by a credit rating agency to adjust a specific bond issue\nrating is best described as:","options":{"A":"notching.","B":"cross-default.","C":"structural subordination."},"answer":"A","topic":"Fixed Income","page":6,"solution":"assets/solutions/4-2/29.jpg","confidence":"ocr","explanation":"because specific issues may be assigned different credit ratings - higher or lower - due to a ratings\nadjustment methodology known as notching. For the rating agencies, likelihood of default—default risk—is the\nprimary factor in assigning their ratings. However, there are secondary factors as well including priority of payment\nin the event of a default, potential loss severity in the event of default, structural subordination,"},{"id":"4-2-30","set":"4-2","number":30,"stem":"Regarding distribution methods in alternative investments, which of the following\nis most advantageous to the general partners?","options":{"A":"A European waterfall","B":"An American waterfall","C":"A whole-of-fund waterfall"},"answer":"B","topic":"Alternative Investments","page":6,"solution":"assets/solutions/4-2/30.jpg","confidence":"ocr","explanation":"because there are two types of waterfalls: deal-by-deal (or American) waterfalls and whole-of-fund (or\nEuropean) waterfalls. Deal-by-deal waterfalls are more advantageous to the GP because performance fees are\ncollected on a per-deal basis, allowing the GP to get paid before LPs receive both their initial investment and their\npreferred rate of return (i.e., the hurdle rate) on the entire fund."},{"id":"4-2-31","set":"4-2","number":31,"stem":"Security market indexes can be used to calculate alphas, which are best described\nas:","options":{"A":"a measure of market sentiment.","B":"the systematic risk of a security, using the index as a proxy for the entire\nmarket.","C":"the difference between the return of the actively managed portfolio and the\nreturn of the passive portfolio."},"answer":"C","topic":"Portfolio Management","page":6,"solution":"assets/solutions/4-2/31.jpg","confidence":"ocr","explanation":"because security market indexes serve as market proxies when measuring risk-adjusted performance.\nAlpha, the difference between the return of the actively managed portfolio and the return of the passive portfolio, is\na measure of risk-adjusted return.\n\nSecurity Market Indexes\n\n= describe uses of security market indexes"},{"id":"4-2-32","set":"4-2","number":32,"stem":"An analyst gathers the following information about a margin transaction:\nInitial stock price           $80\nLeverage ratio                2.5\nIf the first margin call occurs at a stock price below $60, the maintenance margin\nis closest to:","options":{"A":"15.0%.","B":"20.0%.","C":"46.7%."},"answer":"B","topic":"Mixed Topics","page":6,"solution":"assets/solutions/4-2/32.jpg","confidence":"ocr","explanation":"because the maintenance margin is solved using the following equation:\nEquity per share _ Equity per share + P- initial stock price\n—______ = —________ = Maintenance margin in percentage terms.\nPrice per share P\nWhere P is equal to the price below which a margin call will first take place. Here this is $60.\nEquity per share = Percentage of equity x Initial stock price, where the percentage of equity is equal to\n1 1\n——_____ == 0.4 or 40%. Therefore the Equity per share is equal to 0.4 x $80 = $32. Therefore the\nLeverage ratio 2.5\n$32+$60-$80 $12\nmaintenance margin is ————- = —— = 20%.\n$60 $60"},{"id":"4-2-33","set":"4-2","number":33,"stem":"Which of the following is an underlying assumption of yield to maturity as a\nmeasure of expected return for a bond?","options":{"A":"The credit quality of the issuer remains the same","B":"The bond is sold at the same price as the purchase price","C":"Coupons are reinvested at the same rate as the yield to maturity at purchase"},"answer":"C","topic":"Fixed Income","page":7,"solution":"assets/solutions/4-2/33.jpg","confidence":"ocr","explanation":"because the yield-to-maturity at the time of purchase measures the investor's rate of return under three\nassumptions: (1) The investor holds the bond to maturity, (2) there is no default by the issuer, and (3) the coupon\ninterest payments are reinvested at that same rate of interest\n\nInterest Rate Risk and Return\n\n= calculate and interpret the sources of return from investing in a fixed-rate bond;"},{"id":"4-2-34","set":"4-2","number":34,"stem":"A manager gathers the following information about two non-dividend paying\nstocks that constitute a market-capitalization weighted index:\nStock       Market Capitalization       Price per Share\n1            $200 million              $30\n2            $100 million              $90\nIf there are no other securities in the index and the price of each stock increases\nby 10%, the index's return will most likely be:","options":{"A":"less than the return of an equal-weighted index.","B":"equal to the return of an equal-weighted index.","C":"greater than the return of an equal-weighted index."},"answer":"B","topic":"Equity Investments","page":7,"solution":"assets/solutions/4-2/34.jpg","confidence":"ocr","explanation":"because the return or percentage change of both indexes is 10% as shown below.\nThe return of the market-cap or equal-weight index = 5 w, x (Px — Pa) / Po\nwhere\nP, = end-of-period price of the i\" security\nPy = begin-of-period price of the i security\nAe al\nwM = ——_ = weight of security i for a market-cap index at beginning of period\nXN, OP;\nle\n1\nwE = =weight of security for an equal-weight index of N securities\nFor the market-cap index, w, = 200/300 = 0.6667; w. = 100/300 = 0.3333\nThe return of the market-cap index = 0.6667 x 10 + 0.3333 x 10 = 10%\nFor the equal-weight index, w; = w2 = % = 0.50\nThe return of the equal-weight index = 0.5 x 10 + 0.5 x 10 = 10%.\nAlternatively, the answer can be calculated as follows: For the market-cap index, the initial market cap is 100 + 200\n= 300. The market cap of each stock increases by 10% to 110 + 220 = 330. The return or percentage change of the\nindex is 330 / 300 — 1 = 10%. For the equal-weight index of two stocks, each stock has the same weight of ¥ or\n50%. If each stock increases by 10% then the index changes by (50% x 10% + 50% x 10%) = 10%"},{"id":"4-2-35","set":"4-2","number":35,"stem":"A trader buys 500 shares of a stock on margin at $36 a share using an initial\nleverage ratio of 1.66. The maintenance margin requirement for the position is\n30%. The stock price at which the margin call will occur is closest to:","options":{"A":"$20.57.","B":"$25.20.","C":"$30.86."},"answer":"A","topic":"Equity Investments","page":7,"solution":"assets/solutions/4-2/35.jpg","confidence":"ocr","explanation":"because initial equity (%) in the margin transaction = 1/Leverage ratio = 1/1.66 = 0.60. Initial equity per\nshare at the time of purchase = $36 x 0.60 = $21.60\nPrice (P) at which margin call occurs\nEquity per share/Price per share = Maintenance margin (%)\n($21.60 + P—$36)/P = 0.30\n0.7P=$14.40\nP=$2057"},{"id":"4-2-36","set":"4-2","number":36,"stem":"Two private equity funds doubled the value of their investments. All else being\nequal, if Fund 1 achieved this return in less time than Fund 2, the multiple of\ninvested capital (MOIC) of Fund 1 is:","options":{"A":"lower than that of Fund 2.","B":"the same as that of Fund 2.","C":"higher than that of Fund 2."},"answer":"B","topic":"Alternative Investments","page":7,"solution":"assets/solutions/4-2/36.jpg","confidence":"ocr","explanation":"because a shortcut methodology often used by both private equity and real estate managers involves\nsimply citing a multiple of invested capital (MOIC), or money multiple, on total invested capital (which is paid-in\ncapital less management fees and fund expenses). Here, one simply measures the total value of all realized\ninvestments and residual asset values (assets that may still be awaiting their ultimate sale) relative to an initial total\ninvestment the MOIC ignores the timing of cash flows"},{"id":"4-2-37","set":"4-2","number":37,"stem":"At maturity, the buyer faces the counterparty credit risk of the seller in:","options":{"A":"a profitable long forward position only.","B":"an in-the-money long call option position only.","C":"both a profitable long forward position and an in-the-money long call option\nposition."},"answer":"C","topic":"Derivatives","page":7,"solution":"assets/solutions/4-2/37.jpg","confidence":"ocr","explanation":"because at maturity the buyer of an in-the-money call option faces the counterparty credit risk of the seller,\nas does the buyer of a profitable long forward position\n\nDerivative Benefits, Risks, and Issuer and Investor Uses\n\n= describe benefits and risks of derivative instruments"},{"id":"4-2-38","set":"4-2","number":38,"stem":"With respect to an IPS, which of the following best describes an absolute risk\nobjective for a client's portfolio?","options":{"A":"An annual tracking risk of less than 2 percent","B":"A twelve-month 95%value at risk of less than €1,000,000","C":"Maintaining at least €10,000 in cash for planned monthly withdrawals"},"answer":"B","topic":"Portfolio Management","page":8,"solution":"assets/solutions/4-2/38.jpg","confidence":"ocr","explanation":"because measures of absolute risk include the variance or standard deviation of returns and value at risk.\nFor example, the 12-month 95% value at risk of the portfolio must be no more than ¥1 billion"},{"id":"4-2-39","set":"4-2","number":39,"stem":"Which of the following sections of an IPS most likely explains the steps to be\ntaken to keep the IPS current?","options":{"A":"Procedures","B":"Investment Guidelines","C":"Statement of Duties and Responsibilities"},"answer":"A","topic":"Mixed Topics","page":8,"solution":"assets/solutions/4-2/39.jpg","confidence":"ocr","explanation":"because the Procedures section explains the steps to take to keep the IPS current and the procedures to\nfollow to respond to various contingencies"},{"id":"4-2-40","set":"4-2","number":40,"stem":"The value of bitcoin is most likely based on:","options":{"A":"underlying cash flows only.","B":"expected price appreciation only.","C":"both underlying cash flows and expected price appreciation."},"answer":"B","topic":"Mixed Topics","page":8,"solution":"assets/solutions/4-2/40.jpg","confidence":"ocr","explanation":"because bitcoin and other cryptocurrency values are based solely on asset\nappreciation, with no underlying cash flows."},{"id":"4-2-41","set":"4-2","number":41,"stem":"Which of the following types of private debt is expected to be the riskiest?","options":{"A":"Mezzanine debt","B":"Infrastructure debt","C":"Senior direct lending"},"answer":"A","topic":"Alternative Investments","page":8,"solution":"assets/solutions/4-2/41.jpg","confidence":"ocr","explanation":"because mezzanine debt is riskier than senior secure debt which is riskier than infrastructure debt\n(graphically displayed by the Private Capital Risk and Retum Levels by Category chart). Because of its typically\njunior ranking and its usually unsecured status, mezzanine debt is riskier than senior secured debt. Investments in\nprivate capital vary in terms of risk and return across the corporate capital structure hierarchy. Typically, private\n‘equity, as the riskiest alternative, offers the highest returns, with private debt retums declining on a continuum down\nto the safest, most secured form of debt—infrastructure debt."},{"id":"4-2-42","set":"4-2","number":42,"stem":"Which of the following securities is most likely subject to the highest prepayment\nrisk?","options":{"A":"Covered bond","B":"Mortgage pass-through security","C":"Credit card receivable asset-backed security"},"answer":"B","topic":"Fixed Income","page":8,"solution":"assets/solutions/4-2/42.jpg","confidence":"ocr","explanation":"because ABS and MBS pass-through security cash flows are uncertain because scheduled and actual\npayments frequently differ. Borrower behavior, such as the early payment of interest and principal as well as\npayment delinquencies over the life of a loan, depends upon a number of factors, including the income of the\nborrower (household income or cash flows for a corporation), the terms and conditions of the loan (such as the\noriginal interest rate versus current rates and any prepayment penalties), and the sale of the underlying asset being\nfinanced. To correctly value these securities, investors make certain assumptions about the predicted contractual\npayments after factoring in prepayment risk. Prepayment risk is the risk that the principal or a proportion of the\nprincipal is paid back at a different pace from the contractually agreed scheduled payment plan by the borrower.\nPrepayment risk has two components: contraction risk and extension risk, both of which reflect changes in the\ngeneral level of interest rates."},{"id":"4-2-43","set":"4-2","number":43,"stem":"A bond has a modified duration of 5 and a convexity statistic of 75. If the bond's\nyield-to-maturity decreases 50 bps, the expected percentage price change is\nclosest to:","options":{"A":"2.41%.","B":"2.59%.","C":"2.69%."},"answer":"B","topic":"Fixed Income","page":8,"solution":"assets/solutions/4-2/43.jpg","confidence":"ocr","explanation":"because: %APV*™\" = (—AnnModDur x AYield) + [} x AnnConvexity x (A Yield)?] =\n(-5 x -0.005) + [1 x 75 x (—0.005)?] = 0.025 + 0.00094 = 0.02594 ~ 2.59%."},{"id":"4-2-44","set":"4-2","number":44,"stem":"Buying the stock of a company being acquired while going short the stock of the\nacquiring company best describes a(n):","options":{"A":"activist strategy","B":"merger arbitrage strategy.","C":"distressed/restructuring strategy."},"answer":"B","topic":"Mixed Topics","page":9,"solution":"assets/solutions/4-2/44.jpg","confidence":"ocr","explanation":"because a merger arbitrage strategy involves going long (buying) the stock of the company being acquired\nat a discount to its announced takeover price and going short (selling) the stock of the acquiring company when the\nmerger or acquisition is announced"},{"id":"4-2-45","set":"4-2","number":45,"stem":"Commodity futures prices are most likely in backwardation when:","options":{"A":"interest rates are high.","B":"storage costs are high.","C":"the convenience yield is high."},"answer":"C","topic":"Fixed Income","page":9,"solution":"assets/solutions/4-2/45.jpg","confidence":"ocr","explanation":". In backwardation, futures prices are lower than spot prices, that is, the commodity forward curve is\ndownward sloping. This scenario occurs when the convenience yield is high. Futures price ~ Spot price (1 + 1) +\nStorage costs — Convenience yield\n\nNatural Resources\n\n= describe features of commodities and their investment characteristics"},{"id":"4-2-46","set":"4-2","number":46,"stem":"An analyst gathers the following information about a company's non-callable,\nnon-convertible preferred stock:\nPar value per share                                €55\nEstimated intrinsic value per share                    €75\nMaturity                                           5years\nIf the required rate of return is 7.2%, the company's semiannual dividend on the\npreferred stock is closest to:","options":{"A":"€3.96.","B":"€4.40.","C":"€5.40."},"answer":"B","topic":"Mixed Topics","page":9,"solution":"assets/solutions/4-2/46.jpg","confidence":"ocr","explanation":"because using the formula:\nVo= > D1 ++ 1 +1)\",\nWhere: Vo= intrinsic value = €75\nF = par value = €55\nr= nominal required rate of retum = 7.2% annually, divided by 2. Therefore the semi-annual rate = 3.6%\nn= number of periods through to maturity = 5 years multiplied by 2 to arrive at 10\nSolving for D (or PMT in a financial calculator) we arrive at D = €4.3970, rounded to €4.40."},{"id":"4-2-47","set":"4-2","number":47,"stem":"According to the capital asset pricing model (CAPM), the difference in the\nexpected returns for two securities is determined by the securities':","options":{"A":"total risk","B":"systematic risk only.","C":"nonsystematic risk only."},"answer":"B","topic":"Portfolio Management","page":9,"solution":"assets/solutions/4-2/47.jpg","confidence":"ocr","explanation":"because the CAPM asserts that the expected returns of assets vary only by their systematic risk as\nmeasured by beta. Two assets with the same beta will have the same expected retum irrespective of the nature of\nthose assets"},{"id":"4-2-48","set":"4-2","number":48,"stem":"An equity fund manager is considering a market index as the benchmark for his\nportfolio, and has the following preferences\n   the index should have a contrarian effect;\n   shares held by controlling shareholders should be included;\n   dividends should be included in the weighting of constituent securities; and\n   the weights of constituent securities should not be arbitrarily determined by\nthe index provider.\nWhich of the following weightings of indexes best meets the fund manager's\npreferences?","options":{"A":"Equal","B":"Fundamental","C":"Float-adjusted market capitalization"},"answer":"B","topic":"Equity Investments","page":9,"solution":"assets/solutions/4-2/48.jpg","confidence":"ocr","explanation":"because fundamental weighting satisfies the fund manager's preferences. Fundamental indexes use a\nsingle measure, such as total dividends, to weight the constituent securities. Fundamentally weighted indexes\ngenerally will have a contrarian effect in that the portfolio weights will shift away from securities that have increased\nin relative value and toward securities that have fallen in relative value whenever the portfolio is rebalanced. All\nshares are included in a fundamental weighted index."},{"id":"4-2-49","set":"4-2","number":49,"stem":"Which of the following best describes a feature unique to the co-investing method?\nA limited partner.","options":{"A":"participating in an investment fund alongside the general partner.","B":"participating in an investment fund alongside other limited partners.","C":"making an investment alongside a fund in a deal the fund has identified."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/4-2/49.jpg","confidence":"ocr","explanation":"because in co-investing, the investor invests in assets indirectly through the fund but also possesses rights\n(known as co-investment rights) to invest directly in the same assets. Through co-investing, an investor is able to\nmake an investment alongside a fund when the fund identifies deals.\n\nAlternative Investment Features, Methods, and Structures\n\n= compare direct investment, co-investment, and fund investment methods for alternative investments"},{"id":"4-2-50","set":"4-2","number":50,"stem":"A bond portfolio manager is considering three bonds-1, 2, and 3-for his portfolio.\nBond 1 allows the issuer to call the bond before the stated maturity, Bond 2\nallows the investor to put the bond back to the issuer before the stated maturity,\nand Bond 3 contains no embedded options. The bonds are otherwise identical.\nThe manager tells his assistant, “Bond 1 and Bond 2 should have larger nominal\nyield spreads to a US Treasury than Bond 3 to compensate for their embedded\noptions.\" Is the manager most likely correct?","options":{"A":"Yes","B":"No, because Bond 1's nominal yield spread should be less than Bond 3's","C":"No, because Bond 2's nominal yield spread should be less than Bond 3's"},"answer":"C","topic":"Fixed Income","page":10,"solution":"assets/solutions/4-2/50.jpg","confidence":"ocr","explanation":"because Bond 2’s embedded put option benefits the investor, and the yield spread will therefore be less\nthan the yield spread of Bond 3, which does not contain this option or benefit.\n\nFixed-Income Cash Flows and Types\n\n= describe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions\n\nthat benefit issuers and investors ET)"},{"id":"4-2-51","set":"4-2","number":51,"stem":"An analyst gathers the following information:\nTime to Maturity     Yield to Maturity\nBond 1            4 years             3.3%\nBond 2            7 years             5.1%\nBased only on this information, the estimated market discount rate for a 6-year\nbond with similar credit quality is:","options":{"A":"3.9%.","B":"4.2%.","C":"4.5%."},"answer":"C","topic":"Fixed Income","page":10,"solution":"assets/solutions/4-2/51.jpg","confidence":"ocr","explanation":"because some fixed-rate bonds are not actively traded. Therefore, there is no market price available to\ncalculate the rate of return required by investors. In these situations, it is common to estimate the market discount\nrate and price based on the quoted or flat prices of more frequently traded comparable bonds. These comparable\nbonds have similar times-to-maturity, coupon rates, and credit quality. This estimation process is called matrix\npricing. The estimated market discount rate can be obtained with linear interpolation. Using linear interpolation\nbetween the two given bonds, we have: 0.033 + (6 — 4) / (7 — 4) x (0.051 — 0.033) = 0.033 + 2/3 x 0.018 = 0.045 =\n4.5%.\n\nFixed-Income Bond Valuation: Prices and Yields\n\n= describe matrix pricing"},{"id":"4-2-52","set":"4-2","number":52,"stem":"A portfolio manager holds the following three option-free bonds:\nBond      Par Value Owned    Market Value Owned      Duration\n1         $8 million           $12 million             3\n2         $8 million           $6 million             7\n3         $4 million           $6 million             6\nThe portfolio's duration is closest to:","options":{"A":"4.75.","B":"5.20.","C":"5.33."},"answer":"A","topic":"Fixed Income","page":10,"solution":"assets/solutions/4-2/52.jpg","confidence":"ocr","explanation":"because the portfolio's duration is a weighted average of the durations of the individual holdings, computed\nas: (12/24) x (3.0) + (6/24) x (7.0) + (6/24) x (6.0) = 4.75"},{"id":"4-2-53","set":"4-2","number":53,"stem":"Which of the following attributes is least likely to be a requirement for the\nexistence of riskless arbitrage? The underlying security:","options":{"A":"is relatively liquid.","B":"can be sold short.","C":"is a financial asset."},"answer":"C","topic":"Mixed Topics","page":11,"solution":"assets/solutions/4-2/53.jpg","confidence":"ocr","explanation":"because for riskless arbitrage to exist, the underlying security that can be arbitraged may be either a\nfinancial or a non-financial security.\n\nArbitrage, Replication, and the Cost of Carry in Pricing Derivatives\n\n= explain how the concepts of arbitrage and replication are used in pricing derivatives"},{"id":"4-2-54","set":"4-2","number":54,"stem":"Exercise of a European put option is most likely justified if:","options":{"A":"the option is out of the money.","B":"the exercise value is negative.","C":"the exercise price exceeds the value of the underlying."},"answer":"C","topic":"Derivatives","page":11,"solution":"assets/solutions/4-2/54.jpg","confidence":"ocr","explanation":"because if the exercise price exceeds the value of the underlying at expiration, the option has positive\nexercise value and may be exercised\nPricing and Valuation of Options\n= explain the exercise value, moneyness, and time value of an option"},{"id":"4-2-55","set":"4-2","number":55,"stem":"Short positions have the potential for:","options":{"A":"unbounded gains only.","B":"unbounded losses only.","C":"both unbounded gains and unbounded losses."},"answer":"B","topic":"Mixed Topics","page":11,"solution":"assets/solutions/4-2/55.jpg","confidence":"ocr","explanation":"because the potential gains on a short position are limited to no more than 100 percent whereas the\npotential losses are unbounded."},{"id":"4-2-56","set":"4-2","number":56,"stem":"With respect to behavioral finance, an explanation for the overreaction anomaly\nis:","options":{"A":"risk aversion.","B":"loss aversion.","C":"sudden changes in economic fundamentals."},"answer":"B","topic":"Mixed Topics","page":11,"solution":"assets/solutions/4-2/56.jpg","confidence":"ocr","explanation":"because some argue that behavioral theories of loss aversion can explain observed overreaction in\nmarkets. If loss aversion is more important than risk aversion, researchers should observe that investors overreact"},{"id":"4-2-57","set":"4-2","number":57,"stem":"An analyst gathers the following information about two assets:\nAsset         Expected Return     Standard Deviation of Returns\n1             -5%                5%\n2           5%                8%\nIf the correlation between the two assets' returns is -1, the standard deviation of\nreturns for an equally weighted portfolio of the assets is closest to:","options":{"A":"0%.","B":"2%.","C":"4%."},"answer":"B","topic":"Quantitative Methods","page":11,"solution":"assets/solutions/4-2/57.jpg","confidence":"ocr","explanation":"because the portfolio variance can be calculated using the formula: 0,2 = w;2,? + w?022 + 2W4W220102,\nwhere w; denotes the portfolio weights, 0; the asset standard deviations, and p,. the correlation between the returns\non the two assets; 0,2 = (0.52 x 0.052) + (0.5? x 0.092) + (2 x 0.5 x 0.5 x -1 x 0.05 x 0.09) = 0.0004. The standard\ndeviation is ¢, = 10.0004 = 0.02 = 2%. In fact, when two assets are perfectly negatively correlated, the portfolio\nstandard deviation is 0, = |W40; — W202] = |0.5 x 0.05 — 0.5 x 0.09] = |-0.02| = 2%."},{"id":"4-2-58","set":"4-2","number":58,"stem":"The two-fund separation theorem states that all investors will hold a combination\nof the:","options":{"A":"risk-free asset and the optimal risky portfolio.","B":"risk-free asset and the global minimum-variance portfolio.","C":"optimal risky portfolio and the global minimum-variance portfolio."},"answer":"A","topic":"Portfolio Management","page":11,"solution":"assets/solutions/4-2/58.jpg","confidence":"ocr","explanation":"because the two-fund separation theorem states that all investors regardless of taste, risk preferences, and\ninitial wealth will hold a combination of two portfolios or funds: a risk-free asset and an optimal portfolio of risky\nassets."},{"id":"4-2-59","set":"4-2","number":59,"stem":"All else being equal, credit spreads most likely widen:","options":{"A":"in periods of heavy new issue supply.","B":"with expectations of a stronger economy.","C":"with increased demand for corporate bonds."},"answer":"A","topic":"Fixed Income","page":12,"solution":"assets/solutions/4-2/59.jpg","confidence":"ocr","explanation":"because credit spreads widen in periods of heavy new issue supply."},{"id":"4-2-60","set":"4-2","number":60,"stem":"An analyst gathers the following information (in $ millions) about three\ncompanies:\nCompany 1      Company 2       Company 3\nTotal Debt            1,125             1,360             1,562\nEBITDA             590             680              750\nInterest Expense        71              60              63\nWhich company's leverage contributes most adversely to its credit risk?","options":{"A":"Company 1","B":"Company 2","C":"Company 3"},"answer":"C","topic":"Mixed Topics","page":12,"solution":"assets/solutions/4-2/60.jpg","confidence":"ocr","explanation":"because the only leverage ratio that can be calculated given the data provided is the debt-to-EBITDA ratio.\nCompany 3 has the highest debt-to-EBITDA ratio of the three companies presented. A higher ratio indicates more\nleverage and thus higher credit risk. Company 3 also has the highest coverage ratio (EBITDA/interest expense) of\nthe three companies, which would indicate lower credit risk, but the question is confined to analyzing leverage\nratios only.\nCompany 1: 1,125/590 = 1.9x\nCompany 2: 1,360/680 = 2.0x\nCompany 3: 1,562/750 = 2.08\n\nCredit Analysis for Corporate Issuers.\n\n= calculate and interpret financial ratios used in credit analysis"},{"id":"4-2-61","set":"4-2","number":61,"stem":"If the correlation between assets in a two-asset portfolio is less than one, the\nstandard deviation of the portfolio is:","options":{"A":"less than the weighted average standard deviation of the individual assets.","B":"equal to the weighted average standard deviation of the individual assets.","C":"greater than the weighted average standard deviation of the individual assets."},"answer":"A","topic":"Quantitative Methods","page":12,"solution":"assets/solutions/4-2/61.jpg","confidence":"ocr","explanation":"because the portfolio's standard deviation is simply a weighted average of the standard deviations of the\ntwo assets when the individual assets are perfectly correlated. Portfolio risk falls, however, when the two assets are\nnot perfectly correlated (p12 < +1). This can also be seen using the formula for portfolio risk (standard deviation),\nwhich is expressed by the terms to the left of the “<\" sign below. The term to the right of the “<\" shows the portfolio\nrisk when: py = +1\noy = who? + w302 + 2wwapiroiar < y/wra? + wo? + Iwpwroior\n= wier + wie + 2wiwopr2aie2 < (wie + W202).\n\nThe left side is smaller than the right side because the correlation coefficient on the left side for the new portfolio is\n<1"},{"id":"4-2-62","set":"4-2","number":62,"stem":"The pass-through rate of a mortgage-pass through security is:","options":{"A":"lower than the mortgage rate on the underlying pool.","B":"equal to the mortgage rate on the underlying pool.","C":"greater than the mortgage rate on the underlying pool."},"answer":"A","topic":"Mixed Topics","page":12,"solution":"assets/solutions/4-2/62.jpg","confidence":"ocr","explanation":"because the pass-through rate is lower than the mortgage rate on the underlying pool of mortgages by an\namount equal to the servicing and other administrative fees."},{"id":"4-2-63","set":"4-2","number":63,"stem":"Which of the following are most likely traded in traditional investment markets?","options":{"A":"Commodities","B":"Securitized debts","C":"Shares in pooled investment vehicles that hold publicly traded debts"},"answer":"C","topic":"Equity Investments","page":12,"solution":"assets/solutions/4-2/63.jpg","confidence":"ocr","explanation":"because traditional investments include all publicly traded debts and equities and shares in pooled\ninvestment vehicles that hold publicly traded debts and/or equities. Alternative investments include hedge funds,\nprivate equities (including venture capital), commodities, real estate securities and real estate properties,\nsecuritized debts, operating leases, machinery, collectibles, and precious gems.\n\nMarket Organization and Structure\n\n= describe classifications of assets and markets"},{"id":"4-2-64","set":"4-2","number":64,"stem":"If poorly reasoned decisions with positive results are remembered as brilliant\ntactical moves, the cognitive error most likely being exhibited is:","options":{"A":"hindsight bias.","B":"confirmation bias.","C":"overconfidence bias."},"answer":"A","topic":"Mixed Topics","page":12,"solution":"assets/solutions/4-2/64.jpg","confidence":"ocr","explanation":"because hindsight bias refers to believing past events as having been predictable and reasonable to\nexpect. People tend to remember their own predictions of the future as more accurate than they actually were\nbecause they are biased by the knowledge of what actually occurred. Poorly reasoned decisions with positive\nresults may be remembered as brilliant tactical moves, and poor results of well-reasoned decisions may be\ndescribed as avoidable mistakes."},{"id":"4-2-65","set":"4-2","number":65,"stem":"If ten board directors are to be elected, under statutory voting, the maximum\nnumber of votes a shareholder owning ten shares can cast in favor of a single\ncandidate is:","options":{"A":"1.","B":"10.","C":"100."},"answer":"B","topic":"Equity Investments","page":13,"solution":"assets/solutions/4-2/65.jpg","confidence":"ocr","explanation":"because regular shareholder voting, where each share represents one vote, is referred to as statutory\nvoting. Under statutory voting, a shareholder [owning 100 shares] would be able to cast only a maximum of 100\nvotes for each candidate. Therefore, if 10 board directors are to be elected, in case of statutory voting, the\nmaximum number of votes the shareholder owning 10 shares can cast in favor of a single candidate is 10."},{"id":"4-2-66","set":"4-2","number":66,"stem":"In the binomial model, if the probability of an upward movement in an\nunderlying increases, the value of a put option:","options":{"A":"decreases.","B":"remains unchanged.","C":"Increases."},"answer":"B","topic":"Derivatives","page":13,"solution":"assets/solutions/4-2/66.jpg","confidence":"ocr","explanation":"because the value of put option = po = (mp;\" + (1 — T)p;-V/(1 + 1), where T= (1 + r—d)/(u—d), this formula\nsheds a great deal of light on option pricing. Notice the probabilities of the up and down moves, q and 1 — q, do not\nappear in the formula. Therefore, the value of a put option is independent of the probability of an upward movement\nin an underlying"},{"id":"4-2-67","set":"4-2","number":67,"stem":"Zet Bank has entered into a contract with Louly Corporation in which Zet agrees\nto buy a 2.5%US Treasury bond maturing in ten years and promises to sell it back\nnext month at an agreed-on price. From Zet Bank's perspective, this contract is\nbest described as a:","options":{"A":"repo.","B":"reverse repo.","C":"collateralized loan."},"answer":"B","topic":"Fixed Income","page":13,"solution":"assets/solutions/4-2/67.jpg","confidence":"ocr","explanation":"because a reverse repo (repurchase agreement) is collateralized cash lending by purchasing an underlying\nsecurity now and selling it back in the future."},{"id":"4-2-68","set":"4-2","number":68,"stem":"Individual investors most likely bear investment risk when participating in:","options":{"A":"defined benefit pension plans only.","B":"defined contribution pension plans only.","C":"both defined benefit pension plans and defined contribution pension plans."},"answer":"B","topic":"Mixed Topics","page":13,"solution":"assets/solutions/4-2/68.jpg","confidence":"ocr","explanation":"because many employees of public and private companies invest for retirement through a defined\ncontribution pension plan (DC plan). DC plans are retirement plans in the employee's name usually funded by both\nthe employee and the employer. The key to a DC plan is that the employee accepts the investment and inflation risk\nand is responsible for ensuring that there are enough assets in the plan to meet their needs upon retirement."},{"id":"4-2-69","set":"4-2","number":69,"stem":"With respect to risk management, determining how risk is taken by an\norganization best describes:","options":{"A":"risk tolerance.","B":"risk mitigation.","C":"risk budgeting."},"answer":"C","topic":"Mixed Topics","page":13,"solution":"assets/solutions/4-2/69.jpg","confidence":"ocr","explanation":"because risk budgeting picks up where risk tolerance leaves off. Whereas risk tolerance focuses on the\nappetite for risk and what is and is not acceptable, risk budgeting has a more specific focus on how that risk is\ntaken. Risk budgeting quantifies and allocates the tolerable risk by specific metrics; it extends and guides\nimplementation of the risk tolerance decision\n\nIntroduction to Risk Management\n\n= describe risk budgeting and its role in risk governance"},{"id":"4-2-70","set":"4-2","number":70,"stem":"Convenience yield provides a possible explanation as to why the current spot\nprice of a commodity is:","options":{"A":"lower than the market's expectation of the future spot price of the commodity.","B":"equal to the market's expectation of the future spot price of the commodity.","C":"higher than the market's expectation of the future spot price of the\ncommodity."},"answer":"C","topic":"Alternative Investments","page":13,"solution":"assets/solutions/4-2/70.jpg","confidence":"ocr","explanation":"because the spot price of the commodity could even be above the market's expectation of its future price, a\ncondition that would seem to imply a negative expected retum. This scenario raises the question of why anyone\nwould want to hold the commodity if its expected retum is negative. The convenience yield provides a possible\nexplanation that attributes an implied but non-financial expected return to the advantage of holding a commodity in\nshort supply.\n\nArbitrage, Replication, and the Cost of Carry in Pricing Derivatives\n\n= explain the difference between the spot and expected future price of an underlying and the cost of carry associated\n\nwith holding the underlying asset"},{"id":"4-2-71","set":"4-2","number":71,"stem":"The sensitivity of a bond's price to a change in the benchmark yield curve is best\ndescribed as.","options":{"A":"effective duration.","B":"modified duration.","C":"the price value of a basis point."},"answer":"A","topic":"Fixed Income","page":14,"solution":"assets/solutions/4-2/71.jpg","confidence":"ocr","explanation":"because effective duration is a type of curve duration that measures the sensitivity of the bond price with\nrespect to a benchmark yield curve."},{"id":"4-2-72","set":"4-2","number":72,"stem":"A hedge fund raised initial capital under the following terms:\nBeginning-of-year assets under management (AUM)       $100 million\nManagement fee based on end-of-year AUM               2%\nIncentive fee                                     20%\nAnnual gross performance                            30%\nIf the incentive fee is calculated net of management fees, total fees earned by the\nmanager are:","options":{"A":"$6.00 million.","B":"$8.08 million.","C":"$8.60 million."},"answer":"B","topic":"Alternative Investments","page":14,"solution":"assets/solutions/4-2/72.jpg","confidence":"ocr","explanation":"because\n$130 million x 2% = USD2.6 million management fee.\n($130 - $100 - $2.6) million x 20% = $5.48 million incentive fee.\nTotal fees = $8.08 million."},{"id":"4-2-73","set":"4-2","number":73,"stem":"Which of the following best describes the intrinsic value of a security? The\nintrinsic value of a security is:","options":{"A":"the price at which the security can be bought or sold.","B":"represented by the intersection of supply and demand for the security.","C":"the value placed by investors based on a complete understanding of the\nsecurity's investment characteristics."},"answer":"C","topic":"Mixed Topics","page":14,"solution":"assets/solutions/4-2/73.jpg","confidence":"ocr","explanation":"because intrinsic value (sometimes called fundamental value) is, broadly speaking, the value that would be\nplaced on [an asset! by investors if they had a complete understanding of the asset's investment characteristics.\n\nMarket Efficiency\n\n= contrast market value and intrinsic value"},{"id":"4-2-74","set":"4-2","number":74,"stem":"Which of the following duration measures is most appropriate for a callable\nbond?","options":{"A":"Effective duration","B":"Modified duration","C":"Macaulay duration"},"answer":"A","topic":"Fixed Income","page":14,"solution":"assets/solutions/4-2/74.jpg","confidence":"ocr","explanation":"because effective duration is essential to the measurement of the interest rate risk of a complex bond, such\nas a bond that contains an embedded call option. The duration of a callable bond is not the sensitivity of the bond\nprice to a change in the yield-to-worst (e., the lowest of the yield-to-maturity, yield-to-first-call, yield-to-second-call,\nand so forth). The problem is that future cash flows are uncertain because they are contingent on future interest\nrates. The issuer's decision to call the bond depends on the ability to refinance the debt at a lower cost of funds. In\nbrief, a callable bond does not have a well-defined internal rate of return (yield-to-maturity). Therefore, yield\nduration statistics, such as modified and Macaulay durations, do not apply; effective duration is the appropriate\nduration measure"},{"id":"4-2-75","set":"4-2","number":75,"stem":"Price multiples for relative comparisons are most likely used for:","options":{"A":"time-series analyses only.","B":"cross-sectional analyses only.","C":"both time-series analyses and cross-sectional analyses."},"answer":"C","topic":"Mixed Topics","page":14,"solution":"assets/solutions/4-2/75.jpg","confidence":"ocr","explanation":"because the major advantage of using price multiples is that they allow for relative comparisons, both\ncross-sectional (versus the market or another comparable) and in time series.\n\nEquity Valuation: Concepts and Basic Tools\n\n= explain the rationale for using price multiples to value equity, how the price to earnings multiple relates to\n\nfundamentals, and the use of multiples based on comparables"},{"id":"4-2-76","set":"4-2","number":76,"stem":"Which of the following best describes an advantage of the EV/EBITDA multiple\nfor valuing equity? An advantage is that:","options":{"A":"the multiple must be positive.","B":"EBITDA is a proxy for operating cash flow.","C":"it does not require the market value of debt."},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/4-2/76.jpg","confidence":"ocr","explanation":"because an advantage of EBITDA is that it is a proxy for operating cashflow because it excludes\ndepreciation and amortization"},{"id":"4-2-77","set":"4-2","number":77,"stem":"The slope of the capital allocation line is the:","options":{"A":"beta of the market.","B":"market price of risk.","C":"market risk premium."},"answer":"B","topic":"Portfolio Management","page":15,"solution":"assets/solutions/4-2/77.jpg","confidence":"ocr","explanation":"because the capital allocation line has an intercept of R, and a slope of (E(R}) — R,/oj, which is the\nadditional required return for every increment in risk, and is sometimes referred to as the market price of risk."},{"id":"4-2-78","set":"4-2","number":78,"stem":"Regarding hedge fund fee calculations, a high-water mark:","options":{"A":"represents the return on gains that are not yet fully realized.","B":"protects the client from paying twice for the same performance.","C":"is the rate of return that the general partner must exceed in order to earn a\nperformance fee."},"answer":"B","topic":"Alternative Investments","page":15,"solution":"assets/solutions/4-2/78.jpg","confidence":"ocr","explanation":"because in hedge funds, fee calculations also take into account a high-water mark, which reflects the\nhighest value used to calculate an incentive fee. A high-water mark is the highest value of the fund investment ever\nachieved at a performance fee crystallization date, net of fees, by the individual LP. The use of high-water marks\nprotects clients from paying twice for the same performance."},{"id":"4-2-79","set":"4-2","number":79,"stem":"In the private debt market, a hybrid loan structure that combines secured and\nunsecured debt into a single loan with a blended interest rate is best described as:","options":{"A":"unitranche debt.","B":"mezzanine debt.","C":"a leveraged loan."},"answer":"A","topic":"Mixed Topics","page":15,"solution":"assets/solutions/4-2/79.jpg","confidence":"ocr","explanation":"because this is the definition of unitranche debt. Another type of debt that could be directly extended to\nborrowers is unitranche debt. Unitranche debt consists of a hybrid or blended loan structure combining different\ntranches of secured and unsecured debt into a single loan with a single, blended interest rate. Since unitranche\ndebt is a blend of secured and unsecured debt, its interest rate will generally fall in between the interest rates often\ndemanded on secured and unsecured debt. The unitranche loan will usually be structured between senior and\nsubordinated debt in priority ranking"},{"id":"4-2-80","set":"4-2","number":80,"stem":"The financial systems that are operationally efficient are most likely characterized\nby:","options":{"A":"security prices that reflect fundamental values.","B":"the use of resources where they are most valuable.","C":"liquid markets with low commissions and order price impacts."},"answer":"C","topic":"Mixed Topics","page":15,"solution":"assets/solutions/4-2/80.jpg","confidence":"ocr","explanation":"because operationally efficient markets are liquid markets in which the costs of arranging trades,\ncommissions, bid-ask spreads, and order price impacts are low.\n\nMarket Organization and Structure\n\n= describe characteristics of a well-functioning financial system"},{"id":"4-2-81","set":"4-2","number":81,"stem":"Which of the following statements about real estate assets is most accurate?","options":{"A":"Real estate assets are homogeneous","B":"Commercial property represents the majority of real estate assets by value","C":"Private real estate has historically had low correlations with other asset\nclasses"},"answer":"C","topic":"Quantitative Methods","page":15,"solution":"assets/solutions/4-2/81.jpg","confidence":"ocr","explanation":"because the key reasons for investing in [private] real estate include potential benefits like historically low\ncorrelations with other asset classes.\n\nReal Estate and Infrastructure\n\n= explain features and characteristics of real estate"},{"id":"4-2-82","set":"4-2","number":82,"stem":"An analyst observes the following series of 1-year forward rates:\nTime Period    Forward Rate\n0y1y          0.1%\n1y1y          0.3%\n2y1y          0.6%\nBased on only this information, the price per 100 of par value of a 3-year 0.2%\nannual coupon bond is closest to:","options":{"A":"97.64.","B":"98.82.","C":"99.60."},"answer":"C","topic":"Fixed Income","page":16,"solution":"assets/solutions/4-2/82.jpg","confidence":"ocr","explanation":"because the Price per 100 of par value = 0.2/ (1+0.1%) + 0.2/ ((1+0.1%) x (140.3%) + (100+0.2) /\n(140.1%) x (140.3%)x (1+0.6%)) = 99.60.\n\nThe Term Structure of Interest Rates: Spot, Par, and Forward Curves\n\n= define par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates,\n\nand the price of a bond using forward rates"},{"id":"4-2-83","set":"4-2","number":83,"stem":"All else being equal, a stock dividend most likely:","options":{"A":"decreases the share price.","B":"has no impact on the share price.","C":"increases the share price."},"answer":"A","topic":"Mixed Topics","page":16,"solution":"assets/solutions/4-2/83.jpg","confidence":"ocr","explanation":"because a stock dividend (also known as a bonus issue of shares) is a type of dividend in which a\ncompany distributes additional shares of its common stock (typically, 2%~10% of the shares then outstanding) to\nshareholders instead of cash. A stock dividend divides the “pie” (the market value of shareholders’ equity) into\nsmaller pieces without affecting the value of the pie or any shareholder's proportional ownership in the company.\nThe smaller pieces (more shares on issue) would be worth less individually even though the shareholders overall\nholding value is unchanged"},{"id":"4-2-84","set":"4-2","number":84,"stem":"Analytical duration:","options":{"A":"assumes that government bond yields and spreads are independent variables.","B":"is lower than empirical duration for high-yield bonds under market stress\nscenarios.","C":"uses statistical methods and historical bond prices to derive the price-yield\nrelationship for bond portfolios."},"answer":"A","topic":"Fixed Income","page":16,"solution":"assets/solutions/4-2/84.jpg","confidence":"ocr","explanation":"because the approach to estimate duration and convexity statistics using mathematical formulas is often\nreferred to as analytical duration. These estimates of the impact of benchmark yield changes on bond prices\nimplicitly assume that government bond yields and spreads are independent variables that are uncorrelated with\n‘one another."},{"id":"4-2-85","set":"4-2","number":85,"stem":"In contrast to investors in otherwise-similar mortgage-backed securities, investors\nin covered bonds most likely.","options":{"A":"face higher credit risks.","B":"are exposed to prepayment risks.","C":"have recourse against the issuing financial institution."},"answer":"C","topic":"Fixed Income","page":16,"solution":"assets/solutions/4-2/85.jpg","confidence":"ocr","explanation":"because covered bonds are similar to ABS but offer bondholders dual recourse—that is, to both the issuing\nfinancial institution and the underlying asset pool.\n\nAsset-Backed Security (ABS) Instrument and Market Features\n\n= describe characteristics and risks of covered bonds and how they differ from other asset-backed securities"},{"id":"4-2-86","set":"4-2","number":86,"stem":"In order to take advantage of short-term capital market expectations, a fund\nmanager holds less of her portfolio inequities than the policy weights prescribe.\nThis action is best described as:","options":{"A":"security selection.","B":"portfolio rebalancing.","C":"tactical asset allocation."},
