statement and the balance sheet"},{"id":"2-1-86","set":"2-1","number":86,"stem":"An investor gathers the following spot exchange rate information:\nAUD/CHF                 1.4024\n\nUSD/CHF                  1.0943\nAUD/CHF is the amount of AUD per 1 CHF.\nUSD/CHF is the amount of USD per 1 CHF.\nThe AUD/USD spot rate is closest to:","options":{"A":"0.7803.","B":"1.2815.","C":"1.5346."},"answer":"B","topic":"Fixed Income","page":19,"solution":"assets/solutions/2-1/86.jpg","confidence":"ocr","explanation":"because given two exchange rates involving three currencies, it is possible to back out what the cross-rate\nmust be. In this case, the calculation is AUD/USD = AUD / CHF x CHF / USD = 1.4024 x (1/1.0943) = 1.281549 =\n1.2815."},{"id":"2-1-87","set":"2-1","number":87,"stem":"An analyst considers the following scenarios for the economy and the sales\ngrowth of a company:\nProbability of                       Probability of SalesScenario                                  Sales Growth                          Scenario                         Growth\nEconomic boom             0.65         15%                0.70\n-5%                0.30\nEconomic downturn          0.35         4%                 0.30\n-10%                0.70\nBased on this information, the probability of an economic downturn and negative\nsales growth is closest to:","options":{"A":"0.195.","B":"0.210.","C":"0.245."},"answer":"C","topic":"Quantitative Methods","page":19,"solution":"assets/solutions/2-1/87.jpg","confidence":"ocr","explanation":"because suppose there is a 0.60 probability that BankCorp will operate in a declining interest rate\nenvironment in the current fiscal year and a 0.40 probability that it will operate in a stable interest rate environment\n(assessing the chance of an increasing interest rate environment as negligible). If a declining interest rate\nenvironment occurs, the probability that EPS will be $2.60 is estimated at 0.25, and the probability that EPS will be\n$2.45 is estimated at 0.75. Note that 0.60, the probability of declining interest rate environment, times 0.25, the\nprobability of $2.60 EPS given a declining interest rate environment, equals 0.15, the (unconditional) probability of\n$2.60\nHere, the probability of an economic downtum is 0.35, in which case negative sales growth (~10%) is expected to\n‘occur with a probability of 0.70, implying that the probability of an economic downturn and negative growth in the\n‘company’s sales is 0.35 x 0.70 = 0.245.\n\nProbability Trees and Conditional Expectations\n\n= formulate an investment problem as a probability tree and explain the use of conditional expectations in investment\napplication"},{"id":"2-1-88","set":"2-1","number":88,"stem":"For a manufacturing company, the reversal of an inventory write-down from prior\nperiods is:","options":{"A":"prohibited.","B":"recognized as an increase in cost of sales.","C":"limited to the amount of the original write-down."},"answer":"C","topic":"Financial Statement Analysis","page":20,"solution":"assets/solutions/2-1/88.jpg","confidence":"ocr","explanation":"because in each subsequent period, a new assessment of net realisable value is made. Reversal (limited\nto the amount of the original write-down) is required for a subsequent increase in value of inventory previously\nwritten down. The reversal of any write-down of inventories is recognised as a reduction in cost of sales\n\nAnalysis of Inventories\n\n= describe the measurement of inventory at the lower of cost and net realisable value and its implications for financial\nstatements and ratios"},{"id":"2-1-89","set":"2-1","number":89,"stem":"In a test of independence based on contingency table data, the nonparametric test\nstatistic to be used is:","options":{"A":"F-distributed.","B":"normally distributed.","C":"chi-square distributed."},"answer":"C","topic":"Mixed Topics","page":20,"solution":"assets/solutions/2-1/89.jpg","confidence":"ocr","explanation":"because if we want to test whether there is a relationship between the size and investment type (two\nclassifications in a contingency table), we can perform a test of independence using a nonparametric test statistic\nthat is chi-square distributed.\n\nParametric and Non-Parametric Tests of Independence\n\n= explain tests of independence based on contingency table data"},{"id":"2-1-90","set":"2-1","number":90,"stem":"An analyst gathers the following information about a company's capital sources:\nTarget weight of debt         25%\nTarget weight of equity       75%\nBefore-tax marginal cost of debt  4%\nMarginal cost of equity       12%\nIf the marginal tax rate is 20% and interest expense is tax deductible, the\ncompany's WACC is:","options":{"A":"9.80%.","B":"10.00%.","C":"10.25%."},"answer":"A","topic":"Financial Statement Analysis","page":20,"solution":"assets/solutions/2-1/90.jpg","confidence":"ocr","explanation":"because taking the sources of capital to be common stock, preferred stock, and debt and allowing for the\nfact that in some jurisdictions, interest expense may be tax deductible, the expression for WACC is\nWACC = wara(1 — f) + Wprp + Were,\nwhere\nWy = the target proportion of debt in the capital structure when the company raises new funds;\nT= the before-tax marginal cost of debt;\nt= the company’s marginal tax rate;\nWp = the target proportion of preferred stock in the capital structure when the company raises new funds [which is\nequal to 0 in our case];\nfp = the marginal cost of preferred stock;\nW, = the target proportion of common stock in the capital structure when the company raises new funds,\nf= the marginal cost of common stock.\nThus, WACC = 0.25 x 4% x (1 — 20%) + 0.75 x 12% = 9.80%."},{"id":"2-2-01","set":"2-2","number":1,"stem":"According to the CAPM, the priced risk of an individual security is:","options":{"A":"measured by the security's standard deviation of returns.","B":"determined primarily by the security's nonsystematic risk.","C":"affected by holding the security in a well-diversified portfolio."},"answer":"C","topic":"Portfolio Management","page":1,"solution":"assets/solutions/2-2/01.jpg","confidence":"ocr","explanation":"because according to capital market theory, the priced risk of an individual security is affected by holding it\nina well-diversified portfolio. The early research provided the insight that an asset's risk should be measured in\nrelation to the remaining systematic or non-diversifiable risk, which should be the only risk that affects the asset's\nprice. This view of risk is the basis of the capital asset pricing model, or CAPM.\n\nPortfolio Management: An Overview\n\n= describe the portfolio approach to investing"},{"id":"2-2-02","set":"2-2","number":2,"stem":"An analyst uses a valuation model to estimate the value of an option-free bond at\n92.733 to yield 11%. If the value is 94.474 for a 60 bps decrease in yield and\n91.041 for a 60 bps increase in yield, the approximate modified duration of the\nbond is closest to:","options":{"A":"1.85.","B":"3.09.","C":"6.17."},"answer":"B","topic":"Fixed Income","page":1,"solution":"assets/solutions/2-2/02.jpg","confidence":"ocr","explanation":"because the approximate modified duration of a bond is\n= _0V)-0¥,)\n\nApproxModDur = sayicintva)\n\nwhere PV_, PV», and PV. are the values of the bond when the yield falls, under the current yield, and when the\n\nyield rises, respectively, and AYield is the size of the yield change. Therefore,\n\n= 94474-91.041\nApproxModDur = 2474-21041 — 3.09"},{"id":"2-2-03","set":"2-2","number":3,"stem":"An analyst tests market efficiency by computing the serial correlations in security\nreturns. The analyst is most likely assessing whether markets are:","options":{"A":"weak-form efficient.","B":"semi-strong-form efficient.","C":"strong-form efficient."},"answer":"A","topic":"Quantitative Methods","page":1,"solution":"assets/solutions/2-2/03.jpg","confidence":"ocr","explanation":"because tests of whether securities markets are weak-form efficient require looking at patterns of prices.\nOne approach is to see whether there is any serial correlation in security returns, which would imply a predictable\npattern"},{"id":"2-2-04","set":"2-2","number":4,"stem":"An analyst gathers the following information:\nStandard Deviation of Returns  Beta\nPortfolio           10%                 0.5\nMarket           20%                 1.0\nThe covariance between the returns of the portfolio and the market is closest to:","options":{"A":"0.005.","B":"0.010.","C":"0.020."},"answer":"C","topic":"Portfolio Management","page":1,"solution":"assets/solutions/2-2/04.jpg","confidence":"ocr","explanation":"because the portfolio's beta is calculated as B, = Cov(R,,Rmn/On?, where Cov(R,,Rmn) is the covariance\nbetween the returns of portfolio p and the market index m, and 0,2 is the market's variance of returns. Therefore,\nCoVv(Rp,Rim) = Bp X On? = 0.5 x 0.2? = 0.020"},{"id":"2-2-05","set":"2-2","number":5,"stem":"An analyst gathers the following information about three securities:\nTotal Variance of Returns   Nonsystematic Variance of Returns\nSecurity 1             0.20                             0.05\nSecurity 2             0.30                             0.25\nSecurity 3             0.35                             0.22\nAccording to capital market theory, which security has the highest expected\nreturn?","options":{"A":"Security 1.","B":"Security 2.","C":"Security 3."},"answer":"A","topic":"Mixed Topics","page":1,"solution":"assets/solutions/2-2/05.jpg","confidence":"ocr","explanation":"because according to the capital market theory investors should not be compensated for taking on\nnonsystematic risk. In contrast, investors must be compensated for accepting systematic risk because that risk\ncannot be diversified away. In summary, systematic or non-diversifiable risk is priced and investors are\ncompensated for holding assets or portfolios based only on that investment's systematic risk. Also, Total variance =\nSystematic variance + Nonsystematic variance. Thus,\n\nSecurity 1 has systematic variance = 0.20 - 0.05 = 0.15;\n\nSecurity 2 has systematic variance = 0.30 — 0.25 = 0.05;\n\nSecurity 3 has systematic variance = 0.35 — 0.22 = 0.13.\n\nSince only systematic variance (risk) is compensated with a higher expected return, Security 1 has the highest\nexpected return"},{"id":"2-2-06","set":"2-2","number":6,"stem":"An analyst gathers the following information to evaluate the effect of dividends\nand leverage on future growth:\nScenario 1  Scenario 2\nDividend payout ratio    60%      40%\nFinancial leverage        3.0          2.5\nIf return on assets is the same for each scenario, the sustainable growth rate is:","options":{"A":"higher under Scenario 1.","B":"higher under Scenario 2.","C":"the same under both Scenario 1 and Scenario 2."},"answer":"B","topic":"Mixed Topics","page":2,"solution":"assets/solutions/2-2/06.jpg","confidence":"ocr","explanation":"because sustainable growth rate g = b x ROE, where b = retention rate = (1 — Dividend payout ratio), and\nROE = ROA x Financial leverage. Thus g = (1 — Dividend payout ratio) x ROA x Financial leverage. Since ROA is\nunchanged between Scenario 1 and 2:\nG scenario 1 = (1 — 0.6) x ROA x 3.0 = 1.2 x ROA; and\n9 scenario2 = (1 — 0.4) x ROA x 2.5=1.5 x ROA\nAccordingly, scenario 2's sustainable growth rate 1.5 x ROA is higher than Scenario 1's sustainable growth rate 1.2\nx ROA."},{"id":"2-2-07","set":"2-2","number":7,"stem":"Which of the following is best described as a relative risk objective?","options":{"A":"Aiming for a return in the top quartile relative to the peer group.","B":"Requiring returns to be within 5%of the return on the S&P 500 index.","C":"Setting the 12-month 95%value at risk (VaR) limit of a portfolio at ¥10\nbillion."},"answer":"B","topic":"Portfolio Management","page":2,"solution":"assets/solutions/2-2/07.jpg","confidence":"ocr","explanation":"because relative risk objectives relate risk relative to one or more benchmarks perceived to represent\nappropriate risk standards. Here, the risk relative to a benchmark is the tracking error against the S&P 500 index."},{"id":"2-2-08","set":"2-2","number":8,"stem":"Which of the following statements about a forward rate agreement is accurate?","options":{"A":"The underlying is a currency exchange rate.","B":"The short position hedges against an increase in interest rates.","C":"The contract is closely tied to the term structure of interest rates."},"answer":"C","topic":"Fixed Income","page":2,"solution":"assets/solutions/2-2/08.jpg","confidence":"ocr","explanation":"because FRA, and indeed all forward contracts relating to bonds and interest rates, are closely tied to the\nterm structure of interest rates.\n\nPricing and valuation of forward contracts and for an underlying with varying maturities\n\n= Explain how forward rates are determined for interest rate forward contracts and describe the uses of these forward\n\nrates."},{"id":"2-2-09","set":"2-2","number":9,"stem":"Empirical duration:","options":{"A":"assumes that government bond yields and spreads are uncorrelated.","B":"is a more accurate risk measure than analytical duration for government\nbonds.","C":"is estimated using historical data in statistical models incorporating various\nfactors."},"answer":"C","topic":"Fixed Income","page":2,"solution":"assets/solutions/2-2/09.jpg","confidence":"ocr","explanation":"because analytical duration offers a reasonable approximation of the price-yield relationship in many\nsituations, but fixed-income professionals often use historical data in statistical models that incorporate various\nfactors affecting bond prices to calculate empirical duration estimates.\n\nCurve-Based and Empirical Fixed-Income Risk Measures\n\n= describe the difference between empirical duration and analytical duration"},{"id":"2-2-10","set":"2-2","number":10,"stem":"Which of the following is an exclusive feature of private equity funds as opposed\nto hedge funds?","options":{"A":"Hurdle rates.","B":"Performance fees.","C":"Management fees based on committed capital."},"answer":"C","topic":"Alternative Investments","page":2,"solution":"assets/solutions/2-2/10.jpg","confidence":"ocr","explanation":"because the management fee is typically based on committed capital, not invested capital; the committed-\ncapital basis for management fees is an important distinction from hedge funds, whose management fees are\nbased on assets under management (AUM).\n\nAlternative Investment Features, Methods, and Structures\n\n= describe investment ownership and compensation structures commonly used in alternative investments"},{"id":"2-2-11","set":"2-2","number":11,"stem":"Investing in private debt most likely is:","options":{"A":"less risky than investing in traditional bonds.","B":"equally risky to investing in traditional bonds.","C":"more risky than investing in traditional bonds."},"answer":"C","topic":"Fixed Income","page":2,"solution":"assets/solutions/2-2/11.jpg","confidence":"ocr","explanation":"because investing in private debt is riskier than investing in traditional bonds. Investors should be aware of\nthese risks, including illiquidity and heightened default risk when loans are extended to riskier entities or borrowers\nin riskier situations.\n\nInvestments in Private Capital: Equity and Debt\n\n= explain features of private debt and its investment characteristics"},{"id":"2-2-12","set":"2-2","number":12,"stem":"Investing in an existing solar power plant is best categorized as a:","options":{"A":"greenfield investment and a social infrastructure asset.","B":"greenfield investment and an economic infrastructure asset.","C":"brownfield investment and an economic infrastructure asset"},"answer":"C","topic":"Alternative Investments","page":3,"solution":"assets/solutions/2-2/12.jpg","confidence":"ocr","explanation":"because brownfield investments expand existing facilities. Also, economic infrastructure investments\ninclude utility and energy assets [that] generate power [such as a solar power plant] and produce potable water,\ntransmit, store, and distribute gas, water, and electricity; and treat solid waste.\n\nReal Estate and Infrastructure\n\n= explain features and characteristics of infrastructure"},{"id":"2-2-13","set":"2-2","number":13,"stem":"Insurance on a portfolio of risky assets is most likely:","options":{"A":"negatively correlated with the portfolio's assets.","B":"uncorrelated with the portfolio's assets.","C":"positively correlated with the portfolio's assets."},"answer":"A","topic":"Portfolio Management","page":3,"solution":"assets/solutions/2-2/13.jpg","confidence":"ocr","explanation":"because insurance has a negative correlation with other assets and is, thus, very valuable. Insurance gives\npositive return when other assets lose value, but pays nothing if other assets maintain their value."},{"id":"2-2-14","set":"2-2","number":14,"stem":"Which bond is most likely to exhibit a reduction in duration as time to maturity\nincreases? A bond priced at:","options":{"A":"par.","B":"a discount.","C":"a premium."},"answer":"B","topic":"Fixed Income","page":3,"solution":"assets/solutions/2-2/14.jpg","confidence":"ocr","explanation":"because a longer time to maturity usually leads to higher duration. It always does so for a bond priced at a\npremium or par value. But if the bond is priced at a discount, a longer time to maturity might lead to a lower\nduration. The situation occurs only if the coupon rate is low (but not zero) relative to the yield and the time to\nmaturity is long"},{"id":"2-2-15","set":"2-2","number":15,"stem":"An analyst gathers the following information about a portfolio and the market:\nReturn Standard Deviation of Returns\nPortfolio       11%           18%\nMarket       10%           20%\nIf the risk-free rate is 4%, the portfolio's �2 alpha is closest to:","options":{"A":"0.3%.","B":"0.8%.","C":"1.8%."},"answer":"C","topic":"Portfolio Management","page":3,"solution":"assets/solutions/2-2/15.jpg","confidence":"ocr","explanation":"because the difference between the risk-adjusted performance (M7) of the portfolio and the performance of\nthe market is frequently referred to as M? alpha. Applying the formula yields:\nM alpha = (Rp — Rf) x (Gm!Sp) + RF- Rm\nMF alpha = (0.11 — 0.04) x (0.20/0.18) + 0.04 — 0.10 = 0.07 x 1.1111 — 0.06 = 1.778% = 1.8%."},{"id":"2-2-16","set":"2-2","number":16,"stem":"The value of a European put option is directly related to the:","options":{"A":"risk-free interest rate.","B":"value of the underlying.","C":"volatility of the underlying."},"answer":"C","topic":"Derivatives","page":3,"solution":"assets/solutions/2-2/16.jpg","confidence":"ocr","explanation":"because the value of a European put is directly related to the volatility of the underlying\nPricing and Valuation of Options\nidentify the factors that determine the value of an option and describe how each factor affects the value of an option"},{"id":"2-2-17","set":"2-2","number":17,"stem":"An analyst gathers the following information about a semiannual pay bond:\nPrice                            102\nYears to maturity                   3\nYield to maturity(semiannual basis)  5.27%\nCoupon                        6.00%\nThe annual yield to maturity based on quarterly compounding is closest to:","options":{"A":"5.24%.","B":"5.33%.","C":"5.96%."},"answer":"A","topic":"Fixed Income","page":3,"solution":"assets/solutions/2-2/17.jpg","confidence":"ocr","explanation":"because a general formula to convert an annual percentage rate for m periods per year, denoted APRm, to\nan annual percentage rate for n periods per year, APRn, is (1 + APR, /m)\" = (1 + APR, / n)\". Solving provides (1 +\n0527/2)? = (1 + APR,/4)*. 1.05339 = (1 + APR,/4)*. APR4/4 = 0.013. and 0.01309 x 4 = 0.05235 = 5.24%."},{"id":"2-2-18","set":"2-2","number":18,"stem":"For a non-callable bond with an approximate annual modified duration of 15.213\nand an approximate annual convexity of 350.32, if the bond's yield increases by\n100 bps, the estimated percentage decline in the price of the bond is closest to:","options":{"A":"0.15%.","B":"8.21%.","C":"13.46%."},"answer":"C","topic":"Fixed Income","page":4,"solution":"assets/solutions/2-2/18.jpg","confidence":"ocr","explanation":"because the estimated percentage decline in the price of the bond given a 100 basis point increase in yield\nis calculated as\n%APV\"™\" = (—AnnModDur x AYield) + [} x AnnConvexity x (AYield)”]\n= (15.213 x 0.01) + [} x 350.32 x (0.01)\"]\n= 0.13461 or — 13.46%\nGiven a 100 basis point increase in the bond's yield to maturity, the bond price would fall by approximately 13.46%\nYield-Based Bond Convexity and Portfolio Properties\n= calculate the percentage price change of a bond for a specified change in yield, given the bond's duration and\nconvexity"},{"id":"2-2-19","set":"2-2","number":19,"stem":"The duration statistic that best measures the interest rate risk of a bond that does\nnot have a well-defined internal rate of return is:","options":{"A":"effective duration.","B":"modified duration.","C":"Macaulay duration."},"answer":"A","topic":"Fixed Income","page":4,"solution":"assets/solutions/2-2/19.jpg","confidence":"ocr","explanation":"because effective duration is essential to the measurement of the interest rate risk of a complex bond, such\nas a bond that contains an embedded call option a callable bond does not have a well-defined internal rate of return\n(yield-to-maturity). Therefore, yield duration statistics, such as modified and Macaulay durations, do not apply;\neffective duration is the appropriate duration measure."},{"id":"2-2-20","set":"2-2","number":20,"stem":"Which of the following components of an investment policy statement most likely\nstates a client's requirements for withdrawing funds from the portfolio?","options":{"A":"Statement of Purpose.","B":"Investment Constraints.","C":"Statement of Duties and Responsibilities."},"answer":"B","topic":"Portfolio Management","page":4,"solution":"assets/solutions/2-2/20.jpg","confidence":"ocr","explanation":"because the IPS should state what the likely requirements are to withdraw funds from the portfolio. When\nthe client does have such a requirement, the manager should allocate part of the portfolio to cover the liability. This\nis a liquidity constraint that would be reflected in the investment constraints component of the IPS. Major types of\nconstraints on portfolio selection are liquidity, time horizon, tax concerns, legal and regulatory factors, and unique\ncircumstances. These constraints are typically discussed in a section of the IPS called, Investment Constraints.\nThis section presents the factors that constrain the client in seeking to achieve the investment objectives."},{"id":"2-2-21","set":"2-2","number":21,"stem":"Which version of the dividend discount model (DDM) would most likely be\nappropriate for valuing a fairly young, publicly traded company?","options":{"A":"A two-stage DDM.","B":"A three-stage DDM.","C":"The Gordon growth model."},"answer":"B","topic":"Equity Investments","page":4,"solution":"assets/solutions/2-2/21.jpg","confidence":"ocr","explanation":"because for most publicly traded companies (that is, companies beyond the startup stage), practitioners\nassume that growth will ultimately fall into three stages: (1) growth, (2) transition, and (3) maturity. This assumption\nsupports the use of a three-stage DDM"},{"id":"2-2-22","set":"2-2","number":22,"stem":"Which of the following is not a credit enhancement in asset-backed securities?","options":{"A":"Credit tranching.","B":"Overcollateralization.","C":"Representations and warranties."},"answer":"C","topic":"Mixed Topics","page":4,"solution":"assets/solutions/2-2/22.jpg","confidence":"ocr","explanation":"because representations and warranties are only provisions in the legal documentation of an ABS, not a\ncredit enhancement. An important legal document is the purchase agreement between the seller of the collateral\nand the SPE,\nwhich sets forth the representations and warranties that the seller makes about the assets sold. These\nrepresentations and warranties assure investors about the quality of the assets, an important consideration when\nassessing the risks associated with the ABS.\n\nAsset-Backed Security (ABS) Instrument and Market Features\n\n= describe typical credit enhancement structures used in securitizations"},{"id":"2-2-23","set":"2-2","number":23,"stem":"In a credit default swap, the party that receives a series of cash payments in return\nfor promising to pay compensation for credit losses resulting from a third party's\ndefault is most likely the:","options":{"A":"clearinghouse.","B":"seller of the swap","C":"buyer of the swap."},"answer":"B","topic":"Derivatives","page":4,"solution":"assets/solutions/2-2/23.jpg","confidence":"ocr","explanation":"because a credit default swap is a derivatives contract between a credit protection buyer and a credit\nprotection seller in which the seller receives a series of cash payments from the buyer in return for a promise of\ncompensation for credit losses resulting from a third party's default."},{"id":"2-2-24","set":"2-2","number":24,"stem":"All else being equal, the price of a commodity futures contract will most likely\ndecrease with a(n):","options":{"A":"decline in storage costs.","B":"increase in the risk-free rate.","C":"decline in the convenience yield."},"answer":"A","topic":"Fixed Income","page":5,"solution":"assets/solutions/2-2/24.jpg","confidence":"ocr","explanation":"because the price [of a futures contract (futures price)] can be formalized in the following form: Futures\nprice ~ Spot price (1 + r) + Storage costs — Convenience yield,\nwhere ris the period’s short-term risk-free interest rate\nThe formula shows that the futures price is positively correlated with storage costs. A decrease in storage costs\nwould indicate a drop in the price of the commodity futures contract."},{"id":"2-2-25","set":"2-2","number":25,"stem":"When a bank invests its excess reserves, which of the following best describes the\nbank's return objective? To earn a return that exceeds the:","options":{"A":"risk-free interest rate.","B":"interest rate the bank pays on its deposits.","C":"interest rate the bank receives on its loans."},"answer":"B","topic":"Mixed Topics","page":5,"solution":"assets/solutions/2-2/25.jpg","confidence":"ocr","explanation":"because banks often have excess reserves that are invested in relatively conservative and very short-\nduration fixed-income investments, with a goal of earning an excess retum above interest obligations due to\ndepositors."},{"id":"2-2-26","set":"2-2","number":26,"stem":"If futures prices are positively correlated with interest rates then futures contracts\nare mostly likely.","options":{"A":"less desirable to holders of long positions than are forwards.","B":"more desirable to holders of long positions than are forwards.","C":"neither more or less desirable to holders of long positions than are forwards."},"answer":"B","topic":"Derivatives","page":5,"solution":"assets/solutions/2-2/26.jpg","confidence":"ocr","explanation":"because if futures prices are positively correlated with interest rates, futures contracts are more desirable\nto holders of long positions than are forwards. The reason is because rising prices lead to futures profits that are\nreinvested in periods of rising interest rates, and falling prices leads to losses that occur in periods of falling interest\nrates. It is far better to receive cash flows in the interim than all at expiration under such conditions. This condition\nmakes futures more attractive than forwards, and therefore their prices will be higher than forward prices."},{"id":"2-2-27","set":"2-2","number":27,"stem":"In futures markets, contract performance is most likely guaranteed by:","options":{"A":"clearinghouses.","B":"regulatory agencies.","C":"the futures exchanges."},"answer":"A","topic":"Derivatives","page":5,"solution":"assets/solutions/2-2/27.jpg","confidence":"ocr","explanation":"because clearing houses arrange for financial settlement of trades. In futures markets, they guarantee\ncontract performance."},{"id":"2-2-28","set":"2-2","number":28,"stem":"Equity style indexes most likely represent groups of securities classified by:","options":{"A":"geography and sector.","B":"value and/or growth and market capitalization.","C":"asset class and gross domestic product (GDP)weight."},"answer":"B","topic":"Economics","page":5,"solution":"assets/solutions/2-2/28.jpg","confidence":"ocr","explanation":"because style indices represent groups of securities classified according to market capitalization, value,\ngrowth, or a combination of these characteristics. They are intended to reflect the investing styles of certain\ninvestors, such as the growth investor, value investor, and small-cap investor."},{"id":"2-2-29","set":"2-2","number":29,"stem":"With respect to index construction, which method of grouping companies most\nlikely experiences the highest turnover in its constituents? Grouping by:","options":{"A":"industry.","B":"geography.","C":"statistical similarities."},"answer":"C","topic":"Mixed Topics","page":5,"solution":"assets/solutions/2-2/29.jpg","confidence":"ocr","explanation":"because company groupings based on statistical similarities tend to have greater constituent turnover than\nthose based on industries or countries. These groupings are usually relative (e.g., companies with dividend yields\nat or above the 75th percentile as of the measurement date) and tend to show far more turnover in their\nconstituents than groupings based on industries and countries, because these statistics are less stable by company\nand companies’ rankings change.\n\nIndustry and Competitive Analysis\n\n= describe industry classification methods and compare methods by which companies can be grouped"},{"id":"2-2-30","set":"2-2","number":30,"stem":"When evaluating hedge fund positions, internal valuation models are most likely\nused for.","options":{"A":"Level 1 assets.","B":"Level 2 assets.","C":"Level 3 assets."},"answer":"C","topic":"Alternative Investments","page":6,"solution":"assets/solutions/2-2/30.jpg","confidence":"ocr","explanation":"because Level 3 asset values are computed using only internal models when outsider broker (Level 2)\nquotes are not available or not reliable\n\nAlternative Investment Performance and Returns\n\n= describe the performance appraisal of alternative investments"},{"id":"2-2-31","set":"2-2","number":31,"stem":"An analyst gathers the following information about a company (in $ millions):\nYear 1\nNet sales                    1,000\nDepreciation expense         36\nNet PP&E-beginning of year   480\nNet PP&E-end of year        530\nForecast assumptions for Year 2\n·net sales growth:10%\n·(depreciation expense /net PP&E beginning of year)ratio to remain constant\n·maintenance capital expenditures equal depreciation expense\n·growth capital expenditure:5% of net sales\nThe forecast total capital expenditure for Year 2 is closest to:","options":{"A":"$55 million.","B":"$86 million.","C":"$95 million"},"answer":"C","topic":"Financial Statement Analysis","page":6,"solution":"assets/solutions/2-2/31.jpg","confidence":"ocr","explanation":"because capital expenditures can be broken down into maintenance capital expenditures necessary to\nsustain the current business and growth capital expenditures needed to expand the business. Maintenance capital\nexpenditure forecasts are often based on historical depreciation and amortization expenses, usually with a small\nadjustment upward to account for inflation in capital goods. Growth capital expenditure forecasts are more\ndiscretionary and are tied to management's expansion plans and revenue growth. Depreciation and amortization\nforecasts are based on net P&E and intangibles on the balance sheet (which increase due to capital expenditures)\nand their useful lives as assumed by management's accounting policies, which can be approximated by the ratio of\ngross fixed assets to depreciation and amortization expenses. Information may also be found in the notes to the\nfinancial statements.\nYear\n(depreciation expense/net PP&E beginning of year) = 36/480 = 0.075\nYear 2\nnet sales = 1,000 x (1+10%) = 1,100\ngrowth capital expenditure = 5% x 1,100 = 55\nmaintenance capital expenditure = depreciation expense = 530 x 0.075= 39.75\ntotal capital expenditure = growth capital expenditure + maintenance capital expenditure = 55 + 39.75 = 94.75 ~ 95\n\nCompany Analysis: Forecasting\n\n= explain approaches to forecasting a company’s capital investments and capital structure"},{"id":"2-2-32","set":"2-2","number":32,"stem":"An asset-based valuation model is most applicable for a company with significant","options":{"A":"intangible assets.","B":"property, plant, and equipment.","C":"proportions of current assets and current liabilities and few intangible assets."},"answer":"C","topic":"Mixed Topics","page":6,"solution":"assets/solutions/2-2/32.jpg","confidence":"ocr","explanation":"because asset-based valuations work well for companies that do not have a high proportion of intangible or\n“off the books” assets and that do have a high proportion of current assets and current liabilities\n\nEquity Valuation: Concepts and Basic Tools\n\n= describe asset-based valuation models and their use in estimating equity value"},{"id":"2-2-33","set":"2-2","number":33,"stem":"A multi-boutique asset manager firm is best described as a(n):","options":{"A":"asset management company that focuses on a specific asset class or style.","B":"asset management company that offers a wide variety of asset classes and\nstyles.","C":"holding company which owns several asset management firms with\nspecialized investment strategies."},"answer":"C","topic":"Mixed Topics","page":6,"solution":"assets/solutions/2-2/33.jpg","confidence":"ocr","explanation":"because multi-boutique is a type of asset manager firm in which a holding company owns several asset\nmanagement firms that typically have specialized investment strategies.\n\nPortfolio Management: An Overview\n\n= describe aspects of the asset management industry"},{"id":"2-2-34","set":"2-2","number":34,"stem":"An overreaction in the financial markets causes a security s price to experience a\nsignificant loss during a short period. If this overreaction is caused by investors\nthat sell because other investors are selling, the behavior is best described as:","options":{"A":"herding","B":"loss aversion.","C":"overconfidence."},"answer":"A","topic":"Mixed Topics","page":6,"solution":"assets/solutions/2-2/34.jpg","confidence":"ocr","explanation":"because herding occurs when investors trade on the same side of the market in the same securities, or\nwhen investors ignore their own private information and/or analysis and act as other investors do. Herding behavior\nhas been advanced as a possible explanation of under-reaction and over-reaction in financial markets."},{"id":"2-2-35","set":"2-2","number":35,"stem":"An analyst observes the following information about a bond:\nYield to Maturity  Full Price\n1.35%          97.5\n1.50%          97.0\n1.65%          96.8\n1.35%          97.5\nIf the initial price of the bond is 97.0, the approximate convexity is closest to:","options":{"A":"2.","B":"687.","C":"1.375."},"answer":"C","topic":"Fixed Income","page":7,"solution":"assets/solutions/2-2/35.jpg","confidence":"ocr","explanation":"because the approximate convexity statistic = ApproxCon = (PV_+ PV, - 2 x PV,)/ [(AYield)? x PV¢]\nwhere\nPV_= price if yields decline\nPV. = price if yields rise\nPVp = initial price\nAYield = change in yield in decimal form\nApproxCon = [(97.5 + 96.8) ~ (2 x 97)] = (0.0015? x 97) = 1,374.5704\nApproxCon = [194.3 - 194] = (0.00000225 x 97) = 1,374.57, rounded to 1,375.\n\nYield-Based Bond Convexity and Portfolio Properties\n\n= calculate and interpret convexity and describe the convexity adjustment"},{"id":"2-2-36","set":"2-2","number":36,"stem":"A bond covenant that prevents the issuance of debt that would be senior to\nexisting bondholders' debt is best described as a:","options":{"A":"negative pledge.","B":"restriction on debt.","C":"cross-default clause."},"answer":"A","topic":"Fixed Income","page":7,"solution":"assets/solutions/2-2/36.jpg","confidence":"ocr","explanation":"because negative pledges prevent the issuance of debt that would be senior to or rank in priority ahead of\nthe existing bondholders’ debt"},{"id":"2-2-37","set":"2-2","number":37,"stem":"Which of the following equations best describes put-call parity for European\noptions?","options":{"A":"�0 = �0 −�0 + �/(1 + �)�","B":"�0 = �0 −�0 + �/(1 + �)�","C":"�0 = �0 −�0 −�/(1 + �)�"},"answer":"A","topic":"Derivatives","page":7,"solution":"assets/solutions/2-2/37.jpg","confidence":"ocr","explanation":"because Sp + po = Cy + X/ (1 +17. This relationship is known as put-call parity. Rearranging the equation,\nwe can get: Pp = Gy ~ Sp + X/ (1 +1). That.is, long put = long call, short asset, long bond."},{"id":"2-2-38","set":"2-2","number":38,"stem":"A bond issued by a local government is best described as a(n):","options":{"A":"agency bond.","B":"supranational bond.","C":"non-sovereign bond."},"answer":"C","topic":"Fixed Income","page":7,"solution":"assets/solutions/2-2/38.jpg","confidence":"ocr","explanation":"because non-sovereign government authorities [local and regional government authorities] may either\nissue debt for general purposes, which is repaid from local tax cash flows, or issue debt to fund specific projects or\ninfrastructure, which is repaid from user fees or other cash flows directly derived from the project.\n\nFixed-Income Markets for Government Issuers\n\n= describe funding choices by sovereign and non-sovereign governments, quasi-government entities, and\nsupranational agencies"},{"id":"2-2-39","set":"2-2","number":39,"stem":"Statutory voting means that shareholders:","options":{"A":"vote by proxy.","B":"have one vote per share.","C":"with a small number of shares are in a better position than in the case of\ncumulative voting."},"answer":"B","topic":"Equity Investments","page":7,"solution":"assets/solutions/2-2/39.jpg","confidence":"ocr","explanation":"because regular shareholder voting, where each share represents one vote, is referred to as statutory\nvoting."},{"id":"2-2-40","set":"2-2","number":40,"stem":"An analyst gathers the following information about a floating-rate note (FRN)\nTime to maturity                  3 years\nCurrent price (per 100 of par value)     98\nReference rate                    1.5%\nQuoted margin                   0.5%\nPayment basis                      Quarterly\nAssuming evenly spaced periods, the discount margin of the FRN is closest to:","options":{"A":"0.69%.","B":"1.20%","C":"3.23%."},"answer":"B","topic":"Fixed Income","page":8,"solution":"assets/solutions/2-2/40.jpg","confidence":"ocr","explanation":"because the interest payment each period is 0.5 per 100 of par value\n[(index + QM) x FV\\/m = (0.015 + 0.005) x 100/4 = 0.5 (where the index is also referred to as the market reference\nrate)\nThe discount margin can be estimated by solving for DM in this equation:\n98 = 0.5/[1 + (0.015 + DM)/4] + 0.5/{1 + (0.015 + DM)/4P +... + (0.5 + 100)/[1 + (0.015 + DMy/4]\"2\nUsing a financial calculator: N = 12, PV = 98, PMT = 0.5, FV = 100 = r= 0.0067406.\nWe can now solve for DM: 0.0067406 = (0.015 + DM)/4 > DM = 0.01196 = 1.20%."},{"id":"2-2-41","set":"2-2","number":41,"stem":"In the binomial option pricing model, the price of a call option will increase when","options":{"A":"the risk-free rate increases.","B":"the volatility of the underlying increases.","C":"the probability of an upward movement in the underlying increases."},"answer":"B","topic":"Derivatives","page":8,"solution":"assets/solutions/2-2/41.jpg","confidence":"ocr","explanation":"because if volatility increases, the difference between S,+ and S,~ increases, which widens the range\nbetween c,+ and c;-, leading to a higher option value."},{"id":"2-2-42","set":"2-2","number":42,"stem":"Assume the current dividend of a security is $9.50. The dividend is expected to\ngrow by 12% each year for two years and then 3% afterwards. The required rate\nof return is 15%. The security's value is closest to:","options":{"A":"$94.99.","B":"$95.58.","C":"$120.51."},"answer":"B","topic":"Mixed Topics","page":8,"solution":"assets/solutions/2-2/42.jpg","confidence":"ocr","explanation":". The value of the security is\nDy = $9.50\nDy = $9.50 x (1 + 0.12) = $10.64\nDy = $9.50 x (1 + 0.12) = $11.92\nDy = $9.50 x (1 + 0.12)? x (1 + 0.03) = $12.27\nsi227\nVax 015-003\ngloss , sis2 , sas\nVo = Gory + 40157 = 4015p $2208"},{"id":"2-2-43","set":"2-2","number":43,"stem":"An analyst gathers the following estimates about a company:\nEarnings retention rate 40% 40%\nGrowth rate           3%\nIf the justified forward P/E is 10 based on the Gordon growth model, the required\nrate of return is:","options":{"A":"6%.","B":"7%.","C":"9%."},"answer":"C","topic":"Mixed Topics","page":8,"solution":"assets/solutions/2-2/43.jpg","confidence":"ocr","explanation":"because 9% is the required rate of return (r), determined by rearranging the justified forward P/E ratio to\nsolve for r, which requires first calculating the dividend payout ratio. The dividend payout ratio = (1 — earnings\nretention rate) = (1 — 0.40) = 0.60. The justified forward P/E = (D, / E,)/ (-g) = p/(r—g) = 10. Rearranging the\nequation: r= p/ (P/E) + g= (0.6 / 10) + 0.03 = 0.09 = 9%, where Pp = current intrinsic value, E, = forecast for next\nyear's earnings, p = dividend payout ratio, g = growth rate\n\nEquity Valuation: Concepts and Basic Tools\n\n= explain the rationale for using price multiples to value equity, how the price to earnings multiple relates to\nfundamentals, and the use of multiples based on comparables"},{"id":"2-2-44","set":"2-2","number":44,"stem":"As one moves to the right along an investor's efficient frontier, a set increase in\nrisk is most likely to lead to:","options":{"A":"sequentially smaller increases in expected return.","B":"consistent increases in expected return.","C":"sequentially larger increases in expected return."},"answer":"A","topic":"Mixed Topics","page":8,"solution":"assets/solutions/2-2/44.jpg","confidence":"ocr","explanation":"because the increase in return with every unit increase in risk keeps decreasing as one moves from left to\nright because the slope of the efficient frontier continues to decrease. Thus, investors obtain decreasing increases\nin returns as they assume more risk"},{"id":"2-2-45","set":"2-2","number":45,"stem":"In a rising interest rate environment, the effective duration of a putable bond\nrelative to an otherwise identical non-putable bond, will most likely be:","options":{"A":"lower.","B":"the same.","C":"higher."},"answer":"A","topic":"Fixed Income","page":9,"solution":"assets/solutions/2-2/45.jpg","confidence":"ocr","explanation":"because when interest rates are rising, the put option becomes more valuable to the investor. The ability to\nsell the bond at par value limits the price depreciation as rates rise. So, the presence of an embedded put option\nreduces the sensitivity of the bond price to changes in interest rates, resulting in a lower effective duration"},{"id":"2-2-46","set":"2-2","number":46,"stem":"Knowledge about the degree of risk aversion of investors is most likely needed\nfor.","options":{"A":"he pricing of assets, but not for the pricing of derivatives.","B":"the pricing of derivatives, but not for the pricing of assets.","C":"both the pricing of assets and the pricing of derivatives."},"answer":"A","topic":"Derivatives","page":9,"solution":"assets/solutions/2-2/46.jpg","confidence":"ocr","explanation":"because derivatives pricing makes use of the fact that arbitrage opportunities guarantee that a risk-free\nportfolio that combines the underlying with a derivative must eam the risk-free rate. As such, no knowledge about\nthe degree of risk aversion of investors is needed. In contrast, the pricing of assets requires knowledge of the\ndegree of risk aversion to adequately assess risk premia"},{"id":"2-2-47","set":"2-2","number":47,"stem":"If an investor wants to protect a short position from adverse price movements\nwhile also providing the opportunity for gains in the future, the investor should\nmost likely use a:","options":{"A":"stop order.","B":"limit order.","C":"market order."},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/2-2/47.jpg","confidence":"ocr","explanation":"because a stop order is an order in which a trader has specified a stop price condition. The stop order may\nnot be filled until the stop price condition has been satisfied. Traders use them with the hope of stopping losses on\npositions that they have established. In the case of a short position, the investor places a stop buy order to protect\npaper gains. In the case of a short position, when the price rises above the stop price, the order becomes\nexecutable."},{"id":"2-2-48","set":"2-2","number":48,"stem":"The lead underwriter in an IPO most likely.","options":{"A":"acts as the book builder for the offering.","B":"is not responsible for making a market in the securities.","C":"is prohibited from providing an opinion about the issue to their clients."},"answer":"A","topic":"Mixed Topics","page":9,"solution":"assets/solutions/2-2/48.jpg","confidence":"ocr","explanation":"because the lead underwriter is the book builder for the offering. Book building is a process where the\ninvestment bank then lines up subscribers who will buy the security. For large issues, a syndicate of investment\nbanks and broker-dealers helps the lead underwriter build the book."},{"id":"2-2-49","set":"2-2","number":49,"stem":"A company has an issuer rating of B. Which of the following types of debt issued\nby this company is most likely to carry a rating of BB-?","options":{"A":"Subordinated debt.","B":"Senior secured debt.","C":"Senior unsecured debt."},"answer":"B","topic":"Mixed Topics","page":9,"solution":"assets/solutions/2-2/49.jpg","confidence":"ocr","explanation":"because for the rating agencies, likelihood of default—default risk—is the primary factor in assigning their\nratings. However, there are secondary factors as well. These factors include the priority of payment in the event of\na default (e.g., secured versus senior unsecured versus subordinated) as well as potential loss severity in the\nevent of default. Recognizing these different payment priorities, and thus the potential for higher (or lower) loss\nseverity in the event of default, the rating agencies have adopted a notching process whereby their credit ratings\n‘on issues can be moved up or down from the issuer rating, which is usually the rating applied to its senior\nunsecured debt. Given that senior secured debt ranks higher in the priority of claims than senior unsecured debt\nand thus potentially has lower loss severity in the event of default, the senior secured debt is most likely to carry a\nBB- rating (which is higher than the issuer rating by 2 notches)."},{"id":"2-2-50","set":"2-2","number":50,"stem":"A portfolio manager creates the following two-security portfolio:\nSecurity     Security Weight  Expected Standard Deviation\nA          30%              30%\nB          70%              25%\nIf the correlation of returns between the two securities is 0.60, the expected\nstandard deviation of the portfolio is closest to:","options":{"A":"16.8%.","B":"24.0%.","C":"26.5%."},"answer":"B","topic":"Portfolio Management","page":9,"solution":"assets/solutions/2-2/50.jpg","confidence":"ocr","explanation":"because Opoy:= \\/wro? + wo? + 2wiwapipaiar\n= Opon = VO3PO.30 + (0.77025)? + 2(0.3)(0.7)(0.6)(0.30)(0.25)\n= Oport = V(0.09(0.09) + (0:49)(0.0625) + 0.0189\n= Ono = 0.057625 = 0.240052078 = 24.0%."},{"id":"2-2-51","set":"2-2","number":51,"stem":"An investor with a 7-year investment horizon purchases an option-free fixed-rate\nbond with modified duration of 7. In a positive yield environment, the investor's\nduration gap is:","options":{"A":"negative.","B":"zero.","C":"positive."},"answer":"C","topic":"Fixed Income","page":10,"solution":"assets/solutions/2-2/51.jpg","confidence":"ocr","explanation":"because modified duration is the Macaulay duration statistic divided by one plus the yield per period. Thus\nin a positive yield environment, Macaulay duration is greater than modified duration; in this case greater than 7\n‘An important property of Macaulay duration is that it indicates the investment horizon for which coupon\nreinvestment risk and market price risk offset each other. The difference between the Macaulay duration of a bond\nand the investment horizon is called the duration gap. The duration gap is a bond's Macaulay duration minus the\ninvestment horizon. Here, since the Macaulay duration is greater than the investment horizon of seven years, the\nduration gap is positive.\n\nInterest Rate Risk and Return\n\n= describe the relationships among a bond's holding period return, its Macaulay duration, and the investment horizon;"},{"id":"2-2-52","set":"2-2","number":52,"stem":"An investor sells a European put option with the following characteristics:\nPut price         15\nExercise price    250\nIf the price of the underlying at expiration is 260, the profit for the seller is:","options":{"A":"5.","B":"10.","C":"15."},"answer":"C","topic":"Derivatives","page":10,"solution":"assets/solutions/2-2/52.jpg","confidence":"ocr","explanation":"because to the put seller, the profit is [1 = -Max(0,X — Sr) + pp, where X is the exercise price, S; is the price\nof the underlying at expiration, and py is the put price. Therefore, M = —Max(0,250 — 260) + 15 = 15\n\nForward Commitment and Contingent Claim Features and Instruments\n\n= determine the value at expiration and profit from a long or a short position in a call or put option"},{"id":"2-2-53","set":"2-2","number":53,"stem":"A company that is required to raise equity capital to continue to operate as a\ngoing concern is most likely doing so to:","options":{"A":"purchase long-lived assets.","B":"fund capital expansion projects.","C":"improve capital adequacy ratios."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/2-2/53.jpg","confidence":"inferred","explanation":""},{"id":"2-2-54","set":"2-2","number":54,"stem":"The average life of a mortgage pass-through security is two years. Six months\nago, its average life was five years. Over the last six months, investors in the\nsecurity have most likely experienced:","options":{"A":"balloon risk.","B":"extension risk.","C":"contraction risk."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/2-2/54.jpg","confidence":"ocr","explanation":"because the average life indicates to investors how long they can expect to hold the MBS before it is paid\noff assuming interest rates stay at current levels and, thus, expected prepayments are realized. The average life\ncontracts rapidly as the prepayment rate goes up. While six months have passed, the average life of the security\nhas decreased by three years. The relevant risk here is therefore contractions risk [whichlis the risk that when\ninterest rates decline, actual prepayments will be higher than forecasted. Thus, a security backed by mortgages will\nhave a shorter maturity than was anticipated at the time of purchase.\n\nMortgage-Backed Security (MBS) Instrument and Market Features\n\n= define prepayment risk and describe time tranching structures in securitizations and their purpose"},{"id":"2-2-55","set":"2-2","number":55,"stem":"An investor buys a call for $24.70 that has a strike price of $650. If the value at\nexpiration for this call is $47.60, the price of the underlying at expiration is\nclosest to:","options":{"A":"$602.40.","B":"$672.90.","C":"$697.60."},"answer":"C","topic":"Mixed Topics","page":10,"solution":"assets/solutions/2-2/55.jpg","confidence":"ocr","explanation":"because the value or \"payoff to the call buyer\" at expiration is cr = Max(0,Sr — X) where X is the strike\nprice, S; is the price of the underlying at expiration. Given the information in the stem we get $47.60 = Max(0,S; —\n$650). Hence, S; =$ 650 + $47.60 = $697.60.\n\nForward Commitment and Contingent Claim Features and Instruments\n\n= determine the value at expiration and profit from a long or a short position in a call or put option"},{"id":"2-2-56","set":"2-2","number":56,"stem":"Management of a price-weighted index most likely entails:","options":{"A":"rebalancing only.","B":"reconstitution only.","C":"both rebalancing and reconstitution."},"answer":"B","topic":"Mixed Topics","page":11,"solution":"assets/solutions/2-2/56.jpg","confidence":"ocr","explanation":"because price-weighted indexes are not rebalanced because the weight of each constituent security is\ndetermined by its price. Reconstitution is the process of changing the constituent securities in an index."},{"id":"2-2-57","set":"2-2","number":57,"stem":"Electronic trading in cryptocurrencies on centralized exchanges is most likely:","options":{"A":"hosted on public servers.","B":"direct without any intermediating broker or dealer.","C":"regulated to the same standard as exchanges for more traditional assets."},"answer":"B","topic":"Mixed Topics","page":11,"solution":"assets/solutions/2-2/57.jpg","confidence":"ocr","explanation":"because trading is electronic and direct, without any intermediating broker or dealer."},{"id":"2-2-58","set":"2-2","number":58,"stem":"An investor purchases a 30-year, 5% annual pay bond at 86.24 and plans to sell it\nin 11 years. Immediately after purchase, interest rates increase by 1%, and they\nremain at that level until maturity. Assuming coupons are reinvested at the new\nyield, the investor's realized horizon yield is closest to:","options":{"A":"5.67%.","B":"6.0%.","C":"6.13%."},"answer":"A","topic":"Fixed Income","page":11,"solution":"assets/solutions/2-2/58.jpg","confidence":"ocr","explanation":"because total return is determined by adding the return from reinvested coupons to the sales price of the\nbond when you sell in 11 years.\nFirst, determine the current yield to maturity by using either the annuity or bond function on your financial calculator.\nUsing the annuity function\nN=30.\nPMT =5.\nPV =-86.24\nFv =100.\nCPT UY = 6.0%.\nSince interest rates increased by 1% immediately after purchase, the reinvested coupons are compounded at 7%\nfor 11 years.\nUsing the annuity function, solve for FV:\nN=11\nIY =7%.\nPV=0.\nPMT =-5.\nCPT FV = 78.92.\nAfter the bond is sold in 11 years, there are 19 years remaining until maturity. The sale price is determined by using\nthe annuity or bond function on your calculator.\nN=19\nWW = 7%.\nPMT =-5.\nFV =—100.\nCPT PV = 79.33.\nTotal return is 158.25(78.92 + 79.33), resulting in a realized 11-year rate of return of 5.67%.\n86.24 = 1825.\n<i +n\"\nr= 0.0567."},{"id":"2-2-59","set":"2-2","number":59,"stem":"Which of the following is the best example of an embedded option granted to\nbondholders?","options":{"A":"A prepayment option.","B":"A put if the issuer's rating changes.","C":"An increasing sinking fund provision."},"answer":"B","topic":"Derivatives","page":11,"solution":"assets/solutions/2-2/59.jpg","confidence":"ocr","explanation":"because a put allows the bondholder to sell the security back to the issuer if the bondholder chooses to do\nso"},{"id":"2-2-60","set":"2-2","number":60,"stem":"A hedge fund that implements trades based on a top-down analysis of expected\nmovements in economic variables most likely uses a(n):","options":{"A":"macro strategy.","B":"relative value strategy","C":"event-driven strategy."},"answer":"A","topic":"Alternative Investments","page":11,"solution":"assets/solutions/2-2/60.jpg","confidence":"ocr","explanation":"because macro strategies emphasize a top-down approach, and trades are made based on expected\nmovements of economic variables"},{"id":"2-2-61","set":"2-2","number":61,"stem":"A reason for a company's management to repurchase its shares is to signal a belief\nthat the company's shares are:","options":{"A":"undervalued.","B":"fairly valued.","C":"overvalued."},"answer":"A","topic":"Equity Investments","page":11,"solution":"assets/solutions/2-2/61.jpg","confidence":"ocr","explanation":"because company managements have expressed several key reasons for engaging in share\nrepurchases— namely, signaling a belief that their shares are undervalued"},{"id":"2-2-62","set":"2-2","number":62,"stem":"The option-free bonds of Argus Corporation have a duration of eight years. When\ninterest rates rise by 100 bps, the bond's price declines by 7.9%. When interest\nrates fall by 100 bps, however, the price rises by 8.2%.The asymmetrical price\nchange is most likely caused by the:","options":{"A":"coupon effect.","B":"maturity effect.","C":"convexity effect."},"answer":"C","topic":"Fixed Income","page":12,"solution":"assets/solutions/2-2/62.jpg","confidence":"ocr","explanation":"because a fall in interest rates will result in a higher percentage rise in the bond's price compared with the\npercentage fall in the bond's price when interest rates rise by the same amount.\nFixed-Income Bond Valuation: Prices and Yields\n= identify the relationships among a bond’s price, coupon rate, maturity, and yield-to-maturity"},{"id":"2-2-63","set":"2-2","number":63,"stem":"Only the seller can default on a(n):","options":{"A":"swap.","B":"option.","C":"forward."},"answer":"B","topic":"Derivatives","page":12,"solution":"assets/solutions/2-2/63.jpg","confidence":"ocr","explanation":"because the option buyer (the long) does not have to exercise the option, beyond the initial payment of the\npremium, therefore there is no obligation of the long to the short. Thus, only the short can default, which would\n‘occur if the long exercises the option and the short fails to do what it is supposed to do. Thus, in contrast to\nforwards and swaps, in which either party could default to the other, default in options is possible only from the\nshort to the long."},{"id":"2-2-64","set":"2-2","number":64,"stem":"An analyst gathers the following information about a hedge fund's first year of\noperations:\nBeginning-of-year assets under management                   $100,000,000\nManagement fee based on end-of-year assets under management    2%\nIncentive fee, calculated net of the management fee             20%\nAnnual gross return                                  15%\nSoft hurdle rate                                  5%\nThe total fees (in $millions) earned by the hedge fund in Year 1 are:","options":{"A":"3.84.","B":"4.30.","C":"4.84."},"answer":"C","topic":"Alternative Investments","page":12,"solution":"assets/solutions/2-2/64.jpg","confidence":"ocr","explanation":"because the management fee is $2,300,000 ($15,000,000 x .02) and the incentive fee is $2,540,000\n(($115,000,000 — $100,000,000 — $2,300,000) x .2). Total fees are $4,840,000. With a soft hurdle rate, the\nincentive fee is eared on all of the return as long as the hurdle rate is exceeded\n\nAlternative Investment Performance and Returns\n\n= calculate and interpret alternative investment returns both before and after fees"},{"id":"2-2-65","set":"2-2","number":65,"stem":"Alternative investments are most likely characterized by:","options":{"A":"more transparency than traditional investments.","B":"more restrictions on redemptions than traditional investments.","C":"High correlation of returns with those of traditional investments."},"answer":"B","topic":"Alternative Investments","page":12,"solution":"assets/solutions/2-2/65.jpg","confidence":"ocr","explanation":"because alternative investments differ from traditional asset classes in\nthat they involve longer time horizons, unique patterns of cash flows, the use of leverage, illiquid positions, more\ncomplex fee structures, different tax and accounting treatment, and so on. Special provisions also exist for the\nlockup and redemption of capital from investors."},{"id":"2-2-66","set":"2-2","number":66,"stem":"If the annual market discount rate is 6%, the value of a 3-year bond that has a 7%\ncoupon rate, has a maturity (par) value of $1,000, and pays interest annually is\nclosest to:","options":{"A":"$973.76.","B":"$1,026.73.","C":"$1,049.17."},"answer":"B","topic":"Fixed Income","page":12,"solution":"assets/solutions/2-2/66.jpg","confidence":"ocr","explanation":"because\nPV = PMT¢/ (141), where\nPV is the present value\nPMT is the payment = par value x coupon rate = $70\nTis the market discount rate.\nExpanding this equation over three years results in a present value equal to:\ns,s , $1070 _ =\nSR + FR + SER = $66.04 + $62.30 + $898.39 = $1, 026.73"},{"id":"2-2-67","set":"2-2","number":67,"stem":"An efficient market is best described as one in which","options":{"A":"an active investment strategy is preferred to a passive strategy.","B":"consistent, superior, risk-adjusted returns, net of all expenses, cannot be\nachieved.","C":"the time frame for price adjustment to new information allows many traders\nto profit."},"answer":"B","topic":"Mixed Topics","page":13,"solution":"assets/solutions/2-2/67.jpg","confidence":"ocr","explanation":"because consistent, superior, risk-adjusted returns (net of all expenses) are not achievable in an efficient\nmarket."},{"id":"2-2-68","set":"2-2","number":68,"stem":"The correlation between the returns of a risk-free asset and a portfolio of risky\nassets is:","options":{"A":"negative.","B":"zero.","C":"positive."},"answer":"B","topic":"Portfolio Management","page":13,"solution":"assets/solutions/2-2/68.jpg","confidence":"ocr","explanation":"because a combination of the risk-free asset and a risky asset can result in a better risk-return trade-off\nthan an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset"},{"id":"2-2-69","set":"2-2","number":69,"stem":"With respect to derivatives, which of the following is a second-order risk?","options":{"A":"Vega.","B":"Delta.","C":"Gamma."},"answer":"C","topic":"Derivatives","page":13,"solution":"assets/solutions/2-2/69.jpg","confidence":"ocr","explanation":"because whereas delta is a first-order risk, gamma is considered a second-order risk because it reflects\nthe risk of changes in delta\n\nIntroduction to Risk Management\n\n= describe methods for measuring and modifying risk exposures and factors to consider in choosing among the\n\nmethods"},{"id":"2-2-70","set":"2-2","number":70,"stem":"Risk management is a process that can most likely be best described as:","options":{"A":"minimizing risks while attempting to maximize returns.","B":"forecasting the level of risk that can meet a defined required return.","C":"defining a level of risk to betaken with the goal of maximizing the portfolio's\nvalue."},"answer":"C","topic":"Portfolio Management","page":13,"solution":"assets/solutions/2-2/70.jpg","confidence":"ocr","explanation":"because risk management is the process by which an organization or individual defines the level of risk to\nbe taken, measures the level of risk being taken, and adjusts the latter toward the former, with the goal of\nmaximizing the company’s or portfolio’s value or the individual's overall satisfaction or utility.\n\nIntroduction to Risk Management\n\n= define risk management"},{"id":"2-2-71","set":"2-2","number":71,"stem":"The price of a stock is $100 and the risk-free rate is 5%. If the strike price of a\nEuropean put option with one year until expiration is $105, the put option is:","options":{"A":"at the money.","B":"in the money.","C":"out of the money."},"answer":"B","topic":"Derivatives","page":13,"solution":"assets/solutions/2-2/71.jpg","confidence":"ocr","explanation":"because when the underlying is beyond the exercise price in the appropriate direction (higher for a call,\nlower for a put), the option is said to be in the money. When the underlying is precisely at the exercise price, the\noption is said to be at the money. When the underlying has not reached the exercise price (currently lower for a\ncall, higher for a put), the option is said to be out of the money. Here, the put option is in the money since the stock\nprice is below the strike price"},{"id":"2-2-72","set":"2-2","number":72,"stem":"The following information relates to a leveraged investment:\nPurchase price                           $100/share\nSales price                              $110/share\nShares purchased and subsequently sold     10,000\nLeverage ratio                                2.5\nCall money rate, per annum            5%\nDividends received                        $5/share\nHolding period                         1 year\nThe return on investment is closest to:","options":{"A":"18%.","B":"25%.","C":"30%."},"answer":"C","topic":"Equity Investments","page":14,"solution":"assets/solutions/2-2/72.jpg","confidence":"ocr","explanation":"because it has correctly applied the effects of leverage, dividend, and interest cost in the calculation,\naccordingly:\nCost of purchase Shares purchased x Purchase price = 10,000 x $100 = $1,000,000\nEquity invested Cost of purchase / Leverage ratio = $1,000,000 / 2.5 = $400,000\nInitial investment Equity invested = $400,000\nAmount borrowed Cost of purchase — Equity invested = $1,000,000 — $400,000 = $600,000\nSales proceeds Shares sold x Sales price = 10,000 x $110 = $1,100,000\nInterest paid Amount borrowed x Call money rate = $600,000 x 5% = $30,000\nDividend Shares purchased x Dividend received per share = 10,000 x $5/share = $50,000\nreceived\nNet gain/loss Sales Proceeds + Dividends received — Cost of purchase — Interest paid = $1,100,000 +\n$50,000 — $1,000,000 — $30,000 = $120,000\nReturn on Net gain/loss / Initial investment = $120,000 / $400,000 = 30%\ninvestment\nMarket Organization and Structure\n= calculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which\nthe investor would receive a margin call"},{"id":"2-2-73","set":"2-2","number":73,"stem":"An investor seeking an indirect debt investment in real estate is most likely to.","options":{"A":"originate a residential mortgage.","B":"purchase a commercial property.","C":"purchase a mortgage-backed security."},"answer":"C","topic":"Fixed Income","page":14,"solution":"assets/solutions/2-2/73.jpg","confidence":"ocr","explanation":"because mortgage-backed securities are pools of loans that are securitized and offered to the financial\nmarkets providing indirect debt investment opportunities in residential property.\n\nReal Estate and Infrastructure\n\n= explain features and characteristics of real estate"},{"id":"2-2-74","set":"2-2","number":74,"stem":"An analyst gathers the following information about spot rates:\nTime to Maturity  Sequence 1  Sequence 2\n1 year         2.0%       4.7%\n2 years         3.5%       3.5%\n3 years         4.7%       2.0%\nFor a 3-year,2%annual coupon payment bond, the price using Sequence 1 is:","options":{"A":"less than the price using Sequence 2.","B":"the same as the price using Sequence 2.","C":"greater than the price using Sequence 2."},"answer":"A","topic":"Fixed Income","page":14,"solution":"assets/solutions/2-2/74.jpg","confidence":"ocr","explanation":"because the formula to calculate a bond price given a sequence of spot rates is the following: PV =(PMT/\n(14Z,)\") + (PMT / (1+Z,) + .. + (PMT + FV)/ (1+Z,)\"), where\nZ, = spot rate, or zero-coupon yield, or zero rate, for Period 1\nZ,= spot rate, or zero-coupon yield, or zero rate, for Period 2\nZu = spot rate, or zero-coupon yield, or zero rate, for Period N.\nFor Sequence 1, applying this formula, the bond price is: (2/1.02) + (2/1.0712) + (102/1.1477) = 1.9608 + 1.8670 +\n88.871 ~ 92.70\nFor Sequence 2, the bond price is: (2/1.047) + (2/1.712) + (102/1.0612) = 1.9608 + 1.8674 + 96.1169 ~ 99.89.\nThe bond price using Sequence 1 is less than the price using Sequence 2"},{"id":"2-2-75","set":"2-2","number":75,"stem":"The decision to divest from fossil fuels in a portfolio is most consistent with\nwhich of the following approaches to ESG investing?","options":{"A":"ESG integration.","B":"Impact investing.","C":"Negative screening."},"answer":"C","topic":"Portfolio Management","page":14,"solution":"assets/solutions/2-2/75.jpg","confidence":"ocr","explanation":"because negative screening refers to the practice of excluding certain sectors or excluding companies that\ndeviate from accepted standards or norms. The example described in the stem is the practice of excluding the\nfossil fuels sector from investment options.\n\nBasics of Portfolio Planning and Construction\n\n= describe how environmental, social, and governance (ESG) considerations may be integrated into portfolio.\nplanning and construction"},{"id":"2-2-76","set":"2-2","number":76,"stem":"A transaction setup to absorb the variable cash flow of a floating-rate asset can\nbe described as a:","options":{"A":"fair value hedge.","B":"cash flow hedge.","C":"net investment hedge."},"answer":"B","topic":"Fixed Income","page":14,"solution":"assets/solutions/2-2/76.jpg","confidence":"ocr","explanation":"because derivatives designated as absorbing the variable cash flow of a floating-rate asset or liability such\nas foreign exchange, interest rates, or commodities are referred to as cash flow hedges."},{"id":"2-2-77","set":"2-2","number":77,"stem":"The security market line applies:","options":{"A":"to all securities.","B":"only to efficient securities.","C":"only to securities that have idiosyncratic risk."},"answer":"A","topic":"Portfolio Management","page":15,"solution":"assets/solutions/2-2/77.jpg","confidence":"ocr","explanation":"because the security market line applies to any security, efficient or not. The security market line (SML) is\ngraphical representation of the capital asset pricing model with beta, reflecting systematic risk, on the x-axis and\nexpected return on the y-axis."},{"id":"2-2-78","set":"2-2","number":78,"stem":"Which of the following sections of an investment policy statement most likely\ndetails the role of the custodian for a client's assets?","options":{"A":"Procedures.","B":"Investment Guidelines.","C":"Statement of Duties and Responsibilities."},"answer":"C","topic":"Portfolio Management","page":15,"solution":"assets/solutions/2-2/78.jpg","confidence":"ocr","explanation":"because the Statement of Duties and Responsibilities details the duties and\nresponsibilities of the client, the custodian of the client's assets, and the investment\nmanagers.\n\nBasics of Portfolio Planning and Construction\n\n= describe the major components of an IPS"},{"id":"2-2-79","set":"2-2","number":79,"stem":"If a stock is purchased on margin where the minimum margin requirement is 35%,\nthe maximum leverage ratio is closest to:","options":{"A":"1.54.","B":"1.86.","C":"2.86."},"answer":"C","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-2/79.jpg","confidence":"ocr","explanation":"because the leverage ratio is the ratio of the value of the position to the value of the equity investment in it\nLeverage ratio = 1/initial margin requirement; or = 1/0.35 = 2.857 ~ 2.86\n\nMarket Organization and Structure\n\n= calculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which\n\nthe investor would receive a margin call"},{"id":"2-2-80","set":"2-2","number":80,"stem":"Compared to the total return version of an index, the value of the price version of\nthe index at inception is:","options":{"A":"less than the value of the total return version.","B":"equal to the value of the total return version.","C":"greater than the value of the total return version."},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-2/80.jpg","confidence":"ocr","explanation":"because at inception, the values of the price and total return versions of an index are equal. As time\npasses, however, the value of the total retum index will exceed the value of the price return index."},{"id":"2-2-81","set":"2-2","number":81,"stem":"When presented with new information, if an analyst asks themselves the question\n\"how much does this information change my forecast?\" then which of the\nfollowing biases is the analyst most likely trying to overcome?","options":{"A":"Hindsight bias.","B":"Self-control bias.","C":"Conservatism bias."},"answer":"C","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-2/81.jpg","confidence":"ocr","explanation":"because conservatism bias is a belief perseverance bias in which people maintain their prior views or\nforecasts by inadequately incorporating new, conflicting information. In order to overcome such a bias, when new\ninformation is presented, the FMP (financial market participant) should ask such questions as, ‘How does this\ninformation change my forecast?’ or ‘What effect does this information have on my forecast?”\n\nThe Behavioral Biases of Individuals\n\n= discuss commonly recognized behavioral biases and their implications for financial decision making"},{"id":"2-2-82","set":"2-2","number":82,"stem":"Which of the following is not a source of return from investing in equities?","options":{"A":"Cash dividends.","B":"Stock dividends.","C":"Change in the market price of equities."},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/2-2/82.jpg","confidence":"ocr","explanation":"because stock splits and reverse stock splits are similar to stock dividends in that they have no economic\neffect on the company or shareholders. They are therefore not a source of returns to the shareholder."},{"id":"2-2-83","set":"2-2","number":83,"stem":"Compared to the deal-by-deal waterfall distribution method in alternative\ninvestments, the whole-of-fund method is:","options":{"A":"less advantageous to general partners than to limited partners.","B":"equally advantageous to general partners and to limited partners.","C":"more advantageous to general partners than to limited partners."},"answer":"A","topic":"Alternative Investments","page":16,"solution":"assets/solutions/2-2/83.jpg","confidence":"ocr","explanation":"because the whole-of-fund waterfall distribution method is less advantageous to general partners. Deal-\nby-deal waterfalls are more advantageous to the GP because performance fees are collected on a per-deal basis,\nallowing the GP to get paid before LPs receive both their initial investment and their preferred rate of retum (i.e.,\nthe hurdle rate) on the entire fund. In whole-of-fund waterfalls, all distributions go to the LPs as deals are exited\nand the GP does not participate in any profits until the LPs receive their initial investment and the hurdle rate has\nbeen met."},{"id":"2-2-84","set":"2-2","number":84,"stem":"An analyst gathers the following information about a hedge fund's fee structure:\nAssets under management (AUM), beginning of period  $80 million\nManagement fee, based on year-end AUM            2%\nIncentive fee                                20%\nThe management and incentive fees are calculated independently. If the hedge\nfund generates a gross return of 25%, the assets under management after fees at\nthe end of the period are closest to:","options":{"A":"$94.0 million.","B":"$94.4 million.","C":"$97.6 million."},"answer":"A","topic":"Alternative Investments","page":16,"solution":"assets/solutions/2-2/84.jpg","confidence":"ocr","explanation":"because management fee = $80 million x (1 + 25%) x 2% = $2 million;\nIncentive fee = ($80 million x 25%) x 20% = $4 million;\nAssets under management (AUM), net of fees = ($80 million x (1 + 25%) - $2 million - $4 million) = $94.0 milion."},{"id":"2-2-85","set":"2-2","number":85,"stem":"A private equity firm sells a portfolio company to a buyer that is active in the\nsame industry as the portfolio company. This transaction is best described as a(n):","options":{"A":"trade sale.","B":"secondary sale.","C":"initial public offering."},"answer":"A","topic":"Portfolio Management","page":16,"solution":"assets/solutions/2-2/85.jpg","confidence":"ocr","explanation":"because in a trade sale, a portion or a division of the private company is sold either via direct sale or\nauction to a strategic buyer interested in increasing the scale and scope of the existing business"},{"id":"2-2-86","set":"2-2","number":86,"stem":"Convenience yield is primarily associated with which of the following assets?","options":{"A":"High-yield bonds.","B":"Dividend-paying stocks.","C":"Commodities in short supply."},"answer":"C","topic":"Fixed Income","page":16,"solution":"assets/solutions/2-2/86.jpg","confidence":"ocr","explanation":"because convenience yields are primarily associated with commodities and generally exist as a result of\ndifficulty in either shorting the commodity or unusually tight supplies. They represent a nonmonetary advantage of\nholding the asset. In contrast, for most financial assets, convenience yields are either nonexistent or extremely\nlimited\n\nArbitrage, Replication, and the Cost of Carry in Pricing Derivatives\n\n= explain the difference between the spot and expected future price of an underlying and the cost of carry associated\n\nwith holding the underlying asset"},{"id":"2-2-87","set":"2-2","number":87,"stem":"For a bond investment, loss severity is:","options":{"A":"independent of the recovery rate.","B":"used in the calculation of the expected loss.","C":"the primary focus when assessing the creditworthiness of high-quality\nissuers."},"answer":"B","topic":"Fixed Income","page":16,"solution":"assets/solutions/2-2/87.jpg","confidence":"ocr","explanation":"because Expected loss = Default probability x Loss severity given default"},{"id":"2-2-88","set":"2-2","number":88,"stem":"A market where buyers and sellers trade only with dealers is most likely a(n):","options":{"A":"brokered market.","B":"order-driven market.","C":"quote-driven market."},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/2-2/88.jpg","confidence":"ocr","explanation":"because in quote-driven markets, customers trade with dealers. Traders call them quote-driven (or price-\ndriven or dealer) because customers trade at the prices quoted by dealers. Thus, in quote-driven markets both\nbuyer and seller customers directly trade with dealers and not with each other.\n\nMarket Organization and Structure\n\n= describe how securities, contracts, and currencies are traded in quote-driven, order-driven, and brokered markets"},{"id":"2-2-89","set":"2-2","number":89,"stem":"A non-recourse residential mortgage loan:","options":{"A":"does not allow the lender to recover the outstanding mortgage balance.","B":"only allows the lender to use the property to recover the outstanding\nmortgage balance.","C":"permits the lender to seek recovery of the outstanding mortgage balance from\nthe borrower's other assets."},"answer":"B","topic":"Mixed Topics","page":17,"solution":"assets/solutions/2-2/89.jpg","confidence":"ocr","explanation":"because in a non-recourse loan, the lender can look only to the property to recover the outstanding\nmortgage balance."},{"id":"2-2-90","set":"2-2","number":90,"stem":"According to put-call-forward parity, a fiduciary call is equal to:","options":{"A":"a long call and a long risk-free asset.","B":"a long call, a short forward and a long risk-free bond.","C":"a long forward, a short call and a short risk-free bond."},"answer":"A","topic":"Fixed Income","page":17,"solution":"assets/solutions/2-2/90.jpg","confidence":"ocr","explanation":"because we can demonstrate put-call forward parity by comparing a synthetic protective put position to the\nprotective put and fiduciary call positions. Consider a modification of the portf
