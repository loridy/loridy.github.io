alue of a basis point (PVBP)"},{"id":"3-2-89","set":"3-2","number":89,"stem":"A repo is best defined as a:","options":{"A":"publicly traded, collateralized short-term security.","B":"security that provides the holder the right to sell it back to the issuer at par.","C":"sale of a security with an agreement by the seller to buy it back at a specified\nprice."},"answer":"C","topic":"Mixed Topics","page":17,"solution":"assets/solutions/3-2/89.jpg","confidence":"ocr","explanation":"because a repurchase agreement or repo is the sale of a security with a simultaneous agreement by the\nseller to buy the same security back from the purchaser at an agreed-on price and future date.\n\nFixed-Income Markets for Corporate Issuers\n\n= compare short-term funding alternatives available to corporations and financial institutions"},{"id":"3-2-90","set":"3-2","number":90,"stem":"An analyst uses a multi-factor model to estimate the expected returns of various\nsecurities. The model analyzes historical and cross-sectional return data to\nidentify factors that explain the variance or covariance in the securities' observed\nreturns. This model is most likely a:","options":{"A":"statistical factor model.","B":"fundamental factor model.","C":"macroeconomic factor model."},"answer":"A","topic":"Mixed Topics","page":18,"solution":"assets/solutions/3-2/90.jpg","confidence":"ocr","explanation":"because statistical factor models use historical and cross-sectional return data to identify factors that\nexplain the variance or covariance in the observed returns of securities"},{"id":"4-1-01","set":"4-1","number":1,"stem":"Ashley Brown, CFA, applies for a new job. In her application letter, she states,\n\"As a CFA charterholder, I provide the best value in trade execution.\" Further, she\nstates, \"I passed all three CFA Program examinations in three consecutive years.\"\nHas Brown violated the Standards?","options":{"A":"No","B":"Yes, by stating, \"As a CFA charterholder, I provide the best value in trade\nexecution\"","C":"Yes, by stating, \"As a CFA charterholder, I provide the best value in trade\nexecution\" and by stating, \" I passed all three CFA Program examinations in\nthree consecutive years\""},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/4-1/01.jpg","confidence":"ocr","explanation":"because according to Standard VII (B), Reference to CFA Institute, the CFA Designation, and the CFA\nProgram, Brown violated the Standards by directly implying that superior performance in trade execution can be\nexpected of someone with the CFA designation. Statements referring fo CFA Institute, the CFA designation, or the\nCFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior\nperformance can be expected from someone with the CFA designation are not allowed under the standard."},{"id":"4-1-02","set":"4-1","number":2,"stem":"Michael Cane, CFA, is an investment manager. Cane's proxy voting policy\nincludes a provision that voting proxies may not be required in all instances if\nthey do not benefit clients. The proxy voting policy is disclosed to his clients only\nupon request. Has Cane most likely violated the Standard relating to loyalty,\nprudence and care?","options":{"A":"Yes, only because the voting of proxies is required in all instances","B":"Yes, only because the proxy voting policy is disclosed to his clients only\nupon request","C":"Yes, both because the voting of proxies is required in all instances and\nbecause the proxy voting policy is disclosed to his clients only upon request"},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/4-1/02.jpg","confidence":"ocr","explanation":"because according to Standard III (A), Loyalty, Prudence and Care, part of a member's or candidate’s duty\nof loyalty includes voting proxies in an informed and responsible manner. Proxies have economic value to a client,\nand members and candidates must ensure that they properly safeguard and maximize this value. An investment\nmanager who fails to vote, casts a vote without considering the impact of the question, or votes blindly with\nmanagement on nonroutine governance issues (e.g., a change in company capitalization) may violate this\nstandard. Voting of proxies is an integral part of the management of investments. A cost-benefit analysis may show\nthat voting all proxies may not benefit the client, so voting proxies may not be necessary in all instances. Members\nand candidates should disclose to clients their proxy voting policies. Therefore members should disclose their proxy\nvoting policies to clients, not only upon request."},{"id":"4-1-03","set":"4-1","number":3,"stem":"Which of the following is a recommended procedure for compliance with the\nstandard relating to responsibilities of supervisors? Once a violation in the form\nof wrongdoing from an employee is discovered, a supervisor should do which of\nthe following?","options":{"A":"Avoid increasing supervision of the wrongdoer until the investigation is\nconcluded","B":"Place appropriate limitations on the wrongdoer pending the outcome of the\ninvestigation","C":"Rely on an employee's statement about the extent of a violation of the law if\nthe employee gives written assurance that the wrongdoing will not reoccur"},"answer":"B","topic":"Ethics","page":1,"solution":"assets/solutions/4-1/03.jpg","confidence":"ocr","explanation":"because according to Standard IV (C), Responsibilities of Supervisors, once a supervisor learns that an\n‘employee has violated or may have violated the law or the Code and Standards, the supervisor must promptly\ninitiate an assessment to determine the extent of the wrongdoing. Relying on an employee's statements about the\nextent of the violation or assurances that the wrongdoing will not reoccur is not enough. Reporting the misconduct\nup the chain of command and warning the employee to cease the activity are also not enough. Pending the\n‘outcome of the investigation, a supervisor should take steps to ensure that the violation will not be repeated, such\nas placing limits on the employee's activities or increasing the monitoring of the employee's activities."},{"id":"4-1-04","set":"4-1","number":4,"stem":"Which of the following is a requirement for compliance with the GIPS standards?","options":{"A":"The GIPS standards must be applied on a firm-wide basis","B":"A firm must represent partial compliance by stating it is \"in compliance with\nthe GIPS standards except for...\"","C":"A firm must refer to its performance calculation methodology as being \"in\ncompliance\" with the GIPS standards"},"answer":"A","topic":"Ethics","page":1,"solution":"assets/solutions/4-1/04.jpg","confidence":"ocr","explanation":"because the GIPS standards requirements for the fundamentals of compliance include that the GIPS\nstandards must be applied on a FIRM-wide basis. Compliance cannot be achieved on a single product or\ncomposite"},{"id":"4-1-05","set":"4-1","number":5,"stem":"Jessica Jayson, CFA, lives in a country without requirements to keep client\ninformation confidential. Her firm requires only keeping information regarding\ncurrent clients confidential. Jayson discusses charity donations with one of her\nfriends and shares an email address of a former client who was involved in\ncharity work. Has Jayson most likely violated the Standards?","options":{"A":"No","B":"Yes, the Standard relating to fair dealing","C":"Yes, the Standard relating to knowledge of the law"},"answer":"C","topic":"Ethics","page":2,"solution":"assets/solutions/4-1/05.jpg","confidence":"ocr","explanation":"because according to Standard | (A), Knowledge of the Law, When applicable law and the Code and\nStandards require different conduct, members and candidates must follow the more strict of the applicable law or\nthe Code and Standards. According to Standard III (E), Preservation of Confidentiality, Members and Candidates\nmust keep information about current, former, and prospective clients confidential. In this case, the Code and\nStandards were stricter so Jayson must not have revealed her former client's e-mail address."},{"id":"4-1-06","set":"4-1","number":6,"stem":"Mary Lawrence, CFA, is a research analyst. She archives her research notes for\nrecommendation changes and discards her research notes for cases in which\nrecommendations do not change. She also discards third-party research reports\nused to support her analysis. Lawrence has most likely violated the Standards:","options":{"A":"only by discarding third-party research reports used to support her analysis.","B":"only by discarding her research notes for cases in which recommendations do\nnot change.","C":"both by discarding third-party research reports used to support her analysis\nand by discarding her research notes for cases in which recommendations do\nnot change."},"answer":"C","topic":"Ethics","page":2,"solution":"assets/solutions/4-1/06.jpg","confidence":"inferred","explanation":""},{"id":"4-1-07","set":"4-1","number":7,"stem":"Robert Dowling, CFA, is part of a research team. Dowling's team has\nrecommended a \"buy\" rating on a company, but Dowling does not agree with the\nrecommendation. To comply with the Standard relating to diligence and\nreasonable basis, Dowling:","options":{"A":"must decline to be identified with the report.","B":"must ensure that the report reflects his opinion.","C":"may continue to be identified with the report as long as the recommendation\nhas a reasonable basis."},"answer":"C","topic":"Ethics","page":2,"solution":"assets/solutions/4-1/07.jpg","confidence":"ocr","explanation":"because according to Standard V (A), Diligence and Reasonable Basis, if a member believes that the\nconsensus opinion has a reasonable and adequate basis and is independent and objective, the member or\ncandidate need not decline to be identified with the report. If the member or candidate is confident in the process,\nthe member or candidate does not need to dissociate from the report even if it does not reflect his or her opinion.\nThus, Dowling may accept the group's decision and may be identified with the report as long as it has a reasonable\nbasis"},{"id":"4-1-08","set":"4-1","number":8,"stem":"According to the Standard relating to preservation of confidentiality, if local laws\nrequire investment personnel to maintain confidentiality, is a member permitted\nto share confidential client information?","options":{"A":"No","B":"Yes, if the information concerns activities of a former client","C":"Yes, if the information is provided in support of an investigation by the CFA\nInstitute Professional Conduct Program into the member's conduct"},"answer":"A","topic":"Ethics","page":2,"solution":"assets/solutions/4-1/08.jpg","confidence":"ocr","explanation":"because according to Standard III(E), Preservation of Confidentiality, if applicable law requires members to\nmaintain confidentiality, even if the information concems illegal activities on the part of the client, members and\ncandidates should not disclose such information."},{"id":"4-1-09","set":"4-1","number":9,"stem":"Monique Gretta, CFA, is a research analyst at East West Investment Bank.\nPreviously, Gretta worked at a mutual fund management company and has a\nlong-standing client relationship with the managers of the funds and their\ninstitutional investors. Gretta often provides fund managers, who work for\nGretta's former employer, with draft copies of her research before disseminating\nthe information to all of the bank's clients. This practice has helped Gretta avoid\nseveral errors in her reports, and she believes it is beneficial to the bank's clients,\neven though they are not aware of this practice. Regarding her research, Gretta\nleast likely violated the Standards because:","options":{"A":"her report is a draft.","B":"this practice benefits all clients.","C":"the long-standing client relationships are not disclosed."},"answer":"C","topic":"Ethics","page":3,"solution":"assets/solutions/4-1/09.jpg","confidence":"ocr","explanation":"because the analyst does not violate any of the Standards of Professional Conduct by having long-\nstanding client relationships and generally is not required to disclose such relationships. However, the analyst is not\ntreating all clients fairly as required by Standard III(B), Fair Dealing, when disseminating investment\nrecommendations."},{"id":"4-1-10","set":"4-1","number":10,"stem":"Which of the following actions violate the Standard relating to market\nmanipulation?\nAction 1  Entering large buy and sell trades between multiple proprietary\naccounts of the firm with the intent to increase trading volume.\nAction 2  Securing a dominant position in a financial instrument with an intent\nto influence the price of a related derivative.\nAction 3   Exploiting perceived market inefficiencies through aggressive trading\nstrategies.","options":{"A":"Action 1 and Action 2 only","B":"Action 1 and Action 3 only","C":"Action 2 and Action 3 only"},"answer":"A","topic":"Ethics","page":3,"solution":"assets/solutions/4-1/10.jpg","confidence":"ocr","explanation":"because Standard II(B), Market Manipulation, precludes transaction-based manipulation such as\nattempting to buy and sell the stock using the accounts in hopes of raising the trading volume and the price. So,\nAction 1 violates the Standard. Also, the Standard precludes other transaction-based manipulation such as\nsecuring a controlling, dominant position in a financial instrument to exploit and manipulate the price of a related\nderivative and/or the underlying asset. So, Action 2 also violates the Standard,"},{"id":"4-1-11","set":"4-1","number":11,"stem":"Alice Chan, CFA, a portfolio manager, does comprehensive research and\nconcludes that First Automobile Company's (FAC) stock is suitable for all of her\nfirm's clients. To avoid potential conflict, Chan buys FAC's stock for other clients\nfirst and then for her sister's fee-paying account in which she has no beneficial\ninterest. She makes no disclosure to clients about her sister's account. The price\nof FAC's stock declines significantly after three months, causing substantial\nlosses to all her clients. Chan has violated the Standard relating to:","options":{"A":"disclosure of conflicts.","B":"priority of transactions.","C":"diligence and reasonable basis."},"answer":"B","topic":"Ethics","page":3,"solution":"assets/solutions/4-1/11.jpg","confidence":"ocr","explanation":"because according to Standard VI(B), Priority of Transactions, family accounts that are client accounts\nshould be treated like any other firm account and should neither be given special treatment nor be disadvantaged\nbecause of the family relationship. Chan should treat her sister's fee-paying account like any other firm account and\nshould not be disadvantaged. Therefore, Lau has violated Standard VI(B)."},{"id":"4-1-12","set":"4-1","number":12,"stem":"Regarding ethical standards in the investment industry, which of the following is\nmost accurate? CFA Institute:","options":{"A":"requires charterholders to engage in their professional communities.","B":"aims to build market integrity by calling for regulations that align the\ninterests of firms and clients.","C":"promotes the highest standards of ethics, education, and professional\nexcellence for the ultimate benefit of shareholders."},"answer":"B","topic":"Ethics","page":4,"solution":"assets/solutions/4-1/12.jpg","confidence":"ocr","explanation":"because the advocacy efforts of CFA Institute aim to build market integrity by calling for regulations that\nalign the interests of firms and clients."},{"id":"4-1-13","set":"4-1","number":13,"stem":"Which of the following statements relating to the GIPS standards is accurate?\nStatement 1     Verification improves the consistency of a firm's GIPS-compliant\npresentations.\nStatement 2     Verification provides assurance to clients that specific composite\npresentations made by a firm are accurate.","options":{"A":"Statement 1 only","B":"Statement 2 only","C":"Both Statement 1 and Statement 2"},"answer":"A","topic":"Ethics","page":4,"solution":"assets/solutions/4-1/13.jpg","confidence":"ocr","explanation":"because verification may also increase the knowledge of the firm’s performance measurement team and\nimprove the consistency and quality of the firm's GIPS standards-related performance information. Therefore,\nStatement 1 is accurate."},{"id":"4-1-14","set":"4-1","number":14,"stem":"Merchant Capital Partners, a regional investment bank, acts as a market maker for\nVital Link Health Services and other small firms listed on an over-the-counter\nexchange. For those shares for whom Merchant acts as market maker, it trades for\nits own book as well as engaging in risk arbitrage trading. Merchant allows staff\nmembers to trade in shares once clients and the company have traded. Merchant\nrecently obtained material nonpublic information regarding Vital's planned\nreverse takeover of a publicly listed competitor. In order to be in compliance with\nthe CFA Institute Code and Standards, which type of trading in Vital shares\nshould Merchant least likely suspend?","options":{"A":"Personal","B":"Risk arbitrage","C":"Passive proprietary"},"answer":"C","topic":"Ethics","page":4,"solution":"assets/solutions/4-1/14.jpg","confidence":"ocr","explanation":"because according to Standard II(A), Material Nonpublic Information, Recommended Procedures for\nCompliance, if Merchant stopped market making, a form of proprietary trading, due to being in possession of\nmaterial nonpublic information, it could tip off investors that Vital is likely to be making a major announcement in the\nnear future. This would be counterproductive to the goals of maintaining the confidentiality of information and\nproviding market liquidity. The Standard recommends that market makers remain passive when in possession of\nmaterial nonpublic information. The Standard also requires personal trading to be suspended when in possession\nof material nonpublic information, and it is prudent to suspend arbitrage trading to prevent profits from insider\ntrading"},{"id":"4-1-15","set":"4-1","number":15,"stem":"Sisse Brimberg, CFA, is responsible for performance presentations at her\ninvestment firm. The presentation that Sisse uses states that when making\nperformance presentations her firm:\n  deducts all fees and taxes;\n   uses actual and simulated performance results; and\n   bases the performance on a representative individual account.\nBased only on the this information, which of the following is the most\nappropriate recommendation to help Brimberg meet the CFA Institute Standards\nof Professional Conduct in her performance presentations? She should present\nperformance based on:","options":{"A":"a gross of fee basis.","B":"actual not simulated results.","C":"a weighted composite for all similar discretionary portfolios."},"answer":"C","topic":"Ethics","page":5,"solution":"assets/solutions/4-1/15.jpg","confidence":"ocr","explanation":"because in order to meet their obligations under Standard III(D), Performance Presentation, members\nshould present the performance of the weighted composite of similar portfolios rather than using a single\nrepresentative or all accounts."},{"id":"4-1-16","set":"4-1","number":16,"stem":"According to the Standard relating to suitability, which of the following is\ncorrect?","options":{"A":"An appropriate suitability determination will prevent some investments from\nlosing value","B":"Members must judge the suitability of investments in the context of the\nclient's total portfolio","C":"The higher the expected investment return, the lower the need to determine\nthe investment's suitability"},"answer":"B","topic":"Ethics","page":5,"solution":"assets/solutions/4-1/16.jpg","confidence":"ocr","explanation":"because according to Standard Ill (C), Suitability, members must judge the suitability of investments in the\ncontext of the client's total portfolio."},{"id":"4-1-17","set":"4-1","number":17,"stem":"According to the Standards, members who plan to engage in independent practice\nfor compensation must notify their employers and describe which of the\nfollowing items regarding the services they will render to prospective\nindependent clients?\nItem 1     The types of services\nItem 2     The expected duration of the services\nItem 3     The compensation for the services","options":{"A":"Only Item 1","B":"Only Item 1 and Item 2","C":"Item 1, Item 2, and Item 3"},"answer":"C","topic":"Ethics","page":5,"solution":"assets/solutions/4-1/17.jpg","confidence":"ocr","explanation":"because according to Standard IV(A) Loyalty, members and candidates who plan to engage in\nindependent practice for compensation must notify their employer and describe the types of services they will\nrender to prospective independent clients, the expected duration of the services, and the compensation for the\nservices"},{"id":"4-1-18","set":"4-1","number":18,"stem":"David Jacobs, CFA, and Megan Amari, CFA, work for Global Investment Inc.\nand receive fees for client referrals. Prior to signing service agreements with\nclients, Jacobs informs his clients about the referral fee arrangement without\nproviding an estimated dollar value. Amari discloses all details of the\narrangement, including the estimated dollar value, to her clients only after the\nservice agreements are signed. Who has violated the Standards?","options":{"A":"Amari only","B":"Jacobs only","C":"Both Amari and Jacobs"},"answer":"C","topic":"Ethics","page":6,"solution":"assets/solutions/4-1/18.jpg","confidence":"ocr","explanation":"because according to Standards VI(C), Referral Fees, appropriate disclosure means that members and\ncandidates must advise the client or prospective client, before entry into any formal agreement for services, of any\nbenefit given or received for the recommendation of any services provided by the member or candidate. In addition,\nthe member or candidate must disclose the nature of the consideration or benefit, together with the estimated dollar\nvalue. Jacobs does not provide the estimated dollar value and and Amari discloses after the agreement is signed\nTherefore, they both violate Standard VI(C)."},{"id":"4-1-19","set":"4-1","number":19,"stem":"Jennifer Ducumon, CFA, is a portfolio manager for high-net-worth individuals at\nNortheast Investment Bank. Northeast holds a large number of shares in\nBabyskin Care Inc., a manufacturer of baby care products. Northeast obtained the\nBabyskin shares when they underwrote the company's recent IPO. Ducumon has\nbeen asked by the investment banking department to recommend Babyskin to her\nclients, who currently do not hold any shares in their portfolios. Although\nDucumon has a favorable opinion of Babyskin, she does not consider the shares a\nbuy at the IPO price nor at current price levels. According to the CFA Institute\nCode of Ethics and Standards of Professional Conduct the most appropriate\naction for Ducumon is to:","options":{"A":"ignore the request.","B":"recommend the shares after additional analysis.","C":"follow the request as soon as the share price declines."},"answer":"A","topic":"Ethics","page":6,"solution":"assets/solutions/4-1/19.jpg","confidence":"ocr","explanation":"because Ducumon should refuse to recommend the shares as her opinion of the Babyskin shares must not\nbe affected by internal pressure. If Ducumon followed the request from the investment banking department at her\ncompany, she would be in violation of Standard I(B), Independence and Objectivity. Ducumon must refuse to\nrecommend the Babyskin shares until they are an attractive purchase based on fundamental analysis and market\npricing"},{"id":"4-1-20","set":"4-1","number":20,"stem":"Yao Tsang, CFA, has a large percentage of his net worth invested in the\nAustralian mining company Outback Mines, which he has held for many years.\nTsang is in the process of moving to a new employer where he is responsible for\ninitiating research on mining companies. Shortly after his move, Tsang is asked to\ncomplete a research report on Outback. In order to meet the CFA Institute\nStandards of Professional Conduct concerning his stock holding, which of the\nfollowing actions is most appropriate for Tsang to take?","options":{"A":"Disclose his stock holding to his employer and to clients","B":"Sell his stock holdings to eliminate any potential conflict of interest","C":"Refuse to write the report and ask his employer to assign another analyst to\ncomplete the analysis"},"answer":"A","topic":"Ethics","page":6,"solution":"assets/solutions/4-1/20.jpg","confidence":"ocr","explanation":"because disclosure should be made as required by Standard VI(A), Disclosure of Conflicts. This standard\ndoes not preclude an analyst from owning shares in a covered company but any ownership needs to be adequately\ndisclosed. As the stock in question has been held for many years it may not be practical to sell it due to issues such\nas tax consequences. In addition, since the analyst has been hired to initiate coverage of mining companies, the\nfirm may not have other analysts that would be as competent in completing a research report on mining companies"},{"id":"4-1-21","set":"4-1","number":21,"stem":"According to the Standard relating to misrepresentation, a member is most likely\nrequired to:","options":{"A":"disclose his intended use of an external manager.","B":"always provide a benchmark for investment strategies.","C":"provide attribution to a member who is no longer with the firm when issuing\na report."},"answer":"A","topic":"Ethics","page":7,"solution":"assets/solutions/4-1/21.jpg","confidence":"ocr","explanation":"because according to Standard | (C), Misrepresentation, members and candidates must disclose their\nintended use of external managers and must not represent those managers’ investment practices as their own."},{"id":"4-1-22","set":"4-1","number":22,"stem":"Manpreet Grewal, CFA, is a wealth manager and also teaches underprivileged\nchildren at a school on holiday weekends. The school pays Grewal a nominal fee\nfor his services. Grewal does not disclose this arrangement to his employer. Has\nGrewal violated the Standards?","options":{"A":"No","B":"Yes, the Standard relating to disclosure of conflicts","C":"Yes, the Standard relating to additional compensation arrangements"},"answer":"A","topic":"Ethics","page":7,"solution":"assets/solutions/4-1/22.jpg","confidence":"ocr","explanation":"because Standard IV(B), Additional Compensation Arrangements, requires members and candidates to\nobtain permission from their employer before accepting compensation or other benefits from third parties for the\nservices rendered to the employer or for any services that might create a conflict with their employer's interest.\nSince the activity in concern is teaching, there is no conflict with the employer and hence no approval is needed\nAdditionally, the teaching is done on holiday weekends and the pay is nominal. According to Standard VI(A),\nDisclosure of Conflicts, members and candidates must make full and fair disclosure of all matters that could\nreasonably be expected to impair their independence and objectivity or interfere with respective duties to their\nclients, prospective clients, and employer. Grewal teaches on holiday weekends which does not pose any conflict of\ninterest with his employer and hence no disclosure is necessary. Neither Standard is violated"},{"id":"4-1-23","set":"4-1","number":23,"stem":"Which of the following can claim compliance with the GIPS standards?","options":{"A":"Only asset owners","B":"Only asset owners and consultants who advise investment funds","C":"Asset owners, consultants who advise investment funds, and software\nvendors"},"answer":"A","topic":"Ethics","page":7,"solution":"assets/solutions/4-1/23.jpg","confidence":"ocr","explanation":"because according to the GIPS standards, asset owners may comply with the GIPS standards in the same\nway as firms if they compete for business. If they don’t compete for business but report their performance to an\noversight body, asset owners may choose to comply with the GIPS standards for asset owners"},{"id":"4-1-24","set":"4-1","number":24,"stem":"Which of the following is a key concept relating to the GIPS standards? The\nGIPS standards:","options":{"A":"address every aspect of performance measurement.","B":"require firms to adhere to certain calculation methodologies to allow for\ncomparability across firms.","C":"require the inclusion of all discretionary and non-discretionary segregated\naccounts in at least one composite."},"answer":"B","topic":"Ethics","page":7,"solution":"assets/solutions/4-1/24.jpg","confidence":"ocr","explanation":"because the GIPS standards require firms to adhere to certain calculation methodologies to allow for\n‘comparability across firms."},{"id":"4-1-25","set":"4-1","number":25,"stem":"Which of the following is among the recommended procedures for compliance\nwith the Standard relating to misconduct?\nProcedure 1  Disseminate to all employees a list of past violations together with\ndisciplinary actions.\nProcedure 2  Check references of potential employees to ensure that they are of\ngood character.","options":{"A":"Procedure 1 only","B":"Procedure 2 only","C":"Both Procedure 1 and Procedure 2"},"answer":"B","topic":"Ethics","page":7,"solution":"assets/solutions/4-1/25.jpg","confidence":"ocr","explanation":"because according to the recommended procedures for compliance with the Standard relating to\nmisconduct, members should encourage their firms to check references of potential employees to ensure that they\nare of good character."},{"id":"4-1-26","set":"4-1","number":26,"stem":"Millicent Plain has just finished taking Level II of the CFA examination. Upon\nleaving the examination site, she meets with four Level III candidates who also\njust sat for their exams. Curious about their examination experience, Plain asks\nthe candidates how difficult the Level IIIexam was and how they did on it. The\ncandidates say the essay portion of the examination was much harder than they\nhad expected and they were not able to complete all questions as a result. The\ncandidates go on to tell Plain about broad topic areas that were tested and\ncomplain about specific formulas they had memorized that did not appear on the\nexam. The Level III candidates least likely violated the CFA Institute Standards\nof Professional Conduct by discussing:","options":{"A":"specific formulas.","B":"broad topic areas.","C":"the examination essays."},"answer":"C","topic":"Ethics","page":8,"solution":"assets/solutions/4-1/26.jpg","confidence":"ocr","explanation":"because discussing the level of difficulty of the essay portion of the examination is not a violation of\nStandard VII(A)-Conduct as Participants in CFA Institute Programs."},{"id":"4-1-27","set":"4-1","number":27,"stem":"Mike Leung, CFA, is a research analyst at an investment firm. Leung does\ncomprehensive analysis and identifies several stocks that are undervalued. Leung\nposts a recommended stock list on social media which is accessible to all clients,\nstating that additional information will be available upon request. Has Leung\nviolated the Standards?","options":{"A":"No","B":"Yes, by posting only a recommended stock list","C":"Yes, by using social media to communicate his recommendations to clients"},"answer":"A","topic":"Ethics","page":8,"solution":"assets/solutions/4-1/27.jpg","confidence":"ocr","explanation":"because according to Standard V(B), Communication with Clients and Prospective Clients, if\nrecommendations are contained in capsule form (such as a recommended stock list), members and candidates\nshould notify clients that additional information and analyses are available from the producer of the report. In\naddition, members and candidates using any social media service to communicate business information must be\ndiligent in their efforts to avoid unintended problems because these services may not be available to all clients.\nWhen providing information to clients through new technologies, members and candidates should take reasonable\nsteps to ensure that such delivery would treat all clients fairly and, if necessary, be considered publicly\ndisseminated. Leung posts the recommended stock list on social media, which is accessible to all of his firm's\nclients, with additional information upon request. Therefore, Leung has not violated Standard V(B)."},{"id":"4-1-28","set":"4-1","number":28,"stem":"Private contracts, such as bank loan agreements, are most likely to provide an\neffective disciplinary mechanism to ensure high financial reporting quality\nbecause:","options":{"A":"lenders monitor managers and pay close attention to the firm's financial\nreports.","B":"loan covenants require the firm to meet specific financial ratios in order to\nrenew the loan.","C":"loan covenants may allow the lender to recover all or part of their investment\nif certain financial conditions are triggered."},"answer":"A","topic":"Financial Statement Analysis","page":8,"solution":"assets/solutions/4-1/28.jpg","confidence":"ocr","explanation":"because the monitoring role of lenders is most likely to insure high-quality financial reports because the\nlenders inspect financial reports carefully to be sure they are not manipulated"},{"id":"4-1-29","set":"4-1","number":29,"stem":"A corporate takeover mechanism by which shareholders are persuaded to vote for\na group seeking a controlling position on a company's board of directors best\ndefines a:","options":{"A":"tender offer.","B":"proxy contest.","C":"hostile takeover."},"answer":"B","topic":"Mixed Topics","page":8,"solution":"assets/solutions/4-1/29.jpg","confidence":"ocr","explanation":"because corporate takeovers can be pursued in several different ways. One mechanism is the proxy\ncontest (or proxy fight). In a proxy contest, shareholders are persuaded to vote for a group seeking a controlling\nposition on a company’s board of directors."},{"id":"4-1-30","set":"4-1","number":30,"stem":"A company reporting under US GAAP has production facilities with a net book\nvalue of $28.4 million. Recently, several competitors have entered its market, and\nthe company now estimates that its production facilities will be able to generate\ncash flows of only $3 million per year for the next seven years. The firm has a\ncost of capital of 10%.\nBased on these recent events related to its production facilities, the company's\nfinancial statements will most likely report a:","options":{"A":"$13.8 million reduction in operating cash flows.","B":"$13.8 million impairment loss on the income statement.","C":"$7.4 million reduction in the balance sheet carrying amount."},"answer":"B","topic":"Financial Statement Analysis","page":9,"solution":"assets/solutions/4-1/30.jpg","confidence":"ocr","explanation":". The company will report an impairment loss of $13.8 million on its income statement. Under US GAAP, the\nfacilities fail the recoverability test: the net book value cannot be recovered from undiscounted cash flows (7 years x\n$3 = $21 < $28.4). Therefore, the asset is impaired and should be written down to its fair value.\n\nFair Value is the present value (PV) of future benefits: (N = 7; i= 10; PMT = 3); PV= 14.6\nImpairment Loss is Carrying value — Fair value = 28.4 — 14.6 = 13.8 to be reported on the income statement."},{"id":"4-1-31","set":"4-1","number":31,"stem":"Which of the following statements best describes the effect of finance leases on\nfinancial statements?","options":{"A":"Balance sheet effects differ based on whether the lease is a direct financing\nlease or a sales-type lease","B":"The lessor reports a profit on the sale of the leased asset on the income\nstatement in the case of a sales-type lease","C":"A lessee reports the interest portion of the lease payment as operating cash\nflow under IFRS and financing cash flow under US GAAP"},"answer":"B","topic":"Financial Statement Analysis","page":9,"solution":"assets/solutions/4-1/31.jpg","confidence":"ocr","explanation":"because a lessor reports a profit on the sale of the asset on the income statement when the present value\nof the lease payments exceeds the carrying amount of the leased asset (sales-type lease)."},{"id":"4-1-32","set":"4-1","number":32,"stem":"In which of the following business structures do owners share all risk and\nbusiness liability?","options":{"A":"Corporations","B":"Limited partnerships","C":"General partnerships"},"answer":"C","topic":"Mixed Topics","page":9,"solution":"assets/solutions/4-1/32.jpg","confidence":"ocr","explanation":"because general partnerships have a small number of partners who establish the business by contributing\n‘equal amounts of capital. A key feature of general partnerships is that partners share all risk and business liability.\n\nOrganizational Forms, Corporate Issuer Features, and Ownership\n\n= compare the organizational forms of businesses"},{"id":"4-1-33","set":"4-1","number":33,"stem":"Assuming wages and prices are stable, which of the following policy\ncombinations most likely leads to an increase in the private sector's share of\nGDP?","options":{"A":"Easy fiscal and easy monetary policy","B":"Tight fiscal and easy monetary policy","C":"Easy fiscal and tight monetary policy"},"answer":"B","topic":"Economics","page":9,"solution":"assets/solutions/4-1/33.jpg","confidence":"ocr","explanation":"because with tight fiscal policy/easy monetary policy: If a fiscal contraction is accompanied by\n‘expansionary monetary policy and low interest rates, then the private sector will be stimulated and will rise as a\nshare of GDP, while the public sector will shrink"},{"id":"4-1-34","set":"4-1","number":34,"stem":"Inventory values are recorded at the lower of cost or.","options":{"A":"market.","B":"net realizable value.","C":"estimated selling price."},"answer":"B","topic":"Financial Statement Analysis","page":9,"solution":"assets/solutions/4-1/34.jpg","confidence":"ocr","explanation":"because inventories are measured at the lower of cost or net realizable value under IFRS"},{"id":"4-1-35","set":"4-1","number":35,"stem":"A crucial requirement for a central bank to be effective is to:","options":{"A":"maintain reasonable inflation targets.","B":"maintain independence from the government.","C":"preserve the confidentiality of its economic views."},"answer":"B","topic":"Economics","page":10,"solution":"assets/solutions/4-1/35.jpg","confidence":"ocr","explanation":"because independence, credibility, and transparency are arguably the crucial ingredients for an effective\ncentral bank, whether they target inflation or not."},{"id":"4-1-36","set":"4-1","number":36,"stem":"An analyst gathers the following information (in € millions) about a company's\nland that is valued under the revaluation model:\nPurchase cost                                          20\nCarrying amount after first revaluation at 31 December Year 1   18\nCarrying amount after second revaluation at 31 December Year  23\n\nAs a result of the second revaluation, the revaluation surplus increases (in €\nmillions) by:","options":{"A":"2.","B":"3.","C":"5."},"answer":"B","topic":"Mixed Topics","page":10,"solution":"assets/solutions/4-1/36.jpg","confidence":"ocr","explanation":"because if a revaluation initially decreases the carrying amount of the asset class, the decrease is\nrecognised in profit or loss. Later, if the carrying amount of the asset class increases, the increase is recognised in\nprofit or loss to the extent that it reverses a revaluation decrease of the same asset class previously recognised in\nprofit or loss. Any increase in excess of the reversal amount will not be recognised in the income statement but will\nbe recorded directly to equity in a revaluation surplus account. In Year 1, a loss of 2,000,000 is recognized in profit\nand loss; In Year 2, the loss of 2,000,000 is reversed on the income statement as a gain, and the excess of\n3,000,000 (5,000,000 — 2,000,000) bypasses profit or loss and goes through OC! to the revaluation surplus."},{"id":"4-1-37","set":"4-1","number":37,"stem":"The following table summarizes income statement data for a manufacturing\ncompany:\nYear 2            Year 1\n(in € Thousands)   (in € Thousands)\nNet revenue                                    2,611             2,325\nCost of goods sold                              1,700             1,550\nGross profit                                 930             775\nSelling, general & administrative expense         295             260\nOperating income                            635             515\nInterest expense                              55              55\nPre-tax income                              580             460\nIncome tax                                  155             120\nNet income                                 425             340\nCompared with Year 1, the Year 2 common-size income statement most likely\nindicates:","options":{"A":"a lower tax rate.","B":"sale of a new, differentiated product.","C":"cost cutting in selling, general and administration."},"answer":"B","topic":"Financial Statement Analysis","page":10,"solution":"assets/solutions/4-1/37.jpg","confidence":"ocr","explanation":"because gross profit margin improved from 33.3% (E775/€2,325) to 35.6% (€930/€2,611). This may be\nreflective of selling a new, more highly differentiated product."},{"id":"4-1-38","set":"4-1","number":38,"stem":"If an economy has a long-term growth potential of 2% per year and the central\nbank's inflation target is 3% per year, the neutral rate of interest is most likely.","options":{"A":"1%.","B":"3%.","C":"5%."},"answer":"C","topic":"Economics","page":10,"solution":"assets/solutions/4-1/38.jpg","confidence":"ocr","explanation":"because the Neutral rate = Trend growth + Inflation target = 2% + 3% = 5%\n\nMonetary Policy\n\n= describe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting\n\nin expansionary or contractionary monetary policy; and describe the limitations of monetary policy"},{"id":"4-1-39","set":"4-1","number":39,"stem":"An analyst is reviewing the property, plant, and equipment disclosure related to a\ncompany's warehouse. Under the revaluation model, the analyst would least\nlikely be able to determine:","options":{"A":"the original date of acquisition.","B":"how the fair value was obtained.","C":"the carrying amount under the cost model."},"answer":"A","topic":"Ethics","page":11,"solution":"assets/solutions/4-1/39.jpg","confidence":"ocr","explanation":"because IFRS does not require disclosure of the original date of acquisition"},{"id":"4-1-40","set":"4-1","number":40,"stem":"An investor observed the following hedge fund return data.\nYear     Beginning of Year Account Balance    Net Return of the Fund\n1               $30 million                  10%\n2               $40 million                    -5%\n3               $30 million                    -5%\nThe money-weighted return is closest to:","options":{"A":"-1.523%.","B":"-0.749%.","C":"-0.524%."},"answer":"C","topic":"Alternative Investments","page":11,"solution":"assets/solutions/4-1/40.jpg","confidence":"ocr","explanation":". Tabulate the annual returns and the investment amounts to determine the cash flows:\nee\nBalance from previous year 0 33.00 38.00\nNew Investment by Maria Delanie 30.00 7.00 0\nWithdrawal by Maria Delanie 0 0 -800\nNet balance at the beginning of the year 30.00 40.00 30.00\nInvestment return for the year 10% 5% -5%\nInvestment gain (loss) 3.00 -2.00 -1.50\nBalance at the end of the year 33.00 38.00 28.50\nCF = -30, CF, =-7, CF2 = +8, CF; = +28.5; IRR =-0.524%\nRates and Returns\n= compare the money-weighted and time-weighted rates of return and evaluate the performance of portfolios based\non these measures"},{"id":"4-1-41","set":"4-1","number":41,"stem":"Which of the following is most likely a leading indicator for an economy?","options":{"A":"Change in unit labor costs","B":"Average weekly hours, manufacturing","C":"Employees on non-agricultural payrolls"},"answer":"B","topic":"Mixed Topics","page":11,"solution":"assets/solutions/4-1/41.jpg","confidence":"ocr","explanation":"because average weekly hours, manufacturing is a leading indicator. Businesses will cut overtime before\nlaying off workers in a downturn and increase it before rehiring in a cyclical upturn, these measures move up and\ndown before the general economy."},{"id":"4-1-42","set":"4-1","number":42,"stem":"Which of the following changes to compensation packages would most likely\nresult in management becoming more risk averse in its corporate decision\nmaking?","options":{"A":"Decreasing the length of management tenure","B":"Eliminating stock grants and options from management compensation","C":"Tying management compensation to the size of the company's business"},"answer":"B","topic":"Derivatives","page":11,"solution":"assets/solutions/4-1/42.jpg","confidence":"ocr","explanation":"because a compensation package relying too heavily on stock grants and options can motivate risk-taking\nbehavior by management, since option holders participate only in upside share price moves. Similarly, too little or\nno use of stock grants and options awarded to managers can lead to the opposite result. However, managers and\ndirectors without a meaningful equity stake in the company are typically more risk averse in their corporate decision\nmaking so they can better protect their long-term engagement by the company."},{"id":"4-1-43","set":"4-1","number":43,"stem":"Unaudited financial statements are most likely presented in a(n):","options":{"A":"annual report.","B":"quarterly report.","C":"proxy statement."},"answer":"B","topic":"Mixed Topics","page":11,"solution":"assets/solutions/4-1/43.jpg","confidence":"ocr","explanation":"because interim reports are also provided by the company either semiannually or quarterly, depending on\nthe applicable regulatory requirements. Interim reports generally present the four basic financial statements and\ncondensed notes but are not audited"},{"id":"4-1-44","set":"4-1","number":44,"stem":"A project has the following annual cash flows:\nYear 0         Year 1          Year 2           Year 3\n-$606,061      $2,151,515      -$2,542,424       $1,000,000\nWhich discount rate most likely provides a positive NPV?","options":{"A":"15%","B":"18%","C":"21%"},"answer":"C","topic":"Mixed Topics","page":12,"solution":"assets/solutions/4-1/44.jpg","confidence":"ocr","explanation":"because the NPV at 21% is $14.7, whereas the NPVs at other two discount rates are negative.\nYearCashFlow r= 15% r= 18% T= 21% Calculation\n0  -$606,061 -$606,061.00 -$606,061.00 -$606,061.00 606,061\n1 2,151,515 1,870,882.60 1,823,317.80 1,778,111.60 +2,151,515/(1 +r)\n2  -2,542,424 -1,922,437.80 —1,825,929.30 -1,736,509.80 —2,542,424/(1 + r)?\n3 1,000,000 657,516.20 608,630.90 564,473.90 +1,000,000/(1 +1)?\nNPV -$100.00 -$41.60 +$14.70  r=Discount rate\nCapital Investments and Capital Allocation\n= describe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return\n‘on invested capital (ROIC), and contrast their use in capital allocation"},{"id":"4-1-45","set":"4-1","number":45,"stem":"The effectiveness of infrastructure spending as a near-term fiscal stimulant would\nbe least constrained by the:","options":{"A":"action lag.","B":"impact lag.","C":"recognition lag."},"answer":"C","topic":"Alternative Investments","page":12,"solution":"assets/solutions/4-1/45.jpg","confidence":"ocr","explanation":"because recognition lag refers to the time required before policymakers realize that a policy action is\nTequired because data appear with a considerable lag and are subject to substantial revision. A policy action to\nspend on infrastructure would occur at the conclusion of this lag and, as a result, the recognition lag is not a\nconstraint on any specific type of policy action\n\nFiscal Policy\n\n= explain the implementation of fiscal policy and difficulties of implementation as well as whether a fiscal policy is\nexpansionary or contractionary"},{"id":"4-1-46","set":"4-1","number":46,"stem":"The demand curve of a perfectly competitive firm is:","options":{"A":"vertical.","B":"horizontal.","C":"downward sloping."},"answer":"B","topic":"Mixed Topics","page":12,"solution":"assets/solutions/4-1/46.jpg","confidence":"ocr","explanation":"because the demand curve that each perfectly competitive firm faces is a horizontal line at the equilibrium\nprice, even though the demand curve for the whole market is downward sloping"},{"id":"4-1-47","set":"4-1","number":47,"stem":"An exchange rate regime based on an explicit legislative commitment to\nexchange domestic currency for a specified foreign currency at a fixed exchange\nrate is best described as a:","options":{"A":"monetary union.","B":"fixed parity system.","C":"currency board system."},"answer":"C","topic":"Economics","page":12,"solution":"assets/solutions/4-1/47.jpg","confidence":"ocr","explanation":"because the IMF defines a currency board system (CBS) as a monetary regime based on an explicit\nlegislative commitment to exchange domestic currency for a specified foreign currency at a fixed exchange rate,\ncombined with restrictions on the issuing authority to ensure fulfillment of its legal obligation\n\nThe Foreign Exchange Market and Capital Flows\n\n= describe exchange rate regimes and explain the effects of exchange rates on countries’ international trade and\n\ncapital flows"},{"id":"4-1-48","set":"4-1","number":48,"stem":"An analyst gathers the following exchange rate information:\nUSD/EUR spot rate                          1.0993\nUSD/EUR 6-month forward points                11.7\nUSD/EUR is the amount of USD per 1 EUR.\nThe USD/EUR 6-month forward rate is closest to:","options":{"A":"1.0981.","B":"1.1005.","C":"1.2279."},"answer":"B","topic":"Fixed Income","page":12,"solution":"assets/solutions/4-1/48.jpg","confidence":"ocr","explanation":"because the six month forward rate = spot rate + (forward points / 10,000) = 1.0993 + (11.7 / 10,000) =\n1.10047, which is closest to 1.1005."},{"id":"4-1-49","set":"4-1","number":49,"stem":"An analyst gathers the following information (in € millions) about a company for\na given year:\nNet income                      300\nDepreciation expense               35\nIncrease in inventory               20\nDecrease in accounts receivable      30\nIncrease in accounts payable         25\nCash flow from operating activities (in € millions) for the year is:","options":{"A":"300.","B":"320.","C":"370."},"answer":"C","topic":"Financial Statement Analysis","page":13,"solution":"assets/solutions/4-1/49.jpg","confidence":"ocr","explanation":"because CFO = Net income + Depreciation expense — Increase in working capital. Increase in working\ncapital = Increase in inventory + Increase in accounts receivable — Increase in accounts payable. Increase in\nworking capital = €20 — €30 — €25 = -€35, i.e. actually decrease in working capital of €35 which is added to the sum\nof net income and depreciation expense. Consequently, CFO (in millions) = €300 + €35 — (€35) = €370.\n\nAnalyzing Statements of Cash Flows |\n\n= describe the steps in the preparation of direct and indirect cash flow statements, including how cash flows can be\ncomputed using income statement and balance sheet data"},{"id":"4-1-50","set":"4-1","number":50,"stem":"A hypothesis test fails to reject a false null hypothesis. This result is best\ndescribed as a:","options":{"A":"Type Ierror.","B":"Type IIerror.","C":"test with little power."},"answer":"B","topic":"Quantitative Methods","page":13,"solution":"assets/solutions/4-1/50.jpg","confidence":"ocr","explanation":". Failure to reject a false null hypothesis is a Type II error. '"},{"id":"4-1-51","set":"4-1","number":51,"stem":"An investment makes ten payments of $10,000 per year, with the first payment\ntoday. If the annual discount rate is 6%, the present value of the investment is\nclosest to:","options":{"A":"$72,098.","B":"$73.601","C":"$78,017."},"answer":"C","topic":"Mixed Topics","page":13,"solution":"assets/solutions/4-1/51.jpg","confidence":"ocr","explanation":"because the investment represents an annuity due with 10 payments. Because the first payment occurs at\nt= 0, we can separate the annuity into two pieces: an immediate $10,000 that is received today (f= 0) and an\nordinary annuity of $10,000 per year for 9 years\nUsing the formula for the present value of the ordinary annuity with 9 payments, we compute PV = A[1 — 1/(1 + 1)\"]/\nr= $10,000 x [1 — 1/(1+ 0.06)9//0.06 = >$68, 106.92.\nAdding the two pieces, we obtain PV = $10,000 + $68,106.92 = $78,106.92 ~ $78,107\nAlternatively, using a financial calculator with END mode:\nCompute the present value of the ordinary annuity with N = 9; I/Y = 6; PMT = 10,000; FV = 0; CPT PV = $68,016.92\nAdding them, we obtain PV = $10,000 + $68,016.92 = $78,016.92 ~ $78,017\nAlternatively, using a financial calculator with BGN mode:\nN= 10; VY = 6; PMT = 10,000; FV = 0; CPT PV = $78,016.92 = $78,017.\n\nTime Value of Money in Finance\n\n= calculate and interpret the present value (PV) of fixed-income and equity instruments based on expected future\n\ncash flows"},{"id":"4-1-52","set":"4-1","number":52,"stem":"Which of the following is most likely an objective of fiscal policy?","options":{"A":"Maintaining price stability","B":"Achieving an exchange rate target","C":"Distributing income and wealth among different segments of the population"},"answer":"C","topic":"Economics","page":13,"solution":"assets/solutions/4-1/52.jpg","confidence":"ocr","explanation":"because tools associated with fiscal policy involve the use of government spending and changing tax\nrevenue to affect a number of aspects of the economy: Distribution of income and wealth among different segments\nof the population\n\nFiscal Policy\n\n= describe roles and objectives of fiscal policy as well as arguments as to whether the size of a national debt relative\nto GDP matters"},{"id":"4-1-53","set":"4-1","number":53,"stem":"An analyst gathers the following information about a company:\nCompany value ($billions)               1.5\nValue of debt ($billions)                 0.6\nMarginal tax rate               30%\nBased on Modigliani and Miller's Proposition I with taxes, if the company issues\ncommon stock to repay outstanding debt, the value of the unlevered company\nwill be closest to:","options":{"A":"$0.9 billion.","B":"$1.3 billion.","C":"$1.5 billion."},"answer":"B","topic":"Financial Statement Analysis","page":13,"solution":"assets/solutions/4-1/53.jpg","confidence":"ocr","explanation":"because the value of the levered company is greater than that of the all-equity company by an amount\n‘equal to the tax rate multiplied by the value of the debt, also termed the debt tax shield. V, = V, + tD, where V, =\nthe value of the levered company, Vy = the value of the unlevered company, fis the marginal tax rate and tD is the\ndebt tax shield. Therefore, $1.5 billion = Vy + 0.30 x $0.6 billion and V, = $1.32 billion ~ $1.3 billion."},{"id":"4-1-54","set":"4-1","number":54,"stem":"Which of the following is most likely a primary source of liquidity?","options":{"A":"Regular credit lines","B":"Sale of operating assets","C":"Renegotiation of supplier contracts"},"answer":"A","topic":"Mixed Topics","page":14,"solution":"assets/solutions/4-1/54.jpg","confidence":"ocr","explanation":"because primary sources include short-term funds, which can include items such as trade credit, bank\nlines of credit, and short-term investment portfolios."},{"id":"4-1-55","set":"4-1","number":55,"stem":"If a company raises its prices to consumers, which of the following is most likely\nto result in an increase in total revenue of the company?","options":{"A":"The company's products are price elastic","B":"The company is in a competitive industry","C":"The company has a fragmented consumer base"},"answer":"C","topic":"Mixed Topics","page":14,"solution":"assets/solutions/4-1/55.jpg","confidence":"ocr","explanation":"because in a fragmented consumer base, the consumers have less bargaining power making it easier for\ncompanies to pass on higher costs to the consumers.\n\nIntroduction to Financial Statement Modeling\n\n= explain how the competitive position of a company based on a Porter's five forces analysis affects prices and costs"},{"id":"4-1-56","set":"4-1","number":56,"stem":"Which type of market structure best describes many firms supplying\ndifferentiated products?","options":{"A":"An oligopoly","B":"Perfect competition","C":"Monopolistic competition"},"answer":"C","topic":"Mixed Topics","page":14,"solution":"assets/solutions/4-1/56.jpg","confidence":"ocr","explanation":"because in the case of monopolistic competition, there are many firms providing products to the market\nand one firm's product is differentiated in some way.\n\nThe Firm and Market Structures\n\n= identify the type of market structure within which a firm operates and describe the use and limitations of\n\nconcentration measures"},{"id":"4-1-57","set":"4-1","number":57,"stem":"An analyst gathers the following information about a company:\nCash flow from operating activities               €600,000\nPreferred dividends declared and paid              €30,000\nTotal dividends declared and paid                 €120,000\nNumber of common shares outstanding             100,000\nThe company did not issue or repurchase common shares during the year. If the\ncompany reports total dividends paid as cash flows used in operating activities,\ncash flow per share is:","options":{"A":"€5.70.","B":"€6.30.","C":"€6.90."},"answer":"C","topic":"Equity Investments","page":14,"solution":"assets/solutions/4-1/57.jpg","confidence":"ocr","explanation":"because Cash flow per share = (CFO — Preferred dividends) / Number of common shares outstanding.\nNote that if the company reports under IFRS and includes total dividends paid as a use of cash in the operating\nsection, total dividends should be added back to CFO as reported and then preferred dividends should be\nsubtracted. Therefore, the calculation becomes = (CFO + Total dividends — Preferred dividends) / Number of\n‘common shares outstanding = (600 + 120 — 30) / 100 = 6.9.\n\nAnalyzing Statements of Cash Flows II\n\n= calculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow\nratios"},{"id":"4-1-58","set":"4-1","number":58,"stem":"For an analyst estimating a company's target capital structure, which of the\nfollowing methods is most appropriate?","options":{"A":"Apply the company's current capital structure at book value weights","B":"Use the average capital structure of a diversified group of companies","C":"Infer the target capital structure by analyzing management statements on\ncapital structure policy"},"answer":"C","topic":"Corporate Issuers","page":14,"solution":"assets/solutions/4-1/58.jpg","confidence":"ocr","explanation":"because an analyst can examine trends in the company’s capital structure or statements by management\nregarding capital structure policy to infer the target capital structure.\n\nCapital Structure\n\n= describe optimal and target capital structures"},{"id":"4-1-59","set":"4-1","number":59,"stem":"A construction company enters into a 2-year building contract. Payment of the\nconsideration will be at the end of the building contract when all performance\nobligations are met. Costs incurred provide an appropriate measure of progress\ntowards completing the contract. The construction company has incurred 30% of\nthe costs during the first year. Assuming it is highly probable that revenue will\nnot be subsequently reversed, at the end of Year 1, the construction company\nshould most likely recognize a:","options":{"A":"receivable.","B":"contract asset.","C":"contract liability."},"answer":"B","topic":"Mixed Topics","page":15,"solution":"assets/solutions/4-1/59.jpg","confidence":"ocr","explanation":"because when revenue is recognized, a contract asset is presented on the balance sheet. It is only at the\npoint when all performance obligations have been met except for payment that a receivable appears on the seller's\nbalance sheet"},{"id":"4-1-60","set":"4-1","number":60,"stem":"A form of economic integration that allows free movement of goods, services,\nand factors of production among member countries and has a common trade\npolicy against non-members best describes a:","options":{"A":"free trade area.","B":"customs union.","C":"common market."},"answer":"C","topic":"Mixed Topics","page":15,"solution":"assets/solutions/4-1/60.jpg","confidence":"ocr","explanation":"because a common market is the next level of economic integration that incorporates all aspects of the\ncustoms union (free movement of goods and services, and common trade policy against non-members) and\nextends it by allowing free movement of factors of production among members.\n\nInternational Trade\n\n= explain motivations for and advantages of trading blocs, common markets, and economic unions"},{"id":"4-1-61","set":"4-1","number":61,"stem":"As a result of an inventory write-down, which of the following financial ratios\nmost likely decreases?","options":{"A":"Quick ratio","B":"Current ratio","C":"Payables turnover ratio"},"answer":"B","topic":"Financial Statement Analysis","page":15,"solution":"assets/solutions/4-1/61.jpg","confidence":"ocr","explanation":"because the Current ratio decreases as a result of an inventory write down. The Current ratio = Current\nassets ~ Current liabilities. Inventory is classified as current assets, among the current assets’ required line items\nare cash and cash equivalents, trade and other receivables, inventories, and financial assets (with short maturities).\nIn the event that the value of inventory declines below the carrying amount on the balance sheet, the inventory\ncarrying amount must be written down to its net realisable value and the loss (reduction in value) recognised as an\n‘expense on the income statement. This expense may be included as part of cost of sales or reported separately.\nThe numerator in the Current ratio is reduced by an inventory write-down and the denominator is unaffected,\ntherefore the current ratio would decrease"},{"id":"4-1-62","set":"4-1","number":62,"stem":"A company's purchases can be estimated as cost of sales plus:","options":{"A":"ending inventory less beginning inventory.","B":"beginning inventory less ending inventory.","C":"the average level of inventory for the period."},"answer":"A","topic":"Financial Statement Analysis","page":15,"solution":"assets/solutions/4-1/62.jpg","confidence":"ocr","explanation":"because if the amount of purchases is not directly available, it can be computed as cost of goods sold plus\nending inventory less beginning inventory. Alternatively, cost of goods sold is sometimes used as an approximation\nof purchases."},{"id":"4-1-63","set":"4-1","number":63,"stem":"A discrete random variable X has the following probability function:\nX     Probability\n0        0.50\n1        0.50\nThe variance of X is closest to:","options":{"A":"0.25.","B":"0.50.","C":"1.00."},"answer":"A","topic":"Quantitative Methods","page":15,"solution":"assets/solutions/4-1/63.jpg","confidence":"ocr","explanation":"because the variance of a random variable is the expected value (the probability-weighted average) of\nsquared deviations from the random variable’s expected value. Var(X) = P(0)x(0 — 0.5? + P(1)x(1 -0.5)2=\n0.5x0.5?+0.5x0.5?= 0.25, where expected value of X is E(X) = 00.5 + 1x0.5=0.5"},{"id":"4-1-64","set":"4-1","number":64,"stem":"Which of the following represents the difference between the observed value of a\nstatistic and the quantity it is intended to estimate as a result of using subsets of a\npopulation?","options":{"A":"Standard error","B":"Sampling error","C":"Standard deviation"},"answer":"B","topic":"Quantitative Methods","page":16,"solution":"assets/solutions/4-1/64.jpg","confidence":"ocr","explanation":"because sampling error is the difference between the observed value of a statistic and the quantity it is\nintended to estimate as a result of using subsets of the population."},{"id":"4-1-65","set":"4-1","number":65,"stem":"An investor will receive $50,000 at the end of Year 10. If the discount rate is 5%,\nthe present value of the cash flow at the end of Year 5 is closest to:","options":{"A":"$30,696.","B":"$37,311.","C":"$39,176."},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/4-1/65.jpg","confidence":"ocr","explanation":"because Year 10 is five years into the future from the end of Year 5, so the present value at the end of\nYear 5 is calculated using the formula\nPV=FYV,(1 + r-? = $50,000(1.05)-5 = $39,176.\n\nRates and Returns\n\n= calculate and interpret annualized retum measures and continuously compounded returns, and describe their\nappropriate uses"},{"id":"4-1-66","set":"4-1","number":66,"stem":"According to Jensen's free cash flow hypothesis:","options":{"A":"internal financing is preferable to debt issuance.","B":"debt reduces management opportunities to misuse cash.","C":"debt issuance signals confidence about a company's prospects."},"answer":"B","topic":"Portfolio Management","page":16,"solution":"assets/solutions/4-1/66.jpg","confidence":"ocr","explanation":"because according to Michael Jensen's free cash flow hypothesis higher debt levels discipline managers\nby forcing them to manage the company efficiently so the company can make its interest and principal payments\nand by reducing the company’s free cash flow and thus management's opportunities to misuse cash"},{"id":"4-1-67","set":"4-1","number":67,"stem":"The archetype of country behavior most likely characterized by globalization and\ncooperation is:","options":{"A":"hegemony","B":"bilateralism.","C":"multilateralism."},"answer":"C","topic":"Mixed Topics","page":16,"solution":"assets/solutions/4-1/67.jpg","confidence":"ocr","explanation":"because multilateralism is characterized by globalization and cooperation\nIntroduction to Geopolitics\n\n= describe geopolitical risk"},{"id":"4-1-68","set":"4-1","number":68,"stem":"An investor earns the following annual returns over a 4-year period:\nYear      Annual Return\n1           12.2%\n2            -8.5%\n3           6.7%\n4            -3.3%\nThe geometric mean annual return is closest to:","options":{"A":"1.45%.","B":"1.78%.","C":"5.93%."},"answer":"A","topic":"Mixed Topics","page":16,"solution":"assets/solutions/4-1/68.jpg","confidence":"ocr","explanation":"because the geometric mean annual return is equal to the product of the mean returns and then setting\n\nthe product to the 1/n\" power, where n is the number of returns. This translates to:\n(1.122 x 0.915 x 1.067 x 0.967)°5 — 1 = 0.0145 = 1.45%"},{"id":"4-1-69","set":"4-1","number":69,"stem":"In capital investment decisions, project sequencing is most likely a type of","options":{"A":"timing option.","B":"flexibility option.","C":"fundamental option."},"answer":"A","topic":"Derivatives","page":16,"solution":"assets/solutions/4-1/69.jpg","confidence":"ocr","explanation":"because project sequencing is a type of timing option. Delaying an investment and basing the decision on\nhopefully improved information that you might have in, say, a year could help improve the NPV of the projects\nselected. Project sequencing options allow the company to defer the decision to invest in a future investment until\nthe outcome of some or all of a current investment is known."},{"id":"4-1-70","set":"4-1","number":70,"stem":"The following information is available for a company that reports its cash flow\nusing the indirect method:\nYear 2(€)        Year 1(€)\nOther operating expenses           80,050           76,230\nPrepaid insurance expenses          8,400           10,600\nAccrued utilities payable           23,020           21,500\nInsurance and utilities are the only two components of other operating expenses.\nThe cash the company paid in other operating expenses in Year 2 is:","options":{"A":"€76,330.","B":"€79,370.","C":"€80,730."},"answer":"A","topic":"Mixed Topics","page":17,"solution":"assets/solutions/4-1/70.jpg","confidence":"ocr","explanation":"because in Year 2 the company paid €76,330 in cash for other operating expenses, calculated as follows\nOther operating expenses €80,050\nLess: Decrease in prepaid expenses -€2,200 A deduction: Prepaid expense\n€8,400 — €10,600 = -€2,200 declined\nCash-based other operating expenses\nlower than accrual basis\nLess: Increase in accrued utilities payable -€1,520 A deduction: Accrued utilities payable\n€23,020 — €21,500 = €1,520 increased\nCash-based other operating expenses\nlower than accrual basis\nCash paid for other operating expenses _€76,330"},{"id":"4-1-71","set":"4-1","number":71,"stem":"If a company purchases, at a premium, bonds that it expects to hold until maturity,\nthey are most likely measured on the balance sheet at:","options":{"A":"fair value.","B":"historical cost.","C":"amortized cost."},"answer":"C","topic":"Fixed Income","page":17,"solution":"assets/solutions/4-1/71.jpg","confidence":"ocr","explanation":"because under IFRS, financial assets are subsequently measured at amortized cost if the asset's cash\nflows occur on specified dates and consist solely of principal and interest, and if the business model is to hold the\nasset to maturity,\n\nAnalyzing Balance Sheets\n\n= explain the financial reporting and disclosures related to financial instruments"},{"id":"4-1-72","set":"4-1","number":72,"stem":"Earthquakes most likely expose a country to:","options":{"A":"event risk.","B":"thematic risk.","C":"exogenous risk."},"answer":"C","topic":"Mixed Topics","page":17,"solution":"assets/solutions/4-1/72.jpg","confidence":"ocr","explanation":"because exogenous risk is a sudden or unanticipated risk that impacts either a country’s cooperative\nstance, the ability of non-state actors to globalize, or both. Examples include sudden uprisings, invasions, or the\naftermath of natural disasters.\n\nIntroduction to Geopolitics\n\n= describe the impact of geopolitical risk on investments"},{"id":"4-1-73","set":"4-1","number":73,"stem":"An analyst gathers the following information about a company's capital structure,\ncost of capital and marginal tax rate:\nMarket value of debt                          $1,000 million\nMarket value of equity                        $500 million\nBook value of debt                           $900 million\nBook value of equity                         $300 million\nPre-tax cost of debt                         4%\nCost of equity                             6%\nMarginal tax rate                             30%\nIf interest is fully tax deductible, the WACC is closest to:","options":{"A":"3.6%.","B":"3.9%.","C":"4.7%."},"answer":"B","topic":"Corporate Issuers","page":17,"solution":"assets/solutions/4-1/73.jpg","confidence":"ocr","explanation":"because WACC = Ward 1 —t) + Wolp + Wefe,\nwhere\nwgis the proportion of debt,\nry is the before-tax marginal cost of debt,\nWp is the proportion of preferred stock,\nr, is the marginal cost of preferred stock,\nWe is the proportion of equity, and\nT, is the marginal cost of equity.\nTherefore WACC = (1000/(1000 + 500) x (0.04)(1 — 0.30) + (500/(1000 + 500)) x 0.06 = 0.03867 = 3.9%."},{"id":"4-1-74","set":"4-1","number":74,"stem":"An analyst gathers the following information about two companies in the same\nindustry:\nCompany 1    Company 2\nROE                                      12%        18%\nAverage total assets/Average shareholders' equity            2            3\nRevenue/Average total assets                            1            2\nBased only on this information, Company 2:","options":{"A":"is less efficient than Company 1.","B":"has a higher ROA than Company 1.","C":"has a lower net profit margin than Company 1."},"answer":"C","topic":"Mixed Topics","page":18,"solution":"assets/solutions/4-1/74.jpg","confidence":"ocr","explanation":"because ROE = Net profit margin x Total asset turnover x Leverage and thus Net profit margin =\nROE/(Total asset turnover x Leverage). For Company 1, Net profit margin = 12%/(1 x 2) = 6%, which is higher than\nCompany 2's Net profit margin = 18%/(2 x 3) = 3%\n\nFinancial Analysis Techniques\n\n= demonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in\nits components"},{"id":"4-1-75","set":"4-1","number":75,"stem":"An analyst gathers the following information for a company's fiscal year\nbeginning 1 January:\nNet income                                     €9,200,000\nInterest expense on convertible debt               €1,600,000\nCommon shares outstanding on 1 January            6,000,000\nCommon shares issued on 31 March                4,000,000\nCommon shares outstanding on 31 December       10,000,000\nIncome tax rate                             35%\nIf the convertible debt was outstanding for the entire year and is convertible into\n2,000,000 common shares, reported diluted EPS is closest to:","options":{"A":"€0.93.","B":"€0.98.","C":"€1.02."},"answer":"A","topic":"Equity Investments","page":18,"solution":"assets/solutions/4-1/75.jpg","confidence":"ocr","explanation":"because when a company has convertible debt outstanding, the diluted EPS calculation also uses the if-\nconverted method. Diluted EPS is calculated as if the convertible debt had been converted at the beginning of the\nperiod. If the convertible debt had been converted, the debt securities would no longer be outstanding; instead,\nadditional shares of common stock would be outstanding. Also, if such a conversion had taken place, the company\nwould not have paid interest on the convertible debt, so the net income available to common shareholders would\nincrease by the after tax amount of interest expense on the debt converted. Diluted EPS for a company that has\nconvertible debt outstanding is calculated according to the following formula: Diluted EPS = (Net income + After-tax\ninterest on convertible debt — Preferred dividends) + (Weighted average number of shares outstanding + Additional\ncommon shares that would have been issued at conversion). As disclosed in the stem of the question the input\nfactors into this equation are as follows\nNet income = €9,200,000\nAfter-tax interest on convertible debt = €1,600,000x (1 — 0.35) = €1,040,000\nNumbers of shares outstanding at the beginning of the year = 6,000,000\nWeighted average number of shares outstanding = 6,000,000 x3 months ~ 12 months + 10,000,000 x 9 months +\n12 months = 1,500,000 + 7,500,000 = 9,000,000\nBasic EPS = €9,200,000 + 9,000,000 = €1.0222 = €1.02\nAdditional common shares that would have be issued at conversion = 2,000,000\nDiluted EPS = (€9,200,000 + €1,040,000) ~ (9,000,0"},{"id":"4-1-76","set":"4-1","number":76,"stem":"Firms in monopolistic competition most likely have:","options":{"A":"no pricing power.","B":"some pricing power.","C":"substantial pricing power."},"answer":"B","topic":"Mixed Topics","page":18,"solution":"assets/solutions/4-1/76.jpg","confidence":"ocr","explanation":"because firms have some but not considerable pricing power under monopolistic competition. In this\nmarket structure, sellers are able to differentiate their products but at the same time can face a large number of\ncompetitors and low barriers to entry. The result is that firms have more pricing power than they would have under\nperfect competition (where there is no product differentiation) but less pricing power than in an oligopoly where\nentry barriers are high and there are fewer sellers"},{"id":"4-1-77","set":"4-1","number":77,"stem":"Which of the following statements about the acquisition of a target company with\ntax loss carryforwards is most accurate? If the acquirer is profitable:","options":{"A":"its current tax rate will have no impact on the acquisition price.","B":"the acquirer would theoretically be willing to pay more than another acquirer\nwith a lower tax rate.","C":"the acquirer would theoretically be willing to pay more than another acquirer\nwith a higher tax rate."},"answer":"B","topic":"Financial Statement Analysis","page":18,"solution":"assets/solutions/4-1/77.jpg","confidence":"ocr","explanation":"because if an acquiring company is profitable, it may be able to use MU’s tax loss carryforwards to offset\nits own tax liabilities. The value to an acquirer would be the present value of the carryforwards, based on the\nacquirer's tax rate and expected timing of realization. The higher the acquiring company's tax rate, and the more\nprofitable the acquirer, the sooner it would be able to benefit. Therefore, an acquirer with a high current tax rate\nwould theoretically be willing to pay more than an acquirer with a lower tax rate"},{"id":"4-1-78","set":"4-1","number":78,"stem":"An analyst computes the following analysis of variance (ANOVA) table for a\nsimple linear regression:\nSource       Sum of Squares    Degrees of Freedom l   Mean Square\nRegression          144                 1               144\nError               48                 4                12\nTotal               192                 5                        ---\nThe standard error of the estimate for the regression is closest to:","options":{"A":"3.5.","B":"6.9.","C":"12.0."},"answer":"A","topic":"Quantitative Methods","page":19,"solution":"assets/solutions/4-1/78.jpg","confidence":"ocr","explanation":"because from the ANOVA table, we can also calculate the standard error of the estimate which is also\nknown as the standard error of the regression or the root mean square error. The standard error of the estimate is\nthe square root of the mean square error. Thus, standard error of the estimate = 1295 = 3.4641 ~ 3.5."},{"id":"4-1-79","set":"4-1","number":79,"stem":"An analyst gathers the following sample: 0, 2, 3, 4, 6. The value of the fourth\nquintile is:","options":{"A":"4.0.","B":"4.8.","C":"5.6."},"answer":"C","topic":"Mixed Topics","page":19,"solution":"assets/solutions/4-1/79.jpg","confidence":"ocr","explanation":"because the fourth quintile is equivalent to the 80th percentile. To find the yth percentile ( P,), we first must\ndetermine its location. The formula for the position of a percentile in an array with n entries sorted in ascending\norder is Ly = (n+ 1) x ( y/100). In this case, n= 5 and y = 80, So Lap = (5 + 1) x (80/100) = 6 x 0.8 = 4.8. When Ly is\nnot a whole number or integer, L, lies between the two closest integer numbers (one above and one below), and\nwe use linear interpolation between those two places to determine P,. Thus, the value of the 4\" quintile is Pay = 4 +\n08x (6-4)=56\n\nStatistical Measures of Asset Returns\n\n= calculate, interpret, and evaluate measures of central tendency and location to address an investment problem"},{"id":"4-1-80","set":"4-1","number":80,"stem":"Which of the following statements about machine learning is most accurate?\nMachine learning:","options":{"A":"does not have a broad application in Big Data analysis.","B":"still requires human judgment in understanding the underlying data.","C":"performs well even when insufficient data are available to train and validate\nthe model."},"answer":"B","topic":"Mixed Topics","page":19,"solution":"assets/solutions/4-1/80.jpg","confidence":"ocr","explanation":"because ML (machine learning) still requires human judgement in understanding the underlying data and\nselecting the appropriate techniques for data analysis. Before they can be used, the data must be clean and free of\nbiases and spurious data"},{"id":"4-1-81","set":"4-1","number":81,"stem":"A portfolio has a me
