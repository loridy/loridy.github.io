<script>
const VERSION='cfa-sprint-2026-online-v1';const STORAGE_KEY='cfa-sprint-progress-v1';const LETTERS=['A','B','C'];const SETS=['1-1','1-2','2-1','2-2','3-1','3-2','4-1','4-2','5-1','5-2'];const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
const icons={home:'⌂',practice:'◎',errors:'⊗',saved:'☆',library:'☷',analytics:'▥',settings:'⚙'};
let state={stats:{},mistakes:{},stars:{},daily:{},session:null};
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved&&typeof saved==='object')state={...state,...saved}}catch(e){}
let route='home',filterSet='all',search='',listPage=0,toastTimer=0,selected='',filters={set:'all',status:'all'};
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(window.CFA_SYNC?.schedule)window.CFA_SYNC.schedule()}catch(e){toast('浏览器空间不足，请导出备份')}}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function fmt(n){return Number(n||0).toLocaleString('zh-CN')}
function pct(a,b){return b?Math.round(100*a/b):0}
function today(){return new Date().toLocaleDateString('sv-SE')}
function summary(){const items=Object.values(state.stats),seen=items.filter(x=>x.attempts>0).length,attempts=items.reduce((a,x)=>a+(x.attempts||0),0),correct=items.reduce((a,x)=>a+(x.correct||0),0),wrong=Object.keys(state.mistakes).filter(k=>state.mistakes[k]).length;return {seen,attempts,correct,wrong,accuracy:pct(correct,attempts)}}
function countSeen(set){return BANK.filter(q=>q.set===set&&state.stats[q.id]?.attempts>0).length}
function toast(t){let old=document.getElementById('toast-msg');if(old)old.remove();const x=document.createElement('div');x.className='toast';x.id='toast-msg';x.textContent=t;document.body.appendChild(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),2600)}
function navTo(next){route=next;listPage=0;render();scrollTo({top:0,behavior:'instant'})}
function nav(){const entries=[['home','学习总览'],['practice','开始刷题'],['errors','我的错题'],['saved','收藏题目'],['library','全部题库'],['analytics','学习统计'],['settings','设置与备份']];document.getElementById('nav').innerHTML=entries.map(([id,label])=>`<button class="nav-btn ${route===id?'active':''}" data-go="${id}"><span style="font-size:20px;width:20px;text-align:center">${icons[id]}</span>${label}${id==='errors'?`<span class="nav-right">${summary().wrong}</span>`:''}</button>`).join('');document.getElementById('mobileNav').innerHTML=[['home','首页'],['practice','刷题'],['errors','错题'],['analytics','统计'],['settings','更多']].map(([id,label])=>`<button class="${route===id?'active':''}" data-go="${id}"><span>${icons[id]}</span>${label}</button>`).join('')}
function render(){const sums=summary();nav();document.getElementById('sideprogress').textContent=pct(sums.seen,BANK.length)+'%';document.getElementById('sidebar').style.width=pct(sums.seen,BANK.length)+'%';document.getElementById('topStats').textContent=`已练 ${fmt(sums.seen)} / ${BANK.length} 题`;document.getElementById('crumb').textContent={home:'总览',practice:'刷题',quiz:'练习中',errors:'错题本',saved:'已收藏',library:'完整题库',analytics:'学习报告',settings:'设置',result:'练习结果'}[route];const app=document.getElementById('app');app.innerHTML=({home:homeView,practice:practiceView,quiz:quizView,errors:()=>listView('errors'),saved:()=>listView('saved'),library:()=>listView('library'),analytics:analyticsView,settings:settingsView,result:resultView}[route]||homeView)(); }
function homeView(){const s=summary(),todayCount=state.daily[today()]||0;return `<section class="hero"><div class="intro"><div class="eyebrow">✦ YOUR DAILY CFA ROUTINE</div><h2>每天 10 题，积累确定性。</h2><p>不需要准备。打开网页，随时刷题，持续攻克薄弱点。</p><button class="btn white" data-act="quick">开始 10 题练习&nbsp; →</button>${state.session&&!state.session.done?`<button class="btn" style="color:#c5d6e4;border:1px solid #647e8d;margin-left:10px" data-act="resume">继续上次练习</button>`:''}</div><div class="hero-visual"><span></span><span></span><span></span><span></span><span></span></div></section>
<div class="kpi-grid"><div class="kpi"><div class="kpi-label">累计练习 <span class="kpi-icon">↗</span></div><div class="kpi-value">${fmt(s.attempts)}</div><div class="kpi-small">题次 · 今日 ${fmt(todayCount)} 题</div></div><div class="kpi"><div class="kpi-label">综合正确率 <span class="kpi-icon">◎</span></div><div class="kpi-value">${s.accuracy}<span style="font-size:17px">%</span></div><div class="kpi-small">基于全部答题记录</div></div><div class="kpi"><div class="kpi-label">错题待掌握 <span class="kpi-icon">↺</span></div><div class="kpi-value" style="color:var(--rose)">${fmt(s.wrong)}</div><div class="kpi-small">优先巩固的知识点</div></div><div class="kpi"><div class="kpi-label">题库覆盖率 <span class="kpi-icon">▦</span></div><div class="kpi-value">${pct(s.seen,BANK.length)}<span style="font-size:17px">%</span></div><div class="kpi-small">${s.seen} / ${BANK.length} 道题</div></div></div>
<div class="section-row"><h3>按套卷练习</h3><span>5 套模拟考 · 每套 2 个 Session</span></div><div class="quiz-grid">${SETS.map(set=>`<button class="set-card" data-set="${set}"><div class="set-icon">${set.split('-')[0].padStart(2,'0')}</div><h4>Mock ${set.replace('-',' · ')}</h4><small>${countSeen(set)} / 90 已练习</small><div class="set-progress"><span style="width:${pct(countSeen(set),90)}%"></span></div></button>`).join('')}</div>
<div class="section-row"><h3>快速入口</h3><span>找到你下一步要做的事</span></div><div class="split"><div class="panel"><div class="action-card"><div class="action-icon">↺</div><div><b>错题强化</b><p>从错误中提高正确率</p></div><button class="btn ghost small" data-act="wrongPractice" ${s.wrong?'':'disabled'}>开始复习</button></div><div class="action-card"><div class="action-icon">☆</div><div><b>收藏夹</b><p>反复练习你关注的题目</p></div><button class="btn ghost small" data-go="saved">查看收藏</button></div><div class="action-card"><div class="action-icon">▥</div><div><b>学习报告</b><p>查看各套正确率和进度</p></div><button class="btn ghost small" data-go="analytics">查看报告</button></div></div><div class="panel"><h3>当前进度</h3><div class="chart-legend"><span>已完成</span><span>${s.seen} / 900</span></div><div class="meter" style="height:10px;background:#eaf0f2"><span style="width:${pct(s.seen,900)}%"></span></div><p class="low-note" style="margin-top:20px">本题库来自你上传的 10 份 CFA Level I 模考题。在线版提供 900 道题及文字解析，原版 PDF 与答案截图请使用此前的完整离线包。当前练习记录仅保存在本设备。</p><button class="mini-link" data-go="settings">管理备份 →</button></div></div>`}
function practiceView(){return `<h1 class="page-title">开始新练习</h1><p class="page-sub">按你自己的节奏刷题。可以选择随机题、未做题、错题或完整模拟考。</p><div class="panel" style="max-width:690px;margin-top:25px"><h3>练习设置</h3><div class="settings"><div class="field"><label>题目范围</label><select id="range"><option value="all">全部题库 · 900 题</option>${SETS.map(s=>`<option value="${s}">Mock ${s} · 90 题</option>`).join('')}<option value="mistakes">我的错题</option><option value="starred">我的收藏</option></select></div><div class="field"><label>练习题数</label><select id="amount"><option value="10">10 道 · 快速练习</option><option value="20">20 道 · 专注练习</option><option value="50">50 道 · 长练习</option><option value="90">90 道 · 完整 Session</option><option value="0">全部可用题目</option></select></div><div class="field"><label>题目状态</label><select id="status"><option value="all">不限 · 所有题</option><option value="unseen">优先未做过</option><option value="review">优先曾经做错</option></select></div><div class="field"><label>出题顺序</label><select id="order"><option value="random">随机打乱</option><option value="sequential">按原卷顺序</option></select></div></div><p class="form-tip">提交后立即显示判分和解析。中途退出不会丢失进度；错题会自动保留在错题本，直到手动移除。</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><button class="btn primary" data-act="createSession">开始练习 →</button>${state.session&&!state.session.done?`<button class="btn ghost" data-act="resume">继续未完成练习</button>`:''}</div></div>`}
function initSession(range='all',count=10,status='all',order='random'){let pool=BANK.filter(q=>range==='all'||(range==='mistakes'?state.mistakes[q.id]:range==='starred'?state.stars[q.id]:q.set===range));if(!pool.length){toast('当前范围还没有可用题目');return}if(status==='unseen'){const unseen=pool.filter(q=>!state.stats[q.id]?.attempts),seen=pool.filter(q=>state.stats[q.id]?.attempts);pool=unseen.concat(seen)}else if(status==='review'){const wrong=pool.filter(q=>state.mistakes[q.id]);pool=wrong.concat(pool.filter(q=>!state.mistakes[q.id]))}if(order==='random'){if(status==='all'){pool=shuffle(pool)}else{const a=pool.filter(q=>status==='unseen'?!state.stats[q.id]?.attempts:state.mistakes[q.id]),b=pool.filter(q=>status==='unseen'?state.stats[q.id]?.attempts:!state.mistakes[q.id]);pool=shuffle(a).concat(shuffle(b))}}if(count>0)pool=pool.slice(0,count);state.session={ids:pool.map(x=>x.id),idx:0,answers:{},selected:{},created:Date.now(),done:false,range};selected='';persist();navTo('quiz')}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quizView(){const ses=state.session;if(!ses||!ses.ids.length)return `<div class="empty">没有进行中的练习。<br><br><button class="btn primary" data-go="practice">创建练习</button></div>`;const q=byId[ses.ids[ses.idx]];if(!q)return '<p>题目不存在。</p>';const rec=ses.answers[q.id];selected=ses.selected[q.id]||'';const submitted=!!rec;const num=ses.idx+1;const total=ses.ids.length;const correctCount=Object.values(ses.answers).filter(x=>x.correct===true).length;return `<div class="quiz-shell"><div class="quiz-toolbar"><div><div style="font-size:15px;font-weight:800;margin-bottom:6px">正在练习 · ${esc(ses.range==='all'?'随机题库':ses.range)}</div><div class="meta">第 ${num} / ${total} 题 &nbsp; · &nbsp; 已答对 ${correctCount} 题</div></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn ghost small" data-act="pause">退出练习</button><button class="btn subtle small" data-act="finish">结束本轮</button></div></div><div class="progress-track"><span style="width:${pct(num-1,total)}%"></span></div><div class="question-card"><div class="question-tags"><span class="topic-tag">${esc(q.topic||'General')}</span><span class="q-id">MOCK ${esc(q.set)} · Q${q.number}</span><span class="q-id">原试卷页 ${q.page}</span><button class="star-btn ${state.stars[q.id]?'starred':''}" data-star="${q.id}" title="收藏题目">${state.stars[q.id]?'★':'☆'}</button></div><div class="question-text">${esc(q.stem)}</div><div class="options">${LETTERS.map(letter=>{let cls='';if(submitted){if(letter===q.answer)cls='correct';else if(letter===rec.chosen&&rec.correct===false)cls='incorrect'}else if(letter===selected)cls='selected';return `<button class="option ${cls}" data-choice="${letter}" ${submitted?'disabled':''}><span class="letter">${letter}</span><span>${esc(q.options[letter])}</span></button>`}).join('')}</div><div class="question-actions"><div style="display:flex;gap:8px;align-items:center"><button class="btn ghost small" data-act="previous" ${ses.idx===0?'disabled':''}>← 上一题</button><span class="muted" style="font-size:11px">键盘 1 / 2 / 3 选答案</span></div>${submitted?`<button class="btn primary" data-act="next">${num===total?'完成练习':'下一题 →'}</button>`:`<button class="btn primary" data-act="submit" ${selected?'':'disabled'} id="submit-answer">确认答案 →</button>`}</div>${submitted?feedbackView(q,rec):''}</div><div class="bottom-banner"><span>小提示：每次答错都会计入错题本；答对不会自动删除错题记录。</span><span>${total-num} 道剩余</span></div></div>`}
function feedbackView(q,rec){const ok=rec.correct===true;const unsure=rec.correct===null;return `<div class="feedback ${unsure?'':ok?'correct-state':'wrong-state'}"><div class="feedback-title">${unsure?'ℹ 请核对原始答案':ok?'✓ 回答正确':'✕ 回答错误'} <span style="font-size:11px;font-weight:500;color:#798b9b">${q.answer?'正确答案：'+q.answer:'答案尚未核验'}</span></div>${q.explanation?`<p>${esc(q.explanation)}</p>`:'<p>请核对原始解答页。你可以手动将本题加入错题本。</p>'}<div class="flex-end"><button class="btn ghost small" data-act="manualWrong">${state.mistakes[q.id]?'已加入错题 ✓':'加入错题本'}</button></div></div>`}
function recordAnswer(){const ses=state.session;if(!ses)return;const q=byId[ses.ids[ses.idx]];if(!selected||ses.answers[q.id])return;const correct=q.answer?selected===q.answer:null;ses.answers[q.id]={chosen:selected,correct,at:Date.now()};let st=state.stats[q.id]||{attempts:0,correct:0,wrong:0};if(correct!==null){st.attempts++;if(correct)st.correct++;else{st.wrong++;state.mistakes[q.id]=true}}st.last=Date.now();state.stats[q.id]=st;state.daily[today()]=(state.daily[today()]||0)+1;ses.selected[q.id]=selected;persist();render()}
function nextQuestion(){const ses=state.session;if(!ses)return;if(ses.idx===ses.ids.length-1){finishQuiz();return}ses.idx++;persist();render();scrollTo({top:0,behavior:'instant'})}
function finishQuiz(){if(!state.session)return;state.session.done=true;persist();navTo('result')}
function resultView(){const ses=state.session;if(!ses)return `<div class="empty">暂无练习结果</div>`;const done=Object.values(ses.answers);const valid=done.filter(r=>r.correct!==null),good=valid.filter(r=>r.correct).length;return `<div style="max-width:670px;margin:20px auto"><div class="panel result-card"><div style="font-size:13px;color:#7d8e9c">本轮练习已完成</div><div class="result-score">${pct(good,valid.length)}<span style="font-size:27px">%</span></div><div class="result-info">正确 ${good} 题 &nbsp; · &nbsp; 错误 ${valid.length-good} 题 &nbsp; · &nbsp; 已完成 ${done.length} / ${ses.ids.length} 题</div><div class="result-actions"><button class="btn primary" data-act="quick">继续刷 10 题 →</button><button class="btn ghost" data-go="errors">查看我的错题</button><button class="btn ghost" data-go="home">返回首页</button></div></div></div>`}
function listView(which){const labels={errors:['错题本','所有做错过的题目都保存在这里；需要你主动标记“已掌握”才会移除。'],saved:['我的收藏','把容易混淆或重要的题目收藏起来，随时回看。'],library:['全部题库','搜索题干并按套卷筛选，快速定位指定题目。']};const [heading,subtitle]=labels[which];let arr=BANK.filter(q=>which==='library'||(which==='errors'?state.mistakes[q.id]:state.stars[q.id]));if(filters.set!=='all')arr=arr.filter(q=>q.set===filters.set);if(filters.status==='unseen')arr=arr.filter(q=>!state.stats[q.id]?.attempts);if(filters.status==='seen')arr=arr.filter(q=>state.stats[q.id]?.attempts);if(search)arr=arr.filter(q=>(q.stem+' '+Object.values(q.options).join(' ')).toLowerCase().includes(search.toLowerCase()));const chunks=arr.slice(listPage*30,(listPage+1)*30);return `<h1 class="page-title">${heading}</h1><p class="page-sub">${subtitle}</p><div class="filters"><select id="listSet"><option value="all">全部套卷</option>${SETS.map(s=>`<option value="${s}" ${filters.set===s?'selected':''}>Mock ${s}</option>`).join('')}</select><select id="listStatus"><option value="all">所有状态</option><option value="seen" ${filters.status==='seen'?'selected':''}>已练习</option><option value="unseen" ${filters.status==='unseen'?'selected':''}>未练习</option></select><input id="listSearch" value="${esc(search)}" placeholder="搜索英文题干关键词"/><span class="muted" style="font-size:11px">共 ${arr.length} 题</span></div>${arr.length?`<div class="list-items">${chunks.map(q=>`<div class="list-card"><div class="list-number">${q.set}</div><div class="list-body"><h4>${esc(q.stem.replaceAll('\n',' '))}</h4><span>Q${q.number} · ${esc(q.topic)} · 已练 ${state.stats[q.id]?.attempts||0} 次${state.stats[q.id]?.wrong?` · 答错 ${state.stats[q.id].wrong} 次`:''}</span></div><div class="list-actions"><button class="btn ghost small" data-one="${q.id}">单题练习</button>${which==='errors'?`<button class="btn ghost small" data-master="${q.id}">已掌握</button>`:which==='saved'?`<button class="btn ghost small" data-star="${q.id}">取消收藏</button>`:''}</div></div>`).join('')}</div><div class="section-row"><span>显示 ${listPage*30+1}–${Math.min(arr.length,(listPage+1)*30)} / ${arr.length}</span><div style="display:flex;gap:8px"><button class="btn ghost small" data-page="-1" ${listPage===0?'disabled':''}>上一页</button><button class="btn ghost small" data-page="1" ${(listPage+1)*30>=arr.length?'disabled':''}>下一页</button></div></div>${which==='errors'?`<div style="margin-top:20px"><button class="btn primary" data-act="wrongPractice">随机练习错题 →</button></div>`:''}`:`<div class="empty"><span style="font-size:38px">${which==='errors'?'✓':which==='saved'?'☆':'⌕'}</span><strong>${which==='errors'?'目前没有错题':which==='saved'?'还没有收藏题目':'没有匹配的题目'}</strong><p style="font-size:12px">${which==='errors'?'开始刷题后，错题会自动记录在这里。':'尝试修改筛选条件，或去题库浏览。'}</p><button class="btn primary" data-go="practice">开始刷题 →</button></div>`}`}
function analyticsView(){const s=summary();return `<h1 class="page-title">学习统计</h1><p class="page-sub">你已经解答了 ${s.attempts} 题次。重点不是刷题数量，而是把错误转化为知识。</p><div class="kpi-grid"><div class="kpi"><div class="kpi-label">练习题次</div><div class="kpi-value">${fmt(s.attempts)}</div><div class="kpi-small">包含重复作答</div></div><div class="kpi"><div class="kpi-label">独立题目</div><div class="kpi-value">${fmt(s.seen)}</div><div class="kpi-small">已覆盖的不同题目</div></div><div class="kpi"><div class="kpi-label">累计答对</div><div class="kpi-value">${fmt(s.correct)}</div><div class="kpi-small">正确率 ${s.accuracy}%</div></div><div class="kpi"><div class="kpi-label">错题待掌握</div><div class="kpi-value">${fmt(s.wrong)}</div><div class="kpi-small">清零目标</div></div></div><div class="split" style="margin-top:22px"><div class="panel"><h3>按试卷的练习进度</h3>${SETS.map(x=>`<div class="bar-row"><div class="bar-label">Mock ${x}</div><div class="bar-bg"><div class="bar-fill" style="width:${pct(countSeen(x),90)}%"></div></div><div class="bar-count">${countSeen(x)} / 90</div></div>`).join('')}</div><div class="panel"><h3>最近 7 天练习量</h3>${Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=d.toLocaleDateString('sv-SE');const n=state.daily[k]||0;const max=Math.max(10,...Object.values(state.daily).slice(-7));return `<div class="bar-row"><div class="bar-label">${k.slice(5)}</div><div class="bar-bg"><div class="bar-fill" style="width:${pct(n,max)}%"></div></div><div class="bar-count">${n} 题</div></div>`}).join('')}<div class="low-note" style="margin-top:20px">本地浏览器记录仅保存在当前设备。建议定期在设置页面导出备份。</div></div></div>`}
function settingsView(){const s=summary();return `<h1 class="page-title">设置与数据备份</h1><p class="page-sub">你的题库可以离线使用。答题记录存储在当前浏览器的 localStorage 中。</p><div class="split" style="margin-top:25px"><div class="panel"><h3>备份和恢复</h3><p class="low-note">更换浏览器或设备之前，请先导出 JSON 备份；在新的浏览器中导入即可恢复错题、收藏和练习记录。</p><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:22px"><button class="btn primary" data-act="export">↓ 导出我的学习记录</button><button class="btn ghost" data-act="import">↑ 导入备份</button><input type="file" id="file-import" accept=".json,application/json" hidden/></div><div style="margin-top:20px;border-top:1px solid var(--line);padding-top:15px;font-size:11px;color:#8594a5">已答题 ${s.seen} 道 · 错题 ${s.wrong} 道 · 收藏 ${Object.values(state.stars).filter(Boolean).length} 道</div></div><div class="panel"><h3>关于这份题库</h3><p class="low-note">已导入 10 份原版 CFA Level I 模拟考，共 900 道三选一试题。答案由上传的扫描版解答识别。部分题目可能有识别误差；原版解析图保留在之前交付的完整版离线包中。</p><p class="low-note">单 HTML 文件可直接打开；完整版文件夹中另含 900 张原版解析图片。目前所有记录仅保存在当前设备。跨设备同步功能正在准备中；请通过导出/导入备份在设备间转移。</p><button class="btn danger small" data-act="reset">清除全部答题数据</button></div></div>`}
function exportData(){const data={app:VERSION,exportedAt:new Date().toISOString(),progress:state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CFA-Sprint-学习记录-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('学习记录备份已导出')}
function openModal(title,body,actions){document.getElementById('modal-root').innerHTML=`<div class="modal-bg"><div class="modal"><h2>${title}</h2><p>${body}</p><div class="modal-actions">${actions}</div></div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function choose(letter){let ses=state.session;if(!ses||ses.answers[ses.ids[ses.idx]])return;selected=letter;ses.selected[ses.ids[ses.idx]]=letter;persist();render()}
function handleClick(e){const el=e.target.closest('button');if(!el)return;if(el.dataset.go){navTo(el.dataset.go);return}if(el.dataset.set){document.getElementById('modal-root').innerHTML='';initSession(el.dataset.set,90,'all','sequential');return}if(el.dataset.choice){choose(el.dataset.choice);return}if(el.dataset.star){const id=el.dataset.star;state.stars[id]=!state.stars[id];persist();render();toast(state.stars[id]?'已收藏':'已取消收藏');return}if(el.dataset.one){initSessionFromIds([el.dataset.one]);return}if(el.dataset.master){delete state.mistakes[el.dataset.master];persist();render();toast('已从错题本移除');return}if(el.dataset.page){listPage=Math.max(0,listPage+Number(el.dataset.page));render();return}const act=el.dataset.act;switch(act){case 'quick':initSession('all',10,'unseen','random');break;case 'createSession':{const g=id=>document.getElementById(id).value;initSession(g('range'),+g('amount'),g('status'),g('order'));break}case 'resume':navTo('quiz');break;case 'submit':recordAnswer();break;case 'next':nextQuestion();break;case 'previous':if(state.session?.idx>0){state.session.idx--;persist();render()}break;case 'pause':navTo('home');break;case 'finish':openModal('结束本轮练习？','已提交的答案和学习记录都会保留，未完成的题目不会计分。',`<button class="btn ghost" data-act="closeModal">继续刷题</button><button class="btn primary" data-act="confirmFinish">结束练习</button>`);break;case 'confirmFinish':closeModal();finishQuiz();break;case 'closeModal':closeModal();break;case 'toggleImage':{let x=document.getElementById('answer-image-box');if(x)x.hidden=!x.hidden;break}case 'wrongPractice':initSession('mistakes',20,'all','random');break;case 'manualWrong':{const q=byId[state.session.ids[state.session.idx]];state.mistakes[q.id]=true;persist();toast('已添加到错题本');render();break}case 'export':exportData();break;case 'import':document.getElementById('file-import').click();break;case 'reset':openModal('确定清除所有记录？','此操作会永久清除当前浏览器的错题、已做题、收藏和进度。建议先导出备份。',`<button class="btn ghost" data-act="closeModal">取消</button><button class="btn danger" data-act="confirmReset">彻底清除</button>`);break;case 'confirmReset':state={stats:{},mistakes:{},stars:{},daily:{},session:null};persist();closeModal();navTo('home');toast('已清除');break;}}
function initSessionFromIds(ids){state.session={ids,idx:0,answers:{},selected:{},range:'单题',done:false,created:Date.now()};persist();navTo('quiz')}
document.addEventListener('click',handleClick);
document.addEventListener('change',e=>{if(e.target.id==='listSet'){filters.set=e.target.value;listPage=0;render()}if(e.target.id==='listStatus'){filters.status=e.target.value;listPage=0;render()}if(e.target.id==='file-import'){const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.progress||typeof d.progress.stats!=='object')throw Error('文件格式不正确');state={stats:{},mistakes:{},stars:{},daily:{},session:null,...d.progress};persist();navTo('home');toast('备份导入成功')}catch(err){toast('导入失败：'+err.message)}};fr.readAsText(f)}});
document.addEventListener('input',e=>{if(e.target.id==='listSearch'){search=e.target.value;listPage=0;const pos=e.target.selectionStart;render();const n=document.getElementById('listSearch');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(route!=='quiz'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||e.metaKey||e.ctrlKey)return;if(['1','2','3'].includes(e.key)){e.preventDefault();choose(LETTERS[Number(e.key)-1])}else if(e.key==='Enter'){e.preventDefault();const ses=state.session;if(ses.answers[ses.ids[ses.idx]])nextQuestion();else recordAnswer()}});
render();

</script>
<script src="cloud-config.js"></script>
<script>if(window.CFA_CLOUD_CONFIG?.url&&window.CFA_CLOUD_CONFIG?.publishableKey){const js=document.createElement('script');js.src='cloud-sync.js';document.body.appendChild(js)}</script>
